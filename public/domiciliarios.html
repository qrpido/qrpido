<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar de Cacería - QRpido Domicilios</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    
    <link rel="stylesheet" href="ui-estilos.css" />

    <style>
        /* Estilos específicos para la interfaz táctica de calle */
        body { background: var(--bg-oscuro); }
        #mapa-domicilios { height: 100vh; width: 100%; z-index: 1; filter: brightness(0.8) contrast(1.2); }

        /* Bottom Sheet: Radar de Cacería */
        .radar-caceria {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border-top: 2px solid var(--naranja); border-radius: 30px 30px 0 0;
            padding: var(--sp-md); box-sizing: border-box; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .order-card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 15px; padding: var(--sp-sm); margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .btn-cazar {
            background: var(--naranja); color: white; border: none;
            padding: 12px 20px; border-radius: 10px; font-weight: 900;
            text-transform: uppercase; font-size: 12px; cursor: pointer;
        }

        /* Teclado Numérico: Apretón de Manos Digital */
        .pin-pad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            margin-top: 20px; width: 100%; max-width: 300px; margin-left: auto; margin-right: auto;
        }

        .pin-btn {
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            color: white; padding: 20px; border-radius: 15px; font-size: 20px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }

        .pin-btn:active { background: var(--naranja); transform: scale(0.9); }

        .pin-display {
            background: rgba(0,0,0,0.5); color: var(--naranja);
            font-family: monospace; font-size: 32px; text-align: center;
            letter-spacing: 10px; padding: 15px; border-radius: 10px;
            margin-bottom: 20px; border: 1px solid var(--naranja);
        }
    </style>
</head>
<body class="ui-dark">

    <div id="mapa-domicilios"></div>

    <div class="radar-caceria" id="panel-radar">
        <div class="drag-handle"></div>
        <h2 style="color: var(--naranja); margin-top: 0; font-size: 16px; text-transform: uppercase;">Órdenes Cercanas</h2>
        <div id="lista-ordenes">
            <div class="order-card">
                <div>
                    <b style="color: #00ff64;">+ $5.200 COP</b><br>
                    <small style="color: #aaa;">A 1.2km de tu ubicación</small>
                </div>
                <button class="btn-cazar" onclick="aceptarOrden()">CAZAR ⚡</button>
            </div>
        </div>
    </div>

    <div class="bottom-sheet-overlay" id="modal-apreton">
        <div class="bottom-sheet-contenido">
            <div class="drag-handle"></div>
            <h2 style="color: var(--naranja); text-align: center; margin-top: 0;">ENTREGA FINAL</h2>
            <p style="text-align: center; color: #ccc; font-size: 13px;">Ingresa el código que te dicte el cliente:</p>
            
                        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; max-width: 320px; margin-left: auto; margin-right: auto;">
                <input type="text" id="input-secreto" maxlength="10" placeholder="QRP-XXXXXX" style="flex: 1; outline: none; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: var(--naranja); text-transform: uppercase; text-align: center; font-family: monospace; font-size: 24px; letter-spacing: 2px; padding: 15px; border-radius: 10px; transition: border-color 0.3s;">
                
                <button id="btn-toggle-teclado" onclick="alternarTecladoTactico()" style="background: transparent; border: 1px solid var(--glass-border); border-radius: 10px; width: 60px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;">
                    <span style="opacity: 0.2; font-size: 20px;">⌨️</span>
                </button>
            </div>

            <div id="teclado-tactico" style="display: none; grid-template-columns: repeat(6, 1fr); gap: 6px; max-width: 350px; margin: 0 auto 20px auto;"></div>

            <button class="btn-cazar" style="width: 100%; max-width: 320px; display: block; margin: 0 auto 20px auto; font-size: 16px; padding: 15px;" onclick="validarEntrega()">🔗 VERIFICAR Y COBRAR</button>

            
            <input type="text" id="miel-domi" style="position:absolute; left:-9999px; opacity:0;" tabindex="-1">
        </div>
    </div>

    <script type="module">        // 🔗 Conexión a Módulos Globales
        import QRpidoDB from './core-db.js';
        import './auth-mando.js';
        import './profiler.js';

        let ticketPublicoCazado = null; 
 

        // Inicialización de Mapa Táctico
        const mapa = L.map('mapa-domicilios', { zoomControl: false }).setView([4.8133, -75.6961], 15);
        L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', {
            maxZoom: 20
        }).addTo(mapa);

        // --- MOTOR DE TECLADO TÁCTICO ALFANUMÉRICO ---
        const caracteres = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const contenedorTeclado = document.getElementById('teclado-tactico');
        const inputSecreto = document.getElementById('input-secreto');

        // Renderizado dinámico para ahorrar nodos fijos en HTML
        caracteres.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'pin-btn';
            btn.style.cssText = 'padding: 10px; font-size: 14px; border-radius: 8px;';
            btn.innerText = c;
            btn.onclick = () => {
             if (navigator.vibrate) navigator.vibrate(15);
// CAMBIO: Separación limpia del comentario para evitar truncado sintáctico
if (inputSecreto.value.length < 10) {
    inputSecreto.value += c;
}
            };
            contenedorTeclado.appendChild(btn);
        });

        // Botón de Borrar
        const btnBorrar = document.createElement('button');
        btnBorrar.className = 'pin-btn';
        btnBorrar.style.cssText = 'padding: 10px; font-size: 14px; border-radius: 8px; color: #ff4444; grid-column: span 2;';
        btnBorrar.innerText = "✖ DEL";
        btnBorrar.onclick = () => {
            if (navigator.vibrate) navigator.vibrate(20);
            inputSecreto.value = inputSecreto.value.slice(0, -1);
        };
        contenedorTeclado.appendChild(btnBorrar);

        // Alternador UI (El Easter Egg)
        window.alternarTecladoTactico = () => {
            const btn = document.getElementById('btn-toggle-teclado');
            if (contenedorTeclado.style.display === 'none') {
                contenedorTeclado.style.display = 'grid';
                btn.style.borderColor = 'var(--naranja)';
                btn.querySelector('span').style.opacity = '1';
            } else {
                contenedorTeclado.style.display = 'none';
                btn.style.borderColor = 'var(--glass-border)';
                btn.querySelector('span').style.opacity = '0.2';
            }
        };

              // Lógica Zero-Trust (Handshake Criptográfico Adaptado al contrato estricto de index.js en la Nube)
window.validarEntrega = async () => {
    if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
    if (document.getElementById('miel-domi').value !== "") return; // Honeypot anti-bots

    const codigoSecreto = inputSecreto.value.toUpperCase().trim();

    // Validamos una longitud coherente para producción (Mínimo 6 caracteres o la cadena completa)
    if (codigoSecreto.length >= 6 && ticketPublicoCazado) {
        const btn = document.querySelector('.bottom-sheet-contenido .btn-cazar');
        const textoOriginal = btn.innerText;
        btn.innerText = "⏳ COBRANDO EN SUI BLOCKCHAIN...";
        btn.disabled = true;

        try {
            // Puente Criptográfico Directo: Cumple el contrato del Módulo 3 (validarEntrega en index.js)
            const res = await QRpidoDB.LogisticaService.validarEntrega({
                ordenId: ticketPublicoCazado,           // Mapeado a 'ordenId' tal como lo exige el backend
                codigoSuministrado: codigoSecreto       // Mapeado a 'codigoSuministrado' tal como lo exige el backend
            });

            // El backend retorna un HttpsCallableResult, evaluamos la respuesta interna .data o directa
            const resultado = res.data || res;

            if (resultado && resultado.success) {
                alert(`✅ ¡ENTREGA VALIDADA!\nSello Web3: ${resultado.txID.substring(0,10)}...\n\nFondos de la orden liberados a tu saldo.`);
                document.getElementById('modal-apreton').classList.remove('activo');
                inputSecreto.value = "";
                if (contenedorTeclado) contenedorTeclado.style.display = 'none';
            } else {
                alert("❌ Rechazado por el Cadenero Backend: " + (resultado ? resultado.error : "Código Inválido"));
            }
        } catch(e) {
            console.error(e);
            alert("❌ Fallo crítico de conexión con la Malla de Gas Web3: " + e.message);
        }
        btn.innerText = textoOriginal;
        btn.disabled = false;
    } else {
        alert("⚠️ Ingresa el código de entrega completo (Ej: QRP-A1B2C3).");
    }
};


        window.aceptarOrden = (ticketId = 'TKT-DEMO') => {
            ticketPublicoCazado = ticketId; // Fundimos el ticket a la memoria
            if (navigator.vibrate) navigator.vibrate([40, 30, 40]);
            document.getElementById('modal-apreton').classList.add('activo');
        };

    </script>
</body>
</html>
