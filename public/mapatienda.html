<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plano Espacial de Tienda | Geokatu SIG</title>
    <meta name="theme-color" content="#ff6b00">
    <link rel="stylesheet" href="mapatienda.css">
  <script src="qrcode.min.js"></script>
</head>
<body>

    <!-- 1. VIEWPORT DEL LIENZO INFINITO -->
    <div id="viewport-infinito" style="touch-action: none;">
        <div id="capa-transform">
            <canvas id="rejilla-canvas"></canvas>
            <div id="contenedor-items"></div>
            <div id="contenedor-muebles"></div>

            <!-- Líneas Guía Magnéticas Dinámicas -->
            <div id="guia-h" class="linea-guia horizontal"></div>
            <div id="guia-v" class="linea-guia vertical"></div>
        </div>
    </div>

    <!-- 2. HUD FLOTANTE SUPERIOR -->
    <header class="hud-barra-superior">
        <select id="selector-sede-activa" class="hud-radar-select" title="Cambiar sede">
            <option value="SALA_VENTAS" selected>🏢 Principal</option>
        </select>
        <button id="btn-abrir-modal-sede" class="btn-radar-buscar btn-verde-accent" title="Crear espacio" style="display: none;">+ Sede</button>
        <div class="grupo-busqueda-sku">
            <input type="text" id="input-radar-sku" class="hud-radar-input" placeholder="Buscar SKU...">
            <button id="btn-ejecutar-radar" class="btn-radar-buscar" title="Buscar SKU en mapa">🔍</button>
        </div>
        <button id="btn-toggle-modo-edicion" class="btn-radar-buscar" title="Bloqueo/Desbloqueo de edición">🔒 Lectura</button>
        <button id="btn-modo-muros" class="btn-radar-buscar btn-secundario" title="Modo Muros">🧱 Muros</button>
        <button id="btn-guardar-nube" class="btn-radar-buscar btn-secundario" title="Guardar cambios">💾 Guardar</button>
    </header>

    <!-- MODAL CREACIÓN DE NUEVA TIENDA O BODEGA -->
    <div id="modal-nueva-sede" class="modal-flotante-wrap">
        <div class="modal-tarjeta-boveda">
            <h3 style="margin: 0 0 15px 0; font-size: 15px; text-transform: uppercase; color: var(--naranja);">Crear Espacio / Bodega</h3>
            
            <label style="font-size: 11px; color: #aaa;">IDENTIFICADOR CORTO (ID):</label>
            <input type="text" id="nueva-sede-id" class="input-modal" placeholder="Ej: BODEGA_NORTE" style="font-family: monospace; text-transform: uppercase;">

            <label style="font-size: 11px; color: #aaa;">NOMBRE DESCRIPTIVO:</label>
            <input type="text" id="nueva-sede-nombre" class="input-modal" placeholder="Ej: Bodega Anexa Zona Franca">

            <label style="font-size: 11px; color: #aaa;">TIPO DE ESPACIO:</label>
            <select id="nueva-sede-tipo" class="input-modal">
                <option value="TIENDA" selected>🛒 Piso de Ventas / Tienda</option>
                <option value="BODEGA">📦 Almacén / Bodega de Stock</option>
                <option value="MIXTO">🏬 Espacio Mixto</option>
            </select>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-cancelar-nueva-sede" class="btn-modal-accion" style="background: rgba(255,255,255,0.1);">Cerrar</button>
                <button id="btn-guardar-nueva-sede" class="btn-modal-accion">Crear Espacio</button>
            </div>
        </div>
    </div>

    <!-- 3. DOCK SEGMENTADO INFERIOR UNIFICADO -->
    <nav class="hud-dock-unificado" role="toolbar">
        <button id="btn-burbuja-area" class="dock-segment-btn" title="Definir perímetro de tienda">
            <span class="dock-icono">📐</span>
            <span class="dock-txt">Área</span>
        </button>
        <button id="btn-burbuja-mueble" class="dock-segment-btn destacado" title="Diseñar nuevo mueble">
            <span class="dock-icono">📦</span>
            <span class="dock-txt">+ Mueble</span>
        </button>
        <button id="btn-burbuja-item" class="dock-segment-btn" title="Agregar puerta, acceso o zona">
            <span class="dock-icono">🚪</span>
            <span class="dock-txt">+ Ítem</span>
        </button>
        <button id="btn-pestana-lista-muebles" class="dock-segment-btn" title="Lista de muebles">
            <span class="dock-icono">📋</span>
            <span class="dock-txt">Lista</span>
            <span id="badge-contador-muebles" class="badge-conteo-muebles">0</span>
        </button>
        <button id="btn-burbuja-qrs" class="dock-segment-btn" title="Generar e imprimir señalética">
            <span class="dock-icono">🖨️</span>
            <span class="dock-txt">QRs</span>
        </button>
    </nav>

    <!-- MINIMAPA MAGNÉTICO EN BURBUJA FLOTANTE -->
    <div id="contenedor-minimapa" class="minimapa-burbuja-wrap colapsado" title="Minimapa 2D">
        <div class="minimapa-header-bar">
            <span class="minimapa-titulo">RADAR 2D</span>
            <button id="btn-cerrar-minimapa" class="btn-cerrar-mini" title="Colapsar minimapa">✕</button>
        </div>
        <canvas id="canvas-minimapa"></canvas>
        <div class="icono-minimapa-radar">🧭</div>
    </div>

    <!-- DRAWER LATERAL DE MUEBLES INDEXADOS -->
    <aside id="drawer-muebles" class="drawer-index-muebles">
        <div class="drawer-header">
            <div>
                <strong style="font-size: 14px; text-transform: uppercase; color: var(--naranja);">Índice de Muebles</strong>
                <div id="drawer-resumen-total" style="font-size: 11px; color: #aaa;">0 muebles en plano</div>
            </div>
            <button id="btn-cerrar-drawer" class="btn-cerrar-mini" title="Cerrar lista" style="font-size: 16px;">✕</button>
        </div>
        <div id="drawer-lista-contenedor" class="drawer-lista-scroll"></div>
    </aside>

    <!-- 4. MODALES PARAMÉTRICOS -->
    <!-- ÁREA -->
    <div id="modal-area" class="modal-flotante-wrap">
        <div class="modal-tarjeta-boveda">
            <h3 style="margin: 0 0 15px 0; font-size: 15px; text-transform: uppercase; color: var(--naranja);">Delimitar Área de Tienda</h3>
            <label style="font-size: 11px; color: #aaa;">ANCHO EN METROS (X):</label>
            <input type="number" id="area-ancho" class="input-modal" value="12" min="2" max="100">
            
            <label style="font-size: 11px; color: #aaa;">LARGO EN METROS (Y):</label>
            <input type="number" id="area-largo" class="input-modal" value="18" min="2" max="100">

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-cancelar-area" class="btn-modal-accion" style="background: rgba(255,255,255,0.1);">Cerrar</button>
                <button id="btn-aplicar-area" class="btn-modal-accion">Fijar Perímetro</button>
            </div>
        </div>
    </div>

    <!-- MUEBLE -->
    <div id="modal-mueble" class="modal-flotante-wrap">
        <div class="modal-tarjeta-boveda">
            <h3 id="modal-mueble-titulo" style="margin: 0 0 15px 0; font-size: 15px; text-transform: uppercase; color: var(--naranja);">Diseñar Mueble</h3>
            
            <div style="display: flex; gap: 8px;">
                <div style="flex: 1.5;">
                    <label style="font-size: 11px; color: #aaa;">NOMBRE DEL MUEBLE:</label>
                    <input type="text" id="mueble-nombre" class="input-modal" value="Góndola Central">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 11px; color: #aaa;">ZONA DEL PLANO:</label>
                    <select id="mueble-zona" class="input-modal" style="text-transform: uppercase;">
                        <option value="PISO_VENTA" selected>🛒 Piso de Venta</option>
                        <option value="BODEGA">📦 Trastienda / Bodega</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">ANCHO (Metros):</label>
                    <input type="number" id="mueble-ancho" class="input-modal" value="2" step="0.5" min="0.5">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">LARGO (Metros):</label>
                    <input type="number" id="mueble-largo" class="input-modal" value="4" step="0.5" min="0.5">
                </div>
            </div>

            <label style="font-size: 10px; color: #aaa; margin-top: 4px; display: block;">CONFIGURAR CARA DE EXHIBICIÓN:</label>
            <div class="selector-caras-tabs" id="dock-selector-caras">
                <button type="button" class="tab-cara-btn activa" data-cara="A">Frontal (A)</button>
                <button type="button" class="tab-cara-btn" data-cara="B">Posterior (B)</button>
                <button type="button" class="tab-cara-btn" data-cara="C">Cabecera Izq (C)</button>
                <button type="button" class="tab-cara-btn" data-cara="D">Cabecera Der (D)</button>
            </div>

            <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">NIVELES CARA ACTIVA:</label>
                    <input type="number" id="mueble-niveles" class="input-modal" value="4" min="1" max="25">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">BINS X NIVEL:</label>
                    <input type="number" id="mueble-subdivs" class="input-modal" value="4" min="1" max="32">
                </div>
            </div>

            <p id="txt-preview-bins" style="font-size: 11px; color: #00ff64; text-align: center; margin: 6px 0;">
                Cara Frontal: 16 Bins | Total Góndola: 16 Bins
            </p>

            <div style="display: flex; gap: 10px;">
                <button id="btn-cancelar-mueble" class="btn-modal-accion" style="background: rgba(255,255,255,0.1);">Cerrar</button>
                <button id="btn-crear-mueble" class="btn-modal-accion">Guardar Mueble</button>
            </div>
        </div>
    </div>

    <!-- ÍTEM -->
    <div id="modal-item" class="modal-flotante-wrap">
        <div class="modal-tarjeta-boveda">
            <h3 id="modal-item-titulo" style="margin: 0 0 12px 0; font-size: 15px; text-transform: uppercase; color: var(--naranja);">Agregar Elemento</h3>
            
            <label style="font-size: 10px; color: #aaa;">TIPO DE ELEMENTO:</label>
            <select id="item-tipo-preset" class="input-modal">
                <option value="PUERTA_PPAL">🚪 Puerta Principal</option>
                <option value="PUERTA_SEC">🚪 Puerta Secundaria</option>
                <option value="PUERTA_BOD_INT">📦 Puerta Bodega Interna</option>
                <option value="PUERTA_BOD_EXT">🚚 Portón Bodega Externa</option>
                <option value="ZONA_TEXTO">🏷️ Rótulo de Zona</option>
                <option value="SIMBOLO_FORMA">🔷 Figura Geométrica</option>
            </select>

            <label style="font-size: 10px; color: #aaa;">TEXTO / IDENTIFICADOR:</label>
            <input type="text" id="item-etiqueta" class="input-modal" value="Entrada Principal">

            <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">FORMA:</label>
                    <select id="item-forma" class="input-modal">
                        <option value="rectangulo" selected>Rectángulo</option>
                        <option value="circulo">Círculo</option>
                        <option value="elipse">Elipse</option>
                        <option value="nube">Nube Delineada</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">COLOR / FONDO:</label>
                    <select id="item-color" class="input-modal">
                        <option value="rgba(0, 255, 100, 0.25)" selected>Verde Acceso</option>
                        <option value="rgba(255, 107, 0, 0.25)">Naranja</option>
                        <option value="rgba(0, 136, 255, 0.25)">Azul</option>
                        <option value="rgba(255, 68, 68, 0.25)">Rojo Restricción</option>
                        <option value="rgba(184, 68, 255, 0.25)">Púrpura</option>
                        <option value="rgba(255, 255, 255, 0.08)">Neutro</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">ANCHO (m):</label>
                    <input type="number" id="item-ancho" class="input-modal" value="1.2" step="0.1" min="0.4" max="20">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">LARGO (m):</label>
                    <input type="number" id="item-largo" class="input-modal" value="0.4" step="0.1" min="0.2" max="20">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-cancelar-item" class="btn-modal-accion" style="background: rgba(255,255,255,0.1);">Cerrar</button>
                <button id="btn-guardar-item" class="btn-modal-accion">Fijar en Plano</button>
            </div>
        </div>
    </div>

    <!-- IMPRESIÓN QR -->
    <div id="modal-impresion" class="modal-flotante-wrap">
        <div class="modal-tarjeta-boveda">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--naranja); padding-bottom: 8px;">
                <h3 style="margin: 0; font-size: 15px; text-transform: uppercase;">Señalética QR de Tienda</h3>
                <button id="btn-cerrar-print" style="background: none; border: none; font-size: 18px; cursor: pointer;">✕</button>
            </div>
            <div class="grid-qrs-print" id="contenedor-qrs-render"></div>
            <button onclick="window.print()" class="btn-modal-accion" style="margin-top: 12px;">🖨️ Mandar a Imprimir</button>
        </div>
    </div>

    <!-- =========================================================================
         SCRIPT PRINCIPAL BLINDADO
         ========================================================================= -->
    <script type="module">
        import GeokatuDB from './core-db.js';

        // 1. ESTADO GLOBAL
        let idNegocio = localStorage.getItem('geokatu_active_uid') || null;
        let idSedeActiva = localStorage.getItem('geokatu_sede_activa') || 'SALA_VENTAS';
        let permisosUsuario = { autorizado: false, rol: null, puedeCrearSedes: false, puedeMoverMuebles: false };

        const METRO_PX = 60;
        let perimetro = { anchoM: 12, largoM: 18 };
        let muebles = [];
        let muebleSeleccionado = null;
        let muebleRadarActivoId = null; 
        let animacionRadarMiniTimer = null;
        
        let itemsEspaciales = [];
        let itemSeleccionado = null;
        let itemEnEdicion = null;

        let modoPincelMuros = false;
        let celdasMurosBloqueadas = new Set();
        let modoEdicionActivo = false; 
        let viewport = { x: 40, y: 100, escala: 1 };
        const SCALE_MIN = 0.15; 
        const SCALE_MAX = 5.0;

        let caraActivaModal = 'A';
        let configCarasEnMemoria = {
            A: { niveles: 4, bins: 4, activa: true },
            B: { niveles: 0, bins: 0, activa: false },
            C: { niveles: 0, bins: 0, activa: false },
            D: { niveles: 0, bins: 0, activa: false }
        };

        // 2. REFERENCIAS DOM VITALES
        const vpEl = document.getElementById('viewport-infinito'); 
        const capaTransform = document.getElementById('capa-transform');
        const canvasRejilla = document.getElementById('rejilla-canvas');
        const ctxRejilla = canvasRejilla.getContext('2d');
        const contenedorMuebles = document.getElementById('contenedor-muebles');
        const contenedorItems = document.getElementById('contenedor-items');
        const guiaH = document.getElementById('guia-h');
        const guiaV = document.getElementById('guia-v');
        const canvasMinimapa = document.getElementById('canvas-minimapa');
        const ctxMinimapa = canvasMinimapa ? canvasMinimapa.getContext('2d') : null;

        // 3. FUNCIONES DE DIBUJO Y CANVAS
        window.actualizarTransform = function() {
            capaTransform.style.transform = "translate3d(" + viewport.x + "px, " + viewport.y + "px, 0) scale(" + viewport.escala + ")";
            const tamRejilla = METRO_PX * viewport.escala;
            vpEl.style.backgroundSize = tamRejilla + "px " + tamRejilla + "px";
            vpEl.style.backgroundPosition = viewport.x + "px " + viewport.y + "px";
            window.renderizarMinimapa();
        };

        window.redibujarArea = function() {
            const w = perimetro.anchoM * METRO_PX;
            const h = perimetro.largoM * METRO_PX;

            canvasRejilla.width = w;
            canvasRejilla.height = h;
            canvasRejilla.style.width = w + "px";
            canvasRejilla.style.height = h + "px";

            ctxRejilla.clearRect(0, 0, w, h);
            ctxRejilla.fillStyle = '#21212b';
            ctxRejilla.fillRect(0, 0, w, h);

            ctxRejilla.strokeStyle = 'rgba(255, 255, 255, 0.09)';
            ctxRejilla.lineWidth = 1;
            for (let x = 0; x <= w; x += METRO_PX) {
                ctxRejilla.beginPath(); ctxRejilla.moveTo(x, 0); ctxRejilla.lineTo(x, h); ctxRejilla.stroke();
            }
            for (let y = 0; y <= h; y += METRO_PX) {
                ctxRejilla.beginPath(); ctxRejilla.moveTo(0, y); ctxRejilla.lineTo(w, y); ctxRejilla.stroke();
            }

            ctxRejilla.strokeStyle = '#ff6b00';
            ctxRejilla.lineWidth = 3;
            ctxRejilla.strokeRect(0, 0, w, h);

            celdasMurosBloqueadas.forEach(function(coord) {
                const arr = coord.split(',');
                const cx = Number(arr[0]);
                const cy = Number(arr[1]);
                ctxRejilla.fillStyle = 'rgba(255, 68, 68, 0.45)';
                ctxRejilla.fillRect(cx * METRO_PX, cy * METRO_PX, METRO_PX, METRO_PX);
                ctxRejilla.strokeStyle = '#ff4444';
                ctxRejilla.lineWidth = 1;
                ctxRejilla.strokeRect(cx * METRO_PX, cy * METRO_PX, METRO_PX, METRO_PX);
            });
        };

        window.renderizarMinimapa = function() {
            if (!ctxMinimapa || !canvasMinimapa) return;
            const dpr = window.devicePixelRatio || 1;
            const rectMini = canvasMinimapa.getBoundingClientRect();
            if (canvasMinimapa.width !== rectMini.width * dpr || canvasMinimapa.height !== rectMini.height * dpr) {
                canvasMinimapa.width = rectMini.width * dpr;
                canvasMinimapa.height = rectMini.height * dpr;
            }

            ctxMinimapa.save();
            ctxMinimapa.scale(dpr, dpr);
            ctxMinimapa.clearRect(0, 0, rectMini.width, rectMini.height);

            const planoW = perimetro.anchoM * METRO_PX;
            const planoH = perimetro.largoM * METRO_PX;
            const escalaMini = Math.min((rectMini.width - 20) / planoW, (rectMini.height - 20) / planoH);
            const offsetX = (rectMini.width - planoW * escalaMini) / 2;
            const offsetY = (rectMini.height - planoH * escalaMini) / 2;

            ctxMinimapa.fillStyle = 'rgba(25, 25, 32, 0.9)';
            ctxMinimapa.fillRect(offsetX, offsetY, planoW * escalaMini, planoH * escalaMini);
            ctxMinimapa.strokeStyle = '#ff6b00';
            ctxMinimapa.lineWidth = 1.5;
            ctxMinimapa.strokeRect(offsetX, offsetY, planoW * escalaMini, planoH * escalaMini);

            ctxMinimapa.fillStyle = 'rgba(255, 68, 68, 0.6)';
            celdasMurosBloqueadas.forEach(function(coord) {
                const arr = coord.split(',');
                const cx = Number(arr[0]);
                const cy = Number(arr[1]);
                ctxMinimapa.fillRect(
                    offsetX + cx * METRO_PX * escalaMini,
                    offsetY + cy * METRO_PX * escalaMini,
                    METRO_PX * escalaMini,
                    METRO_PX * escalaMini
                );
            });

            itemsEspaciales.forEach(function(it) {
                const iW = (it.anchoM * METRO_PX) * escalaMini;
                const iH = (it.largoM * METRO_PX) * escalaMini;
                const cX = offsetX + (it.x * escalaMini) + (iW / 2);
                const cY = offsetY + (it.y * escalaMini) + (iH / 2);

                ctxMinimapa.save();
                ctxMinimapa.translate(cX, cY);
                ctxMinimapa.rotate(((it.rotacion || 0) * Math.PI) / 180);
                ctxMinimapa.fillStyle = it.colorFondo || 'rgba(0,255,100,0.3)';
                ctxMinimapa.strokeStyle = '#00ff64';
                ctxMinimapa.lineWidth = 1;

                if (it.forma === 'circulo' || it.forma === 'elipse') {
                    ctxMinimapa.beginPath();
                    ctxMinimapa.ellipse(0, 0, iW / 2, iH / 2, 0, 0, Math.PI * 2);
                    ctxMinimapa.fill(); ctxMinimapa.stroke();
                } else if (it.forma === 'nube') {
                    ctxMinimapa.setLineDash([2, 2]);
                    ctxMinimapa.strokeRect(-iW / 2, -iH / 2, iW, iH);
                    ctxMinimapa.fillRect(-iW / 2, -iH / 2, iW, iH);
                } else {
                    ctxMinimapa.fillRect(-iW / 2, -iH / 2, iW, iH);
                    ctxMinimapa.strokeRect(-iW / 2, -iH / 2, iW, iH);
                }
                ctxMinimapa.restore();
            });

            muebles.forEach(function(m) {
                const mW = (m.anchoM * METRO_PX) * escalaMini;
                const mH = (m.largoM * METRO_PX) * escalaMini;
                const centroX = offsetX + (m.x * escalaMini) + (mW / 2);
                const centroY = offsetY + (m.y * escalaMini) + (mH / 2);

                ctxMinimapa.save();
                ctxMinimapa.translate(centroX, centroY);
                ctxMinimapa.rotate(((m.rotacion || 0) * Math.PI) / 180);

                const esSeleccionado = (muebleSeleccionado && muebleSeleccionado.id_mueble === m.id_mueble);
                const enRadar = (muebleRadarActivoId === m.id_mueble);

                if (enRadar) {
                    ctxMinimapa.strokeStyle = '#00ff64';
                    ctxMinimapa.lineWidth = 2.5;
                    ctxMinimapa.strokeRect((-mW / 2) - 3, (-mH / 2) - 3, mW + 6, mH + 6);
                }
                ctxMinimapa.fillStyle = enRadar ? '#00ff64' : (esSeleccionado ? '#ff8c00' : '#ff6b00');
                ctxMinimapa.fillRect(-mW / 2, -mH / 2, mW, mH);
                ctxMinimapa.strokeStyle = enRadar ? '#ffffff' : (esSeleccionado ? '#00ff64' : 'rgba(255, 255, 255, 0.4)');
                ctxMinimapa.lineWidth = enRadar ? 2 : 1;
                ctxMinimapa.strokeRect(-mW / 2, -mH / 2, mW, mH);
                ctxMinimapa.restore();
            });

            const camMundoX = -viewport.x / viewport.escala;
            const camMundoY = -viewport.y / viewport.escala;
            const camMundoW = window.innerWidth / viewport.escala;
            const camMundoH = window.innerHeight / viewport.escala;

            ctxMinimapa.fillStyle = 'rgba(0, 255, 100, 0.12)';
            ctxMinimapa.fillRect(offsetX + camMundoX * escalaMini, offsetY + camMundoY * escalaMini, camMundoW * escalaMini, camMundoH * escalaMini);
            ctxMinimapa.strokeStyle = '#00ff64';
            ctxMinimapa.lineWidth = 1.8;
            ctxMinimapa.strokeRect(offsetX + camMundoX * escalaMini, offsetY + camMundoY * escalaMini, camMundoW * escalaMini, camMundoH * escalaMini);
            
            const centroVisorX = offsetX + (camMundoX + camMundoW / 2) * escalaMini;
            const centroVisorY = offsetY + (camMundoY + camMundoH / 2) * escalaMini;
            ctxMinimapa.strokeStyle = 'rgba(0, 255, 100, 0.5)';
            ctxMinimapa.lineWidth = 1;
            ctxMinimapa.beginPath();
            ctxMinimapa.moveTo(centroVisorX - 4, centroVisorY);
            ctxMinimapa.lineTo(centroVisorX + 4, centroVisorY);
            ctxMinimapa.moveTo(centroVisorX, centroVisorY - 4);
            ctxMinimapa.lineTo(centroVisorX, centroVisorY + 4);
            ctxMinimapa.stroke();
            ctxMinimapa.restore();
        };

            });

        window.verificarColisionMuros = function(x, y, anchoM, largoM) {
            const minX = Math.floor(x / METRO_PX);
            const minY = Math.floor(y / METRO_PX);
            const maxX = Math.floor((x + (anchoM * METRO_PX)) / METRO_PX);
            const maxY = Math.floor((y + (largoM * METRO_PX)) / METRO_PX);
            for (let cx = minX; cx <= maxX; cx++) {
                for (let cy = minY; cy <= maxY; cy++) {
                    if (celdasMurosBloqueadas.has(cx + "," + cy)) return true;
                }
            }
            return false;
        };

        window.calcularSmartGuides = function(muebleActual, x, y) {
            const TOLERANCIA = 8;
            let snapX = x; let snapY = y;
            let guiasActivas = { h: null, v: null };
            const w = muebleActual.anchoM * METRO_PX;
            const h = muebleActual.largoM * METRO_PX;

            muebles.forEach(function(otro) {
                if (otro.id_mueble === muebleActual.id_mueble) return;
                const otroW = otro.anchoM * METRO_PX;
                const otroH = otro.largoM * METRO_PX;
                if (Math.abs(y - otro.y) < TOLERANCIA) { snapY = otro.y; guiasActivas.h = snapY; }
                else if (Math.abs((y + h) - (otro.y + otroH)) < TOLERANCIA) { snapY = otro.y + otroH - h; guiasActivas.h = snapY + h; }
                if (Math.abs(x - otro.x) < TOLERANCIA) { snapX = otro.x; guiasActivas.v = snapX; }
                else if (Math.abs((x + w) - (otro.x + otroW)) < TOLERANCIA) { snapX = otro.x + otroW - w; guiasActivas.v = snapX + w; }
            });

            if (guiasActivas.h !== null) { guiaH.style.top = guiasActivas.h + "px"; guiaH.style.display = 'block'; }
            else { guiaH.style.display = 'none'; }
            if (guiasActivas.v !== null) { guiaV.style.left = guiasActivas.v + "px"; guiaV.style.display = 'block'; }
            else { guiaV.style.display = 'none'; }
            return { x: snapX, y: snapY };
        };

        window.ocultarGuias = function() {
            guiaH.style.display = 'none';
            guiaV.style.display = 'none';
        };

        window.seleccionarMueble = function(mueble, el) {
            window.deseleccionarMuebles();
            muebleSeleccionado = mueble;
            el.classList.add('seleccionado');
        };

        window.deseleccionarMuebles = function() {
            muebleSeleccionado = null;
            document.querySelectorAll('.mueble-bloque').forEach(function(m) { m.classList.remove('seleccionado'); });
        };

        window.seleccionarItem = function(it, el) {

            itemSeleccionado = it;
            el.classList.add('seleccionado');
        };

        window.deseleccionarItems = function() {
            itemSeleccionado = null;
            document.querySelectorAll('.item-espacial-bloque').forEach(function(b) { b.classList.remove('seleccionado'); });
        };

        window.iniciarDragMueble = function(el, mueble) {
            let offsetArrastre = { x: 0, y: 0 };
            let arrastrando = false;
            el.addEventListener('pointerdown', function(e) {
                if (!modoEdicionActivo) return;
                e.stopPropagation();
                arrastrando = true;
                window.seleccionarMueble(mueble, el);
                offsetArrastre = {
                    x: (e.clientX / viewport.escala) - mueble.x,
                    y: (e.clientY / viewport.escala) - mueble.y
                };
                el.setPointerCapture(e.pointerId);
            });
            el.addEventListener('pointermove', function(e) {
                if (!arrastrando) return;
                let nuevoX = (e.clientX / viewport.escala) - offsetArrastre.x;
                let nuevoY = (e.clientY / viewport.escala) - offsetArrastre.y;
                const snap = window.calcularSmartGuides(mueble, nuevoX, nuevoY);
                if (!window.verificarColisionMuros(snap.x, snap.y, mueble.anchoM, mueble.largoM)) {
                    mueble.x = snap.x;
                    mueble.y = snap.y;
                    el.style.left = snap.x + "px";
                    el.style.top = snap.y + "px";
                    window.renderizarMinimapa();
                }
            });
            const finDrag = function() { arrastrando = false; window.ocultarGuias(); };
            el.addEventListener('pointerup', finDrag);
            el.addEventListener('pointercancel', finDrag);
        };

        window.iniciarDragItem = function(el, item) {
            let offset = { x: 0, y: 0 };
            let arrastrando = false;
            el.addEventListener('pointerdown', function(e) {
                if (!modoEdicionActivo) return;
                e.stopPropagation();
                arrastrando = true;
                window.deseleccionarMuebles();
                window.seleccionarItem(item, el);
                offset = {
                    x: (e.clientX / viewport.escala) - item.x,
                    y: (e.clientY / viewport.escala) - item.y
                };
                el.setPointerCapture(e.pointerId);
            });
            el.addEventListener('pointermove', function(e) {
                if (!arrastrando) return;
                item.x = (e.clientX / viewport.escala) - offset.x;
                item.y = (e.clientY / viewport.escala) - offset.y;
                el.style.left = item.x + "px";
                el.style.top = item.y + "px";
                window.renderizarMinimapa();
            });
            const fin = function() { arrastrando = false; };
            el.addEventListener('pointerup', fin);
            el.addEventListener('pointercancel', fin);
        };

        // 4. LÓGICA DE VIEWPORT Y PANEO
        const punterosActivos = new Map();
        let inicioArrastreUnico = { x: 0, y: 0 };
        let distanciaInicialPinch = 0; let escalaInicialPinch = 1; let centroInicialPinch = { x: 0, y: 0 }; let viewportInicialPinch = { x: 0, y: 0 };

        vpEl.addEventListener('pointerdown', function(e) {
            if (e.target.closest('.mueble-bloque') || e.target.closest('.pivote-giro') || e.target.closest('.item-espacial-bloque')) return;
            if (modoPincelMuros) return;
            punterosActivos.set(e.pointerId, { x: e.clientX, y: e.clientY });
            vpEl.setPointerCapture(e.pointerId);
            window.deseleccionarMuebles();
            window.deseleccionarItems();
            if (punterosActivos.size === 1) {
                inicioArrastreUnico = { x: e.clientX - viewport.x, y: e.clientY - viewport.y };
            } else if (punterosActivos.size === 2) {
                const pts = Array.from(punterosActivos.values());
                distanciaInicialPinch = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                escalaInicialPinch = viewport.escala;
                viewportInicialPinch = { x: viewport.x, y: viewport.y };
                centroInicialPinch = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
            }
        });
        vpEl.addEventListener('pointermove', function(e) {
            if (!punterosActivos.has(e.pointerId)) return;
            punterosActivos.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (punterosActivos.size === 1) {
                viewport.x = e.clientX - inicioArrastreUnico.x;
                viewport.y = e.clientY - inicioArrastreUnico.y;
                window.actualizarTransform();
            } else if (punterosActivos.size === 2) {
                const pts = Array.from(punterosActivos.values());
                const distActual = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                if (distanciaInicialPinch === 0) return;
                const factor = distActual / distanciaInicialPinch;
                const nuevaEscala = Math.min(Math.max(SCALE_MIN, escalaInicialPinch * factor), SCALE_MAX);
                const centroActual = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
                const mundoPivotX = (centroInicialPinch.x - viewportInicialPinch.x) / escalaInicialPinch;
                const mundoPivotY = (centroInicialPinch.y - viewportInicialPinch.y) / escalaInicialPinch;
                viewport.x = centroActual.x - (mundoPivotX * nuevaEscala);
                viewport.y = centroActual.y - (mundoPivotY * nuevaEscala);
                viewport.escala = nuevaEscala;
                window.actualizarTransform();
            }
        });
        const limpiarPuntero = function(e) {
            punterosActivos.delete(e.pointerId);
            if (punterosActivos.size === 1) {
                const pRestante = Array.from(punterosActivos.values())[0];
                inicioArrastreUnico = { x: pRestante.x - viewport.x, y: pRestante.y - viewport.y };
            }
        };
        vpEl.addEventListener('pointerup', limpiarPuntero);
        vpEl.addEventListener('pointercancel', limpiarPuntero);
        vpEl.addEventListener('wheel', function(e) {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
            const nuevaEscala = Math.min(Math.max(SCALE_MIN, viewport.escala * zoomFactor), SCALE_MAX);
            if (nuevaEscala !== viewport.escala) {
                const mouseX = e.clientX; const mouseY = e.clientY;
                viewport.x = mouseX - (mouseX - viewport.x) * (nuevaEscala / viewport.escala);
                viewport.y = mouseY - (mouseY - viewport.y) * (nuevaEscala / viewport.escala);
                viewport.escala = nuevaEscala;
                window.actualizarTransform();
            }
        }, { passive: false });

        // 5. PINCEL MUROS
        const btnMuros = document.getElementById('btn-modo-muros');
        if (btnMuros) {
            btnMuros.addEventListener('click', function() {
                modoPincelMuros = !modoPincelMuros;
                if (modoPincelMuros) {
                    btnMuros.style.background = 'var(--naranja)'; btnMuros.style.borderColor = 'white';
                    alert("Modo Muros Activado. Toca las celdas para pintar paredes.");
                } else {
                    btnMuros.style.background = 'rgba(255,255,255,0.1)'; btnMuros.style.borderColor = 'rgba(255,255,255,0.2)';
                }
            });
        }
        canvasRejilla.style.pointerEvents = 'auto';
        canvasRejilla.addEventListener('pointerdown', function(e) {
            if (!modoPincelMuros) return;
            const rect = canvasRejilla.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / viewport.escala;
            const clickY = (e.clientY - rect.top) / viewport.escala;
            const celdaX = Math.floor(clickX / METRO_PX);
            const celdaY = Math.floor(clickY / METRO_PX);
            const clave = celdaX + "," + celdaY;
            if (celdasMurosBloqueadas.has(clave)) celdasMurosBloqueadas.delete(clave);
            else celdasMurosBloqueadas.add(clave);
            window.redibujarArea();
        });

        // 6. MINIMAPA ARRASTRE
        const contenedorMini = document.getElementById('contenedor-minimapa');
        if (contenedorMini && canvasMinimapa) {
            let arrastrandoMini = false;
            contenedorMini.addEventListener('click', function(e) {
                if (contenedorMini.classList.contains('colapsado')) {
                    e.stopPropagation();
                    contenedorMini.classList.remove('colapsado');
                    window.renderizarMinimapa();
                }
            });
            const btnCerMini = document.getElementById('btn-cerrar-minimapa');
            if (btnCerMini) btnCerMini.addEventListener('click', function(e) { e.stopPropagation(); contenedorMini.classList.add('colapsado'); });
            const moverDesdeMini = function(e) {
                if (contenedorMini.classList.contains('colapsado')) return;
                const rect = canvasMinimapa.getBoundingClientRect();
                const planoW = perimetro.anchoM * METRO_PX;
                const planoH = perimetro.largoM * METRO_PX;
                const escMini = Math.min((rect.width - 20) / planoW, (rect.height - 20) / planoH);
                const offX = (rect.width - planoW * escMini) / 2;
                const offY = (rect.height - planoH * escMini) / 2;
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                const mundoX = (clickX - offX) / escMini;
                const mundoY = (clickY - offY) / escMini;
                viewport.x = (window.innerWidth / 2) - (mundoX * viewport.escala);
                viewport.y = (window.innerHeight / 2) - (mundoY * viewport.escala);
                window.actualizarTransform();
            };
            canvasMinimapa.addEventListener('pointerdown', function(e) {
                if (contenedorMini.classList.contains('colapsado')) return;
                e.stopPropagation(); arrastrandoMini = true; canvasMinimapa.setPointerCapture(e.pointerId); moverDesdeMini(e);
            });
            canvasMinimapa.addEventListener('pointermove', function(e) {
                if (!arrastrandoMini || contenedorMini.classList.contains('colapsado')) return;
                e.stopPropagation(); moverDesdeMini(e);
            });
            const finMini = function(e) { arrastrandoMini = false; try { canvasMinimapa.releasePointerCapture(e.pointerId); } catch (_) {} };
            canvasMinimapa.addEventListener('pointerup', finMini);
            canvasMinimapa.addEventListener('pointercancel', finMini);
        }

        // 7. MÉTODOS DE MODALES
        window.abrirModalEditarMueble = function(m) {
            muebleEnEdicion = m;
            const titulo = document.getElementById('modal-mueble-titulo');
            if (titulo) titulo.innerText = "Editar: " + m.nombre;
            document.getElementById('mueble-nombre').value = m.nombre;
            document.getElementById('mueble-zona').value = m.zona || 'PISO_VENTA';
            document.getElementById('mueble-ancho').value = m.anchoM;
            document.getElementById('mueble-largo').value = m.largoM;

            configCarasEnMemoria = JSON.parse(JSON.stringify(m.caras || {
                A: { niveles: m.niveles || 4, bins: m.subdivisionesXNivel || 4, activa: true },
                B: { niveles: 0, bins: 0, activa: false },
                C: { niveles: 0, bins: 0, activa: false },
                D: { niveles: 0, bins: 0, activa: false }
            }));
            caraActivaModal = 'A';
            document.querySelectorAll('#dock-selector-caras .tab-cara-btn').forEach(function(b) {
                if (b.dataset.cara === 'A') b.classList.add('activa'); else b.classList.remove('activa');
            });
            document.getElementById('mueble-niveles').value = configCarasEnMemoria.A.niveles;
            document.getElementById('mueble-subdivs').value = configCarasEnMemoria.A.bins;
            window.actualizarPreviewBins();

        };

        window.abrirModalEditarItem = function(it) {
            itemEnEdicion = it;
            const tit = document.getElementById('modal-item-titulo');
            if (tit) tit.innerText = "Editar Ítem Espacial";

        window.actualizarPreviewBins = function() {
            const niv = Number(document.getElementById('mueble-niveles').value) || 0;
            const bins = Number(document.getElementById('mueble-subdivs').value) || 0;
            configCarasEnMemoria[caraActivaModal].niveles = niv;
            configCarasEnMemoria[caraActivaModal].bins = bins;
            configCarasEnMemoria[caraActivaModal].activa = (niv > 0 && bins > 0);

            let totalBins = 0;
            for (const c in configCarasEnMemoria) {
                totalBins += (configCarasEnMemoria[c].niveles * configCarasEnMemoria[c].bins);
            }
            const nombresCaras = { A: 'Frontal', B: 'Posterior', C: 'Cabecera Izq', D: 'Cabecera Der' };
            const pt = document.getElementById('txt-preview-bins');
            if (pt) pt.innerText = "Cara " + nombresCaras[caraActivaModal] + ": " + (niv * bins) + " Bins | Total Góndola: " + totalBins + " Bins";
        };

        const inNiv = document.getElementById('mueble-niveles');
        const inSub = document.getElementById('mueble-subdivs');
        if (inNiv) inNiv.addEventListener('input', window.actualizarPreviewBins);
        if (inSub) inSub.addEventListener('input', window.actualizarPreviewBins);

        document.querySelectorAll('#dock-selector-caras .tab-cara-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#dock-selector-caras .tab-cara-btn').forEach(function(b) { b.classList.remove('activa'); });
                btn.classList.add('activa');
                caraActivaModal = btn.dataset.cara;
                document.getElementById('mueble-niveles').value = configCarasEnMemoria[caraActivaModal].niveles || 0;
                document.getElementById('mueble-subdivs').value = configCarasEnMemoria[caraActivaModal].bins || 0;
                window.actualizarPreviewBins();
            });
        });

        window.generarMatrizCanonicaBins = function(idMueble, carasConfig) {
            const compartimientos = [];
            const codigosCaras = ['A', 'B', 'C', 'D'];
            codigosCaras.forEach(function(cara) {
                const cfg = carasConfig[cara];
                if (cfg && cfg.activa && cfg.niveles > 0 && cfg.bins > 0) {
                    for (let niv = 1; niv <= cfg.niveles; niv++) {
                        const strNivel = "N" + niv;
                        for (let b = 1; b <= cfg.bins; b++) {
                            const strBin = "B" + String(b).padStart(2, '0');
                            const idCanonicoComp = "GEO-P-" + idNegocio + "-" + idSedeActiva + "-" + idMueble + "-" + cara + "-" + strNivel + "-" + strBin;
                            const idEstantePadre = "GEO-M-" + idNegocio + "-" + idSedeActiva + "-" + idMueble;
                            compartimientos.push({
                                id_comp: idCanonicoComp,
                                id_estante: idEstantePadre,
                                id_sede: idSedeActiva,
                                cara: cara,
                                nivel: strNivel,
                                bin: strBin,
                                codigo_trazabilidad: idMueble + "_" + cara + "_" + strNivel + "_" + strBin
                            });
                        }
                    }
                }
            });
            return compartimientos;
        };

        const btnMueble = document.getElementById('btn-burbuja-mueble');
        if (btnMueble) btnMueble.addEventListener('click', function() {
            muebleEnEdicion = null;
            const tit = document.getElementById('modal-mueble-titulo');
            if (tit) tit.innerText = "Diseñar Mueble";
            document.getElementById('mueble-nombre').value = "Góndola " + (muebles.length + 1);
            document.getElementById('mueble-zona').value = 'PISO_VENTA';
            document.getElementById('mueble-ancho').value = 2;
            document.getElementById('mueble-largo').value = 4;
            configCarasEnMemoria = {
                A: { niveles: 4, bins: 4, activa: true },
                B: { niveles: 4, bins: 4, activa: true },
                C: { niveles: 0, bins: 0, activa: false },
                D: { niveles: 0, bins: 0, activa: false }
            };
            caraActivaModal = 'A';
            document.querySelectorAll('#dock-selector-caras .tab-cara-btn').forEach(function(b) {
                if (b.dataset.cara === 'A') b.classList.add('activa'); else b.classList.remove('activa');
            });
            document.getElementById('mueble-niveles').value = configCarasEnMemoria.A.niveles;
            document.getElementById('mueble-subdivs').value = configCarasEnMemoria.A.bins;
            window.actualizarPreviewBins();
            document.getElementById('modal-mueble').style.display = 'flex';
        });

        const btnCrearMueble = document.getElementById('btn-crear-mueble');
        if (btnCrearMueble) btnCrearMueble.addEventListener('click', function() {
            const nombre = document.getElementById('mueble-nombre').value.trim() || "Góndola";
            const zona = document.getElementById('mueble-zona').value;
            const anchoM = Number(document.getElementById('mueble-ancho').value) || 2;
            const largoM = Number(document.getElementById('mueble-largo').value) || 4;

            const nivActual = Number(document.getElementById('mueble-niveles').value) || 0;
            const binsActual = Number(document.getElementById('mueble-subdivs').value) || 0;
            configCarasEnMemoria[caraActivaModal].niveles = nivActual;
            configCarasEnMemoria[caraActivaModal].bins = binsActual;
            configCarasEnMemoria[caraActivaModal].activa = (nivActual > 0 && binsActual > 0);
            window.actualizarPreviewBins();

            let maxNiveles = 1;
            for (const c in configCarasEnMemoria) {
                if (configCarasEnMemoria[c].activa && configCarasEnMemoria[c].niveles > maxNiveles) {
                    maxNiveles = configCarasEnMemoria[c].niveles;
                }
            }

            if (muebleEnEdicion) {
                muebleEnEdicion.nombre = nombre;
                muebleEnEdicion.zona = zona;
                muebleEnEdicion.anchoM = anchoM;
                muebleEnEdicion.largoM = largoM;
                muebleEnEdicion.caras = JSON.parse(JSON.stringify(configCarasEnMemoria));
                muebleEnEdicion.compartimientos = window.generarMatrizCanonicaBins(muebleEnEdicion.id_mueble, muebleEnEdicion.caras);
                muebleEnEdicion = null;
            } else {
                const sigNumero = muebles.length + 1;
                const strNum = String(sigNumero).padStart(2, '0');
                const prefZona = (zona === 'BODEGA') ? 'BOD' : 'PV';
                const idCanonicoMueble = prefZona + "_M" + strNum + "_" + anchoM + "x" + largoM + "_H" + maxNiveles;
                const carasCopia = JSON.parse(JSON.stringify(configCarasEnMemoria));
                const compartimientos = window.generarMatrizCanonicaBins(idCanonicoMueble, carasCopia);

                muebles.push({
                    id_mueble: idCanonicoMueble,
                    qr: "GEO-M-" + idNegocio + "-" + idSedeActiva + "-" + idCanonicoMueble,
                    nombre: nombre,
                    zona: zona,
                    anchoM: anchoM,
                    largoM: largoM,
                    caras: carasCopia,
                    compartimientos: compartimientos,
                    x: 80,
                    y: 80,
                    rotacion: 0
                });
            }
            document.getElementById('modal-mueble').style.display = 'none';
            window.renderizarMuebles();
            window.actualizarContadorDrawer();
        });

        const btnCancM = document.getElementById('btn-cancelar-mueble');
        if (btnCancM) btnCancM.addEventListener('click', function() { document.getElementById('modal-mueble').style.display = 'none'; });

        // DRAWER LATERAL
        window.actualizarContadorDrawer = function() {
            const b = document.getElementById('badge-contador-muebles');
            const d = document.getElementById('drawer-resumen-total');
            if (b) b.innerText = muebles.length;
            if (d) d.innerText = muebles.length + " muebles en plano";
        };

        window.renderizarDrawerMuebles = function() {
            const cont = document.getElementById('drawer-lista-contenedor');
            if (!cont) return;
            cont.innerHTML = '';
            if (muebles.length === 0) {
                cont.innerHTML = '<div style="text-align: center; color: #777; padding: 30px 10px; font-size: 12px;">No has agregado muebles.<br>Usa el botón + Mueble.</div>';
                return;
            }
            muebles.forEach(function(m) {
                const totalBins = m.compartimientos ? m.compartimientos.length : 0;
                const card = document.createElement('div');
                card.classList.add('tarjeta-mueble-index');
                const txtZona = m.zona === 'BODEGA' ? 'BODEGA' : 'PISO VENTA';
                const colZona = m.zona === 'BODEGA' ? '#ffaa00' : '#00ff64';
                const bgZona = m.zona === 'BODEGA' ? 'rgba(255,170,0,0.2)' : 'rgba(0,255,100,0.2)';

                card.innerHTML = 
                    '<div style="display: flex; justify-content: space-between; align-items: center;">' +
                        '<strong style="color: white; font-size: 13px;">' + m.nombre + '</strong>' +
                        '<span style="font-size: 9px; padding: 2px 6px; border-radius: 6px; background: ' + bgZona + '; color: ' + colZona + '; font-weight: bold;">' + txtZona + '</span>' +
                    '</div>' +
                    '<div style="font-family: monospace; font-size: 11px; color: var(--naranja); margin-top: 4px;">' + m.id_mueble + '</div>' +
                    '<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11px; color: #888;">' +
                        '<span>Dim: ' + m.anchoM + 'm x ' + m.largoM + 'm</span>' +
                        '<span style="color: #00ff64; font-weight: bold;">' + totalBins + ' Bins</span>' +
                    '</div>';

                card.addEventListener('click', function() {
                    window.navegarYResaltarMueble(m);
                    const dEl = document.getElementById('drawer-muebles');
                    if (dEl) dEl.classList.remove('abierto');
                });
                cont.appendChild(card);
            });
        };

        window.navegarYResaltarMueble = function(m) {
            document.querySelectorAll('.mueble-bloque').forEach(function(b) { b.classList.remove('radar-activo', 'seleccionado'); });
            const miniWrap = document.getElementById('contenedor-minimapa');
            if (miniWrap && miniWrap.classList.contains('colapsado')) miniWrap.classList.remove('colapsado');
            muebleRadarActivoId = m.id_mueble;
            window.renderizarMinimapa();
            if (animacionRadarMiniTimer) clearTimeout(animacionRadarMiniTimer);
            animacionRadarMiniTimer = setTimeout(function() { muebleRadarActivoId = null; window.renderizarMinimapa(); }, 3200);

            capaTransform.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
            viewport.x = (window.innerWidth / 2) - ((m.x + (m.anchoM * METRO_PX) / 2) * viewport.escala);
            viewport.y = (window.innerHeight / 2) - ((m.y + (m.largoM * METRO_PX) / 2) * viewport.escala);
            window.actualizarTransform();
            setTimeout(function() { capaTransform.style.transition = ''; }, 450);

            const elMueble = document.getElementById("mueble-" + m.id_mueble);
            if (elMueble) {
                window.seleccionarMueble(m, elMueble);
                elMueble.classList.add('radar-activo');
                setTimeout(function() { elMueble.classList.remove('radar-activo'); }, 3000);
            }
        };

        const btnPest = document.getElementById('btn-pestana-lista-muebles');
        if (btnPest) btnPest.addEventListener('click', function() {
            window.renderizarDrawerMuebles();
            const d = document.getElementById('drawer-muebles');
            if (d) d.classList.add('abierto');
        });
        const btnCerD = document.getElementById('btn-cerrar-drawer');
        if (btnCerD) btnCerD.addEventListener('click', function() {
            const d = document.getElementById('drawer-muebles');
            if (d) d.classList.remove('abierto');
        });

        // ÍTEMS
        const btnItem = document.getElementById('btn-burbuja-item');
        if (btnItem) btnItem.addEventListener('click', function() {
            itemEnEdicion = null;
            const tit = document.getElementById('modal-item-titulo');
            if (tit) tit.innerText = "Agregar Elemento / Acceso";
            document.getElementById('item-etiqueta').value = "Puerta Principal";
            document.getElementById('item-forma').value = "rectangulo";
            document.getElementById('item-ancho').value = 1.2;
            document.getElementById('item-largo').value = 0.4;
            document.getElementById('modal-item').style.display = 'flex';
        });

        const tipPres = document.getElementById('item-tipo-preset');
        if (tipPres) tipPres.addEventListener('change', function(e) {
            const val = e.target.value;
            if (val.startsWith('PUERTA')) {
                document.getElementById('item-forma').value = 'rectangulo';
                document.getElementById('item-color').value = 'rgba(0, 255, 100, 0.25)';
                document.getElementById('item-ancho').value = (val === 'PUERTA_BOD_EXT') ? 3.0 : 1.2;
                document.getElementById('item-largo').value = 0.4;
                document.getElementById('item-etiqueta').value = e.target.options[e.target.selectedIndex].text.replace(/^[^\s]+\s/, '');
            } else if (val === 'ZONA_TEXTO') {
                document.getElementById('item-forma').value = 'nube';
                document.getElementById('item-color').value = 'rgba(255, 255, 255, 0.08)';
                document.getElementById('item-ancho').value = 3.5;
                document.getElementById('item-largo').value = 2.0;
                document.getElementById('item-etiqueta').value = 'Zona / Checkout';
            }
        });

        const btnCancI = document.getElementById('btn-cancelar-item');
        if (btnCancI) btnCancI.addEventListener('click', function() { document.getElementById('modal-item').style.display = 'none'; });

        const btnGuarI = document.getElementById('btn-guardar-item');
        if (btnGuarI) btnGuarI.addEventListener('click', function() {
            const etiq = document.getElementById('item-etiqueta').value.trim() || 'Ítem';
            const forma = document.getElementById('item-forma').value;
            const color = document.getElementById('item-color').value;
            const w = Number(document.getElementById('item-ancho').value) || 1.2;
            const h = Number(document.getElementById('item-largo').value) || 0.4;

            if (itemEnEdicion) {
                itemEnEdicion.etiqueta = etiq; itemEnEdicion.forma = forma;
                itemEnEdicion.colorFondo = color; itemEnEdicion.anchoM = w; itemEnEdicion.largoM = h;
                itemEnEdicion = null;
            } else {
                itemsEspaciales.push({
                    id_item: "IT_" + Date.now(), etiqueta: etiq, forma: forma, colorFondo: color,
                    anchoM: w, largoM: h, x: 60, y: 60, rotacion: 0
                });
            }
            document.getElementById('modal-item').style.display = 'none';
            window.renderizarItemsEspaciales();
            window.renderizarMinimapa();
        });

        const btnModo = document.getElementById('btn-toggle-modo-edicion');
        if (btnModo) btnModo.addEventListener('click', function() {
            modoEdicionActivo = !modoEdicionActivo;
            if (modoEdicionActivo) {
                vpEl.classList.add('modo-edicion'); vpEl.classList.remove('modo-lectura');
                btnModo.innerHTML = '🔓 Edición'; btnModo.style.background = 'var(--naranja)'; btnModo.style.borderColor = '#ffffff';
            } else {
                vpEl.classList.remove('modo-edicion'); vpEl.classList.add('modo-lectura');
                window.deseleccionarMuebles();
                btnModo.innerHTML = '🔒 Lectura'; btnModo.style.background = 'rgba(255,255,255,0.08)'; btnModo.style.borderColor = 'rgba(255,255,255,0.2)';
            }
        });

        // ÁREA
        const btnArea = document.getElementById('btn-burbuja-area');
        if (btnArea) btnArea.addEventListener('click', function() { document.getElementById('modal-area').style.display = 'flex'; });
        const btnCancA = document.getElementById('btn-cancelar-area');
        if (btnCancA) btnCancA.addEventListener('click', function() { document.getElementById('modal-area').style.display = 'none'; });
        const btnAplA = document.getElementById('btn-aplicar-area');
        if (btnAplA) btnAplA.addEventListener('click', function() {
            perimetro.anchoM = Number(document.getElementById('area-ancho').value) || 12;
            perimetro.largoM = Number(document.getElementById('area-largo').value) || 18;
            document.getElementById('modal-area').style.display = 'none';
            window.redibujarArea();
        });

        // QRS
        const btnQr = document.getElementById('btn-burbuja-qrs');
        if (btnQr) btnQr.addEventListener('click', function() {
            const cont = document.getElementById('contenedor-qrs-render');
            cont.innerHTML = '';
            muebles.forEach(function(m) {
                const cardM = document.createElement('div'); cardM.classList.add('tarjeta-qr-print');
                const canM = document.createElement('canvas'); QRLocal.dibujarEnCanvas(canM, m.qr, { width: 100 });
                cardM.appendChild(canM);
                cardM.innerHTML += '<p style="margin: 4px 0 0 0; font-size: 11px; font-weight: bold;">' + m.nombre + '<br><span style="color:#ff6b00;">' + m.qr + '</span></p>';
                cont.appendChild(cardM);

                (m.compartimientos || []).forEach(function(comp) {
                    const cardC = document.createElement('div'); cardC.classList.add('tarjeta-qr-print');
                    const canC = document.createElement('canvas'); QRLocal.dibujarEnCanvas(canC, comp.id_comp, { width: 100 });
                    cardC.appendChild(canC);
                    cardC.innerHTML += '<p style="margin: 4px 0 0 0; font-size: 10px;">' + m.nombre + ' [Cara ' + (comp.cara || 'A') + ']<br>' + (comp.nivel || '') + '-' + (comp.bin || '') + '<br><span style="color:#0088ff; font-weight: bold;">' + comp.id_comp + '</span></p>';
                    cont.appendChild(cardC);
                });
            });
            document.getElementById('modal-impresion').style.display = 'flex';
        });
        const btnCerrP = document.getElementById('btn-cerrar-print');
        if (btnCerrP) btnCerrP.addEventListener('click', function() { document.getElementById('modal-impresion').style.display = 'none'; });

        // RADAR BÚSQUEDA
        const btnEjecR = document.getElementById('btn-ejecutar-radar');
        if (btnEjecR) btnEjecR.addEventListener('click', async function() {
            const sku = document.getElementById('input-radar-sku').value.trim();
            if (!sku || !idNegocio) { alert("Ingresa un código SKU válido."); return; }
            document.querySelectorAll('.mueble-bloque').forEach(function(m) { m.classList.remove('radar-activo'); });

            const res = await GeokatuDB.InventarioService.obtenerStockUbicacionesProducto(idNegocio, sku);
            if (res.success && res.data.length > 0) {
                const ubi = res.data[0];
                const idComp = ubi.id_compartimiento || ubi.id || "";
                const mueble = muebles.find(function(m) {
                    if (m.id_mueble === ubi.id_estante || m.qr === ubi.id_estante) return true;
                    return (m.compartimientos || []).some(function(c) { return c.id_comp === idComp; });
                });

                if (mueble) {
                    const el = document.getElementById("mueble-" + mueble.id_mueble);
                    if (el) {
                        el.classList.add('radar-activo');
                        viewport.x = (window.innerWidth / 2) - ((mueble.x + (mueble.anchoM * METRO_PX) / 2) * viewport.escala);
                        viewport.y = (window.innerHeight / 2) - ((mueble.y + (mueble.largoM * METRO_PX) / 2) * viewport.escala);
                        window.actualizarTransform();

                        const partes = idComp.split('-');
                        let detalle = idComp;
                        if (partes.length >= 6) {
                            detalle = "Góndola: " + mueble.nombre + " | Cara: " + partes[partes.length - 3] + " | Nivel: " + partes[partes.length - 2] + " | Bin: " + partes[partes.length - 1];
                        }
                        const tagEl = el.querySelector('.mueble-etiqueta');
                        if (tagEl) tagEl.innerText = "🎯 SKU AQUÍ\n" + detalle;
                    }
                } else {
                    alert("SKU en bin [" + idComp + "], pero el mueble no está en el plano actual.");
                }
            } else {
                alert("El producto no posee registros en ubicaciones físicas.");
            }
        });

        // GUARDADO NUBE
        const btnGuardN = document.getElementById('btn-guardar-nube');
        if (btnGuardN) btnGuardN.addEventListener('click', async function() {
            if (!idNegocio) { alert("Inicia sesión para respaldar."); return; }
            const gridData = {
                perimetro: perimetro, elementos: muebles, items: itemsEspaciales,
                muros: Array.from(celdasMurosBloqueadas), sede: idSedeActiva
            };
            const res = await GeokatuDB.RadarService.guardarMapaBodega(idNegocio, idSedeActiva, gridData);
            if (res.success) alert("✅ Plano espacial de [" + idSedeActiva + "] sincronizado con éxito.");
            else alert("⚠️ Error guardando: " + res.error);
        });

        // CARGA NUBE
        window.hidratarPlanoNube = async function() {
            if (!idNegocio) return;
            try {
                const res = await GeokatuDB.RadarService.obtenerMapaBodega(idNegocio, idSedeActiva);
                if (res.success && res.data) {
                    if (res.data.perimetro) {
                        perimetro = res.data.perimetro;
                        document.getElementById('area-ancho').value = perimetro.anchoM;
                        document.getElementById('area-largo').value = perimetro.largoM;
                    }
                    if (Array.isArray(res.data.elementos)) {
                        muebles = res.data.elementos.map(function(m) {
                            if (!m.caras) m.caras = { A: { niveles: m.niveles || 4, bins: m.subdivisionesXNivel || 4, activa: true }, B: { niveles: 0, bins: 0, activa: false }, C: { niveles: 0, bins: 0, activa: false }, D: { niveles: 0, bins: 0, activa: false } };
                            if (!m.compartimientos || m.compartimientos.length === 0) m.compartimientos = window.generarMatrizCanonicaBins(m.id_mueble, m.caras);
                            return m;
                        });
                    } else { muebles = []; }
                    if (Array.isArray(res.data.items)) itemsEspaciales = res.data.items; else itemsEspaciales = [];
                    if (Array.isArray(res.data.muros)) celdasMurosBloqueadas = new Set(res.data.muros); else celdasMurosBloqueadas = new Set();
                } else {
                    itemsEspaciales = []; perimetro = { anchoM: 12, largoM: 18 };
                    document.getElementById('area-ancho').value = 12; document.getElementById('area-largo').value = 18;
                    muebles = []; celdasMurosBloqueadas = new Set();
                }
                
                modoEdicionActivo = false;
                vpEl.classList.remove('modo-edicion'); vpEl.classList.add('modo-lectura');
                window.deseleccionarMuebles();
                const bModo = document.getElementById('btn-toggle-modo-edicion');
                if (bModo) { bModo.innerHTML = '🔒 Lectura'; bModo.style.background = 'rgba(255,255,255,0.08)'; bModo.style.borderColor = 'rgba(255,255,255,0.2)'; }

                window.redibujarArea();
                window.renderizarMuebles();
                window.actualizarTransform();
                window.renderizarItemsEspaciales();
                window.actualizarContadorDrawer();
            } catch (err) {}
        };

        // INICIALIZACIÓN
        window.redibujarArea();
        window.actualizarTransform();
        window.actualizarContadorDrawer();

    </script>
</body>
</html>
