                    } catch(e){}
                    
                    cardM.appendChild(divQrM);
                    const tituloMueble = document.createElement('p');
                    tituloMueble.textContent = m.nombre + ' · Mueble';
                    cardM.appendChild(tituloMueble);
                    contenedor.appendChild(cardM);

                    (m.compartimientos || []).forEach((comp) => {
                        const cardC = document.createElement('div');
                        cardC.classList.add('tarjeta-qr-print');
                        const divQrC = document.createElement('div');
                        
                        try {
                            if(typeof QRCode !== 'undefined') {
                                new QRCode(divQrC, { text: comp.id_comp, width: 144, height: 144, colorDark: "#000000", colorLight: "#ffffff" });
                            }
                        } catch(e){}

                        cardC.appendChild(divQrC);
                        const tituloEspacio = document.createElement('p');
                        tituloEspacio.textContent = m.nombre + ' · Cara ' + (comp.cara || 'A') + ' · ' + comp.nivel + ' · ' + comp.bin;
                        cardC.appendChild(tituloEspacio);
                        contenedor.appendChild(cardC);
                    });
                });

                document.getElementById('modal-impresion').style.display = 'flex';
            });
        }

        const btnCerrarPrint = document.getElementById('btn-cerrar-print');
        if (btnCerrarPrint) {
            btnCerrarPrint.addEventListener('click', () => {
                document.getElementById('modal-impresion').style.display = 'none';
            });
        }

       // --- 9. AUTO-CARGA DEL PLANO PERSISTIDO (0-MS LOCALSTORAGE + NUBE) ---
        window.aplicarDatosPlanoEnMemoria = function(planoObj) {
            if (!planoObj) {
                itemsEspaciales = [];
                perimetro = { anchoM: 12, largoM: 18 };
                document.getElementById('area-ancho').value = 12;
                document.getElementById('area-largo').value = 18;
                muebles = [];
                celdasMurosBloqueadas = new Set();
                return;
            }
            if (planoObj.perimetro) {
                perimetro = planoObj.perimetro;
                document.getElementById('area-ancho').value = perimetro.anchoM;
                document.getElementById('area-largo').value = perimetro.largoM;
            }
            if (Array.isArray(planoObj.elementos)) {
                muebles = planoObj.elementos.map(m => {
                    if (!m.caras) {
                        m.caras = {
                            A: { niveles: m.niveles || 4, bins: m.subdivisionesXNivel || 4, activa: true },
                            B: { niveles: 0, bins: 0, activa: false },
                            C: { niveles: 0, bins: 0, activa: false },
                            D: { niveles: 0, bins: 0, activa: false }
                        };
                    }
                    if (!m.compartimientos || m.compartimientos.length === 0) {
                        m.compartimientos = window.generarMatrizCanonicaBins(m.id_mueble, m.caras);
                    }
                    return m;
                });
            } else {
                muebles = [];
            }
            itemsEspaciales = Array.isArray(planoObj.items) ? planoObj.items : [];
            celdasMurosBloqueadas = Array.isArray(planoObj.muros) ? new Set(planoObj.muros) : new Set();
        };

        window.hidratarPlanoNube = async function() {
            if (!idNegocio) return;
            const negocio = idNegocio;
            const sede = idSedeActiva;
            actualizarEnlaceCroquis();
            const res = await GeokatuDB.RadarService.obtenerMapaBodega(negocio, sede, { revalidarMs: 300000 });
            if (negocio !== idNegocio || sede !== idSedeActiva) return;
            const borrador = permisosUsuario.puedeMoverMuebles ? planoBorradorActual() : null;
            window.aplicarDatosPlanoEnMemoria(borrador ? JSON.parse(borrador) : res.data);
            window.alternarModoEdicion(false);
            window.redibujarArea();
            window.renderizarMuebles();
            window.actualizarTransform();
            window.renderizarItemsEspaciales();
            window.actualizarContadorDrawer();
            informarCroquis(borrador ? 'Cambios en borrador' : res.success ? '' : 'No se pudo cargar el plano.');
        };


        const btnToggleModoEdicion = document.getElementById('btn-toggle-modo-edicion');
        if (btnToggleModoEdicion) {
            btnToggleModoEdicion.addEventListener('click', () => window.alternarModoEdicion());
        }

        // --- DRAWER LATERAL DE MUEBLES ---
        const drawerEl = document.getElementById('drawer-muebles');
        const contenedorDrawer = document.getElementById('drawer-lista-contenedor');
        const badgeContador = document.getElementById('badge-contador-muebles');
        const drawerTotalTxt = document.getElementById('drawer-resumen-total');

        window.actualizarContadorDrawer = function() {
            if (badgeContador) badgeContador.innerText = muebles.length;
            if (drawerTotalTxt) drawerTotalTxt.innerText = muebles.length + " muebles en plano";
        };

        window.renderizarDrawerMuebles = function() {
            if (!contenedorDrawer) return;
            contenedorDrawer.innerHTML = '';

            if (muebles.length === 0) {
                contenedorDrawer.innerHTML = "<div style=\"text-align: center; color: #777; padding: 30px 10px; font-size: 12px;\">No has agregado muebles al plano.<br>Usa el botón <strong>+ Mueble</strong> para diseñar estanterías.</div>";
                return;
            }

            muebles.forEach((m) => {
                const totalBins = m.compartimientos ? m.compartimientos.length : 0;
                const card = document.createElement('div');
                card.classList.add('tarjeta-mueble-index');
                
                const txtZona = m.zona === 'BODEGA' ? 'BODEGA' : 'PISO VENTA';
                const colorBg = m.zona === 'BODEGA' ? 'rgba(255,170,0,0.2)' : 'rgba(0,255,100,0.2)';
                const colorTxt = m.zona === 'BODEGA' ? '#ffaa00' : '#00ff64';

                card.innerHTML = "<div style=\"display: flex; justify-content: space-between; align-items: center;\">" +
                    "<strong style=\"color: white; font-size: 13px;\">" + m.nombre + "</strong>" +
                    "<span style=\"font-size: 9px; padding: 2px 6px; border-radius: 6px; background: " + colorBg + "; color: " + colorTxt + "; font-weight: bold;\">" + txtZona + "</span>" +
                    "</div>" +
                    "<div style=\"font-family: monospace; font-size: 11px; color: var(--naranja); margin-top: 4px;\">" + m.id_mueble + "</div>" +
                    "<div style=\"display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11px; color: #888;\">" +
                    "<span>Dim: " + m.anchoM + "m x " + m.largoM + "m</span>" +
                    "<span style=\"color: #00ff64; font-weight: bold;\">" + totalBins + " Bins</span>" +
                    "</div>";

                card.addEventListener('click', () => {
                    window.navegarYResaltarMueble(m);
                    drawerEl.classList.remove('abierto');
                });

                contenedorDrawer.appendChild(card);
            });
        };

        window.navegarYResaltarMueble = function(m) {
            document.querySelectorAll('.mueble-bloque').forEach(b => {
                b.classList.remove('radar-activo', 'seleccionado');
            });

            const miniWrap = document.getElementById('contenedor-minimapa');
            if (miniWrap && miniWrap.classList.contains('colapsado')) {
                miniWrap.classList.remove('colapsado');
            }

            muebleRadarActivoId = m.id_mueble;
            window.renderizarMinimapa();

            if (animacionRadarMiniTimer) clearTimeout(animacionRadarMiniTimer);
            animacionRadarMiniTimer = setTimeout(() => {
                muebleRadarActivoId = null;
                window.renderizarMinimapa();
            }, 3200);

            capaTransform.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
            viewport.x = (window.innerWidth / 2) - ((m.x + (m.anchoM * METRO_PX) / 2) * viewport.escala);
            viewport.y = (window.innerHeight / 2) - ((m.y + (m.largoM * METRO_PX) / 2) * viewport.escala);
            window.actualizarTransform();

            setTimeout(() => {
                capaTransform.style.transition = '';
            }, 450);

            const elMueble = document.getElementById("mueble-" + m.id_mueble);
            if (elMueble) {
                window.seleccionarMueble(m, elMueble);
                elMueble.classList.add('radar-activo');
                setTimeout(() => {
                    elMueble.classList.remove('radar-activo');
                }, 3000);
            }
        };

        const btnPestanaListaMuebles = document.getElementById('btn-pestana-lista-muebles');
        if (btnPestanaListaMuebles) {
            btnPestanaListaMuebles.addEventListener('click', () => {
                window.renderizarDrawerMuebles();
                if (drawerEl) drawerEl.classList.add('abierto');
            });
        }

        const btnCerrarDrawer = document.getElementById('btn-cerrar-drawer');
        if (btnCerrarDrawer) {
            btnCerrarDrawer.addEventListener('click', () => {
                if (drawerEl) drawerEl.classList.remove('abierto');
            });
        }

        // =======================================================
        // GESTIÓN DE ÍTEMS ESPACIALES, PUERTAS Y ANOTACIONES
        // =======================================================
        window.renderizarItemsEspaciales = function() {
            if (!contenedorItems) return;
            contenedorItems.innerHTML = '';

            itemsEspaciales.forEach((it) => {
                const el = document.createElement('div');
                el.classList.add('item-espacial-bloque', "forma-" + it.forma);
                if (itemSeleccionado && itemSeleccionado.id_item === it.id_item) {
                    el.classList.add('seleccionado');
                }
                el.id = "item-" + it.id_item;
                el.style.width = (it.anchoM * METRO_PX) + "px";
                el.style.height = (it.largoM * METRO_PX) + "px";
                el.style.left = it.x + "px";
                el.style.top = it.y + "px";
                el.style.background = it.colorFondo;
                el.style.transform = "rotate(" + (it.rotacion || 0) + "deg)";

                const tag = document.createElement('div');
                tag.classList.add('item-etiqueta', 'contra-rotacion');
                tag.innerText = it.etiqueta || '';
                el.appendChild(tag);

                const pivote = document.createElement('div');
                pivote.classList.add('pivote-giro', 'contra-rotacion');
                pivote.innerHTML = '🔄';
                pivote.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    it.rotacion = ((it.rotacion || 0) + 45) % 360;
                    el.style.transform = "rotate(" + it.rotacion + "deg)";
                    window.aplicarContraRotacion(el, it.rotacion);
                    window.renderizarMinimapa();
                });
                el.appendChild(pivote);

                const menu = document.createElement('div');
                menu.classList.add('menu-contextual-mueble', 'contra-rotacion');
                menu.innerHTML = "<button class=\"btn-mini-contextual btn-editar-it\">✏️ Editar</button><button class=\"btn-mini-contextual peligro btn-borrar-it\">🗑️ Borrar</button>";
                
                menu.querySelector('.btn-editar-it').addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    window.abrirModalEditarItem(it);
                });
                menu.querySelector('.btn-borrar-it').addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    if (confirm("¿Eliminar \"" + it.etiqueta + "\"?")) {
                        itemsEspaciales = itemsEspaciales.filter(x => x.id_item !== it.id_item);
                        window.deseleccionarItems();
                        window.renderizarItemsEspaciales();
                        window.renderizarMinimapa();
                    }
                });
                el.appendChild(menu);

                window.iniciarDragItem(el, it);
                contenedorItems.appendChild(el);
                window.aplicarContraRotacion(el, it.rotacion || 0);
            });
        };

        window.iniciarDragItem = function(el, item) {
            let offset = { x: 0, y: 0 };
            let arrastrando = false;

            el.addEventListener('pointerdown', (e) => {
                if (!modoEdicionActivo) return;
                e.stopPropagation();
                arrastrando = true;
                window.deseleccionarMuebles();
                window.seleccionarItem(item, el);

                offset = {
                    x: (e.clientX / viewport.escala) - item.x,
                    y: (e.clientY / viewport.escala) - item.y
                };
                el.setPointerCapture(e.pointerId);
            });

            el.addEventListener('pointermove', (e) => {
                if (!arrastrando) return;
                item.x = (e.clientX / viewport.escala) - offset.x;
                item.y = (e.clientY / viewport.escala) - offset.y;
                el.style.left = item.x + "px";
                el.style.top = item.y + "px";
                window.renderizarMinimapa();
            });

            const fin = () => { arrastrando = false; };
            el.addEventListener('pointerup', fin);
            el.addEventListener('pointercancel', fin);
        };

        window.seleccionarItem = function(it, el) {
            window.deseleccionarItems();
            itemSeleccionado = it;
            el.classList.add('seleccionado');
        };

        window.deseleccionarItems = function() {
            itemSeleccionado = null;
            document.querySelectorAll('.item-espacial-bloque').forEach(b => b.classList.remove('seleccionado'));
        };

        window.abrirModalEditarItem = function(it) {
            itemEnEdicion = it;
            document.getElementById('modal-item-titulo').innerText = "Editar Ítem Espacial";
            document.getElementById('item-etiqueta').value = it.etiqueta;
            document.getElementById('item-forma').value = it.forma;
            document.getElementById('item-color').value = it.colorFondo;
            document.getElementById('item-ancho').value = it.anchoM;
            document.getElementById('item-largo').value = it.largoM;
            document.getElementById('modal-item').style.display = 'flex';
        };

        const btnBurbujaItem = document.getElementById('btn-burbuja-item');
        if (btnBurbujaItem) {
            btnBurbujaItem.addEventListener('click', () => {
                itemEnEdicion = null;
                document.getElementById('modal-item-titulo').innerText = "Agregar Elemento / Acceso";
                document.getElementById('item-etiqueta').value = "Puerta Principal";
                document.getElementById('item-forma').value = "rectangulo";
                document.getElementById('item-ancho').value = 1.2;
                document.getElementById('item-largo').value = 0.4;
                document.getElementById('modal-item').style.display = 'flex';
            });
        }

        const itemTipoPreset = document.getElementById('item-tipo-preset');
        if (itemTipoPreset) {
            itemTipoPreset.addEventListener('change', (e) => {
                const val = e.target.value;
                const inputEtiq = document.getElementById('item-etiqueta');
                const inputForma = document.getElementById('item-forma');
                const inputColor = document.getElementById('item-color');
                const inputW = document.getElementById('item-ancho');
                const inputH = document.getElementById('item-largo');

                if (val.startsWith('PUERTA')) {
                    inputForma.value = 'rectangulo';
                    inputColor.value = 'rgba(0, 255, 100, 0.25)';
                    inputW.value = (val === 'PUERTA_BOD_EXT') ? 3.0 : 1.2;
                    inputH.value = 0.4;
                    inputEtiq.value = e.target.options[e.target.selectedIndex].text.replace(/^[^\s]+\s/, '');
                } else if (val === 'ZONA_TEXTO') {
                    inputForma.value = 'nube';
                    inputColor.value = 'rgba(255, 255, 255, 0.08)';
                    inputW.value = 3.5;
                    inputH.value = 2.0;
                    inputEtiq.value = 'Zona Cajas / Checkout';
                }
            });
        }

        const btnCancelarItem = document.getElementById('btn-cancelar-item');
        if (btnCancelarItem) {
            btnCancelarItem.addEventListener('click', () => {
                document.getElementById('modal-item').style.display = 'none';
            });
        }

        const btnGuardarItem = document.getElementById('btn-guardar-item');
        if (btnGuardarItem) {
            btnGuardarItem.addEventListener('click', () => {
                const etiq = document.getElementById('item-etiqueta').value.trim() || 'Ítem';
                const forma = document.getElementById('item-forma').value;
                const color = document.getElementById('item-color').value;
                const w = Number(document.getElementById('item-ancho').value) || 1.2;
                const h = Number(document.getElementById('item-largo').value) || 0.4;

                if (itemEnEdicion) {
                    itemEnEdicion.etiqueta = etiq;
                    itemEnEdicion.forma = forma;
                    itemEnEdicion.colorFondo = color;
                    itemEnEdicion.anchoM = w;
                    itemEnEdicion.largoM = h;
                    itemEnEdicion = null;
                } else {
                    itemsEspaciales.push({
                        id_item: "IT_" + Date.now(),
                        etiqueta: etiq,
                        forma: forma,
                        colorFondo: color,
                        anchoM: w,
                        largoM: h,
                        x: 60,
                        y: 60,
                        rotacion: 0
                    });
                }
                document.getElementById('modal-item').style.display = 'none';
                window.alternarModoEdicion(true);
                window.renderizarItemsEspaciales();
                window.renderizarMinimapa();
                window.persistirPlanoLocal();
            });
        }


        // Inicialización del Modelo CAD
        window.redibujarArea();
        window.actualizarTransform();
        window.actualizarContadorDrawer();
        window.renderizarItemsEspaciales();
        
    </script>

</body>
</html>
