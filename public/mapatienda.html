<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plano Espacial de Tienda | Geokatu SIG</title>
    <meta name="theme-color" content="#ff6b00">
    <link rel="stylesheet" href="mapatienda.css">
    <!-- SE INCLUYE QRCODE NATIVO AQUÍ PARA EVITAR EL CRASH DEL IMPORT -->
    <script src="qrcode.min.js" type="text/javascript"></script>
</head>
<body class="editor-croquis">

    <!-- 1. VIEWPORT DEL LIENZO INFINITO -->
    <div id="viewport-infinito" style="touch-action: none;">
        <div id="capa-transform">
            <canvas id="rejilla-canvas"></canvas>
            <div id="contenedor-items"></div>
            <div id="contenedor-muebles"></div>

            <!-- Líneas Guía Magnéticas Dinámicas -->
            <div id="guia-h" class="linea-guia horizontal"></div>
            <div id="guia-v" class="linea-guia vertical"></div>
        </div>
    </div>

    <!-- 2. HUD FLOTANTE SUPERIOR ZERO-OVERFLOW (MULTI-SEDE, RADAR Y CONTROLES) -->
    <header class="hud-barra-superior croquis-hud">
        <div class="croquis-cabecera">
            <a href="inventario" id="croquis-volver" class="croquis-enlace">‹ Inventario</a>
            <strong>GEOKATU <span> / Croquis</span></strong>
            <details class="croquis-mas">
                <summary aria-label="Opciones de terminal">⋯</summary>
                <div class="croquis-opciones">
                    <button type="button" onclick="window.AuthGate.bloquearTerminalPorInactividad();">Cambiar operario</button>
                    <button type="button" id="btn-logout-mapatienda">Cerrar sesión</button>
                </div>
            </details>
        </div>
        <div class="croquis-principales">
            <select id="selector-sede-activa" class="hud-radar-select" aria-label="Sede">
                <option value="SALA_VENTAS" selected>Sala de ventas</option>
            </select>
            <button id="btn-toggle-modo-edicion" type="button" class="btn-radar-buscar" aria-pressed="false" hidden>Editar</button>
            <button id="btn-guardar-nube" type="button" class="btn-radar-buscar croquis-guardar" hidden>Publicar plano</button>
            <button id="btn-abrir-modal-sede" type="button" class="btn-radar-buscar" style="display:none">+ Sede</button>
        </div>
        <p id="croquis-estado" class="croquis-estado" role="status" hidden></p>
        <form class="grupo-busqueda-sku" id="croquis-busqueda">
            <input type="search" id="input-radar-sku" class="hud-radar-input" aria-label="Nombre o código del producto" placeholder="Buscar producto">
            <button id="btn-ejecutar-radar" class="btn-radar-buscar" type="submit">Buscar</button>
        </form>
    </header>



    <!-- MODAL CREACIÓN DE NUEVA TIENDA O BODEGA -->
    <div id="modal-nueva-sede" class="modal-flotante-wrap" style="display: none;">
        <div class="modal-tarjeta-boveda">
            <h3 style="margin: 0 0 15px 0; font-size: 15px; text-transform: uppercase; color: var(--naranja);">Crear Espacio / Tienda / Bodega</h3>
            
            <label style="font-size: 11px; color: #aaa;">IDENTIFICADOR CORTO (ID):</label>
            <input type="text" id="nueva-sede-id" class="input-modal" placeholder="Ej: BODEGA_NORTE" style="font-family: monospace; text-transform: uppercase;">

            <label style="font-size: 11px; color: #aaa;">NOMBRE DESCRIPTIVO:</label>
            <input type="text" id="nueva-sede-nombre" class="input-modal" placeholder="Ej: Bodega Anexa Zona Franca">

            <label style="font-size: 11px; color: #aaa;">TIPO DE ESPACIO:</label>
            <select id="nueva-sede-tipo" class="input-modal">
                <option value="TIENDA" selected>🛒 Piso de Ventas / Tienda</option>
                <option value="BODEGA">📦 Almacén / Bodega de Stock</option>
                <option value="MIXTO">🏬 Espacio Mixto (Piso de Venta + Bodega)</option>
            </select>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-cancelar-nueva-sede" class="btn-modal-accion" style="background: rgba(255,255,255,0.1);">Cerrar</button>
                <button id="btn-guardar-nueva-sede" class="btn-modal-accion">Crear Espacio</button>
            </div>
        </div>
    </div>

    <!-- 3. DOCK SEGMENTADO INFERIOR UNIFICADO -->
    <nav class="hud-dock-unificado" aria-label="Herramientas del croquis">
        <button hidden data-croquis-edicion id="btn-burbuja-area" class="dock-segment-btn" title="Definir perímetro de tienda">
            <span class="dock-icono">📐</span>
            <span class="dock-txt">Área</span>
        </button>
        <button hidden data-croquis-edicion id="btn-burbuja-mueble" class="dock-segment-btn destacado" title="Diseñar nuevo mueble">
            <span class="dock-icono">📦</span>
            <span class="dock-txt">+ Mueble</span>
        </button>
        <button hidden data-croquis-edicion id="btn-burbuja-item" class="dock-segment-btn" title="Agregar puerta, acceso o zona">
            <span class="dock-icono">🚪</span>
            <span class="dock-txt">+ Ítem</span>
        </button>
        <button hidden data-croquis-edicion type="button" id="btn-modo-muros" class="dock-segment-btn" aria-pressed="false">
            <span class="dock-icono">▦</span><span class="dock-txt">Muros</span>
        </button>
        <button id="btn-pestana-lista-muebles" class="dock-segment-btn" title="Lista de muebles">
            <span class="dock-icono">📋</span>
            <span class="dock-txt">Muebles</span>
            <span id="badge-contador-muebles" class="badge-conteo-muebles">0</span>
        </button>
        <button id="btn-burbuja-qrs" class="dock-segment-btn" title="Generar e imprimir señalética">
            <span class="dock-icono">🖨️</span>
            <span class="dock-txt">Etiquetas</span>
        </button>
    </nav>

    <!-- MINIMAPA MAGNÉTICO EN BURBUJA FLOTANTE COLAPSABLE -->
    <div id="contenedor-minimapa" class="minimapa-burbuja-wrap colapsado" title="Minimapa 2D">
        <div class="minimapa-header-bar">
            <span class="minimapa-titulo">RADAR 2D</span>
            <button id="btn-cerrar-minimapa" class="btn-cerrar-mini" title="Colapsar minimapa">✕</button>
        </div>
        <canvas id="canvas-minimapa"></canvas>
        <div class="icono-minimapa-radar">🧭</div>
    </div>

    <!-- DRAWER LATERAL DE MUEBLES INDEXADOS -->
    <aside id="drawer-muebles" class="drawer-index-muebles">
        <div class="drawer-header">
            <div>
                <strong style="font-size: 14px; text-transform: uppercase; color: var(--naranja);">Índice de Muebles</strong>
                <div id="drawer-resumen-total" style="font-size: 11px; color: #aaa;">0 muebles en plano</div>
            </div>
            <button id="btn-cerrar-drawer" class="btn-cerrar-mini" title="Cerrar lista" style="font-size: 16px;">✕</button>
        </div>
        <div id="drawer-lista-contenedor" class="drawer-lista-scroll"></div>
    </aside>

    <!-- 4. MODAL PARAMÉTRICO: DELIMITAR ÁREA -->
    <div id="modal-area" class="modal-flotante-wrap" style="display: none;">
        <div class="modal-tarjeta-boveda">
            <h3 style="margin: 0 0 15px 0; font-size: 15px; text-transform: uppercase; color: var(--naranja);">Delimitar Área de Tienda</h3>
            <label style="font-size: 11px; color: #aaa;">ANCHO EN METROS (X):</label>
            <input type="number" id="area-ancho" class="input-modal" value="12" min="2" max="100">
            
            <label style="font-size: 11px; color: #aaa;">LARGO EN METROS (Y):</label>
            <input type="number" id="area-largo" class="input-modal" value="18" min="2" max="100">

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-cancelar-area" class="btn-modal-accion" style="background: rgba(255,255,255,0.1);">Cerrar</button>
                <button id="btn-aplicar-area" class="btn-modal-accion">Fijar Perímetro</button>
            </div>
        </div>
    </div>

    <!-- 5. MODAL PARAMÉTRICO: NUEVO / EDITAR MUEBLE -->
    <div id="modal-mueble" class="modal-flotante-wrap" style="display: none;">
        <div class="modal-tarjeta-boveda">
            <h3 id="modal-mueble-titulo" style="margin: 0 0 15px 0; font-size: 15px; text-transform: uppercase; color: var(--naranja);">Diseñar Mueble / Estante</h3>
            
            <div style="display: flex; gap: 8px;">
                <div style="flex: 1.5;">
                    <label style="font-size: 11px; color: #aaa;">NOMBRE DEL MUEBLE:</label>
                    <input type="text" id="mueble-nombre" class="input-modal" value="Góndola Central">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 11px; color: #aaa;">ZONA DEL PLANO:</label>
                    <select id="mueble-zona" class="input-modal" style="text-transform: uppercase;">
                        <option value="PISO_VENTA" selected>🛒 Piso de Venta</option>
                        <option value="BODEGA">📦 Trastienda / Bodega</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">ANCHO (Metros):</label>
                    <input type="number" id="mueble-ancho" class="input-modal" value="2" step="0.5" min="0.5">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">LARGO (Metros):</label>
                    <input type="number" id="mueble-largo" class="input-modal" value="4" step="0.5" min="0.5">
                </div>
            </div>

            <label style="font-size: 10px; color: #aaa; margin-top: 4px; display: block;">CONFIGURAR CARA DE EXHIBICIÓN:</label>
            <div class="croquis-tipos" aria-label="Configuración inicial del mueble" id="croquis-tipos">
                <button type="button" class="btn-radar-buscar" data-tipo-mueble="estante">Estante</button>
                <button type="button" class="btn-radar-buscar" data-tipo-mueble="gondola">Góndola doble</button>
                <button type="button" class="btn-radar-buscar" data-tipo-mueble="mostrador">Mostrador</button>
            </div>
            <div class="selector-caras-tabs" id="dock-selector-caras">
                <button type="button" class="tab-cara-btn activa" data-cara="A">Frontal (A)</button>
                <button type="button" class="tab-cara-btn" data-cara="B">Posterior (B)</button>
                <button type="button" class="tab-cara-btn" data-cara="C">Cabecera Izq (C)</button>
                <button type="button" class="tab-cara-btn" data-cara="D">Cabecera Der (D)</button>
            </div>

            <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">NIVELES CARA ACTIVA:</label>
                    <input type="number" id="mueble-niveles" class="input-modal" value="4" min="1" max="25">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">BINS X NIVEL:</label>
                    <input type="number" id="mueble-subdivs" class="input-modal" value="4" min="1" max="32">
                </div>
            </div>

            <p id="txt-preview-bins" style="font-size: 11px; color: #00ff64; text-align: center; margin: 6px 0;">
                Cara Frontal: 16 Bins | Total Góndola: 16 Bins
            </p>

            <div style="display: flex; gap: 10px;">
                <button id="btn-cancelar-mueble" class="btn-modal-accion" style="background: rgba(255,255,255,0.1);">Cerrar</button>
                <button id="btn-crear-mueble" class="btn-modal-accion">Guardar Mueble</button>
            </div>
        </div>
    </div>

    <!-- 6. MODAL IMPRESIÓN DE SEÑALÉTICA QR -->
    <div id="modal-impresion" class="modal-flotante-wrap" style="display: none;">
        <div class="modal-tarjeta-boveda">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--naranja); padding-bottom: 8px;">
                <h3 style="margin: 0; font-size: 15px; text-transform: uppercase;">Señalética QR de Tienda</h3>
                <button id="btn-cerrar-print" style="background: none; border: none; font-size: 18px; cursor: pointer;">✕</button>
            </div>
            <div class="grid-qrs-print" id="contenedor-qrs-render"></div>
            <button onclick="window.print()" class="btn-modal-accion" style="margin-top: 10px;">🖨️ Mandar a Imprimir</button>
        </div>
    </div>

    <!-- MODAL PARAMÉTRICO: ÍTEMS ARQUITECTÓNICOS -->
    <div id="modal-item" class="modal-flotante-wrap" style="display: none;">
        <div class="modal-tarjeta-boveda">
            <h3 id="modal-item-titulo" style="margin: 0 0 12px 0; font-size: 15px; text-transform: uppercase; color: var(--naranja);">Agregar Elemento / Acceso</h3>
            
            <label style="font-size: 10px; color: #aaa;">TIPO DE ELEMENTO:</label>
            <select id="item-tipo-preset" class="input-modal">
                <option value="PUERTA_PPAL">🚪 Puerta Principal (Entrada)</option>
                <option value="PUERTA_SEC">🚪 Puerta Secundaria (Acceso)</option>
                <option value="PUERTA_BOD_INT">📦 Puerta Bodega Interna</option>
                <option value="PUERTA_BOD_EXT">🚚 Portón Bodega / Carga Externa</option>
                <option value="ZONA_TEXTO">🏷️ Rótulo / Cuadro de Texto</option>
                <option value="SIMBOLO_FORMA">🔷 Símbolo / Figura Geométrica</option>
            </select>

            <label style="font-size: 10px; color: #aaa;">TEXTO / IDENTIFICADOR:</label>
            <input type="text" id="item-etiqueta" class="input-modal" value="Entrada Principal">

            <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">FORMA:</label>
                    <select id="item-forma" class="input-modal">
                        <option value="rectangulo" selected>Rectángulo</option>
                        <option value="circulo">Círculo</option>
                        <option value="elipse">Elipse</option>
                        <option value="nube">Nube de Revisión</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">COLOR / FONDO:</label>
                    <select id="item-color" class="input-modal">
                        <option value="rgba(0, 255, 100, 0.25)" selected>Verde Acceso</option>
                        <option value="rgba(255, 107, 0, 0.25)">Naranja Geokatu</option>
                        <option value="rgba(0, 136, 255, 0.25)">Azul Operativo</option>
                        <option value="rgba(255, 68, 68, 0.25)">Rojo Restricción</option>
                        <option value="rgba(184, 68, 255, 0.25)">Púrpura Especial</option>
                        <option value="rgba(255, 255, 255, 0.08)">Neutro Translúcido</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">ANCHO (Metros):</label>
                    <input type="number" id="item-ancho" class="input-modal" value="1.2" step="0.1" min="0.4" max="20">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 10px; color: #aaa;">LARGO (Metros):</label>
                    <input type="number" id="item-largo" class="input-modal" value="0.4" step="0.1" min="0.2" max="20">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-cancelar-item" class="btn-modal-accion" style="background: rgba(255,255,255,0.1);">Cerrar</button>
                <button id="btn-guardar-item" class="btn-modal-accion">Fijar en Plano</button>
            </div>
        </div>
    </div>

    <!-- 7. SCRIPT DEL MOTOR MATEMÁTICO CANVAS & SMART GUIDES -->
    <script type="module">
        import GeokatuDB from './core-db.js';
        import { AuthGate } from './auth-gate.js';
        import './geokatu-tour.js';

        let idNegocio = localStorage.getItem('geokatu_active_uid') || null;
        let idSedeActiva = localStorage.getItem('geokatu_sede_activa') || 'SALA_VENTAS';
        let permisosUsuario = { autorizado: false, rol: null, puedeCrearSedes: false, puedeMoverMuebles: false };

        const selectSede = document.getElementById('selector-sede-activa');
        const btnAbrirModalSede = document.getElementById('btn-abrir-modal-sede');
        const estadoCroquis = document.getElementById('croquis-estado');
        function informarCroquis(texto) {
            estadoCroquis.hidden = !texto;
            estadoCroquis.textContent = texto;
        }

        function actualizarEnlaceCroquis() {
            document.getElementById('croquis-volver').href = 'inventario?sede=' + encodeURIComponent(idSedeActiva);
        }

        // Cargar lista dinámica de sedes
        async function cargarListaSedes() {
            if (!idNegocio || !selectSede) return;
            if (typeof GeokatuDB.RadarService.obtenerSedesComercio !== 'function') return;
            const res = await GeokatuDB.RadarService.obtenerSedesComercio(idNegocio);
            if (!permisosUsuario.puedeCambiarSede) return;

             if (res && res.success && Array.isArray(res.data)) {
                selectSede.innerHTML = '';
                res.data.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id_sede;
                    const icono = s.tipo === 'BODEGA' ? '📦' : (s.tipo === 'MIXTO' ? '🏬' : '🛒');
                    opt.innerText = icono + " " + s.nombre + " [" + (s.tipo || 'TIENDA') + "]";
                    if (s.id_sede === idSedeActiva) opt.selected = true;
                    selectSede.appendChild(opt);
                });
                if (!Array.from(selectSede.options).some(opt => opt.value === idSedeActiva)) {
                    selectSede.add(new Option(idSedeActiva, idSedeActiva, true, true));
                }
            }
        }

        if (selectSede) {
            selectSede.addEventListener('change', async (e) => {
                if (!permisosUsuario.puedeCambiarSede) return;
                idSedeActiva = e.target.value;
                localStorage.setItem('geokatu_sede_activa_' + idNegocio, idSedeActiva);
                actualizarEnlaceCroquis();
                await hidratarPlanoNube();
            });
        }

        if (btnAbrirModalSede) {
            btnAbrirModalSede.addEventListener('click', () => {
                if (!permisosUsuario.puedeCrearSedes) {
                    alert("Solo el Dueño o un Administrador pueden crear nuevas sedes o bodegas.");
                    return;
                }
                document.getElementById('modal-nueva-sede').style.display = 'flex';
            });
        }

        const btnCancNS = document.getElementById('btn-cancelar-nueva-sede');
        if (btnCancNS) {
            btnCancNS.addEventListener('click', () => {
                document.getElementById('modal-nueva-sede').style.display = 'none';
            });
        }

        const btnGuarNS = document.getElementById('btn-guardar-nueva-sede');
        if (btnGuarNS) {
            btnGuarNS.addEventListener('click', async () => {
                const rawId = document.getElementById('nueva-sede-id').value.trim();
                const nom = document.getElementById('nueva-sede-nombre').value.trim();
                const tipo = document.getElementById('nueva-sede-tipo').value;

                if (!rawId || !nom) return alert("Completa el ID y Nombre de la nueva sede.");
                const cleanId = rawId.toUpperCase().replace(/[^A-Z0-9_]/g, '_');

                const res = await GeokatuDB.RadarService.crearSedeBodega(idNegocio, cleanId, { 
                    nombre: nom, 
                    tipo: tipo,
                    fecha_creacion: new Date().toISOString()
                });
                if (res.success) {
                    await GeokatuDB.RadarService.guardarMapaBodega(idNegocio, cleanId, {
                        perimetro: { anchoM: 12, largoM: 18 },
                        elementos: [],
                        muros: [],
                        sede: cleanId,
                        tipo_espacio: tipo
                    });

                    alert("✅ Espacio [" + nom + "] (" + tipo + ") creado con éxito.");
                    document.getElementById('modal-nueva-sede').style.display = 'none';
                    idSedeActiva = cleanId;
                    localStorage.setItem('geokatu_sede_activa', idSedeActiva);
                    await cargarListaSedes();
                    await hidratarPlanoNube();
                } else {
                    alert("Error creando espacio: " + res.error);
                }
            });
        }

        // ==========================================
        // CONTROL DE SESIÓN Y DISEÑO ESPACIAL CON AUTH-GATE
        // ==========================================
        AuthGate.inicializar({
            tituloModulo: 'Editor de Góndolas SIG',
            subtituloModulo: 'Plano Espacial de Tienda y Diseño de Mobiliario',
            minutosInactividad: 10,
            onSesionLista: async function(contexto) {
                idNegocio = contexto.idNegocio;
                const parametros = new URLSearchParams(location.search);
                idSedeActiva = contexto.esDueno ? (parametros.get('sede') || localStorage.getItem('geokatu_sede_activa_' + idNegocio) || contexto.almacen) : contexto.almacen;
                idSedeActiva ||= 'SALA_VENTAS';
                actualizarEnlaceCroquis();
                selectSede.replaceChildren(new Option(idSedeActiva === 'SALA_VENTAS' ? 'Sala de ventas' : idSedeActiva, idSedeActiva));

                await GeokatuDB.SecurityService.sellarSesionTerminalLocal(contexto.idNegocio);

                const rolesDiseno = ['supervisor', 'administrador_delegado', 'visual_merchandising', 'admin', 'superadmin'];
                permisosUsuario = {
                    autorizado: true,
                    rol: contexto.rol,
                    puedeCrearSedes: Boolean(contexto.esDueno),
                    puedeCambiarSede: Boolean(contexto.esDueno),
                    puedeMoverMuebles: Boolean(contexto.esDueno) || rolesDiseno.includes(contexto.rol)
                };
                selectSede.disabled = !permisosUsuario.puedeCambiarSede;
                btnAbrirModalSede.style.display = permisosUsuario.puedeCrearSedes ? 'inline-block' : 'none';
                if (permisosUsuario.puedeCambiarSede) await cargarListaSedes();
                await hidratarPlanoNube();

                // Iniciar guía del editor espacial de tienda
                if (window.GeokatuTour && typeof window.GeokatuTour.iniciar === 'function') {
                    setTimeout(function() {
                        window.GeokatuTour.iniciar('mapatienda');
                    }, 850);
                }
            },

            onCerrarSesion: async function() {
                permisosUsuario = {};
                idNegocio = null;
                informarCroquis('');
                window.alternarModoEdicion(false);
                cerrarOpcionesCroquis();
                muebles = [];
                itemsEspaciales = [];
                celdasMurosBloqueadas = new Set();
                if (contenedorMuebles) contenedorMuebles.innerHTML = '';
                if (contenedorItems) contenedorItems.innerHTML = '';
                window.deseleccionarMuebles();
                window.deseleccionarItems();
            }
        });

        // Listener del botón Salir del HUD superior
        const cerrarOpcionesCroquis = () => { document.querySelector('.croquis-mas').open = false; };
        const btnLogoutMapatienda = document.getElementById('btn-logout-mapatienda');
        if (btnLogoutMapatienda) {
            btnLogoutMapatienda.addEventListener('click', async () => {
                await AuthGate.cerrarSesion();
            });
        }



        const METRO_PX = 60;
        let perimetro = { anchoM: 12, largoM: 18 };
        let muebles = [];
        let muebleSeleccionado = null;
        let muebleRadarActivoId = null; 
        let animacionRadarMiniTimer = null;
        
        let itemsEspaciales = [];
        let itemSeleccionado = null;
        let itemEnEdicion = null;

        let modoPincelMuros = false;
        let celdasMurosBloqueadas = new Set();
        let modoEdicionActivo = false; 

        window.alternarModoEdicion = function(forzarEstado) {
            modoEdicionActivo = Boolean(permisosUsuario.puedeMoverMuebles && (forzarEstado ?? !modoEdicionActivo));
            const btnModo = document.getElementById('btn-toggle-modo-edicion');
            const vp = document.getElementById('viewport-infinito');
            btnModo.hidden = !permisosUsuario.puedeMoverMuebles;
            btnModo.textContent = modoEdicionActivo ? 'Terminar edición' : 'Editar';
            btnModo.setAttribute('aria-pressed', String(modoEdicionActivo));
            document.getElementById('btn-guardar-nube').hidden = !permisosUsuario.puedeMoverMuebles || !planoBorradorActual();
            document.querySelectorAll('[data-croquis-edicion]').forEach(btn => { btn.hidden = !modoEdicionActivo; });
            vp.classList.toggle('modo-edicion', modoEdicionActivo);
            vp.classList.toggle('modo-lectura', !modoEdicionActivo);
            if (!modoEdicionActivo) {
                modoPincelMuros = false;
                document.getElementById('btn-modo-muros').setAttribute('aria-pressed', 'false');
                window.deseleccionarMuebles();
                window.deseleccionarItems();
            }
        };

        let viewport = { x: 40, y: 100, escala: 1 };
        const SCALE_MIN = 0.15; 
        const SCALE_MAX = 5.0;  

        window.obtenerScaleMin = function() {
            return SCALE_MIN;
        };

        window.zoomExtents = function() {
            const planoW = perimetro.anchoM * METRO_PX;
            const planoH = perimetro.largoM * METRO_PX;
            const factor = Math.min((window.innerWidth * 0.85) / planoW, (window.innerHeight * 0.85) / planoH);
            viewport.escala = Math.max(SCALE_MIN, Math.min(factor, 2.0));
            viewport.x = (window.innerWidth - planoW * viewport.escala) / 2;
            viewport.y = (window.innerHeight - planoH * viewport.escala) / 2;
            window.actualizarTransform();
        };

        const vpEl = document.getElementById('viewport-infinito'); 
        const capaTransform = document.getElementById('capa-transform');
        const canvasRejilla = document.getElementById('rejilla-canvas');
        const ctxRejilla = canvasRejilla.getContext('2d');
        const contenedorMuebles = document.getElementById('contenedor-muebles');
        const contenedorItems = document.getElementById('contenedor-items');
        const guiaH = document.getElementById('guia-h');
        const guiaV = document.getElementById('guia-v');

        const canvasMinimapa = document.getElementById('canvas-minimapa');
        const ctxMinimapa = canvasMinimapa ? canvasMinimapa.getContext('2d') : null;

        window.actualizarTransform = function() {
            capaTransform.style.transform = "translate3d(" + viewport.x + "px, " + viewport.y + "px, 0) scale(" + viewport.escala + ")";
            const tamRejilla = METRO_PX * viewport.escala;
            vpEl.style.backgroundSize = tamRejilla + "px " + tamRejilla + "px";
            vpEl.style.backgroundPosition = viewport.x + "px " + viewport.y + "px";
            window.renderizarMinimapa();
        };

        window.renderizarMinimapa = function() {
            if (!ctxMinimapa || !canvasMinimapa) return;

            const dpr = window.devicePixelRatio || 1;
            const rectMini = canvasMinimapa.getBoundingClientRect();
            if (canvasMinimapa.width !== rectMini.width * dpr || canvasMinimapa.height !== rectMini.height * dpr) {
                canvasMinimapa.width = rectMini.width * dpr;
                canvasMinimapa.height = rectMini.height * dpr;
            }

            ctxMinimapa.save();
            ctxMinimapa.scale(dpr, dpr);
            ctxMinimapa.clearRect(0, 0, rectMini.width, rectMini.height);

            const planoW = perimetro.anchoM * METRO_PX;
            const planoH = perimetro.largoM * METRO_PX;
            const escalaMini = Math.min((rectMini.width - 20) / planoW, (rectMini.height - 20) / planoH);
            const offsetX = (rectMini.width - planoW * escalaMini) / 2;
            const offsetY = (rectMini.height - planoH * escalaMini) / 2;

            ctxMinimapa.fillStyle = 'rgba(25, 25, 32, 0.9)';
            ctxMinimapa.fillRect(offsetX, offsetY, planoW * escalaMini, planoH * escalaMini);
            ctxMinimapa.strokeStyle = '#ff6b00';
            ctxMinimapa.lineWidth = 1.5;
            ctxMinimapa.strokeRect(offsetX, offsetY, planoW * escalaMini, planoH * escalaMini);

            ctxMinimapa.fillStyle = 'rgba(255, 68, 68, 0.6)';
            celdasMurosBloqueadas.forEach(coord => {
                const parts = coord.split(',');
                const cx = Number(parts[0]);
                const cy = Number(parts[1]);
                ctxMinimapa.fillRect(
                    offsetX + cx * METRO_PX * escalaMini,
                    offsetY + cy * METRO_PX * escalaMini,
                    METRO_PX * escalaMini,
                    METRO_PX * escalaMini
                );
            });

            itemsEspaciales.forEach(it => {
                const iW = (it.anchoM * METRO_PX) * escalaMini;
                const iH = (it.largoM * METRO_PX) * escalaMini;
                const cX = offsetX + (it.x * escalaMini) + (iW / 2);
                const cY = offsetY + (it.y * escalaMini) + (iH / 2);

                ctxMinimapa.save();
                ctxMinimapa.translate(cX, cY);
                ctxMinimapa.rotate(((it.rotacion || 0) * Math.PI) / 180);

                ctxMinimapa.fillStyle = it.colorFondo || 'rgba(0,255,100,0.3)';
                ctxMinimapa.strokeStyle = '#00ff64';
                ctxMinimapa.lineWidth = 1;

                if (it.forma === 'circulo' || it.forma === 'elipse') {
                    ctxMinimapa.beginPath();
                    ctxMinimapa.ellipse(0, 0, iW / 2, iH / 2, 0, 0, Math.PI * 2);
                    ctxMinimapa.fill();
                    ctxMinimapa.stroke();
                } else if (it.forma === 'nube') {
                    ctxMinimapa.setLineDash([2, 2]);
                    ctxMinimapa.strokeRect(-iW / 2, -iH / 2, iW, iH);
                    ctxMinimapa.fillRect(-iW / 2, -iH / 2, iW, iH);
                } else {
                    ctxMinimapa.fillRect(-iW / 2, -iH / 2, iW, iH);
                    ctxMinimapa.strokeRect(-iW / 2, -iH / 2, iW, iH);
                }

                ctxMinimapa.restore();
            });

            muebles.forEach(m => {
                const mW = (m.anchoM * METRO_PX) * escalaMini;
                const mH = (m.largoM * METRO_PX) * escalaMini;
                const centroX = offsetX + (m.x * escalaMini) + (mW / 2);
                const centroY = offsetY + (m.y * escalaMini) + (mH / 2);

                ctxMinimapa.save();
                ctxMinimapa.translate(centroX, centroY);
                ctxMinimapa.rotate(((m.rotacion || 0) * Math.PI) / 180);

                const esSeleccionado = (muebleSeleccionado && muebleSeleccionado.id_mueble === m.id_mueble);
                const enRadar = (muebleRadarActivoId === m.id_mueble);

                if (enRadar) {
                    ctxMinimapa.strokeStyle = '#00ff64';
                    ctxMinimapa.lineWidth = 2.5;
                    ctxMinimapa.strokeRect((-mW / 2) - 3, (-mH / 2) - 3, mW + 6, mH + 6);
                }

                ctxMinimapa.fillStyle = enRadar ? '#00ff64' : (esSeleccionado ? '#ff8c00' : '#ff6b00');
                ctxMinimapa.fillRect(-mW / 2, -mH / 2, mW, mH);

                ctxMinimapa.strokeStyle = enRadar ? '#ffffff' : (esSeleccionado ? '#00ff64' : 'rgba(255, 255, 255, 0.4)');
                ctxMinimapa.lineWidth = enRadar ? 2 : 1;
                ctxMinimapa.strokeRect(-mW / 2, -mH / 2, mW, mH);

                ctxMinimapa.restore();
            });

            const camMundoX = -viewport.x / viewport.escala;
            const camMundoY = -viewport.y / viewport.escala;
            const camMundoW = window.innerWidth / viewport.escala;
            const camMundoH = window.innerHeight / viewport.escala;

            ctxMinimapa.fillStyle = 'rgba(0, 255, 100, 0.12)';
            ctxMinimapa.fillRect(
                offsetX + camMundoX * escalaMini,
                offsetY + camMundoY * escalaMini,
                camMundoW * escalaMini,
                camMundoH * escalaMini
            );

            ctxMinimapa.strokeStyle = '#00ff64';
            ctxMinimapa.lineWidth = 1.8;
            ctxMinimapa.strokeRect(
                offsetX + camMundoX * escalaMini,
                offsetY + camMundoY * escalaMini,
                camMundoW * escalaMini,
                camMundoH * escalaMini
            );

            const centroVisorX = offsetX + (camMundoX + camMundoW / 2) * escalaMini;
            const centroVisorY = offsetY + (camMundoY + camMundoH / 2) * escalaMini;
            ctxMinimapa.strokeStyle = 'rgba(0, 255, 100, 0.5)';
            ctxMinimapa.lineWidth = 1;
            ctxMinimapa.beginPath();
            ctxMinimapa.moveTo(centroVisorX - 4, centroVisorY);
            ctxMinimapa.lineTo(centroVisorX + 4, centroVisorY);
            ctxMinimapa.moveTo(centroVisorX, centroVisorY - 4);
            ctxMinimapa.lineTo(centroVisorX, centroVisorY + 4);
            ctxMinimapa.stroke();

            ctxMinimapa.restore();
        };

      const contenedorMini = document.getElementById('contenedor-minimapa');
        const btnCerrarMini = document.getElementById('btn-cerrar-minimapa');

        if (contenedorMini && canvasMinimapa) {
            let arrastrandoMinimapa = false;

            contenedorMini.addEventListener('click', (e) => {
                if (contenedorMini.classList.contains('colapsado')) {
                    e.stopPropagation();
                    contenedorMini.classList.remove('colapsado');
                    window.renderizarMinimapa();
                }
            });

            if (btnCerrarMini) {
                btnCerrarMini.addEventListener('click', (e) => {
                    e.stopPropagation();
                    contenedorMini.classList.add('colapsado');
                });
            }

            const moverCamaraDesdeMinimapa = (e) => {
                if (contenedorMini.classList.contains('colapsado')) return;
                const rect = canvasMinimapa.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                const planoW = perimetro.anchoM * METRO_PX;
                const planoH = perimetro.largoM * METRO_PX;
                const escalaMini = Math.min((rect.width - 20) / planoW, (rect.height - 20) / planoH);
                const offsetX = (rect.width - planoW * escalaMini) / 2;
                const offsetY = (rect.height - planoH * escalaMini) / 2;

                const mundoX = (clickX - offsetX) / escalaMini;
                const mundoY = (clickY - offsetY) / escalaMini;

                viewport.x = (window.innerWidth / 2) - (mundoX * viewport.escala);
                viewport.y = (window.innerHeight / 2) - (mundoY * viewport.escala);
                window.actualizarTransform();
            };

            canvasMinimapa.addEventListener('pointerdown', (e) => {
                if (contenedorMini.classList.contains('colapsado')) return;
                e.stopPropagation();
                arrastrandoMinimapa = true;
                canvasMinimapa.setPointerCapture(e.pointerId);
                moverCamaraDesdeMinimapa(e);
            });

            canvasMinimapa.addEventListener('pointermove', (e) => {
                if (!arrastrandoMinimapa || contenedorMini.classList.contains('colapsado')) return;
                e.stopPropagation();
                moverCamaraDesdeMinimapa(e);
            });

            const finDragMini = (e) => {
                arrastrandoMinimapa = false;
                try { canvasMinimapa.releasePointerCapture(e.pointerId); } catch (_) {}
            };

            canvasMinimapa.addEventListener('pointerup', finDragMini);
            canvasMinimapa.addEventListener('pointercancel', finDragMini);
        }

        window.redibujarArea = function() {
            const w = perimetro.anchoM * METRO_PX;
            const h = perimetro.largoM * METRO_PX;

            canvasRejilla.width = w;
            canvasRejilla.height = h;
            canvasRejilla.style.width = w + "px";
            canvasRejilla.style.height = h + "px";

            ctxRejilla.clearRect(0, 0, w, h);
            ctxRejilla.fillStyle = '#21212b';
            ctxRejilla.fillRect(0, 0, w, h);

            ctxRejilla.strokeStyle = 'rgba(255, 255, 255, 0.09)';
            ctxRejilla.lineWidth = 1;

            for (let x = 0; x <= w; x += METRO_PX) {
                ctxRejilla.beginPath();
                ctxRejilla.moveTo(x, 0);
                ctxRejilla.lineTo(x, h);
                ctxRejilla.stroke();
            }
            for (let y = 0; y <= h; y += METRO_PX) {
                ctxRejilla.beginPath();
                ctxRejilla.moveTo(0, y);
                ctxRejilla.lineTo(w, y);
                ctxRejilla.stroke();
            }

            ctxRejilla.strokeStyle = '#ff6b00';
            ctxRejilla.lineWidth = 3;
            ctxRejilla.strokeRect(0, 0, w, h);

            celdasMurosBloqueadas.forEach(coord => {
                const parts = coord.split(',');
                const cx = Number(parts[0]);
                const cy = Number(parts[1]);
                ctxRejilla.fillStyle = 'rgba(255, 68, 68, 0.45)';
                ctxRejilla.fillRect(cx * METRO_PX, cy * METRO_PX, METRO_PX, METRO_PX);
                ctxRejilla.strokeStyle = '#ff4444';
                ctxRejilla.lineWidth = 1;
                ctxRejilla.strokeRect(cx * METRO_PX, cy * METRO_PX, METRO_PX, METRO_PX);
            });
        };

        const punterosActivos = new Map();
        let distanciaInicialPinch = 0;
        let escalaInicialPinch = 1;
        let centroInicialPinch = { x: 0, y: 0 };
        let viewportInicialPinch = { x: 0, y: 0 };
        let inicioArrastreUnico = { x: 0, y: 0 };

        vpEl.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.mueble-bloque') || e.target.closest('.pivote-giro')) return;
            if (modoPincelMuros) return;

            punterosActivos.set(e.pointerId, { x: e.clientX, y: e.clientY });
            vpEl.setPointerCapture(e.pointerId);
            window.deseleccionarMuebles();

            if (punterosActivos.size === 1) {
                inicioArrastreUnico = { x: e.clientX - viewport.x, y: e.clientY - viewport.y };
            } else if (punterosActivos.size === 2) {
                const pts = Array.from(punterosActivos.values());
                distanciaInicialPinch = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                escalaInicialPinch = viewport.escala;
                viewportInicialPinch = { x: viewport.x, y: viewport.y };
                centroInicialPinch = {
                    x: (pts[0].x + pts[1].x) / 2,
                    y: (pts[0].y + pts[1].y) / 2
                };
            }
        });

        vpEl.addEventListener('pointermove', (e) => {
            if (!punterosActivos.has(e.pointerId)) return;
            punterosActivos.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (punterosActivos.size === 1) {
                viewport.x = e.clientX - inicioArrastreUnico.x;
                viewport.y = e.clientY - inicioArrastreUnico.y;
                window.actualizarTransform();
            } else if (punterosActivos.size === 2) {
                const pts = Array.from(punterosActivos.values());
                const distActual = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                if (distanciaInicialPinch === 0) return;

                const factor = distActual / distanciaInicialPinch;
                const escalaMin = window.obtenerScaleMin();
                const nuevaEscala = Math.min(Math.max(escalaMin, escalaInicialPinch * factor), SCALE_MAX);

                const centroActual = {
                    x: (pts[0].x + pts[1].x) / 2,
                    y: (pts[0].y + pts[1].y) / 2
                };

                const mundoPivotX = (centroInicialPinch.x - viewportInicialPinch.x) / escalaInicialPinch;
                const mundoPivotY = (centroInicialPinch.y - viewportInicialPinch.y) / escalaInicialPinch;

                viewport.x = centroActual.x - (mundoPivotX * nuevaEscala);
                viewport.y = centroActual.y - (mundoPivotY * nuevaEscala);
                viewport.escala = nuevaEscala;
                window.actualizarTransform();
            }
        });

        const limpiarPuntero = (e) => {
            punterosActivos.delete(e.pointerId);
            if (punterosActivos.size === 1) {
                const pRestante = Array.from(punterosActivos.values())[0];
                inicioArrastreUnico = { x: pRestante.x - viewport.x, y: pRestante.y - viewport.y };
            }
        };

        vpEl.addEventListener('pointerup', limpiarPuntero);
        vpEl.addEventListener('pointercancel', limpiarPuntero);

        vpEl.addEventListener('wheel', (e) => {
            e.preventDefault();
            const escalaMin = window.obtenerScaleMin();
            const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
            const nuevaEscala = Math.min(Math.max(escalaMin, viewport.escala * zoomFactor), SCALE_MAX);

            if (nuevaEscala !== viewport.escala) {
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                viewport.x = mouseX - (mouseX - viewport.x) * (nuevaEscala / viewport.escala);
                viewport.y = mouseY - (mouseY - viewport.y) * (nuevaEscala / viewport.escala);
                viewport.escala = nuevaEscala;
                window.actualizarTransform();
            }
        }, { passive: false });

        const btnModoMuros = document.getElementById('btn-modo-muros');
        if (btnModoMuros) {
            btnModoMuros.addEventListener('click', () => {
                if (!modoEdicionActivo) return;
                modoPincelMuros = !modoPincelMuros;
                btnModoMuros.setAttribute('aria-pressed', String(modoPincelMuros));
                if (modoPincelMuros) {
                    btnModoMuros.style.background = 'var(--naranja)';
                    btnModoMuros.style.borderColor = 'white';
                    informarCroquis("Toca una celda del plano para colocar o quitar un muro.");
                } else {
                    btnModoMuros.style.background = 'rgba(255,255,255,0.1)';
                    btnModoMuros.style.borderColor = 'rgba(255,255,255,0.2)';
                }
            });
        }

        canvasRejilla.style.pointerEvents = 'auto'; 
        canvasRejilla.addEventListener('pointerdown', (e) => {
            if (!modoPincelMuros) return;
            const rect = canvasRejilla.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / viewport.escala;
            const clickY = (e.clientY - rect.top) / viewport.escala;

            const celdaX = Math.floor(clickX / METRO_PX);
            const celdaY = Math.floor(clickY / METRO_PX);
            const clave = celdaX + "," + celdaY;

            if (celdasMurosBloqueadas.has(clave)) {
                celdasMurosBloqueadas.delete(clave);
            } else {
                celdasMurosBloqueadas.add(clave);
            }
            window.redibujarArea();
        });

        window.verificarColisionMuros = function(x, y, anchoM, largoM) {
            const minX = Math.floor(x / METRO_PX);
            const minY = Math.floor(y / METRO_PX);
            const maxX = Math.floor((x + (anchoM * METRO_PX)) / METRO_PX);
            const maxY = Math.floor((y + (largoM * METRO_PX)) / METRO_PX);

            for (let cx = minX; cx <= maxX; cx++) {
                for (let cy = minY; cy <= maxY; cy++) {
                    if (celdasMurosBloqueadas.has(cx + "," + cy)) {
                        return true;
                    }
                }
            }
            return false;
        };

        let muebleEnEdicion = null;

        window.aplicarContraRotacion = function(el, angulo) {
            const elementosUI = el.querySelectorAll('.contra-rotacion');
            elementosUI.forEach(elem => {
                if (elem.classList.contains('menu-contextual-mueble') || elem.classList.contains('pivote-giro')) {
                    elem.style.transform = "translateX(-50%) rotate(" + (-angulo) + "deg)";
                } else {
                    elem.style.transform = "rotate(" + (-angulo) + "deg)";
                }
            });
        };

        window.renderizarMuebles = function() {
            contenedorMuebles.innerHTML = '';
            muebles.forEach((m) => {
                const el = document.createElement('div');
                el.classList.add('mueble-bloque');
                if (muebleSeleccionado && muebleSeleccionado.id_mueble === m.id_mueble) {
                    el.classList.add('seleccionado');
                }
                el.id = "mueble-" + m.id_mueble;
                el.style.width = (m.anchoM * METRO_PX) + "px";
                el.style.height = (m.largoM * METRO_PX) + "px";
                el.style.left = m.x + "px";
                el.style.top = m.y + "px";
                const rot = m.rotacion || 0;
                el.style.transform = "rotate(" + rot + "deg)";

                const menuContextual = document.createElement('div');
                menuContextual.classList.add('menu-contextual-mueble', 'contra-rotacion');
                menuContextual.innerHTML = '<button class="btn-mini-contextual btn-editar-m">✏️ Configurar Caras</button><button class="btn-mini-contextual peligro btn-borrar-m">🗑️ Borrar</button>';

                menuContextual.querySelector('.btn-editar-m').addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    window.abrirModalEditarMueble(m);
                });

                menuContextual.querySelector('.btn-borrar-m').addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    if (confirm("¿Eliminar " + m.nombre + " del plano?")) {
                        muebles = muebles.filter(item => item.id_mueble !== m.id_mueble);
                        window.deseleccionarMuebles();
                        window.renderizarMuebles();
                        window.actualizarContadorDrawer();
                        window.persistirPlanoLocal();
                    }
                });
                el.appendChild(menuContextual);

                const subGrid = document.createElement('div');
                subGrid.classList.add('mueble-subdivisiones');
                const binsFrontal = (m.caras && m.caras.A) ? (m.caras.A.bins || 4) : 4;
                const cols = Math.ceil(Math.sqrt(binsFrontal));
                subGrid.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
                for (let i = 0; i < binsFrontal; i++) {
                    const c = document.createElement('div');
                    c.classList.add('subdivision-celda');
                    subGrid.appendChild(c);
                }
                el.appendChild(subGrid);

                const tag = document.createElement('div');
                tag.classList.add('mueble-etiqueta', 'contra-rotacion');
                const totalBins = m.compartimientos ? m.compartimientos.length : 0;
                const mZonaStr = m.zona === 'BODEGA' ? 'Bodega' : 'Piso Venta';
                tag.innerText = m.nombre + "\n[" + mZonaStr + "]\n" + totalBins + " Bins";
                el.appendChild(tag);

                const pivote = document.createElement('div');
                pivote.classList.add('pivote-giro', 'contra-rotacion');
                pivote.innerHTML = '🔄';
                pivote.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    m.rotacion = ((m.rotacion || 0) + 45) % 360;
                    el.style.transform = "rotate(" + m.rotacion + "deg)";
                    window.aplicarContraRotacion(el, m.rotacion);
                });
                el.appendChild(pivote);

                window.iniciarDragMueble(el, m);
                contenedorMuebles.appendChild(el);
                window.aplicarContraRotacion(el, rot);
            });
        };

        window.iniciarDragMueble = function(el, mueble) {
            let offsetArrastre = { x: 0, y: 0 };
            let arrastrando = false;

            el.addEventListener('pointerdown', (e) => {
                if (!modoEdicionActivo) return; 
                e.stopPropagation();
                arrastrando = true;
                window.seleccionarMueble(mueble, el);

                const rectM = { x: mueble.x, y: mueble.y };
                offsetArrastre = {
                    x: (e.clientX / viewport.escala) - rectM.x,
                    y: (e.clientY / viewport.escala) - rectM.y
                };
                el.setPointerCapture(e.pointerId);
            });

            el.addEventListener('pointermove', (e) => {
                if (!arrastrando) return;
                let nuevoX = (e.clientX / viewport.escala) - offsetArrastre.x;
                let nuevoY = (e.clientY / viewport.escala) - offsetArrastre.y;

                const snap = window.calcularSmartGuides(mueble, nuevoX, nuevoY);
                
                if (!window.verificarColisionMuros(snap.x, snap.y, mueble.anchoM, mueble.largoM)) {
                    mueble.x = snap.x;
                    mueble.y = snap.y;
                    el.style.left = snap.x + "px";
                    el.style.top = snap.y + "px";
                    window.renderizarMinimapa();
                }
            });

            const finDrag = () => {
                arrastrando = false;
                window.ocultarGuias();
            };
            el.addEventListener('pointerup', finDrag);
            el.addEventListener('pointercancel', finDrag);
        };

        window.calcularSmartGuides = function(muebleActual, x, y) {
            const TOLERANCIA = 8;
            let snapX = x;
            let snapY = y;
            let guiasActivas = { h: null, v: null };

            const w = muebleActual.anchoM * METRO_PX;
            const h = muebleActual.largoM * METRO_PX;

            muebles.forEach((otro) => {
                if (otro.id_mueble === muebleActual.id_mueble) return;
                const otroW = otro.anchoM * METRO_PX;
                const otroH = otro.largoM * METRO_PX;

                if (Math.abs(y - otro.y) < TOLERANCIA) {
                    snapY = otro.y;
                    guiasActivas.h = snapY;
                } else if (Math.abs((y + h) - (otro.y + otroH)) < TOLERANCIA) {
                    snapY = otro.y + otroH - h;
                    guiasActivas.h = snapY + h;
                }

                if (Math.abs(x - otro.x) < TOLERANCIA) {
                    snapX = otro.x;
                    guiasActivas.v = snapX;
                } else if (Math.abs((x + w) - (otro.x + otroW)) < TOLERANCIA) {
                    snapX = otro.x + otroW - w;
                    guiasActivas.v = snapX + w;
                }
            });

            if (guiasActivas.h !== null) {
                guiaH.style.top = guiasActivas.h + "px";
                guiaH.style.display = 'block';
            } else {
                guiaH.style.display = 'none';
            }

            if (guiasActivas.v !== null) {
                guiaV.style.left = guiasActivas.v + "px";
                guiaV.style.display = 'block';
            } else {
                guiaV.style.display = 'none';
            }

            return { x: snapX, y: snapY };
        };

        window.generarMatrizCanonicaBins = function(idMueble, carasConfig) {
            const compartimientos = [];
            const codigosCaras = ['A', 'B', 'C', 'D'];

            codigosCaras.forEach(cara => {
                const cfg = carasConfig[cara];
                if (cfg && cfg.activa && cfg.niveles > 0 && cfg.bins > 0) {
                    for (let niv = 1; niv <= cfg.niveles; niv++) {
                        const strNivel = "N" + niv;
                        for (let b = 1; b <= cfg.bins; b++) {
                            const strBin = "B" + String(b).padStart(2, '0');
                            const idCanonicoComp = "GEO-P-" + idNegocio + "-" + idSedeActiva + "-" + idMueble + "-" + cara + "-" + strNivel + "-" + strBin;
                            const idEstantePadre = "GEO-M-" + idNegocio + "-" + idSedeActiva + "-" + idMueble;

                            compartimientos.push({
                                id_comp: idCanonicoComp,
                                id_estante: idEstantePadre,
                                id_sede: idSedeActiva,
                                cara: cara,
                                nivel: strNivel,
                                bin: strBin,
                                codigo_trazabilidad: idMueble + "_" + cara + "_" + strNivel + "_" + strBin
                            });
                        }
                    }
                }
            });
            return compartimientos;
        };

        // Persistencia instantanea en localStorage (0 ms, sobrevive a recargas y modo avion)
        function claveBorrador() {

        window.persistirPlanoLocal = function() {
            if (!idNegocio || !modoEdicionActivo) return;
            const clavePlano = claveBorrador();
            const gridData = {
                perimetro: perimetro,
                elementos: muebles,

        // --- 6. PERSISTENCIA EN FIRESTORE + LOCALSTORAGE ---
        const btnGuardarNube = document.getElementById('btn-guardar-nube');
        if (btnGuardarNube) {
            btnGuardarNube.addEventListener('click', async () => {
                const borrador = planoBorradorActual();
                if (!permisosUsuario.puedeMoverMuebles || !borrador) return;
                const clave = claveBorrador();
                const sede = idSedeActiva;
                const negocio = idNegocio;
                btnGuardarNube.disabled = true;
                informarCroquis('Publicando…');
                try {
                    const nuevoPlano = JSON.parse(borrador);
                    const publicados = JSON.parse(localStorage.getItem('geokatu_plano_' + negocio + '_' + sede) || 'null');
                    const espacios = plano => (plano?.elementos || []).flatMap(m => (m.compartimientos || []).map(espacio => espacio.id_comp));
                    const nuevos = new Set(espacios(nuevoPlano));
                    const retirados = new Set(espacios(publicados).filter(id => !nuevos.has(id)));
                    if (retirados.size) {
                        const stock = await GeokatuDB.InventarioService.obtenerMapaStockTiendaCompleto(negocio);
                        if (clave !== claveBorrador()) return;
                        if (!stock.success || stock.data.some(item => retirados.has(item.id_compartimiento) && Number(item.cantidad) !== 0)) {
                            informarCroquis('Para retirar espacios, primero verifica que sus saldos estén en cero.');
                            return;
                        }
                    }
                    const res = await GeokatuDB.RadarService.guardarMapaBodega(negocio, sede, nuevoPlano);
                    if (clave !== claveBorrador()) return;
                    if (res.success && !res.offline) {
                        if (localStorage.getItem(clave) === borrador) localStorage.removeItem(clave);
                        btnGuardarNube.hidden = !planoBorradorActual();
                        informarCroquis(planoBorradorActual() ? 'Hay otros cambios en borrador' : 'Plano publicado');
                    } else {
                        informarCroquis(res.error ? 'No se publicó: ' + res.error : 'Sin conexión. Publica el borrador al volver a tener red.');
                    }
                } finally {
                    btnGuardarNube.disabled = false;
                }
            });
        }
       // --- 7. RADAR ESPACIAL 0-MS OFFLINE-FIRST ---
        const btnEjecutarRadar = document.getElementById('btn-ejecutar-radar');
        if (btnEjecutarRadar) {
            document.getElementById('croquis-busqueda').addEventListener('submit', async e => {
                e.preventDefault();
                const sku = document.getElementById('input-radar-sku').value.trim();
                if (!sku || !idNegocio) {
                    alert("Ingresa un codigo SKU, EAN o nombre de articulo.");
                    return;
                }
                document.querySelectorAll('.mueble-bloque').forEach(m => m.classList.remove('radar-activo'));

                // 1. Resolver primero desde cache local (0 ms, 0 lecturas en Firestore)
                const skuLower = sku.toLowerCase();
                const catLocal = JSON.parse(localStorage.getItem('geokatu_catalogo_' + idNegocio) || '[]');
                const ubisLocal = JSON.parse(localStorage.getItem('geokatu_stock_ubis_' + idNegocio) || '[]');

                const prodMatch = catLocal.find(p =>
                    (p.id_prod && p.id_prod.toLowerCase() === skuLower) ||
                    (p.codigo_barras && String(p.codigo_barras).toLowerCase() === skuLower) ||
                    (p.nombre && p.nombre.toLowerCase().indexOf(skuLower) !== -1)
                );
                const targetProdId = prodMatch ? prodMatch.id_prod : sku;
                let ubisEncontradas = ubisLocal.filter(u =>
                    u.id_prod === targetProdId ||
                    (u.id_prod && u.id_prod.toLowerCase() === skuLower) ||
                    (u.id_compartimiento && u.id_compartimiento.toLowerCase() === skuLower)
                );

                let res = { success: true, data: ubisEncontradas };
                // 2. Fallback a Firestore solo si no hay cache local y estamos en linea
                if (ubisEncontradas.length === 0 && navigator.onLine) {
                    res = await GeokatuDB.InventarioService.obtenerStockUbicacionesProducto(idNegocio, targetProdId);
                }

                if (res.success && res.data.length > 0) {
                    const ubi = res.data[0];
                    const idComp = ubi.id_compartimiento || ubi.id || "";
                    
                    const mueble = muebles.find(m => {
                        if (m.id_mueble === ubi.id_estante || m.qr === ubi.id_estante) return true;
                        return (m.compartimientos || []).some(c => c.id_comp === idComp);
                    });

                    if (mueble) {
                        const el = document.getElementById("mueble-" + mueble.id_mueble);
                        if (el) {
                            el.classList.add('radar-activo');
                            
                            viewport.x = (window.innerWidth / 2) - ((mueble.x + (mueble.anchoM * METRO_PX) / 2) * viewport.escala);
                            viewport.y = (window.innerHeight / 2) - ((mueble.y + (mueble.largoM * METRO_PX) / 2) * viewport.escala);
                            window.actualizarTransform();

                            const partes = idComp.split('-');
                            let detalleUbicacion = idComp;
                            const len = partes.length;
                            if (len >= 6) {
                                const bin = partes[len - 1];
                                const nivel = partes[len - 2];
                                const cara = partes[len - 3];
                                detalleUbicacion = "Góndola: " + mueble.nombre + " | Cara: " + cara + " | Nivel: " + nivel + " | Bin: " + bin;
                            }
                            
                            const tagEl = el.querySelector('.mueble-etiqueta');
                            if (tagEl) {
                                tagEl.innerText = "🎯 SKU AQUÍ\n" + detalleUbicacion;

                    } else {
                        alert("SKU asignado al bin [" + idComp + "], pero el mueble no se encuentra emplazado en el plano actual.");

        // --- 8. GENERACIÓN DE SEÑALÉTICA QR ---
        const btnBurbujaQrs = document.getElementById('btn-burbuja-qrs');

                const contenedor = document.getElementById('contenedor-qrs-render');

                const planoPublicado = JSON.parse(localStorage.getItem('geokatu_plano_' + idNegocio + '_' + idSedeActiva) || 'null');
                const listaMuebles = planoPublicado?.elementos || [];
                if (!listaMuebles.length) {
                    informarCroquis('Publica un plano con muebles para imprimir sus etiquetas.');
                    return;
                }
                listaMuebles.forEach((m) => {
                    const cardM = document.createElement('div');
                    cardM.classList.add('tarjeta-qr-print');
                    const divQrM = document.createElement('div');
                    
                    try {
                        if(typeof QRCode !== 'undefined') {
                            const codigoMueble = m.qr || 'GEO-M-' + idNegocio + '-' + idSedeActiva + '-' + m.id_mueble;
                            new QRCode(divQrM, { text: codigoMueble, width: 144, height: 144, colorDark: "#000000", colorLight: "#ffffff" });
