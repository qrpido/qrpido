<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <title>GeoKATU — Terminal Operativa</title>
  <style>
    :root {
      --gk-naranja: #ff6b00;
      --gk-bg: #0a0a0c;
      --gk-panel: #121217;
      --gk-borde: rgba(255, 255, 255, 0.11);
      --gk-verde: #00ff64;
      --gk-texto: #ffffff;
      --gk-muted: #9ca3af;
      --gk-dock-h: 64px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--gk-bg);
      color: var(--gk-texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #terminal-shell {
      position: relative;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      display: none;
    }
    #terminal-shell.listo { display: block; }

    /* AREA DE VISTAS */
    #terminal-stage {
      position: absolute;
      inset: 0;
      bottom: calc(var(--gk-dock-h) + env(safe-area-inset-bottom));
      background: var(--gk-bg);
      transition: bottom 0.2s ease;
    }
    /* En POS el escenario ocupa el 100% vertical: cero pixeles perdidos */
    #terminal-shell.en-pos #terminal-stage {
      bottom: 0;
    }

    .vista-contenedor {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
      z-index: 1;
    }
    .vista-contenedor.activa {
      visibility: visible;
      pointer-events: auto;
      opacity: 1;
      z-index: 10;
    }

    .vista-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: var(--gk-bg);
    }

    /* VISTA INICIO NATIVA */
    #vista-inicio {
      background: radial-gradient(circle at 50% 0%, #1a1a22 0%, #0a0a0c 68%);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 84px;
    }

    .inicio-header {
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gk-borde);
      background: rgba(15, 15, 19, 0.96);
      flex-shrink: 0;
    }
    .inicio-marca {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    .inicio-marca span { color: var(--gk-naranja); }

    .inicio-estado-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      color: var(--gk-verde);
    }
    .inicio-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gk-verde);
      box-shadow: 0 0 8px var(--gk-verde);
    }

    .inicio-cuerpo {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }

    .inicio-saludo {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--gk-borde);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .inicio-saludo h1 {
      margin: 0 0 4px 0;
      font-size: 17px;
      font-weight: 900;
    }
    .inicio-saludo p {
      margin: 0;
      font-size: 12px;
      color: var(--gk-muted);
    }

    .inicio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .inicio-card {
      background: rgba(20, 20, 26, 0.92);
      border: 1px solid var(--gk-borde);
      border-radius: 14px;
      padding: 14px;
      color: #ffffff;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 92px;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }
    .inicio-card:active {
      transform: scale(0.97);
      border-color: var(--gk-naranja);
    }
    .inicio-card.destacada {
      border-color: rgba(255, 107, 0, 0.45);
      background: linear-gradient(135deg, rgba(255, 107, 0, 0.14) 0%, rgba(16, 16, 22, 0.96) 100%);
    }
    .inicio-card strong { font-size: 14px; font-weight: 800; }
    .inicio-card span { font-size: 11.5px; color: var(--gk-muted); line-height: 1.3; }

    .inicio-acciones-sesion {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-inicio-sec {
      min-height: 42px;
      border-radius: 10px;
      border: 1px solid var(--gk-borde);
      background: rgba(255, 255, 255, 0.04);
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-inicio-peligro {
      border-color: rgba(255, 68, 68, 0.35);
      color: #fca5a5;
    }

    /* BARRA VOLVER A LA VENTA (SOLO FUERA DE POS CON TICKET ACTIVO) */
    #barra-volver-venta {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(var(--gk-dock-h) + env(safe-area-inset-bottom) + 8px);
      max-width: 460px;
      margin: 0 auto;
      background: rgba(16, 16, 22, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 10px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 4500;
    }
    #barra-volver-venta.visible { display: flex; }
    #terminal-shell.en-pos #barra-volver-venta { display: none !important; }

    .bvv-izq {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .bvv-icono {
      width: 22px;
      height: 22px;
      color: #e5e7eb;
      flex-shrink: 0;
    }
    .bvv-textos {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .bvv-titulo { font-size: 13.5px; font-weight: 800; color: #ffffff; }
    .bvv-sub { font-size: 11.5px; color: var(--gk-muted); font-variant-numeric: tabular-nums; }
    .bvv-der {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: monospace;
      font-variant-numeric: tabular-nums;
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
    }

    /* DOCK INFERIOR (FIJO FUERA DE POS, RETRACTIL A LA IZQUIERDA EN POS) */
    #terminal-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(var(--gk-dock-h) + env(safe-area-inset-bottom));
      padding: 6px 8px env(safe-area-inset-bottom) 8px;
      background: rgba(12, 12, 16, 0.97);
      border-top: 1px solid var(--gk-borde);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: grid;
      grid-template-columns: 1fr 1fr 62px 1fr 1fr;
      align-items: center;
      gap: 4px;
      z-index: 5000;
      transform: translateX(0);
      transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      will-change: transform;
      touch-action: pan-y;
    }
    #terminal-shell.en-pos.dock-oculto #terminal-dock {
      transform: translateX(-104%);
      pointer-events: none;
    }

    .dock-item {
      background: transparent;
      border: none;
      color: var(--gk-muted);
      height: 50px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .dock-item svg {
      width: 21px;
      height: 21px;
    }
    .dock-item.activo {
      color: var(--gk-naranja);
    }
    .dock-item:active {
      background: rgba(255, 255, 255, 0.06);
    }

    .dock-btn-escaner {
      width: 52px;
      height: 48px;
      margin: 0 auto;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #ff8c00, var(--gk-naranja));
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(255, 107, 0, 0.42);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .dock-btn-escaner:active { transform: scale(0.94); }

        /* BOTON NARANJA EN SU PROPIO ESPACIO INFERIOR IZQUIERDO (SIN PISAR EFECTIVO) */
    #btn-dock-pestana-pos {
      position: fixed;
      left: 10px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      width: 32px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255, 140, 0, 0.85);
      background: linear-gradient(135deg, rgba(255, 107, 0, 0.92), rgba(215, 82, 0, 0.94));
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-right: 2px;
      box-shadow: 3px 4px 16px rgba(0, 0, 0, 0.65), 0 0 12px rgba(255, 107, 0, 0.3);
      z-index: 5100;
      cursor: pointer;
      opacity: 0;
      transform: translateX(-110%);
      pointer-events: none;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
      touch-action: pan-y;
    }
    #terminal-shell.en-pos.dock-oculto #btn-dock-pestana-pos {
      opacity: 0.94;
      transform: translateX(0);
      pointer-events: auto;
    }
    #btn-dock-pestana-pos:active {
      transform: scale(0.95);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="terminal-shell">
    <main id="terminal-stage">
      <!-- VISTA 1: INICIO -->
      <section id="vista-inicio" class="vista-contenedor" aria-label="Inicio de terminal">
        <header class="inicio-header">
          <div class="inicio-marca">Geo<span>KATU</span></div>
          <div class="inicio-estado-pill">
            <span class="inicio-dot"></span>
            <span id="inicio-estado-txt">Terminal lista</span>
          </div>
        </header>

        <div class="inicio-cuerpo">
          <div class="inicio-saludo">
            <div>
              <h1 id="inicio-nombre-negocio">Comercio activo</h1>
              <p id="inicio-operador-rol">Operador autenticado</p>
            </div>
          </div>

          <div class="inicio-grid">
            <button type="button" class="inicio-card destacada" data-ir="pos">
              <strong>POS (Caja)</strong>
              <span>Facturar, pesar, pausar tickets y cobrar sin salir de caja.</span>
            </button>
            <button type="button" class="inicio-card" data-ir="mapa">
              <strong>Mapa de tienda</strong>
              <span>Radar 2D en tiempo real y elevación 2.5D a petición.</span>
            </button>
            <button type="button" class="inicio-card" data-ir="stock">
              <strong>Stock (WMS)</strong>
              <span>Ubicar mercancía, registrar ingresos, traslados y conteo.</span>
            </button>
            <button type="button" class="inicio-card" id="btn-inicio-escaner">
              <strong>Escáner rápido</strong>
              <span>Vender, consultar precio o ubicar con una sola cámara.</span>
            </button>
            <button type="button" class="inicio-card" id="btn-inicio-croquis" style="display:none;">
              <strong>Editar croquis</strong>
              <span>Abrir editor de plano e impresión de etiquetas QR.</span>
            </button>
            <button type="button" class="inicio-card" id="btn-inicio-oficina" style="display:none;">
              <strong>Oficina</strong>
              <span>Administración de catálogo, nómina y reportes.</span>
            </button>
          </div>

          <div class="inicio-acciones-sesion">
            <button type="button" id="btn-inicio-bloquear" class="btn-inicio-sec">Bloquear / Relevo</button>
            <button type="button" id="btn-inicio-salir" class="btn-inicio-sec btn-inicio-peligro">Cerrar sesión</button>
          </div>
        </div>
      </section>

      <!-- VISTA 2: POS (MONTAJE PERSISTENTE EN RAM) -->
      <section id="vista-pos" class="vista-contenedor" aria-label="Punto de venta">
        <iframe id="frame-pos" class="vista-iframe" title="POS GeoKATU" allow="camera"></iframe>
      </section>

      <!-- VISTA 3: STOCK WMS (MONTAJE BAJO DEMANDA Y PERSISTENTE) -->
      <section id="vista-stock" class="vista-contenedor" aria-label="Control de stock">
        <iframe id="frame-stock" class="vista-iframe" title="Stock GeoKATU" allow="camera"></iframe>
      </section>

            <!-- VISTA 4: MAPA RADAR 2D/2.5D + EDITOR DE CROQUIS (MAPATIENDA) -->
      <section id="vista-mapa" class="vista-contenedor" aria-label="Mapa de tienda">
        <iframe id="frame-mapa" class="vista-iframe" title="Mapa de tienda GeoKATU" allow="camera"></iframe>
                <button type="button" id="btn-switch-editor-mapa" onclick="window.TerminalApp.alternarModoEditorMapa()" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span id="txt-switch-editor-mapa">Editar Mapa</span>
        </button>
      </section>
    </main>

    <!-- BARRA FLOTANTE: VOLVER A LA VENTA -->
    <button type="button" id="barra-volver-venta" aria-label="Volver a la venta activa">
      <div class="bvv-izq">
        <svg class="bvv-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/>
          <path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/>
        </svg>
        <div class="bvv-textos">
          <span class="bvv-titulo">Volver a la venta</span>
          <span id="bvv-unidades" class="bvv-sub">0 unidades</span>
        </div>
      </div>
      <div class="bvv-der">
        <span id="bvv-total">$0</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </button>

    <!-- PESTANA NARANJA DE DESPLIEGUE LATERAL (SOLO EN POS) -->
    <button type="button" id="btn-dock-pestana-pos" aria-label="Mostrar menú de herramientas">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <polygon points="7,4 20,12 7,20"/>
      </svg>
    </button>

    <!-- DOCK INFERIOR UNIFICADO -->
    <nav id="terminal-dock" aria-label="Navegación de terminal">
      <button type="button" class="dock-item" data-vista="inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        <span>Inicio</span>
      </button>
      <button type="button" class="dock-item" data-vista="pos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/><path d="M8 16v4"/><path d="M16 16v4"/></svg>
        <span>POS</span>
      </button>
      <button type="button" id="btn-dock-escaner" class="dock-btn-escaner" aria-label="Abrir escáner">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7V5a1 1 0 0 1 1-1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v2"/>
          <path d="M20 17v2a1 1 0 0 1-1 1h-2"/><path d="M7 20H5a1 1 0 0 1-1-1v-2"/>
          <line x1="8" y1="8" x2="8" y2="16"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="16" y1="8" x2="16" y2="16"/>
        </svg>
      </button>
      <button type="button" class="dock-item" data-vista="stock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        <span>Stock</span>
      </button>
      <button type="button" class="dock-item" data-vista="mapa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h6"/><path d="M15 12h6"/><path d="M12 3v6"/><path d="M12 15v6"/></svg>
        <span>Mapa</span>
      </button>
    </nav>
  </div>

  <script src="./html5-qrcode.min.js"></script>
  <script type="module" src="./terminal-shell.js"></script>

<button type="button" id="gk-btn-ayuda-yt" title="Tutoriales y Ayuda GeoKATU" aria-label="Tutoriales y Ayuda">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
</button>
<div id="gk-modal-ayuda-yt">
  <div class="gk-ayuda-card">
    <div style="width:40px; height:4px; border-radius:4px; background:rgba(255,255,255,0.18); margin:0 auto 12px auto;"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div>
        <div style="font-size:15px; font-weight:900; text-transform:uppercase; letter-spacing:0.6px;">Academia <span style="color:#ff6b00;">GEOKATU</span></div>
        <div style="font-size:11px; color:#9ca3af; margin-top:2px;">Guías en video de POS, Stock, WMS y Catálogo</div>
      </div>
      <button type="button" id="gk-cerrar-ayuda-yt" aria-label="Cerrar" style="width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <p style="margin:0 0 14px 0; font-size:12px; color:#cbd5e1; line-height:1.45;">Mira los videos cortos con todas las funciones especiales de tu terminal comercial en el canal oficial.</p>
    <a href="https://www.youtube.com/geokatu" target="_blank" rel="noopener noreferrer" style="display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:44px; border-radius:12px; background:linear-gradient(135deg,#ff8c00,#ff6b00); color:#ffffff; text-decoration:none; font-size:12.5px; font-weight:900; text-transform:uppercase; letter-spacing:0.5px; box-shadow:0 6px 18px rgba(255,107,0,0.38); margin-bottom:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span>Ver Tutoriales en YouTube</span>
    </a>
    <button type="button" id="gk-repetir-paso5" style="width:100%; height:40px; border-radius:11px; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.05); color:#e2e8f0; font-size:11.5px; font-weight:800; cursor:pointer;">Repetir Guía Rápida de Terminal</button>
  </div>
</div>
<div id="gk-p5-backdrop" class="gk-p5-backdrop"></div>
<div id="gk-p5-card" class="gk-p5-card"></div>
<script id="gk-paso5-terminal-js">
(function () {
  "use strict";
  var YOUTUBE_URL = "https://www.youtube.com/geokatu";
  var btnAyuda = document.getElementById("gk-btn-ayuda-yt");
  var modalAyuda = document.getElementById("gk-modal-ayuda-yt");
  var btnCerrarAyuda = document.getElementById("gk-cerrar-ayuda-yt");
  var btnRepetir = document.getElementById("gk-repetir-paso5");
  var backdrop = document.getElementById("gk-p5-backdrop");
  var card = document.getElementById("gk-p5-card");

  function buscarBotonVista(nombre) {
    var n = String(nombre || "").toLowerCase();
    var lista = document.querySelectorAll("button, a, [data-vista]");
    for (var i = 0; i < lista.length; i++) {
      var el = lista[i];
      if (el.id === "gk-btn-ayuda-yt" || el.closest("#gk-modal-ayuda-yt") || el.closest("#gk-p5-card")) continue;
      var dv = String(el.getAttribute("data-vista") || "").toLowerCase();
      var tx = String(el.textContent || "").trim().toLowerCase();
      if (dv === n || tx === n) return el;
    }
    return null;
  }

  function limpiarResaltado() {
    document.querySelectorAll(".gk-p5-spotlight").forEach(function (el) { el.classList.remove("gk-p5-spotlight"); });
    document.querySelectorAll(".gk-p5-parent-top").forEach(function (el) { el.classList.remove("gk-p5-parent-top"); });
  }

  var pasos = [
    {
      getTarget: function () { return null; },
      titulo: "Bienvenido a tu Terminal (Paso 5 de 5)",
      cuerpo: "Aquí operas tu Caja POS, tu Stock y el Mapa de tienda en una sola sesión. Los productos que subiste en tu catálogo ya están en Piso de Venta listos para probar."
    },
    {
      getTarget: function () { return buscarBotonVista("stock"); },
      titulo: "Stock y Subida Rápida",
      cuerpo: "Desde Stock también puedes ingresar mercancía, actualizar cantidades o escanear códigos de barras en segundos. Todo queda sincronizado con tu catálogo."
    },
    {
      getTarget: function () { return buscarBotonVista("pos"); },
      titulo: "Prueba tu Caja POS",
      cuerpo: "Toca POS para cobrar los productos que acabas de subir. Cada venta descuenta automáticamente las existencias de tu Piso de Venta."
    },
    {
      getTarget: function () { return btnAyuda; },
      titulo: "Videotutoriales en YouTube (?)",
      cuerpo: "Cuando quieras dominar funciones avanzadas (WMS, balanza, SIIGO o relevo por PIN), toca este botón (?) para abrir el canal oficial de GeoKATU en YouTube.",
      esFinal: true
    }
  ];

  var idxPaso = 0;

  function cerrarGuiaYEntrarPOS() {
    limpiarResaltado();
    if (backdrop) backdrop.classList.remove("activo");
    if (card) card.classList.remove("activo");
    localStorage.setItem("geokatu_paso5_completado", "1");
    try {
      var url = new URL(window.location.href);
      if (url.searchParams.has("onboarding")) {
        url.searchParams.delete("onboarding");
        window.history.replaceState(null, "", url.pathname + url.search);
      }
    } catch (eU) {}
    if (window.TerminalApp && typeof window.TerminalApp.cambiarVista === "function") {
      window.TerminalApp.cambiarVista("pos");
    } else {
      var bPos = buscarBotonVista("pos");
      if (bPos) bPos.click();
    }
  }

  function renderPaso() {
    limpiarResaltado();
    if (idxPaso >= pasos.length) { cerrarGuiaYEntrarPOS(); return; }
    var p = pasos[idxPaso];
    var target = p.getTarget();
    backdrop.classList.add("activo");
    card.classList.add("activo");

    if (target) {
      var padre = target.closest("nav, footer, header");
      if (padre) padre.classList.add("gk-p5-parent-top");
      target.classList.add("gk-p5-spotlight");
      var r = target.getBoundingClientRect();
      if (r.top > window.innerHeight * 0.55) {
        card.style.top = "auto";
        card.style.bottom = Math.max(96, Math.round(window.innerHeight - r.top + 16)) + "px";
      } else {
        card.style.bottom = "auto";
        card.style.top = Math.min(window.innerHeight - 230, Math.round(r.bottom + 16)) + "px";
      }
    } else {
      card.style.bottom = "auto";
      card.style.top = Math.max(90, Math.round((window.innerHeight - 210) / 2)) + "px";
    }

    var accionesHtml = p.esFinal
      ? "<div style="display:flex; gap:8px;">" +
          "<a href="" + YOUTUBE_URL + "" target="_blank" rel="noopener noreferrer" id="gk-p5-ir-yt" style="flex:1; height:38px; border-radius:10px; border:1px solid rgba(255,107,0,0.55); background:rgba(255,107,0,0.14); color:#ff8c33; font-size:11px; font-weight:900; text-decoration:none; display:flex; align-items:center; justify-content:center;">Ir a YouTube</a>" +
          "<button type="button" id="gk-p5-sig" style="flex:1.2; height:38px; border-radius:10px; border:none; background:linear-gradient(135deg,#ff8c00,#ff6b00); color:#fff; font-size:11.5px; font-weight:900; text-transform:uppercase; cursor:pointer;">Empezar en POS</button>" +
        "</div>"
      : "<div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">" +
          "<button type="button" id="gk-p5-omitir" style="background:transparent; border:none; color:#9ca3af; font-size:11.5px; font-weight:700; cursor:pointer; padding:6px;">Omitir</button>" +
          "<button type="button" id="gk-p5-sig" style="height:36px; padding:0 18px; border-radius:10px; border:none; background:linear-gradient(135deg,#ff8c00,#ff6b00); color:#fff; font-size:11.5px; font-weight:900; text-transform:uppercase; cursor:pointer;">Siguiente</button>" +
        "</div>";

    card.innerHTML =
      "<span style="display:block; font-size:9.5px; font-weight:900; color:#ff6b00; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:4px;">Paso 5 · Guía " + (idxPaso + 1) + " de " + pasos.length + "</span>" +
      "<h4 style="margin:0 0 6px 0; font-size:14px; font-weight:900; color:#fff;">" + p.titulo + "</h4>" +
      "<p style="margin:0 0 14px 0; font-size:12px; color:#cbd5e1; line-height:1.4;">" + p.cuerpo + "</p>" +
      accionesHtml;

    var btnSig = document.getElementById("gk-p5-sig");
    var btnOmi = document.getElementById("gk-p5-omitir");
    if (btnSig) btnSig.addEventListener("click", function () { idxPaso++; renderPaso(); });
    if (btnOmi) btnOmi.addEventListener("click", cerrarGuiaYEntrarPOS);
  }

  window.iniciarOnboardingPaso5 = function () {
    if (modalAyuda) modalAyuda.classList.remove("activo");
    idxPaso = 0;
    renderPaso();
  };

  if (btnAyuda && modalAyuda) {
    btnAyuda.addEventListener("click", function () { modalAyuda.classList.add("activo"); });
    modalAyuda.addEventListener("click", function (e) { if (e.target === modalAyuda) modalAyuda.classList.remove("activo"); });
  }
  if (btnCerrarAyuda && modalAyuda) {
    btnCerrarAyuda.addEventListener("click", function () { modalAyuda.classList.remove("activo"); });
  }
  if (btnRepetir) {
    btnRepetir.addEventListener("click", function () { window.iniciarOnboardingPaso5(); });
  }

  window.addEventListener("DOMContentLoaded", function () {
    var params = new URLSearchParams(window.location.search);
    if (params.get("onboarding") === "paso5") {
      setTimeout(function () { window.iniciarOnboardingPaso5(); }, 700);
    }
  });
})();
</script>
</body>
</html>
