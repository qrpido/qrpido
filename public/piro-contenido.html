<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GEOKATU Studio · Contenido Zero-Scroll</title>
<style>
  :root {
    --bg: #07090e;
    --panel: #101521;
    --panel-2: #171f30;
    --border: rgba(255, 255, 255, 0.11);
    --border-hi: rgba(255, 255, 255, 0.24);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --naranja: #ff6b00;
    --miel: #ffb300;
    --verde: #22c55e;
    --azul: #38bdf8;
    --rojo: #ef4444;
    --radius: 13px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
    overflow: hidden; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px; line-height: 1.38;
  }
  button, input, textarea, select { font-family: inherit; color: var(--text); }
  .svg-ico { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .svg-sm { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .hidden { display: none !important; }

  /* CONTENEDOR FIJO 100DVH ZERO-SCROLL */
  .app-shell {
    display: flex; flex-direction: column; width: 100%; height: 100%; height: 100dvh;
    overflow: hidden; background: var(--bg); position: relative;
  }

  /* BARRA SUPERIOR ULTRADELGADA (42PX) + BOTÓN NARANJA IZQUIERDO */
  .top-slim {
    height: 44px; flex-shrink: 0; padding: 0 8px;
    background: rgba(11, 15, 23, 0.98); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .top-left { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; }
  .btn-drawer-orange {
    width: 34px; height: 32px; flex-shrink: 0; border-radius: 9px;
    border: 1px solid #ff8533;
    background: linear-gradient(135deg, var(--naranja), #ea580c);
    color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(255, 107, 0, 0.35);
  }
  .btn-drawer-orange:active { transform: scale(0.94); }
  .ctx-title { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .ctx-title strong { font-size: 12.5px; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctx-title small { font-size: 10px; color: var(--azul); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sync-pill {
    font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 99px;
    border: 1px solid var(--border); background: rgba(255, 255, 255, 0.05); color: var(--muted);
    white-space: nowrap; flex-shrink: 0;
  }
  .sync-pill.ok { color: #86efac; border-color: rgba(34, 197, 94, 0.45); background: rgba(34, 197, 94, 0.14); }
  .sync-pill.warn { color: #fcd34d; border-color: rgba(245, 158, 11, 0.45); background: rgba(245, 158, 11, 0.14); }

  /* FILA COMPACTA DE SUB-PESTAÑAS HORIZONTALES (36PX) */
  .subtab-strip {
    height: 36px; flex-shrink: 0; padding: 4px 8px;
    background: rgba(14, 18, 28, 0.94); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 5px; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  .subtab-strip::-webkit-scrollbar { display: none; }
  .sub-pill {
    flex: 0 0 auto; padding: 4px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04);
    color: var(--muted); font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap;
  }
  .sub-pill.activo { border-color: var(--azul); background: rgba(56, 189, 248, 0.18); color: #e0f2fe; }
  .sub-pill.hot { border-color: rgba(255, 107, 0, 0.5); color: #fdba74; }
  .sub-pill.hot.activo { background: var(--naranja); border-color: var(--naranja); color: #fff; }

  /* ESCENARIO PRINCIPAL FIJO (CERO SCROLL VERTICAL DE PÁGINA) */
  .workspace-stage {
    flex: 1; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
  }

  /* BOTONES Y CONTROLES */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 6px 10px; border-radius: 9px; border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.06); font-size: 11.5px; font-weight: 800;
    cursor: pointer; white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: linear-gradient(135deg, var(--naranja), #ea580c); border-color: var(--naranja); color: #fff; }
  .btn-green { background: rgba(34, 197, 94, 0.18); border-color: rgba(34, 197, 94, 0.5); color: #86efac; }
  .btn-blue { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.45); color: var(--azul); }
  .btn-danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
  .btn-xs { padding: 4px 8px; font-size: 10.5px; border-radius: 7px; }
  .inp, .txt, .sel {
    width: 100%; padding: 7px 9px; border-radius: 8px;
    border: 1px solid var(--border); background: rgba(5, 8, 14, 0.85);
    font-size: 12px; outline: none;
  }
  .inp:focus, .txt:focus, .sel:focus { border-color: var(--naranja); }
  .field { margin-bottom: 7px; }
  .field label { display: block; font-size: 10px; font-weight: 800; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.3px; }

  /* DOCK INFERIOR ESTILO SNAPSEED (114PX FIJO) */
  .snapseed-dock {
    height: 114px; flex-shrink: 0; background: rgba(12, 16, 25, 0.99);
    border-top: 1px solid var(--border-hi);
    display: flex; flex-direction: column; justify-content: center;
    padding: 6px 8px; overflow: hidden;
  }
  .tool-strip {
    display: flex; align-items: center; gap: 6px;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none; height: 100%; padding: 2px;
  }
  .tool-strip::-webkit-scrollbar { display: none; }
  .tool-btn {
    flex: 0 0 auto; min-width: 66px; height: 74px; padding: 6px;
    border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    cursor: pointer; color: #cbd5e1; font-size: 10.5px; font-weight: 800;
  }
  .tool-btn.activo { border-color: var(--naranja); background: rgba(255, 107, 0, 0.16); color: #fff; }
  .tool-btn.accent { border-color: rgba(56, 189, 248, 0.42); color: #7dd3fc; }
  .subpanel {
    display: flex; flex-direction: column; justify-content: space-between;
    height: 100%; gap: 6px;
  }
  .sub-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .sub-title { font-size: 11px; font-weight: 900; color: var(--miel); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-row {
    display: flex; align-items: center; gap: 6px;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding-bottom: 2px;
  }
  .sub-row::-webkit-scrollbar { display: none; }
  .slider-grp {
    flex: 1; min-width: 120px; display: flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
    border-radius: 9px; padding: 5px 8px;
  }
  .slider-grp span { font-size: 10.5px; font-weight: 800; color: var(--muted); white-space: nowrap; }
  .slider-grp b { font-size: 11px; font-family: monospace; color: var(--azul); min-width: 32px; text-align: right; }
  .slider-grp input[type="range"] { flex: 1; min-width: 55px; accent-color: var(--naranja); margin: 0; }

  /* VISOR SÁNDWICH FIJO */
  .sandwich-stage {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 34px 8px 8px 8px;
    background: radial-gradient(circle at 50% 45%, #121826, #06080d);
  }
  .stage-float-top {
    position: absolute; top: 6px; left: 8px; right: 8px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; pointer-events: none;
  }
  .float-grp { display: flex; gap: 4px; pointer-events: auto; }
  .mini-pill {
    padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(10, 14, 22, 0.88); color: var(--text);
    font-size: 10.5px; font-weight: 800; cursor: pointer;
  }
  .mini-pill.on { border-color: var(--azul); color: var(--azul); background: rgba(56, 189, 248, 0.16); }
  .checker-bg {
    background-color: #161b26;
    background-image: linear-gradient(45deg, #222a3a 25%, transparent 25%),
      linear-gradient(-45deg, #222a3a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #222a3a 75%),
      linear-gradient(-45deg, transparent 75%, #222a3a 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  }
  .dark-bg { background: #05070b; }
  .light-bg { background: #e2e8f0; }
  #canvas-sandwich {
    display: block; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55);
  }

  /* CARRUSEL HORIZONTAL DE TARJETAS ZERO-SCROLL (PIEZAS / ESCENARIOS / PROPS / ESCENAS) */
  .carousel-stage {
    flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 10px;
    overflow-x: auto; overflow-y: hidden; padding: 10px 12px;
    scroll-snap-type: x mandatory;
  }
  .carousel-stage::-webkit-scrollbar { height: 4px; }
  .carousel-stage::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 99px; }
  .slide-card {
    flex: 0 0 min(88vw, 330px); height: 100%; scroll-snap-align: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 15px;
    padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
  }
  .slide-card.listo { border-color: rgba(34, 197, 94, 0.45); }
  .slide-preview {
    flex: 1; min-height: 100px; border-radius: 10px; border: 1px dashed rgba(255, 255, 255, 0.14);
    display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
  }
  .slide-preview img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .slot-empty-label { text-align: center; padding: 10px; color: var(--muted); font-size: 11px; background: rgba(8, 10, 15, 0.78); border-radius: 8px; }
  .slot-tag-dim { position: absolute; top: 6px; right: 6px; font-family: monospace; font-size: 9.5px; padding: 2px 6px; border-radius: 5px; background: rgba(0, 0, 0, 0.78); color: var(--azul); }
  .slot-tag-ok { position: absolute; top: 6px; left: 6px; font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 5px; background: rgba(34, 197, 94, 0.88); color: #052e16; }
  .slot-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex-shrink: 0; }

  /* PANELES COMPACTOS INTERNOS (FICHA / PROMPTS / GUION) */
  .compact-pane {
    flex: 1; min-height: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto; max-width: 720px; width: 100%; margin: 0 auto;
  }
  .prompt-out {
    flex: 1; width: 100%; min-height: 110px; padding: 9px; border-radius: 10px;
    border: 1px solid rgba(56, 189, 248, 0.35); background: #05070b;
    color: #86efac; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.42; resize: none; outline: none;
  }

  /* DRAWER DESLIZABLE DESDE LA ESQUINA IZQUIERDA (BOTÓN ▶ NARANJA) */
  .drawer-ov {
    position: fixed; inset: 0; z-index: 70000; background: rgba(4, 6, 11, 0.72);
    backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .drawer-ov.open { opacity: 1; pointer-events: auto; }
  .drawer-panel {
    position: absolute; top: 0; left: 0; bottom: 0; width: min(84vw, 310px);
    background: linear-gradient(165deg, #151c2c, #0a0e16);
    border-right: 1px solid var(--border-hi);
    transform: translateX(-104%); transition: transform .2s ease;
    display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow: hidden;
  }
  .drawer-ov.open .drawer-panel { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .drawer-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .drawer-sec-lbl { font-size: 10px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .drawer-cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .drawer-item {
    width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04); text-align: left; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 700;
  }
  .drawer-item.activo { border-color: var(--naranja); background: rgba(255, 107, 0, 0.18); color: #fff; }
  .pct-mini { font-family: monospace; font-size: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); color: var(--miel); }
  .pct-mini.full { background: rgba(34, 197, 94, 0.25); color: #86efac; }

  /* MODALES */
  .modal-ov {
    position: fixed; inset: 0; z-index: 80000;
    background: rgba(4, 6, 10, 0.84); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 12px;
  }
  .modal-ov.open { display: flex; }
  .modal-card {
    width: 100%; max-width: 440px; max-height: 86dvh; overflow-y: auto;
    background: linear-gradient(150deg, #161c2a, #0b0e16);
    border: 1px solid var(--border-hi); border-radius: 16px; padding: 15px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 9px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 13.5px; font-weight: 800; }

  #toasts-cont { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 95000; display: flex; flex-direction: column; gap: 5px; pointer-events: none; max-width: 92vw; }
  .toast-c { padding: 8px 13px; border-radius: 99px; font-size: 11.5px; font-weight: 800; background: rgba(12, 16, 25, 0.96); border: 1px solid var(--border); text-align: center; }
  .toast-c.exito { border-color: rgba(34, 197, 94, 0.6); color: #86efac; }
  .toast-c.error { border-color: rgba(239, 68, 68, 0.6); color: #fca5a5; }
  .toast-c.info { border-color: rgba(56, 189, 248, 0.6); color: #7dd3fc; }
</style>
</head>
<body>

<div class="app-shell">
  <!-- BARRA SUPERIOR COMPACTA CON BOTÓN NARANJA ▶ A LA IZQUIERDA -->
  <header class="top-slim">
    <div class="top-left">
      <button type="button" class="btn-drawer-orange" id="btn-abrir-drawer" title="Menú Contenido" onclick="window.toggleDrawerCont(true)">
        <svg class="svg-ico" style="fill:currentColor; stroke:none;" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"/></svg>
      </button>
      <div class="ctx-title">
        <strong id="hdr-entidad-titulo">Personajes</strong>
        <small id="hdr-entidad-sub">Cargando biblioteca...</small>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:5px;">
      <button type="button" class="btn btn-xs btn-blue" id="btn-quick-hdr" onclick="window.accionRapidaHeader()">+ Nuevo</button>
      <span id="badge-sync-cont" class="sync-pill">...</span>
    </div>
  </header>

  <!-- TIRA HORIZONTAL DE SUB-VISTAS (1 SOLA LÍNEA) -->
  <nav class="subtab-strip" id="subtab-strip"></nav>

  <!-- ÁREA CENTRAL ZERO-SCROLL -->
  <main class="workspace-stage" id="workspace-stage"></main>
</div>

<!-- DRAWER LATERAL IZQUIERDO (SE ABRE CON EL BOTÓN ▶ NARANJA) -->
<div class="drawer-ov" id="drawer-cont" onclick="if(event.target.id==='drawer-cont') window.toggleDrawerCont(false)">
  <aside class="drawer-panel">
    <div class="drawer-head">
      <div style="display:flex; align-items:center; gap:6px;">
        <span id="badge-proy-cont" class="sync-pill ok">Pirobonianos</span>
      </div>
      <button type="button" class="btn btn-xs" onclick="window.toggleDrawerCont(false)">Cerrar</button>
    </div>
    <div class="drawer-scroll" id="drawer-cont-body"></div>
    <div style="border-top:1px solid var(--border); padding-top:8px; display:flex; gap:6px;">
      <button type="button" class="btn btn-xs btn-blue" style="flex:1;" onclick="window.toggleDrawerCont(false); window.exportarManifiestoTermux();">Exportar JSON Termux</button>
    </div>
  </aside>
</div>

<input type="file" id="input-file-slot" class="hidden" onchange="window.manejarArchivoSlotSeleccionado(this.files[0]); this.value='';">

<!-- MODAL CREAR NUEVA ENTIDAD -->
<div class="modal-ov" id="modal-crear-entidad" onclick="if(event.target.id==='modal-crear-entidad') window.cerrarModalC('modal-crear-entidad')">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modal-crear-titulo">Crear Nuevo</h3>
      <button type="button" class="btn btn-xs" onclick="window.cerrarModalC('modal-crear-entidad')">Cerrar</button>
    </div>
    <form id="form-crear-entidad" onsubmit="event.preventDefault(); window.confirmarCrearEntidad();"></form>
  </div>
</div>

<!-- MODAL CONFIRMACIÓN -->
<div class="modal-ov" id="modal-conf-c" style="z-index:92000;">
  <div class="modal-card" style="max-width:360px;">
    <h3 id="conf-c-tit" style="margin:0 0 8px 0; font-size:14px;">Confirmar</h3>
    <p id="conf-c-msg" style="margin:0 0 14px 0; font-size:12px; color:var(--muted);"></p>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button type="button" class="btn" id="conf-c-no">Cancelar</button>
      <button type="button" class="btn btn-primary" id="conf-c-si">Confirmar</button>
    </div>
  </div>
</div>

<div id="toasts-cont"></div>

<script type="module">
import GeokatuDB from './core-db.js';
import { dibujarMarionetaPiro, cargarImagenPiro } from './piro-compositor.js';

const CLAVE_PROY_ACTIVO = 'piro_proyecto_activo_v1';
function normalizarDocBibId(id, proyId) {
  const s = String(id || '').trim();
  if (!s || s === '__biblioteca_maestra__') return 'bib_pirobonianos';
  const limpio = s.replace(/^_+/, '').replace(/_+$/, '');
  return limpio || ('bib_' + (proyId || 'pirobonianos'));
}
let proyectoActivo = {
  id: 'pirobonianos', nombre: 'Pirobonianos', docBibId: 'bib_pirobonianos',
  storageDir: 'biblioteca_contenido', plantilla: 'piro_rig', bilingue: false,
  tipo_personaje: 'Anthropomorphic dog',
  estilo_visual: 'A 2D cartoon animation character, BoJack Horseman style, clean black ink outlines, flat vibrant colors.'
};
try {
  const rawP = localStorage.getItem(CLAVE_PROY_ACTIVO);
  if (rawP) { const parsed = JSON.parse(rawP); if (parsed && parsed.docBibId) proyectoActivo = Object.assign(proyectoActivo, parsed); }
} catch (e) {}
proyectoActivo.docBibId = normalizarDocBibId(proyectoActivo.docBibId, proyectoActivo.id);
function getDocBibId() { return normalizarDocBibId(proyectoActivo.docBibId, proyectoActivo.id); }
function getLocalBibKey() { return proyectoActivo.id === 'pirobonianos' ? 'piro_biblioteca_maestra_v1' : ('piro_bib_' + proyectoActivo.id + '_v1'); }
function getStorageDir() { return proyectoActivo.storageDir || 'biblioteca_contenido'; }
function actualizarBadgeProy() { const b = document.getElementById('badge-proy-cont'); if (b) b.textContent = proyectoActivo.nombre || 'Pirobonianos'; }

const SLOTS_BASICOS_PERSONAJE = [
  { key: 'maestro_cuerpo', grupo: 'base', titulo: 'Cuerpo Entero Maestro', preset: 'per_ref', archivo: 'maestro_vest_01', dim: '1000×1600', desc: 'De pie mirando a la derecha, base de referencia.' },
  { key: 'maestro_perfil', grupo: 'base', titulo: 'Busto / Perfil Maestro', preset: 'per_ref', archivo: 'maestro_perfil', dim: '1000×1600', desc: 'Primer plano de pecho arriba para expresiones.' },
  { key: 'cabeza_base', grupo: 'base', titulo: 'Cabeza Sin Rostro', preset: 'per_cabeza', archivo: 'base', dim: '1000×1600', desc: 'Cabeza, orejas y hocico SIN ojos ni boca.' },
  { key: 'cuerpo_base', grupo: 'base', titulo: 'Cuerpo / Vestuario 01', preset: 'per_cuerpo', archivo: 'vest_01', dim: '1000×1600', desc: 'Torso y ropa base SIN cabeza ni brazos.' },

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg, tipo) {
  if (window.self !== window.top) {
    window.parent.postMessage({ tipo: 'PIRO_TOAST', mensaje: msg, nivel: tipo || 'info' }, '*');
    return;
  }
  const cont = document.getElementById('toasts-cont');
  const el = document.createElement('div');
  el.className = 'toast-c ' + (tipo || 'info');
  el.textContent = msg;
  cont.appendChild(el);
  setTimeout(function() { el.remove(); }, 2800);
}

function confirmar(tit, msg) {
  return new Promise(function(resolve) {
    const m = document.getElementById('modal-conf-c');
    document.getElementById('conf-c-tit').textContent = tit;
    document.getElementById('conf-c-msg').textContent = msg;
    const no = document.getElementById('conf-c-no');
    const si = document.getElementById('conf-c-si');
    m.classList.add('open');
    const fin = function(v) { m.classList.remove('open'); no.onclick = null; si.onclick = null; resolve(v); };
    no.onclick = function() { fin(false); };
    si.onclick = function() { fin(true); };
  });
}

async function cargarBiblioteca() {
  actualizarBadgeProy();
  setSyncBadge('...', 'warn');
  biblioteca = { tipo_doc: 'biblioteca', personajes: [], escenarios: [], props: [], guiones: [] };
  const kLoc = getLocalBibKey();
  try { const raw = localStorage.getItem(kLoc); if (raw) biblioteca = JSON.parse(raw); } catch (e) {}

  if (GeokatuDB.PirobonianosService && navigator.onLine) {
    const res = await GeokatuDB.PirobonianosService.obtenerProyectoEDT(getDocBibId());
    if (res.success && res.data && Array.isArray(res.data.personajes)) {
      if (!biblioteca.fecha_actualizacion || String(res.data.fecha_actualizacion || '') >= String(biblioteca.fecha_actualizacion)) {
        biblioteca = res.data;
        try { localStorage.setItem(kLoc, JSON.stringify(biblioteca)); } catch (e) {}
      }
      setSyncBadge(res.origen === 'nube' ? 'Nube OK' : 'Local', res.origen === 'nube' ? 'ok' : 'warn');
    } else if (res.success) {
      setSyncBadge('Nube OK', 'ok');
    } else {
      setSyncBadge('Local', 'warn');
    }
  } else {
    setSyncBadge('Offline', 'warn');
  }

  if (!Array.isArray(biblioteca.personajes) || biblioteca.personajes.length === 0) {
    biblioteca = crearSemillaPorProyecto();
    guardarBiblioteca(true);
  }
  try {
    const rawUiC = localStorage.getItem('piro_cont_ui_' + proyectoActivo.id);
    if (rawUiC) {
      const u = JSON.parse(rawUiC);
      if (u.catActiva) catActiva = u.catActiva;
      if (u.subTabPersonaje) subTabPersonaje = u.subTabPersonaje;
      if (u.selId) selId = Object.assign(selId, u.selId);
    }
  } catch (e) {}
  if (!biblioteca.personajes.some(function(x) { return x.id === selId.personajes; })) selId.personajes = biblioteca.personajes[0] ? biblioteca.personajes[0].id : null;
  if (!biblioteca.escenarios.some(function(x) { return x.id === selId.escenarios; })) selId.escenarios = biblioteca.escenarios[0] ? biblioteca.escenarios[0].id : null;
  if (!biblioteca.guiones.some(function(x) { return x.id === selId.guiones; })) selId.guiones = biblioteca.guiones[0] ? biblioteca.guiones[0].id : null;
  renderizarTodo();
}

function guardarBiblioteca(inmediato) {
  hayCambiosPendientes = true;
  biblioteca.tipo_doc = 'biblioteca';
  biblioteca.meta_proyecto = proyectoActivo;
  biblioteca.fecha_actualizacion = new Date().toISOString();
  const limpioJson = JSON.parse(JSON.stringify(biblioteca));
  try { localStorage.setItem(getLocalBibKey(), JSON.stringify(limpioJson)); } catch (e) {}
  setSyncBadge('Guardando...', 'warn');
  clearTimeout(debounceGuardar);
  const run = async function() {
    if (!GeokatuDB.PirobonianosService) { setSyncBadge('Local', 'warn'); return { success: false, offline: true }; }
    const res = await GeokatuDB.PirobonianosService.guardarProyectoEDT(getDocBibId(), limpioJson);
    if (res.success && !res.offline) {
      hayCambiosPendientes = false;
      setSyncBadge('Nube OK', 'ok');
    } else {
      setSyncBadge('Local', 'warn');
      if (res && res.error) toast('Aviso nube: ' + res.error, 'error');
    }
    if (window.self !== window.top) window.parent.postMessage({ tipo: 'PIRO_BIBLIOTECA_ACTUALIZADA', origen: 'contenido' }, '*');
    return res;
  };
  if (inmediato) return run();
  debounceGuardar = setTimeout(run, 650);
  return Promise.resolve({ success: true, debounced: true });
}

function generarPromptPersonaje(p, tipo) {
  const baseStyle = proyectoActivo.estilo_visual || 'A 2D cartoon animation character, BoJack Horseman style, clean black ink outlines, flat vibrant colors.';
  const prefId = proyectoActivo.plantilla === 'scifi_hibrido' ? ('Character profile: ' + (p.raza || 'human sci-fi character')) : ('Anthropomorphic ' + (p.raza || 'dog') + ' character');
  const identidad = prefId + '. Physique: ' + (p.contextura || 'adult stylized') + '. Features: ' + (p.pelaje_rasgos || 'distinctive look') + '.';
  const ropa = 'Wearing: ' + (p.vestuario_base || 'casual clothes') + '.';

  if (tipo === 'cuerpo_completo' || tipo === 'maestro_cuerpo') {
    return baseStyle + ' Full-body ' + identidad + ' Showing completely from head to toe, both arms, hands, legs, and feet clearly visible, facing three-quarters to the RIGHT. ' + ropa + ' Pose: ' + (p.pose_iconica || 'standing neutral') + '. Isolated on a completely flat solid chroma green background (#00FF00) with zero shadows, perfect for a PNG cut-out. Facial expression: neutral.';
  }
  if (tipo === 'maestro_perfil') {
    return 'Using the attached full-body character as strict reference, generate a clean medium close-up bust portrait (from chest/shoulders up) facing three-quarters to the RIGHT, on a completely flat solid chroma green background (#00FF00) with zero shadows. ' + baseStyle + ' ' + identidad + ' ' + ropa + ' Neutral calm facial expression, centered with generous green margin.';
  }
  if (tipo === 'cabeza_base') {
    return 'Edit the attached character bust portrait: keep the exact same head, ears, hair, fur markings, jawline, and three-quarter angle facing RIGHT, isolated on a completely flat solid chroma green background (#00FF00) with zero shadows. REMOVE the eyes, eyebrows, and mouth completely, replacing those areas seamlessly with smooth clean fur matching the face (keep the nose tip intact). Remove neck and shoulders so ONLY the clean floating head remains.';
  }
  if (tipo === 'cuerpo_base') {
    return 'Edit the attached full-body character: keep the exact same body, outfit (' + (p.vestuario_base || 'base outfit') + '), and three-quarter angle facing RIGHT on a completely flat solid chroma green background (#00FF00) with zero shadows. REMOVE the head and arms completely, cleanly closing the collar and shoulder openings with flat color and black outline for modular 2D puppet rigging.';
  }
  if (tipo.indexOf('ojos') === 0) {
    const emo = tipo === 'ojos' ? '6 expressions in a 2x3 grid (NEUTRAL, HAPPY, ANGRY, SAD, DOUBTFUL, INDIGNANT)' : ('ONLY the expression: ' + tipo.replace('ojos_', '').toUpperCase());
    return 'Using the attached character bust as strict reference, draw ONLY the eyes and eyebrows (' + emo + ') without head, ears, nose, mouth, or text, on a completely flat solid chroma green background (#00FF00) with zero shadows. Keep exact art direction (' + baseStyle + ') and three-quarter angle facing RIGHT.';
  }
  if (tipo.indexOf('boca') === 0) {
    const moc = tipo === 'bocas' ? '5 mouth variations in a neat grid (CLOSED, HALF-OPEN, WIDE OPEN, SMILE, ANNOYED)' : ('ONLY the mouth variation: ' + tipo.replace('boca_', '').toUpperCase());
    return 'Using the attached character bust as strict reference, draw ONLY the mouth/lower muzzle (' + moc + ') without eyes, ears, neck, or text, on a completely flat solid chroma green background (#00FF00) with zero shadows. Keep exact art direction (' + baseStyle + ') and three-quarter angle facing RIGHT.';
  }
  if (tipo.indexOf('brazo') === 0 || tipo.indexOf('pierna') === 0) {
    return 'Using the attached full-body character as strict reference, draw ONLY the isolated limb (' + tipo.replace(/_/g, ' ') + ') with a cleanly rounded shoulder/hip joint cap, matching exact markings and outfit sleeve/pant. Art direction: ' + baseStyle + ' Isolated on solid chroma green (#00FF00) with zero shadows for modular 2D puppet rigging.';
  }
  return 'Using the attached character (' + (p.nombre || p.id) + ') as strict visual reference, generate the custom variant "' + tipo + '". Art direction: ' + baseStyle + ' Facing three-quarters to the RIGHT, isolated on solid chroma green (#00FF00) with zero shadows.';
}

function obtenerRefParaPrompt(p, tipo) {
  const pz = (p && p.piezas) ? p.piezas : {};
  if (tipo === 'cuerpo_completo' || tipo === 'maestro_cuerpo') {
    return { label: 'Adjunta tu foto base o referencia inicial', url: (pz.maestro_cuerpo && pz.maestro_cuerpo.url) || null, archivo: (p.id || 'per') + '_maestro.png' };
  }

    const reg = (pz.maestro_perfil && pz.maestro_perfil.url) ? pz.maestro_perfil : (pz.maestro_cuerpo || null);

  }

function calcularProgresoPersonaje(p) {
  const piezas = p.piezas || {};
  let listos = 0;
  SLOTS_BASICOS_PERSONAJE.forEach(function(s) { if (piezas[s.key] && piezas[s.key].url) listos++; });
  const total = SLOTS_BASICOS_PERSONAJE.length;
  const pct = Math.round((listos / total) * 100);
  const extras = (p.variantes || []).filter(function(v) { return v.url; }).length;
  const tiene = function(k) { return Boolean(piezas[k] && piezas[k].url); };
  const tieneOjos = ['ojos_neutro','ojos_feliz','ojos_enojado','ojos_triste','ojos_duda','ojos_indignado'].some(tiene);
  const tieneHabla = tiene('boca_cerrada') && tiene('boca_media') && tiene('boca_abierta');
  let capacidad = 'Paso 1: sube Cuerpo o Busto Maestro';
  if (tiene('cabeza_base') && tieneOjos && tieneHabla && tiene('cuerpo_base') && tiene('brazo_delantero_prop')) capacidad = 'Listo para escena completa + props';
  else if (tiene('cabeza_base') && tieneOjos && tieneHabla) capacidad = 'Listo para primer plano hablando';
  else if (tiene('cabeza_base') && tieneOjos && (tiene('boca_cerrada') || tiene('boca_sonrisa'))) capacidad = 'Listo para reacción (faltan 3 bocas)';
  else if (tiene('maestro_cuerpo') || tiene('maestro_perfil')) capacidad = 'Ref. aprobada · sigue Cabeza, Ojos y Bocas';
  return { listos: listos, total: total, pct: pct, extras: extras, totalExtras: (p.variantes || []).length, capacidad: capacidad };
}

function actualizarHeaderYSubtabs() {
  const tit = document.getElementById('hdr-entidad-titulo');
  const sub = document.getElementById('hdr-entidad-sub');
  const btnQ = document.getElementById('btn-quick-hdr');
  const strip = document.getElementById('subtab-strip');

  if (catActiva === 'personajes') {
    const p = obtenerPersonajeActual();
    if (!p) { tit.textContent = 'Personajes'; sub.textContent = 'Crea tu primer personaje'; strip.innerHTML = ''; btnQ.textContent = '+ Personaje'; return; }
    const pr = calcularProgresoPersonaje(p);
    tit.textContent = p.nombre + ' · ' + pr.pct + '% (' + pr.listos + '/' + pr.total + ')';
    sub.textContent = pr.capacidad;
    btnQ.textContent = subTabPersonaje === 'variantes' ? '+ Variante' : '+ Personaje';
    const cnt = function(g) {
      const it = SLOTS_BASICOS_PERSONAJE.filter(function(s) { return s.grupo === g; });

      return ok + '/' + it.length;

      '<button type="button" class="sub-pill' + (subTabPersonaje === 'extremidades' ? ' activo' : '') + '" onclick="window.setSubTabPersonaje(\'extremidades\')">Brazos ' + cnt('extremidades') + '</button>' +

  } else if (catActiva === 'escenarios') {
    const e = biblioteca.escenarios.find(function(x) { return x.id === selId.escenarios; }) || biblioteca.escenarios[0];
    tit.textContent = e ? (e.id + ' · ' + e.nombre) : 'Escenarios';
    sub.textContent = e ? ((e.zonas || []).length + ' zona(s) · 1920×1920') : 'Sin escenarios';
    btnQ.textContent = '+ Sub-Zona';
    strip.classList.add('hidden');
  } else if (catActiva === 'props') {
    tit.textContent = 'Props, FX y Audio';
    sub.textContent = (biblioteca.props || []).length + ' elementos · Desliza tarjetas ↔';
    btnQ.textContent = '+ Añadir';
    strip.classList.remove('hidden');

      '<button type="button" class="sub-pill' + (filtroPropsCat === 'todos' ? ' activo' : '') + '" onclick="window.setFiltroProps(\'todos\')">Todos (' + (biblioteca.props || []).length + ')</button>' +
      '<button type="button" class="sub-pill' + (filtroPropsCat === 'prop' ? ' activo' : '') + '" onclick="window.setFiltroProps(\'prop\')">Props PNG</button>' +
      '<button type="button" class="sub-pill' + (filtroPropsCat === 'fx' ? ' activo' : '') + '" onclick="window.setFiltroProps(\'fx\')">Íconos FX</button>' +
      '<button type="button" class="sub-pill' + (filtroPropsCat === 'audio' ? ' activo' : '') + '" onclick="window.setFiltroProps(\'audio\')">Audio & Fuentes</button>';
  } else if (catActiva === 'guiones') {
    const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }) || biblioteca.guiones[0];

function ajustarTamanoCanvasSandwich() {
  const cv = document.getElementById('canvas-sandwich');
  const stage = document.getElementById('sw-stage-wrap');
  if (!cv || !stage) return;
  const maxW = Math.max(80, stage.clientWidth - 16);
  const maxH = Math.max(100, stage.clientHeight - 44);
  const ratio = Math.min(maxW / 1000, maxH / 1600);
  cv.style.width = Math.max(50, Math.floor(1000 * ratio)) + 'px';
  cv.style.height = Math.max(80, Math.floor(1600 * ratio)) + 'px';
}
window.addEventListener('resize', ajustarTamanoCanvasSandwich);

window.iniciarSubidaSlotPersonaje = function(slotKey, esVariante) {
  const p = obtenerPersonajeActual();

    ? (p.variantes || []).find(function(v) { return v.id === slotKey; })
    : SLOTS_BASICOS_PERSONAJE.find(function(s) { return s.key === slotKey; });
  if (!spec) return;
  slotUploadPendiente = {
    tipo: 'personaje', entidadId: p.id, slotKey: slotKey, esVariante: Boolean(esVariante),
    presetId: spec.preset || 'per_cuerpo', archivoNombre: spec.archivo || slotKey,
    etiqueta: p.nombre + ' · ' + (spec.titulo || slotKey),
    calcoUrl: obtenerCalcoInteligente(p, slotKey), pivotesIniciales: parsearPivotesPersonaje(p)
  };
  const inp = document.getElementById('input-file-slot');
  inp.accept = 'image/*';
  inp.click();
};

window.abrirEstudioVacioParaSlot = function(slotKey, esVariante) {
  const p = obtenerPersonajeActual();
  if (!p) return;
  const spec = SLOTS_BASICOS_PERSONAJE.find(function(s) { return s.key === slotKey; });
  if (!spec) return;
  if (window.self === window.top) { toast('Abre este módulo desde piro-shell.html.', 'info'); return; }
  window.parent.postMessage({
    tipo: 'PIRO_IR_A_ESTUDIO', origen: 'contenido', etiqueta: p.nombre + ' · ' + spec.titulo,
    presetId: spec.preset, entidadId: p.id, archivoNombre: spec.archivo,
    calcoUrl: obtenerCalcoInteligente(p, slotKey), pivotesIniciales: parsearPivotesPersonaje(p),
    slotMeta: { tipo: 'personaje', entidadId: p.id, slotKey: slotKey, esVariante: Boolean(esVariante) }
  }, '*');
};

window.manejarArchivoSlotSeleccionado = async function(file) {
  if (!file || !slotUploadPendiente) return;
  const meta = slotUploadPendiente;
  slotUploadPendiente = null;
  if (window.self !== window.top && String(file.type || '').indexOf('image/') === 0 && meta.usarEstudio !== false) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      window.parent.postMessage({
        tipo: 'PIRO_IR_A_ESTUDIO', origen: 'contenido', etiqueta: meta.etiqueta,
        presetId: meta.presetId, entidadId: meta.entidadId, zonaId: meta.zonaId || 'zona_01',
        archivoNombre: meta.archivoNombre, dataUrl: ev.target.result,
        calcoUrl: meta.calcoUrl || null, pivotesIniciales: meta.pivotesIniciales || null, slotMeta: meta
      }, '*');
    };
    reader.readAsDataURL(file);
    return;
  }
  await subirYAsignarArchivoASlot(file, meta, null, false);
};

function parsearPivotesPersonaje(p) {
  if (!p || !p.pivotes_json) return null;
  try { const o = JSON.parse(p.pivotes_json); return (o && typeof o === 'object') ? o : null; } catch (e) { return null; }
}

function obtenerCalcoInteligente(p, slotKey) {
  if (!p || !p.piezas) return null;
  if (String(slotKey || '').indexOf('ojos_') === 0 || String(slotKey || '').indexOf('boca_') === 0) {
    return (p.piezas.cabeza_base && p.piezas.cabeza_base.url) || (p.piezas.maestro_perfil && p.piezas.maestro_perfil.url) || (p.piezas.maestro_cuerpo && p.piezas.maestro_cuerpo.url) || null;
  }
  return (p.piezas.maestro_cuerpo && p.piezas.maestro_cuerpo.url) || null;
}

window.dibujarProbadorSandwich = async function() {
  const canvas = document.getElementById('canvas-sandwich'), p = obtenerPersonajeActual();
  if (!canvas || !p) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 1000, 1600);
  let propImg = null;
  if (sandwichCfg.prop) {
    const prObj = (biblioteca.props || []).find(function(x) { return x.id === sandwichCfg.prop; });
    if (prObj && prObj.archivo && prObj.archivo.url) propImg = await cargarImagenPiro(prObj.archivo.url);
  }
  const n = await dibujarMarionetaPiro(ctx, p, {
    modoLienzoCompleto: true, ojos: sandwichCfg.ojos, boca: sandwichCfg.boca,
    brazoDel: sandwichCfg.brazoDel, rotCab: sandwichCfg.rotCab, rotBrazo: sandwichCfg.rotBrazo,
    piernas: sandwichCfg.piernas, propImg: propImg, mostrarGuias: true
  });
  const est = document.getElementById('sandwich-estado-txt');
  if (est) est.textContent = n > 0 ? ('Capas: ' + n + ' · Motor OK') : 'Sube piezas en Base/Ojos/Bocas';
};

function aplicarRegistroEnSlot(meta, registro, pivotesRecibidos) {
  if (meta.tipo === 'personaje') {
    const p = biblioteca.personajes.find(function(x) { return x.id === meta.entidadId; });
    if (p) {
      if (meta.esVariante) { const v = (p.variantes || []).find(function(x) { return x.id === meta.slotKey; }); if (v) Object.assign(v, registro); }
      else { if (!p.piezas) p.piezas = {}; p.piezas[meta.slotKey] = registro; }
      if (pivotesRecibidos && typeof pivotesRecibidos === 'object' && Object.keys(pivotesRecibidos).some(function(k) { return Boolean(pivotesRecibidos[k]); })) {
        p.pivotes_json = JSON.stringify(pivotesRecibidos, null, 2);
      }
    }
  } else if (meta.tipo === 'voz') {
    const p = biblioteca.personajes.find(function(x) { return x.id === meta.entidadId; }); if (p) p.muestra_voz = registro;
  } else if (meta.tipo === 'escenario') {
    const e = biblioteca.escenarios.find(function(x) { return x.id === meta.entidadId; });
    const z = e ? (e.zonas || []).find(function(x) { return x.id === meta.zonaId; }) : null; if (z) z[meta.campoZona] = registro;
  } else if (meta.tipo === 'prop') {
    const pr = biblioteca.props.find(function(x) { return x.id === meta.entidadId; }); if (pr) pr.archivo = registro;
  }
}

async function subirYAsignarArchivoASlot(fileObj, meta, pivotesRecibidos, desdeEstudio) {
  if (!GeokatuDB.PirobonianosService) { toast('Falta PirobonianosService en core-db.js.', 'error'); return false; }
  setSyncBadge('Subiendo...', 'warn');
  const ruta = meta.tipo + '/' + meta.entidadId + '/' + (meta.zonaId ? (meta.zonaId + '/') : '') + Date.now() + '_' + String(fileObj.name || 'activo.png').replace(/[^a-zA-Z0-9._-]+/g, '_');
  const res = await GeokatuDB.PirobonianosService.subirActivoPirobonianos(getStorageDir(), ruta, fileObj);
  if (!res.success) {
    toast('Error subiendo archivo. Tu borrador sigue guardado en Estudio PNG.', 'error');
    setSyncBadge('Error', 'warn');
    return false;
  }
  const registro = { url: res.url, rutaStorage: res.rutaStorage, nombre: fileObj.name, tipo: res.tipo, fecha: res.fecha };
  aplicarRegistroEnSlot(meta, registro, pivotesRecibidos);
  const gRes = await guardarBiblioteca(true);
  renderizarTodo();
  if (window.self !== window.top && meta.tipo !== 'voz') {
    window.parent.postMessage({ tipo: 'PIRO_SLOT_COMPLETADO', slotMeta: meta }, '*');
    if (desdeEstudio) window.parent.postMessage({ tipo: 'PIRO_PNG_GUARDADO_OK' }, '*');
  }
  toast(gRes && gRes.offline ? 'Activo subido y guardado localmente.' : 'Activo guardado y confirmado en la nube.', 'exito');
  return true;
}

window.enviarFaltantesATickets = async function() {

function renderizarVistaEscenarios() {
  const ws = document.getElementById('workspace-stage');
  const e = biblioteca.escenarios.find(function(x) { return x.id === selId.escenarios; }) || biblioteca.escenarios[0];
  if (!e) { ws.innerHTML = '<div style="margin:auto; color:var(--muted);">Crea tu primer escenario desde el botón ▶.</div>'; return; }
  selId.escenarios = e.id;
  let slides = '';
  (e.zonas || []).forEach(function(z) {
    ['fondo', 'frente'].forEach(function(campo) {
      const reg = z[campo];
      const tit = z.nombre + ' · ' + (campo === 'fondo' ? 'Fondo Base' : 'Capa Frontal');
      const preview = reg && reg.url
        ? '<span class="slot-tag-ok">Listo</span><img src="' + esc(reg.url) + '">'
        : '<div class="slot-empty-label">PNG 1920×1920<br><b>' + campo + '.png</b></div>';
      slides +=
        '<div class="slide-card' + (reg && reg.url ? ' listo' : '') + '">' +
          '<div class="slide-preview checker-bg"><span class="slot-tag-dim">1920×1920</span>' + preview + '</div>' +
          '<div style="flex-shrink:0;"><div style="font-size:13px; font-weight:900;">' + esc(tit) + '</div><div style="font-size:10.5px; color:var(--muted);">' + esc(e.id + '/' + z.id + '/' + campo + '.png') + '</div></div>' +
          '<div class="slot-actions">' +
            '<button type="button" class="btn btn-xs btn-primary" onclick="window.subirSlotEscenario(\'' + esc(z.id) + '\',\'' + campo + '\')">Subir / Estudio</button>' +
            '<button type="button" class="btn btn-xs btn-blue" onclick="window.ticketSlotEscenario(\'' + esc(z.id) + '\',\'' + campo + '\')">+ Ticket</button>' +
          '</div>' +
        '</div>';
    });
  });

  ws.innerHTML =

    : g.escenas.map(function(sc, idx) {

window.agregarEscenaGuion = function() {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g) return;
  if (!Array.isArray(g.escenas)) g.escenas = [];
  const act = (g.reparto && g.reparto[0]) || (biblioteca.personajes[0] ? biblioteca.personajes[0].id : 'per_001');
  g.escenas.push({ actor: act, ojos: 'neutro', camara: 'centro', prop: '', sfx: '', texto: '' });
  guardarBiblioteca(true); renderizarTodo();
};
window.editarEscenaGuion = function(idx, c, v) { const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g || !g.escenas || !g.escenas[idx]) return; g.escenas[idx][c] = v; guardarBiblioteca(false); };
window.moverEscenaGuion = function(idx, d) { const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g || !g.escenas) return; const t = idx + d; if (t < 0 || t >= g.escenas.length) return; const tmp = g.escenas[idx]; g.escenas[idx] = g.escenas[t]; g.escenas[t] = tmp; guardarBiblioteca(true); renderizarTodo(); };
window.eliminarEscenaGuion = function(idx) { const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g || !g.escenas) return; g.escenas.splice(idx, 1); guardarBiblioteca(true); renderizarTodo(); };
window.copiarPromptDirectorEscenas = function() {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g) return;
  const act = biblioteca.personajes.map(function(p) { return p.id + ' (' + p.nombre + ')'; }).join(', ');
  const pr = (biblioteca.props || []).filter(function(x) { return x.categoria !== 'audio'; }).map(function(x) { return x.id; }).join(', ');
  const sfx = (biblioteca.props || []).filter(function(x) { return x.categoria === 'audio'; }).map(function(x) { return x.id; }).join(', ');
  const txt = 'Convierte esta anécdota colombiana en un guion ágil de 35-45s para YouTube Shorts. Devuelve SOLO un array JSON válido sin markdown con objetos: {"actor":"per_001","ojos":"neutro|feliz|enojado|triste|duda|indignado","camara":"centro|izq|der|zoom_actor|plano_general","prop":"","sfx":"","texto":"diálogo corto"}.\nActores: ' + act + '\nProps: ' + (pr || 'ninguno') + '\nSFX: ' + (sfx || 'ninguno') + '\nAnécdota: ' + (g.anecdota || g.titulo);
  navigator.clipboard.writeText(txt).then(function() { toast('Prompt IA -> JSON copiado.', 'exito'); });
};
window.editarCampoGuion = function(campo, val) {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g) return;
  g[campo] = val;
  if (campo === 'titulo') actualizarHeaderYSubtabs();
  guardarBiblioteca(false);
};
window.toggleActorGuion = function(perId) {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g) return;
  if (!g.reparto) g.reparto = [];
  const idx = g.reparto.indexOf(perId);
  if (idx >= 0) g.reparto.splice(idx, 1); else g.reparto.push(perId);
  guardarBiblioteca(true); renderizarVistaGuiones();
};
window.abrirGuionEnEditor = function() {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g) return;
  if (window.self !== window.top) window.parent.postMessage({ tipo: 'PIRO_ABRIR_EDITOR_GUION', episodioId: g.id }, '*');
  else toast('Abre piro-shell.html para saltar al Editor.', 'info');
};
window.enviarGuionATickets = function() {

    const p = obtenerPersonajeActual();
    if (p) {
      p.variantes.push({ id: 'var_' + Date.now(), titulo: document.getElementById('mc-nom').value.trim(), archivo: cleanId(document.getElementById('mc-arch').value, 'var_' + Date.now()), preset: document.getElementById('mc-preset').value, nota: document.getElementById('mc-nota').value.trim(), url: null });
      subTabPersonaje = 'variantes';
    }
  } else if (tipoModalCrear === 'escenario') {
    const id = cleanId(document.getElementById('mc-id').value, 'esc_' + Date.now());
    biblioteca.escenarios.push({ id: id, nombre: document.getElementById('mc-nom').value.trim(), iluminacion: '', zonas: [{ id: 'zona_01', nombre: document.getElementById('mc-zona').value.trim(), fondo: null, frente: null }] });
    catActiva = 'escenarios'; selId.escenarios = id;
  } else if (tipoModalCrear === 'zona') {
    const e = biblioteca.escenarios.find(function(x) { return x.id === selId.escenarios; });
    if (e) e.zonas.push({ id: 'zona_' + String((e.zonas || []).length + 1).padStart(2, '0'), nombre: document.getElementById('mc-nom').value.trim(), fondo: null, frente: null });
  } else if (tipoModalCrear === 'prop') {
    const cat = document.getElementById('mc-cat').value, nom = document.getElementById('mc-nom').value.trim();
    const pref = cat === 'fx' ? 'fx_' : (cat === 'audio' ? 'sfx_' : 'prop_');
    biblioteca.props.push({ id: pref + cleanId(nom, String(Date.now()).slice(-4)), nombre: nom, categoria: cat, archivo: null });
    catActiva = 'props';
  } else if (tipoModalCrear === 'guion') {
    const id = cleanId(document.getElementById('mc-id').value, 'ep_' + Date.now());
    biblioteca.guiones.push({ id: id, titulo: document.getElementById('mc-nom').value.trim(), escenario_id: biblioteca.escenarios[0] ? biblioteca.escenarios[0].id : '', reparto: [], estado: 'Borrador', anecdota: '', escenas: [] });
    catActiva = 'guiones'; selId.guiones = id;
  } else if (tipoModalCrear === 'importar_escenas') {
    const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g) return;
    try {
      const raw = document.getElementById('mc-json-esc').value.trim().replace(/^```json\s*/i, '').replace(/```$/, '').trim();
      const arr = JSON.parse(raw); if (!Array.isArray(arr)) throw new Error('Debe ser un array JSON');
      g.escenas = arr.map(function(i) { return { actor: String(i.actor || 'per_001'), ojos: String(i.ojos || 'neutro'), camara: String(i.camara || 'centro'), prop: String(i.prop || ''), sfx: String(i.sfx || ''), texto: String(i.texto || '') }; });
      catActiva = 'guiones'; subGuionPanel = 'escenas';
    } catch (err) { toast('JSON inválido: ' + err.message, 'error'); return; }
  }
  window.cerrarModalC('modal-crear-entidad');
  guardarBiblioteca(true);
  renderizarTodo();
  toast('Cambios guardados.', 'exito');
};

window.exportarManifiestoTermux = function() {
  const descargas = [];
  const addDl = function(r, reg) { if (reg && reg.url) descargas.push({ ruta_local: r, url: reg.url, tipo: reg.tipo || 'application/octet-stream' }); };
  const rutaSlot = function(pid, s) {
    const sub = s.preset === 'per_ref' ? 'referencia/' : (s.preset === 'per_cabeza' ? 'piezas/cabeza/' : (s.preset === 'per_ojos' ? 'piezas/ojos/' : (s.preset === 'per_boca' ? 'piezas/bocas/' : (s.preset === 'per_brazo' ? 'piezas/brazos/' : 'piezas/cuerpo/'))));
    return 'biblioteca/personajes/' + pid + '/' + sub + s.archivo + '.png';
  };
  const perOut = (biblioteca.personajes || []).map(function(p) {
    const pz = {}, vr = {};
    SLOTS_BASICOS_PERSONAJE.forEach(function(s) { const reg = p.piezas && p.piezas[s.key]; if (reg && reg.url) { const r = rutaSlot(p.id, s); pz[s.key] = r; addDl(r, reg); } });
    (p.variantes || []).forEach(function(v) { if (v && v.url) { const r = 'biblioteca/personajes/' + p.id + '/piezas/variantes/' + (v.archivo || v.id) + '.png'; vr[v.archivo || v.id] = r; addDl(r, v); } });
    if (p.muestra_voz && p.muestra_voz.url) addDl('biblioteca/personajes/' + p.id + '/referencia/muestra_voz.mp3', p.muestra_voz);
    return { id: p.id, nombre: p.nombre, raza: p.raza, voice_id: p.voice_id || '', pivotes: parsearPivotesPersonaje(p), piezas: pz, variantes: vr };
  });
  const escOut = (biblioteca.escenarios || []).map(function(e) {
    return { id: e.id, nombre: e.nombre, iluminacion: e.iluminacion || '', zonas: (e.zonas || []).map(function(z) {
      const o = { id: z.id, nombre: z.nombre, puntos_camara: z.puntos_camara || '' };
      if (z.fondo && z.fondo.url) { o.fondo = 'biblioteca/escenarios/' + e.id + '/zonas/' + z.id + '/fondo.png'; addDl(o.fondo, z.fondo); }
      if (z.frente && z.frente.url) { o.frente = 'biblioteca/escenarios/' + e.id + '/zonas/' + z.id + '/frente.png'; addDl(o.frente, z.frente); }
      return o;
    }) };
  });
  const propsOut = {};
  (biblioteca.props || []).forEach(function(pr) {
    if (pr.archivo && pr.archivo.url) {
      const ext = pr.categoria === 'audio' ? (String(pr.archivo.nombre || '').toLowerCase().indexOf('.ttf') >= 0 ? '.ttf' : '.mp3') : '.png';
      const dir = pr.categoria === 'audio' ? (ext === '.ttf' ? 'biblioteca/fuentes/' : 'biblioteca/audio/sfx/') : 'biblioteca/props/';
      const r = dir + pr.id + ext; propsOut[pr.id] = r; addDl(r, pr.archivo);
    }
  });
  const man = { proyecto: proyectoActivo.id, generado_en: new Date().toISOString(), total_archivos: descargas.length, descargas: descargas, catalogo: { personajes: perOut, escenarios: escOut, props: propsOut, guiones: biblioteca.guiones || [] } };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(man, null, 2)], { type: 'application/json' })); a.download = 'catalogo_sync.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  toast('Manifiesto catalogo_sync.json exportado (' + descargas.length + ' activos).', 'exito');
};

window.addEventListener('message', async function(e) {
  if (!e.data || !e.data.tipo) return;
  if (e.data.tipo === 'PIRO_SHELL_CAMBIAR_PROYECTO' && e.data.proyecto) {
    proyectoActivo = Object.assign(proyectoActivo, e.data.proyecto);
    proyectoActivo.docBibId = normalizarDocBibId(proyectoActivo.docBibId, proyectoActivo.id);
    selId = { personajes: null, escenarios: null, guiones: null };
    cargarBiblioteca();
  } else if (e.data.tipo === 'PIRO_SHELL_AUTH' || e.data.tipo === 'PIRO_BIBLIOTECA_ACTUALIZADA') {
    if (e.data.proyecto) {
      proyectoActivo = Object.assign(proyectoActivo, e.data.proyecto);
      proyectoActivo.docBibId = normalizarDocBibId(proyectoActivo.docBibId, proyectoActivo.id);
    }
    cargarBiblioteca();
  } else if (e.data.tipo === 'PIRO_SHELL_ABRIR_CREAR') {
    if (e.data.entidad === 'personaje') window.cambiarCategoria('personajes');
    else if (e.data.entidad === 'escenario') window.cambiarCategoria('escenarios');
    else if (e.data.entidad === 'guion') window.cambiarCategoria('guiones');
    window.abrirModalCrear(e.data.entidad);
  } else if (e.data.tipo === 'PIRO_PNG_RECIBIDO' && e.data.blob && e.data.slotMeta) {
    const fileObj = new File([e.data.blob], e.data.nombreArchivo || 'pieza.png', { type: 'image/png' });
    await subirYAsignarArchivoASlot(fileObj, e.data.slotMeta, e.data.pivotes || null, true);
  } else if (e.data.tipo === 'PIRO_SHELL_VINCULAR_ASSET_TICKET' && e.data.slotMeta && e.data.registro) {
    aplicarRegistroEnSlot(e.data.slotMeta, e.data.registro, e.data.pivotes || null);
    await guardarBiblioteca(true); renderizarTodo();
    toast('Pieza vinculada automáticamente desde Tickets.', 'exito');
  }
});

function guardarEstadoUICont() {
  try {
    localStorage.setItem('piro_cont_ui_' + proyectoActivo.id, JSON.stringify({
      catActiva: catActiva, selId: selId, subTabPersonaje: subTabPersonaje
    }));
  } catch (e) {}
}
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') {
    guardarEstadoUICont();
    if (hayCambiosPendientes && biblioteca && Array.isArray(biblioteca.personajes) && biblioteca.personajes.length > 0) guardarBiblioteca(true);
  }
});
window.addEventListener('pagehide', function() {
  guardarEstadoUICont();
  if (hayCambiosPendientes && biblioteca && Array.isArray(biblioteca.personajes) && biblioteca.personajes.length > 0) guardarBiblioteca(true);
});

GeokatuDB.SecurityService.observarEstadoSesion(function(user) {
  if (user) cargarBiblioteca();
});
