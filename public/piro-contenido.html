<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GEOKATU Studio · Contenido y Marionetas Piro-Rig</title>
<style>
  :root {
    --bg: #080a0f;
    --panel: rgba(17, 21, 29, 0.88);
    --panel-2: rgba(24, 29, 40, 0.92);
    --border: rgba(255, 255, 255, 0.10);
    --border-hi: rgba(255, 255, 255, 0.20);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --naranja: #ff6b00;
    --miel: #ffb300;
    --verde: #22c55e;
    --azul: #38bdf8;
    --rojo: #ef4444;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
    overflow: hidden; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 13.5px; line-height: 1.4;
  }
  button, input, textarea, select { font-family: inherit; color: var(--text); }
  .svg-ico {
    width: 15px; height: 15px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
  }

  /* ESTRUCTURA DE UNA SOLA VENTANA SIN SCROLL EXTERNO */
  .app-shell {
    display: flex; flex-direction: column; width: 100%; height: 100%; height: 100dvh; overflow: hidden;
  }

  .top-nav {
    flex-shrink: 0;
    background: rgba(12, 15, 22, 0.96);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .seg-tabs {
    display: flex; gap: 4px; background: rgba(0, 0, 0, 0.45);
    padding: 3px; border-radius: 11px; border: 1px solid var(--border);
    overflow-x: auto; max-width: 100%;
  }
  .seg-tab {
    border: none; background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 800;
    cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
    transition: background .15s, color .15s;
  }
  .seg-tab.activo { background: var(--naranja); color: #fff; }
  .sync-pill {
    font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 99px;
    border: 1px solid var(--border); background: rgba(255, 255, 255, 0.05); color: var(--muted);
  }
  .sync-pill.ok { color: #86efac; border-color: rgba(34, 197, 94, 0.45); background: rgba(34, 197, 94, 0.12); }
  .sync-pill.warn { color: #fcd34d; border-color: rgba(245, 158, 11, 0.45); background: rgba(245, 158, 11, 0.12); }

  /* BARRA DE SELECTOR DE ENTIDAD (PERSONAJES / ESCENARIOS / GUIONES) */
  .entity-rail {
    flex-shrink: 0;
    background: rgba(15, 19, 27, 0.88);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex; align-items: center; gap: 7px; overflow-x: auto;
  }
  .entity-pill {
    flex: 0 0 auto;
    padding: 6px 11px; border-radius: 10px; border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04); color: #cbd5e1;
    font-size: 12px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .entity-pill.activo {
    border-color: var(--naranja); background: rgba(255, 107, 0, 0.16); color: #fff;
  }
  .entity-pill .pct-mini {
    font-family: monospace; font-size: 10.5px; padding: 1px 5px; border-radius: 6px;
    background: rgba(0, 0, 0, 0.45); color: var(--miel);
  }
  .entity-pill .pct-mini.full { background: rgba(34, 197, 94, 0.25); color: #86efac; }
  .btn-add-pill {
    flex: 0 0 auto; padding: 6px 11px; border-radius: 10px;
    border: 1px dashed rgba(255, 107, 0, 0.6); background: rgba(255, 107, 0, 0.10);
    color: var(--miel); font-size: 12px; font-weight: 800; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }

  /* ÁREA DE TRABAJO INTERNA CON SCROLL CONTROLADO */
  .workspace-body {
    flex: 1; min-height: 0; overflow-y: auto; padding: 12px;
    max-width: 1240px; width: 100%; margin: 0 auto;
  }

  /* BARRA DE PROGRESO Y SUB-TABS DE MARIONETA */
  .char-header-bar {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 11px 14px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .prog-track {
    width: 150px; height: 8px; border-radius: 99px;
    background: rgba(255, 255, 255, 0.08); overflow: hidden;
  }
  .prog-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--naranja), var(--verde));
    transition: width 0.25s ease;
  }
  .badge-100 {
    padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 800;
    background: rgba(34, 197, 94, 0.18); border: 1px solid rgba(34, 197, 94, 0.55); color: #86efac;
  }

  .sub-tabs {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px;
  }
  .sub-tab {
    flex: 0 0 auto; padding: 6px 11px; border-radius: 9px;
    border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04);
    color: var(--muted); font-size: 11.5px; font-weight: 800; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .sub-tab.activo {
    border-color: var(--azul); background: rgba(56, 189, 248, 0.15); color: #e0f2fe;
  }

  /* BOTONES */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 7px 11px; border-radius: 9px; border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05); font-size: 11.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: background .12s, transform .08s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.10); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, var(--naranja), #ea580c); border-color: var(--naranja); color: #fff; }
  .btn-green { background: rgba(34, 197, 94, 0.18); border-color: rgba(34, 197, 94, 0.45); color: #86efac; }
  .btn-blue { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.45); color: var(--azul); }
  .btn-danger { background: rgba(239, 68, 68, 0.14); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
  .btn-xs { padding: 4px 8px; font-size: 10.5px; border-radius: 7px; }

  /* GRID VISUAL DE SLOTS (PLANTILLA DE PIEZAS) */
  .slots-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px;
  }
  .slot-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 13px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .slot-card.listo { border-color: rgba(34, 197, 94, 0.42); }
  .slot-preview {
    height: 118px; border-radius: 9px; border: 1px dashed rgba(255, 255, 255, 0.14);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    position: relative;
    background-color: #151a22;
    background-image:
      linear-gradient(45deg, #212834 25%, transparent 25%),
      linear-gradient(-45deg, #212834 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #212834 75%),
      linear-gradient(-45deg, transparent 75%, #212834 75%);
    background-size: 14px 14px;
    background-position: 0 0, 0 7px, 7px -7px, -7px 0;
  }
  .slot-preview img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .slot-empty-label {
    text-align: center; padding: 8px; color: var(--muted); font-size: 11px;
    background: rgba(8, 10, 15, 0.72); border-radius: 8px;
  }
  .slot-tag-dim {
    position: absolute; top: 5px; right: 5px; font-family: monospace; font-size: 9.5px;
    padding: 2px 5px; border-radius: 5px; background: rgba(0, 0, 0, 0.75); color: var(--azul);
  }
  .slot-tag-ok {
    position: absolute; top: 5px; left: 5px; font-size: 9.5px; font-weight: 800;
    padding: 2px 6px; border-radius: 5px; background: rgba(34, 197, 94, 0.85); color: #052e16;
  }
  .slot-title { font-size: 12.5px; font-weight: 800; color: #fff; }
  .slot-sub { font-size: 10.5px; color: var(--muted); font-family: monospace; word-break: break-all; }
  .slot-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

  /* FICHA DE DIRECTOR DE ARTE Y GENERADOR DE PROMPTS */
  .art-grid {
    display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; align-items: start;
  }
  @media (max-width: 820px) { .art-grid { grid-template-columns: 1fr; } }
  .card-box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 13px;
  }
  .field { margin-bottom: 9px; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
  .inp, .txt, .sel {
    width: 100%; padding: 8px 10px; border-radius: 9px;
    border: 1px solid var(--border); background: rgba(5, 8, 13, 0.75);
    font-size: 12.5px; outline: none;
  }
  .inp:focus, .txt:focus, .sel:focus { border-color: var(--naranja); }
  .txt { min-height: 62px; resize: vertical; }
  .prompt-out {
    width: 100%; min-height: 185px; padding: 10px; border-radius: 10px;
    border: 1px solid rgba(56, 189, 248, 0.35); background: #05070b;
    color: #86efac; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11.5px; line-height: 1.48; resize: vertical; outline: none;
  }

  /* MODALES GLASSMORPHIC */
  .modal-ov {
    position: fixed; inset: 0; z-index: 80000;
    background: rgba(4, 6, 10, 0.84); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 14px;
  }
  .modal-ov.open { display: flex; }
  .modal-card {
    width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
    background: linear-gradient(150deg, rgba(22, 27, 38, 0.98), rgba(11, 14, 20, 0.99));
    border: 1px solid var(--border-hi); border-radius: 16px; padding: 16px;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .modal-head h3 { margin: 0; font-size: 14px; font-weight: 800; }

  .hidden { display: none !important; }

  #toasts-cont {
    position: fixed; bottom: 14px; right: 14px; z-index: 95000;
    display: flex; flex-direction: column; gap: 6px; max-width: 90vw;
  }
  .toast-c {
    padding: 9px 13px; border-radius: 10px; font-size: 12px; font-weight: 700;
    background: rgba(15, 19, 28, 0.97); border: 1px solid var(--border);
  }
  .toast-c.exito { border-color: rgba(34, 197, 94, 0.55); color: #86efac; }
  .toast-c.error { border-color: rgba(239, 68, 68, 0.55); color: #fca5a5; }
  .toast-c.info { border-color: rgba(56, 189, 248, 0.55); color: #7dd3fc; }
</style>
</head>
<body>

<div class="app-shell">
  <!-- BARRA SUPERIOR DE CATEGORÍAS -->
  <header class="top-nav">
    <div class="seg-tabs">
      <button type="button" class="seg-tab activo" data-cat="personajes" onclick="window.cambiarCategoria('personajes')">
        <svg class="svg-ico" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

      </button>

        Props &amp; Audio
      </button>
      <button type="button" class="seg-tab" data-cat="guiones" onclick="window.cambiarCategoria('guiones')">

            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">

  <!-- RIEL DE ENTIDADES DE LA CATEGORÍA -->
  <div class="entity-rail" id="entity-rail"></div>

  <!-- ÁREA DE TRABAJO INTERNA -->

</div>

<!-- INPUT OCULTO PARA SUBIR IMAGEN/AUDIO -->
<input type="file" id="input-file-slot" class="hidden" onchange="window.manejarArchivoSlotSeleccionado(this.files[0]); this.value='';">

<!-- MODAL CREAR NUEVA ENTIDAD (PERSONAJE / ESCENARIO / PROP / GUION / VARIANTE) -->
<div class="modal-ov" id="modal-crear-entidad" onclick="if(event.target.id==='modal-crear-entidad') window.cerrarModalC('modal-crear-entidad')">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modal-crear-titulo">Crear Nuevo</h3>
      <button type="button" class="btn btn-xs" onclick="window.cerrarModalC('modal-crear-entidad')">Cerrar</button>
    </div>
    <form id="form-crear-entidad" onsubmit="event.preventDefault(); window.confirmarCrearEntidad();"></form>
  </div>
</div>

<!-- MODAL CONFIRMACIÓN -->
<div class="modal-ov" id="modal-conf-c" style="z-index:92000;">
  <div class="modal-card" style="max-width:370px;">
    <h3 id="conf-c-tit" style="margin:0 0 8px 0; font-size:14px;">Confirmar</h3>
    <p id="conf-c-msg" style="margin:0 0 14px 0; font-size:12px; color:var(--muted);"></p>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button type="button" class="btn" id="conf-c-no">Cancelar</button>
      <button type="button" class="btn btn-primary" id="conf-c-si">Confirmar</button>
    </div>
  </div>
</div>

<div id="toasts-cont"></div>

<script type="module">
import GeokatuDB from './core-db.js';

const CLAVE_PROY_ACTIVO = 'piro_proyecto_activo_v1';
let proyectoActivo = {
  id: 'pirobonianos', nombre: 'Pirobonianos', docBibId: '__biblioteca_maestra__',
  storageDir: 'biblioteca_contenido', plantilla: 'piro_rig', bilingue: false,
  tipo_personaje: 'Anthropomorphic dog',
  estilo_visual: 'A 2D cartoon animation character, BoJack Horseman style, clean black ink outlines, flat vibrant colors.'
};
try {
  const rawP = localStorage.getItem(CLAVE_PROY_ACTIVO);
  if (rawP) { const parsed = JSON.parse(rawP); if (parsed && parsed.docBibId) proyectoActivo = Object.assign(proyectoActivo, parsed); }
} catch (e) {}
function getDocBibId() { return proyectoActivo.docBibId || '__biblioteca_maestra__'; }
function getLocalBibKey() { return proyectoActivo.id === 'pirobonianos' ? 'piro_biblioteca_maestra_v1' : ('piro_bib_' + proyectoActivo.id + '_v1'); }
function getStorageDir() { return proyectoActivo.storageDir || 'biblioteca_contenido'; }
function actualizarBadgeProy() { const b = document.getElementById('badge-proy-cont'); if (b) b.textContent = proyectoActivo.nombre || 'Pirobonianos'; }

function crearSemillaPorProyecto() {
  if (proyectoActivo.id === 'pirobonianos') return crearBibliotecaSemilla();
  if (proyectoActivo.id === 'cruzando_la_frontera' || proyectoActivo.plantilla === 'scifi_hibrido') {
    const baseCast = [
      ['NARRADOR', 'Narrador', 'Voz en off documental', 'en-US-BrianNeural', 'es-MX-JorgeNeural'],
      ['DANIEL_CHEN', 'Daniel Chen', 'Ingeniero protagonista', 'en-US-ChristopherNeural', 'es-CO-GonzaloNeural'],
      ['DARIO_KELLER', 'Darío Keller', 'Analista técnico', 'en-US-GuyNeural', 'es-ES-AlvaroNeural'],
      ['MAGNUS_STERLING', 'Magnus Sterling', 'Ejecutivo corporativo', 'en-US-EricNeural', 'es-AR-TomasNeural'],
      ['JULIAN_VANCE', 'Julian Vance', 'Estratega', 'en-US-RogerNeural', 'es-CL-LorenzoNeural'],
      ['ELENA_ROSTOVA', 'Elena Rostova', 'Científica', 'en-US-JennyNeural', 'es-ES-ElviraNeural'],
      ['ARIS_THORNE', 'Aris Thorne', 'Investigador', 'en-GB-RyanNeural', 'es-PE-AlexNeural'],
      ['MATEO_VARGAS', 'Mateo Vargas', 'Operador de campo', 'en-US-AndrewNeural', 'es-US-AlonsoNeural'],
      ['ARTHUR_WARD', 'Arthur Ward', 'Militar / Defensa', 'en-US-TonyNeural', 'es-VE-SebastianNeural'],
      ['PRESIDENTE', 'Presidente', 'Mandatario', 'en-US-DavisNeural', 'es-BO-MarceloNeural'],
      ['LIN_WEI', 'Lin Wei', 'Ingeniera hardware', 'en-US-MichelleNeural', 'es-CO-SalomeNeural'],
      ['JACK_NOVAK', 'Jack Novak', 'Agente táctico', 'en-US-SteffanNeural', 'es-UY-MateoNeural'],
      ['MARCOS_MORENO', 'Marcos Moreno', 'Especialista sistemas', 'en-US-BrandonNeural', 'es-ES-ArnauNeural'],
      ['AGI_CORE', 'AGI Core', 'Entidad sintética IA', 'en-US-AriaNeural', 'es-MX-DaliaNeural']
    ];
    return {
      tipo_doc: 'biblioteca',
      meta_proyecto: proyectoActivo,
      personajes: baseCast.map(function(c) {
        return { id: c[0], nombre: c[1], raza: c[2], contextura: 'Humano adulto estilizado', pelaje_rasgos: '', vestuario_base: '', pose_iconica: 'De pie en plano 3/4 mirando a la derecha', personalidad: c[2], voice_id: '', voz_en: c[3], voz_es: c[4], pivotes_json: '', piezas: {}, variantes: [] };
      }),
      escenarios: [{ id: 'esc_001', nombre: 'Centro de Control / Laboratorio EUV', iluminacion: 'Sombras profundas con destellos neón cian y ámbar', zonas: [{ id: 'zona_01', nombre: 'Sala Principal', puntos_camara: 'Plano general + zoom consolas', fondo: null, frente: null }] }],
      props: [{ id: 'prop_terminal', nombre: 'Terminal Holográfica', categoria: 'prop', archivo: null }, { id: 'sfx_alarma', nombre: 'Alarma Táctica', categoria: 'audio', archivo: null }],
      guiones: [{ id: 'cap_01', titulo: 'Capítulo I · Short 01', escenario_id: 'esc_001', zona_id: 'zona_01', reparto: ['NARRADOR', 'DANIEL_CHEN'], estado: 'Borrador', anecdota: '', escenas: [] }],
      fecha_actualizacion: new Date().toISOString()
    };
  }
  return {
    tipo_doc: 'biblioteca', meta_proyecto: proyectoActivo,
    personajes: [{ id: 'per_001', nombre: 'Protagonista 01', raza: proyectoActivo.tipo_personaje || 'Personaje', contextura: '', pelaje_rasgos: '', vestuario_base: '', pose_iconica: 'De pie mirando a la derecha', personalidad: '', voice_id: '', voz_en: '', voz_es: '', pivotes_json: '', piezas: {}, variantes: [] }],
    escenarios: [{ id: 'esc_001', nombre: 'Escenario Principal', iluminacion: 'Iluminación base', zonas: [{ id: 'zona_01', nombre: 'Zona 01', puntos_camara: '', fondo: null, frente: null }] }],
    props: [], guiones: [{ id: 'ep001', titulo: 'Episodio 001', escenario_id: 'esc_001', reparto: ['per_001'], estado: 'Borrador', anecdota: '', escenas: [] }],
    fecha_actualizacion: new Date().toISOString()
  };
}

// PLANTILLA ESTÁNDAR DE 20 PIEZAS BÁSICAS POR PERSONAJE (MARIONETA SOUTH PARK / PIRO-RIG)
const SLOTS_BASICOS_PERSONAJE = [
  // Base (4)
  { key: 'maestro_cuerpo', grupo: 'base', titulo: 'Cuerpo Entero Maestro', preset: 'per_ref', archivo: 'maestro_vest_01', dim: '1000×1600', desc: 'De pie mirando a la derecha, base de referencia.' },
  { key: 'maestro_perfil', grupo: 'base', titulo: 'Busto / Perfil Maestro', preset: 'per_ref', archivo: 'maestro_perfil', dim: '1000×1600', desc: 'Primer plano de pecho arriba para expresiones.' },
  { key: 'cabeza_base', grupo: 'base', titulo: 'Cabeza Sin Rostro', preset: 'per_cabeza', archivo: 'base', dim: '1000×1600', desc: 'Cabeza, orejas y hocico SIN ojos ni boca.' },
  { key: 'cuerpo_base', grupo: 'base', titulo: 'Cuerpo / Vestuario 01', preset: 'per_cuerpo', archivo: 'vest_01', dim: '1000×1600', desc: 'Torso y ropa base SIN cabeza ni brazos.' },

  // Ojos (6)

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg, tipo) {
  if (window.self !== window.top) {
    window.parent.postMessage({ tipo: 'PIRO_TOAST', mensaje: msg, nivel: tipo || 'info' }, '*');
    return;
  }
  const cont = document.getElementById('toasts-cont');
  const el = document.createElement('div');
  el.className = 'toast-c ' + (tipo || 'info');
  el.textContent = msg;
  cont.appendChild(el);
  setTimeout(function() { el.remove(); }, 2800);
}

function confirmar(tit, msg) {
  return new Promise(function(resolve) {
    const m = document.getElementById('modal-conf-c');
    document.getElementById('conf-c-tit').textContent = tit;
    document.getElementById('conf-c-msg').textContent = msg;
    const no = document.getElementById('conf-c-no');
    const si = document.getElementById('conf-c-si');
    m.classList.add('open');
    const fin = function(v) { m.classList.remove('open'); no.onclick = null; si.onclick = null; resolve(v); };
    no.onclick = function() { fin(false); };
    si.onclick = function() { fin(true); };
  });
}

}

async function cargarBiblioteca() {
  actualizarBadgeProy();
  setSyncBadge('Cargando...', 'warn');
  biblioteca = { tipo_doc: 'biblioteca', personajes: [], escenarios: [], props: [], guiones: [] };
  const kLoc = getLocalBibKey();
  try {
    const raw = localStorage.getItem(kLoc);
    if (raw) biblioteca = JSON.parse(raw);
  } catch (e) {}

  if (GeokatuDB.PirobonianosService && navigator.onLine) {
    const res = await GeokatuDB.PirobonianosService.obtenerProyectoEDT(getDocBibId());
    if (res.success && res.data && Array.isArray(res.data.personajes)) {
      if (!biblioteca.fecha_actualizacion || String(res.data.fecha_actualizacion || '') >= String(biblioteca.fecha_actualizacion)) {
        biblioteca = res.data;
        try { localStorage.setItem(kLoc, JSON.stringify(biblioteca)); } catch (e) {}
      }
      setSyncBadge('Nube OK', 'ok');
    } else if (res.success) {
      setSyncBadge('Nube lista', 'ok');
    } else {
      setSyncBadge('Local', 'warn');
    }
  } else {
    setSyncBadge('Offline', 'warn');
  }

  if (!Array.isArray(biblioteca.personajes) || biblioteca.personajes.length === 0) {
    biblioteca = crearSemillaPorProyecto();
    guardarBiblioteca(true);
  }
    try {
    const rawUiC = localStorage.getItem('piro_cont_ui_' + proyectoActivo.id);
    if (rawUiC) {
      const u = JSON.parse(rawUiC);
      if (u.catActiva) catActiva = u.catActiva;
      if (u.subTabPersonaje) subTabPersonaje = u.subTabPersonaje;
      if (u.selId) selId = Object.assign(selId, u.selId);
    }
  } catch (e) {}
  if (!biblioteca.personajes.some(function(x) { return x.id === selId.personajes; })) selId.personajes = biblioteca.personajes[0] ? biblioteca.personajes[0].id : null;
  if (!biblioteca.escenarios.some(function(x) { return x.id === selId.escenarios; })) selId.escenarios = biblioteca.escenarios[0] ? biblioteca.escenarios[0].id : null;
  if (!biblioteca.guiones.some(function(x) { return x.id === selId.guiones; })) selId.guiones = biblioteca.guiones[0] ? biblioteca.guiones[0].id : null;
  if (!selId.personajes && biblioteca.personajes[0]) selId.personajes = biblioteca.personajes[0].id;
  if (!selId.escenarios && biblioteca.escenarios[0]) selId.escenarios = biblioteca.escenarios[0].id;
  if (!selId.guiones && biblioteca.guiones[0]) selId.guiones = biblioteca.guiones[0].id;

  renderizarTodo();
}

function guardarBiblioteca(inmediato) {
  biblioteca.tipo_doc = 'biblioteca';
  biblioteca.meta_proyecto = proyectoActivo;
  biblioteca.fecha_actualizacion = new Date().toISOString();
  try { localStorage.setItem(getLocalBibKey(), JSON.stringify(biblioteca)); } catch (e) {}
  setSyncBadge('Guardando...', 'warn');
  clearTimeout(debounceGuardar);
  const run = async function() {
    if (!GeokatuDB.PirobonianosService) { setSyncBadge('Local', 'warn'); return; }
    const res = await GeokatuDB.PirobonianosService.guardarProyectoEDT(getDocBibId(), biblioteca);
    if (res.success && !res.offline) setSyncBadge('Nube OK', 'ok');
    else setSyncBadge('Local', 'warn');
  };
  if (inmediato) run();
  else debounceGuardar = setTimeout(run, 650);
}

function generarPromptPersonaje(p, tipo) {
  const baseStyle = proyectoActivo.estilo_visual || 'A 2D cartoon animation character, BoJack Horseman style, clean black ink outlines, flat vibrant colors.';
  const prefId = proyectoActivo.plantilla === 'scifi_hibrido' ? ('Character profile: ' + (p.raza || 'human sci-fi character')) : ('Anthropomorphic ' + (p.raza || 'dog') + ' character');
  const identidad = prefId + '. Physique: ' + (p.contextura || 'adult stylized') + '. Features: ' + (p.pelaje_rasgos || 'distinctive look') + '.';
  const ropa = 'Wearing: ' + (p.vestuario_base || 'casual clothes') + '.';

  if (tipo === 'cuerpo_completo' || tipo === 'maestro_cuerpo') {
    return baseStyle + ' Full-body ' + identidad + ' Showing completely from head to toe, both arms, hands, legs, and feet clearly visible, facing three-quarters to the RIGHT. ' + ropa + ' Pose: ' + (p.pose_iconica || 'standing neutral') + '. Isolated on a completely flat solid chroma green background (#00FF00) with zero shadows, perfect for a PNG cut-out. Facial expression: neutral.';
  }
  if (tipo === 'maestro_perfil') {
    return 'Using the attached full-body character as strict reference, generate a clean medium close-up bust portrait (from chest/shoulders up) facing three-quarters to the RIGHT, on a completely flat solid chroma green background (#00FF00) with zero shadows. ' + baseStyle + ' ' + identidad + ' ' + ropa + ' Neutral calm facial expression, centered with generous green margin.';
  }
  if (tipo === 'cabeza_base') {
    return 'Edit the attached character bust portrait: keep the exact same head, ears, hair, fur markings, jawline, and three-quarter angle facing RIGHT, isolated on a completely flat solid chroma green background (#00FF00) with zero shadows. REMOVE the eyes, eyebrows, and mouth completely, replacing those areas seamlessly with smooth clean fur matching the face (keep the nose tip intact). Remove neck and shoulders so ONLY the clean floating head remains.';
  }
  if (tipo === 'cuerpo_base') {
    return 'Edit the attached full-body character: keep the exact same body, outfit (' + (p.vestuario_base || 'base outfit') + '), and three-quarter angle facing RIGHT on a completely flat solid chroma green background (#00FF00) with zero shadows. REMOVE the head and arms completely, cleanly closing the collar and shoulder openings with flat color and black outline for modular 2D puppet rigging.';
  }
  if (tipo.indexOf('ojos') === 0) {
    const emo = tipo === 'ojos' ? '6 expressions in a 2x3 grid (NEUTRAL, HAPPY, ANGRY, SAD, DOUBTFUL, INDIGNANT)' : ('ONLY the expression: ' + tipo.replace('ojos_', '').toUpperCase());
    return 'Using the attached character bust as strict reference, draw ONLY the eyes and eyebrows (' + emo + ') without head, ears, nose, mouth, or text, on a completely flat solid chroma green background (#00FF00) with zero shadows. Match exact BoJack Horseman 2D line style and three-quarter angle facing RIGHT.';
  }
  if (tipo.indexOf('boca') === 0) {
    const moc = tipo === 'bocas' ? '5 mouth variations in a neat grid (CLOSED, HALF-OPEN, WIDE OPEN, SMILE, ANNOYED)' : ('ONLY the mouth variation: ' + tipo.replace('boca_', '').toUpperCase());
    return 'Using the attached character bust as strict reference, draw ONLY the mouth/lower muzzle (' + moc + ') without eyes, ears, neck, or text, on a completely flat solid chroma green background (#00FF00) with zero shadows. Match exact 2D cartoon line style and three-quarter angle facing RIGHT.';
  }
  if (tipo.indexOf('brazo') === 0 || tipo.indexOf('pierna') === 0) {
    return 'Using the attached full-body character as strict reference, draw ONLY the isolated limb (' + tipo.replace(/_/g, ' ') + ') with a cleanly rounded shoulder/hip joint cap, matching exact fur spots, outfit sleeve/pant, and BoJack Horseman 2D line style, isolated on solid chroma green (#00FF00) with zero shadows for South Park style cut-out animation.';
  }
  return 'Using the attached character (' + (p.nombre || p.id) + ') as strict visual reference, generate the custom variant "' + tipo + '" in BoJack Horseman 2D cartoon style, clean lines, facing three-quarters to the RIGHT, isolated on solid chroma green (#00FF00) with zero shadows.';
}

function calcularProgresoPersonaje(p) {
  const piezas = p.piezas || {};
  let listos = 0;
  SLOTS_BASICOS_PERSONAJE.forEach(function(s) {
    if (piezas[s.key] && piezas[s.key].url) listos++;
  });
  const total = SLOTS_BASICOS_PERSONAJE.length;
  const pct = Math.round((listos / total) * 100);
  const extras = (p.variantes || []).filter(function(v) { return v.url; }).length;
  return { listos: listos, total: total, pct: pct, extras: extras, totalExtras: (p.variantes || []).length };
}

      '<div class="slot-preview">' +
        '<span class="slot-tag-dim">' + esc(spec.dim) + '</span>' +

        '<div class="slot-title">' + esc(spec.titulo) + '</div>' +

        '<button type="button" class="btn btn-xs btn-blue" onclick="window.crearTicketDesdeSlot(\'' + esc(spec.key) + '\',' + (spec.esVariante ? 'true' : 'false') + ')">+ Ticket</button>' +
        '<button type="button" class="btn btn-xs" onclick="window.copiarPromptSlot(\'' + esc(spec.key) + '\')">Prompt</button>' +
        (spec.esVariante
          ? '<button type="button" class="btn btn-xs btn-danger" onclick="window.eliminarVariante(' + spec.varIdx + ')">Borrar</button>'

              ? '<button type="button" class="btn btn-xs btn-danger" onclick="window.quitarImagenSlot(\'' + esc(spec.key) + '\')">Quitar</button>'

window.iniciarSubidaSlotPersonaje = function(slotKey, esVariante) {
  const p = obtenerPersonajeActual();
  if (!p) return;
  const spec = esVariante
    ? (p.variantes || []).find(function(v) { return v.id === slotKey; })
    : SLOTS_BASICOS_PERSONAJE.find(function(s) { return s.key === slotKey; });
  if (!spec) return;

  slotUploadPendiente = {
    tipo: 'personaje',
    entidadId: p.id,
    slotKey: slotKey,
    esVariante: Boolean(esVariante),
    presetId: spec.preset || 'per_cuerpo',
    archivoNombre: spec.archivo || slotKey,
        etiqueta: p.nombre + ' · ' + (spec.titulo || slotKey),
    calcoUrl: obtenerCalcoInteligente(p, slotKey),
    pivotesIniciales: parsearPivotesPersonaje(p)
  };
  const inp = document.getElementById('input-file-slot');
  inp.accept = 'image/*';
  inp.click();
};

window.abrirEstudioVacioParaSlot = function(slotKey, esVariante) {
  const p = obtenerPersonajeActual();
  if (!p) return;
  const spec = SLOTS_BASICOS_PERSONAJE.find(function(s) { return s.key === slotKey; });
  if (!spec) return;
  if (window.self === window.top) {
    toast('Abre este módulo desde piro-shell.html para cambiar al Estudio en 0 ms.', 'info');
    return;
  }
  window.parent.postMessage({
    tipo: 'PIRO_IR_A_ESTUDIO',
    origen: 'contenido',
    etiqueta: p.nombre + ' · ' + spec.titulo,
    presetId: spec.preset,
        entidadId: p.id,
    archivoNombre: spec.archivo,
    calcoUrl: obtenerCalcoInteligente(p, slotKey),
    pivotesIniciales: parsearPivotesPersonaje(p),
    slotMeta: { tipo: 'personaje', entidadId: p.id, slotKey: slotKey, esVariante: Boolean(esVariante) }
  }, '*');
};

window.manejarArchivoSlotSeleccionado = async function(file) {
  if (!file || !slotUploadPendiente) return;
  const meta = slotUploadPendiente;
  slotUploadPendiente = null;

  // Si estamos dentro de piro-shell.html y es imagen, enviarlo al Estudio PNG en 0 ms
  if (window.self !== window.top && String(file.type || '').indexOf('image/') === 0 && meta.usarEstudio !== false) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      window.parent.postMessage({
        tipo: 'PIRO_IR_A_ESTUDIO',
        origen: 'contenido',
        etiqueta: meta.etiqueta,
        presetId: meta.presetId,
        entidadId: meta.entidadId,
        zonaId: meta.zonaId || 'zona_01',
        archivoNombre: meta.archivoNombre,
                dataUrl: ev.target.result,
        calcoUrl: meta.calcoUrl || null,
        pivotesIniciales: meta.pivotesIniciales || null,
        slotMeta: meta
      }, '*');
    };
    reader.readAsDataURL(file);
    return;
  }
  await subirYAsignarArchivoASlot(file, meta, null);
};

function parsearPivotesPersonaje(p) {
  if (!p || !p.pivotes_json) return null;
  try { const o = JSON.parse(p.pivotes_json); return (o && typeof o === 'object') ? o : null; } catch (e) { return null; }
}

function obtenerCalcoInteligente(p, slotKey) {
  if (!p || !p.piezas) return null;
  if (String(slotKey || '').indexOf('ojos_') === 0 || String(slotKey || '').indexOf('boca_') === 0) {
    return (p.piezas.cabeza_base && p.piezas.cabeza_base.url) || (p.piezas.maestro_perfil && p.piezas.maestro_perfil.url) || (p.piezas.maestro_cuerpo && p.piezas.maestro_cuerpo.url) || null;
  }
  return (p.piezas.maestro_cuerpo && p.piezas.maestro_cuerpo.url) || null;
}

function cargarImgSandwich(url) {
  return new Promise(function(resolve) {
    if (!url) { resolve(null); return; }
    if (sandwichImgCache[url]) { resolve(sandwichImgCache[url]); return; }
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = function() { sandwichImgCache[url] = img; resolve(img); };
    img.onerror = function() { resolve(null); };
    img.src = url;
  });
}

};

window.dibujarProbadorSandwich = async function() {
  const canvas = document.getElementById('canvas-sandwich'), p = obtenerPersonajeActual();
  if (!canvas || !p) return;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, 1000, 1600);
  const piezas = p.piezas || {}, piv = parsearPivotesPersonaje(p) || {};
  const getPt = function(k, fx, fy) {
    const v = piv[k];
    if (Array.isArray(v) && v.length >= 2) return { x: Number(v[0]) || fx, y: Number(v[1]) || fy };
    if (v && typeof v.x === 'number' && typeof v.y === 'number') return { x: v.x, y: v.y };
    return { x: fx, y: fy };
  };
  const claves = ['brazo_trasero_reposo', 'pierna_trasera', 'pierna_delantera', 'cuerpo_base', 'maestro_cuerpo', 'cabeza_base', sandwichCfg.ojos, sandwichCfg.boca, sandwichCfg.brazoDel];
  const imgs = {};
  await Promise.all(claves.map(async function(k) { if (k && k !== 'ninguno' && !imgs[k]) imgs[k] = await cargarImgSandwich(piezas[k] ? piezas[k].url : null); }));
  let n = 0;
  const drawP = function(im) { if (im) { ctx.drawImage(im, 0, 0, 1000, 1600); n++; } };
  const drawR = function(im, pt, deg) { if (!im) return; ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate((deg * Math.PI) / 180); ctx.drawImage(im, -pt.x, -pt.y, 1000, 1600); ctx.restore(); n++; };
  drawP(imgs.brazo_trasero_reposo);
  if (sandwichCfg.piernas) { drawP(imgs.pierna_trasera); drawP(imgs.pierna_delantera); }
  if (imgs.cuerpo_base) drawP(imgs.cuerpo_base); else if (imgs.maestro_cuerpo) { ctx.save(); ctx.globalAlpha = 0.45; drawP(imgs.maestro_cuerpo); ctx.restore(); }
  const ptC = getPt('cuello', 500, 480);
  drawR(imgs.cabeza_base, ptC, sandwichCfg.rotCab); drawR(imgs[sandwichCfg.ojos], ptC, sandwichCfg.rotCab); drawR(imgs[sandwichCfg.boca], ptC, sandwichCfg.rotCab);
  if (sandwichCfg.brazoDel !== 'ninguno') drawR(imgs[sandwichCfg.brazoDel], getPt('hombro_delantero', 440, 560), sandwichCfg.rotBrazo);
  ctx.save(); ctx.strokeStyle = 'rgba(34,197,94,0.75)'; ctx.lineWidth = 3; ctx.setLineDash([14, 10]); ctx.beginPath(); ctx.moveTo(0, 1480); ctx.lineTo(1000, 1480); ctx.stroke(); ctx.setLineDash([]);
  ['cuello', 'hombro_trasero', 'hombro_delantero', 'mano_delantera'].forEach(function(k) { if (!piv[k]) return; const pt = getPt(k, 500, 500); ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.arc(pt.x, pt.y, 10, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); });
  ctx.restore();
  const est = document.getElementById('sandwich-estado-txt');
  if (est) est.textContent = n > 0 ? ('Capas activas visibles: ' + n + ' · Línea verde = suelo Y=1480.') : 'Sube piezas en Base, Ojos y Bocas para probar el apilado en vivo.';
};

function aplicarRegistroEnSlot(meta, registro, pivotesRecibidos) {
  if (meta.tipo === 'personaje') {
    const p = biblioteca.personajes.find(function(x) { return x.id === meta.entidadId; });
    if (p) {
      if (meta.esVariante) { const v = (p.variantes || []).find(function(x) { return x.id === meta.slotKey; }); if (v) Object.assign(v, registro); }
      else { if (!p.piezas) p.piezas = {}; p.piezas[meta.slotKey] = registro; }
      if (pivotesRecibidos && typeof pivotesRecibidos === 'object' && Object.keys(pivotesRecibidos).some(function(k) { return Boolean(pivotesRecibidos[k]); })) {
        p.pivotes_json = JSON.stringify(pivotesRecibidos, null, 2);
      }
    }
  } else if (meta.tipo === 'voz') {
    const p = biblioteca.personajes.find(function(x) { return x.id === meta.entidadId; }); if (p) p.muestra_voz = registro;
  } else if (meta.tipo === 'escenario') {
    const e = biblioteca.escenarios.find(function(x) { return x.id === meta.entidadId; });
    const z = e ? (e.zonas || []).find(function(x) { return x.id === meta.zonaId; }) : null; if (z) z[meta.campoZona] = registro;
  } else if (meta.tipo === 'prop') {
    const pr = biblioteca.props.find(function(x) { return x.id === meta.entidadId; }); if (pr) pr.archivo = registro;
  }
}

async function subirYAsignarArchivoASlot(fileObj, meta, pivotesRecibidos) {
  if (!GeokatuDB.PirobonianosService) { toast('Falta PirobonianosService en core-db.js.', 'error'); return; }
  setSyncBadge('Subiendo...', 'warn');
  const ruta = meta.tipo + '/' + meta.entidadId + '/' + (meta.zonaId ? (meta.zonaId + '/') : '') + Date.now() + '_' + String(fileObj.name || 'activo.png').replace(/[^a-zA-Z0-9._-]+/g, '_');
    const res = await GeokatuDB.PirobonianosService.subirActivoPirobonianos(getStorageDir(), ruta, fileObj);
  if (!res.success) { toast('Error subiendo archivo: ' + res.error, 'error'); setSyncBadge('Error', 'warn'); return; }
  const registro = { url: res.url, rutaStorage: res.rutaStorage, nombre: fileObj.name, tipo: res.tipo, fecha: res.fecha };
  aplicarRegistroEnSlot(meta, registro, pivotesRecibidos);
  guardarBiblioteca(true); renderizarTodo();
  if (window.self !== window.top && meta.tipo !== 'voz') window.parent.postMessage({ tipo: 'PIRO_SLOT_COMPLETADO', slotMeta: meta }, '*');
  toast('Activo guardado en la nube.', 'exito');
}

window.crearTicketDesdeSlot = function(slotKey, esVariante) {
  const p = obtenerPersonajeActual();

    ? (p.variantes || []).find(function(v) { return v.id === slotKey; })

window.enviarFaltantesATickets = async function() {
  const p = obtenerPersonajeActual();
  if (!p) return;
  const faltantes = SLOTS_BASICOS_PERSONAJE.filter(function(s) { return !(p.piezas && p.piezas[s.key] && p.piezas[s.key].url); });
  if (faltantes.length === 0) {
    toast('Este personaje ya está al 100% en básicos.', 'exito');
    return;
  }
  const ok = await confirmar('Enviar Faltantes a Tickets', 'Se crearán ' + faltantes.length + ' tickets en la cola para terminar los aspectos básicos de ' + p.nombre + '.');
  if (!ok) return;
  faltantes.forEach(function(s) { window.crearTicketDesdeSlot(s.key, false); });
};

    '<button type="button" class="btn btn-xs" onclick="window.copiarPromptDirectorEscenas()">Prompt IA → JSON</button><button type="button" class="btn btn-xs btn-blue" onclick="window.abrirModalCrear(\'importar_escenas\')">Pegar JSON</button><button type="button" class="btn btn-xs btn-primary" onclick="window.agregarEscenaGuion()">+ Añadir Línea</button></div></div>' + htmlEsc + '</div>';

window.agregarEscenaGuion = function() {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g) return;
  if (!Array.isArray(g.escenas)) g.escenas = [];
  const act = (g.reparto && g.reparto[0]) || (biblioteca.personajes[0] ? biblioteca.personajes[0].id : 'per_001');
  g.escenas.push({ actor: act, ojos: 'neutro', camara: 'centro', prop: '', sfx: '', texto: '' });
  guardarBiblioteca(true); renderizarVistaGuiones();
};
window.editarEscenaGuion = function(idx, c, v) { const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g || !g.escenas || !g.escenas[idx]) return; g.escenas[idx][c] = v; guardarBiblioteca(false); };
window.moverEscenaGuion = function(idx, d) { const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g || !g.escenas) return; const t = idx + d; if (t < 0 || t >= g.escenas.length) return; const tmp = g.escenas[idx]; g.escenas[idx] = g.escenas[t]; g.escenas[t] = tmp; guardarBiblioteca(true); renderizarVistaGuiones(); };
window.eliminarEscenaGuion = function(idx) { const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g || !g.escenas) return; g.escenas.splice(idx, 1); guardarBiblioteca(true); renderizarVistaGuiones(); };
window.copiarPromptDirectorEscenas = function() {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g) return;
  const act = biblioteca.personajes.map(function(p) { return p.id + ' (' + p.nombre + ')'; }).join(', ');
  const pr = (biblioteca.props || []).filter(function(x) { return x.categoria !== 'audio'; }).map(function(x) { return x.id; }).join(', ');
  const sfx = (biblioteca.props || []).filter(function(x) { return x.categoria === 'audio'; }).map(function(x) { return x.id; }).join(', ');
  const txt = 'Convierte esta anécdota colombiana en un guion ágil de 35-45s para YouTube Shorts. Devuelve SOLO un array JSON válido sin markdown con objetos: {"actor":"per_001","ojos":"neutro|feliz|enojado|triste|duda|indignado","camara":"centro|izq|der|zoom_actor|plano_general","prop":"","sfx":"","texto":"diálogo corto"}.\nActores: ' + act + '\nProps: ' + (pr || 'ninguno') + '\nSFX: ' + (sfx || 'ninguno') + '\nAnécdota: ' + (g.anecdota || g.titulo);
  navigator.clipboard.writeText(txt).then(function() { toast('Prompt IA → JSON copiado.', 'exito'); });
};

window.editarCampoGuion = function(campo, val) {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; });
  if (!g) return;
  g[campo] = val;
  if (campo === 'titulo') renderizarRailEntidades();
  guardarBiblioteca(false);
};

window.toggleActorGuion = function(perId) {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; });
  if (!g) return;
  if (!g.reparto) g.reparto = [];
  const idx = g.reparto.indexOf(perId);
  if (idx >= 0) g.reparto.splice(idx, 1);
  else g.reparto.push(perId);
  guardarBiblioteca(true);
  renderizarVistaGuiones();
};

window.abrirGuionEnEditor = function() {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; });
  if (!g) return;
  if (window.self !== window.top) {
    window.parent.postMessage({ tipo: 'PIRO_ABRIR_EDITOR_GUION', episodioId: g.id }, '*');
  } else {
    toast('Abre piro-shell.html para saltar al Editor Timeline en 0 ms.', 'info');
  }
};

window.enviarGuionATickets = function() {
  const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; });
  if (!g) return;
  enviarTicketAShell({
    codigo: g.id.toUpperCase(),

    titulo: 'Producir Short: ' + g.titulo,
    detalle: 'Escenario: ' + (g.escenario_id || 'N/A') + '\nReparto: ' + (g.reparto || []).join(', ') + '\n\nAnécdota:\n' + (g.anecdota || '(Completar anécdota)')

};

window.confirmarCrearEntidad = function() {
  const cleanId = function(s, fb) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '') || fb;
  };

  if (tipoModalCrear === 'personaje') {
    const id = cleanId(document.getElementById('mc-id').value, 'per_' + Date.now());
    const nuevo = {
      id: id,
      nombre: document.getElementById('mc-nom').value.trim(),
      raza: document.getElementById('mc-raza').value.trim(),
      contextura: '', pelaje_rasgos: '', vestuario_base: '', pose_iconica: 'De pie mirando a la derecha',
            personalidad: '', voice_id: '',
      voz_en: document.getElementById('mc-voz-en') ? document.getElementById('mc-voz-en').value.trim() : '',
      voz_es: document.getElementById('mc-voz-es') ? document.getElementById('mc-voz-es').value.trim() : '',
      pivotes_json: '', piezas: {}, variantes: []
    };
    biblioteca.personajes.push(nuevo);
    catActiva = 'personajes';
    selId.personajes = id;
    subTabPersonaje = 'ficha';
  } else if (tipoModalCrear === 'variante') {
    const p = obtenerPersonajeActual();
    if (p) {
      const arch = cleanId(document.getElementById('mc-arch').value, 'var_' + Date.now());
      p.variantes.push({
        id: 'var_' + Date.now(),
        titulo: document.getElementById('mc-nom').value.trim(),
        archivo: arch,
        preset: document.getElementById('mc-preset').value,
        nota: document.getElementById('mc-nota').value.trim(),
        url: null
      });
      subTabPersonaje = 'variantes';
    }
  } else if (tipoModalCrear === 'escenario') {
    const id = cleanId(document.getElementById('mc-id').value, 'esc_' + Date.now());
    biblioteca.escenarios.push({
      id: id,
      nombre: document.getElementById('mc-nom').value.trim(),
      iluminacion: '',
      zonas: [{ id: 'zona_01', nombre: document.getElementById('mc-zona').value.trim(), fondo: null, frente: null }]
    });
    catActiva = 'escenarios';
    selId.escenarios = id;
  } else if (tipoModalCrear === 'zona') {
    const e = biblioteca.escenarios.find(function(x) { return x.id === selId.escenarios; });
    if (e) {
      const zId = 'zona_' + String((e.zonas || []).length + 1).padStart(2, '0');
      e.zonas.push({ id: zId, nombre: document.getElementById('mc-nom').value.trim(), fondo: null, frente: null });
    }
  } else if (tipoModalCrear === 'prop') {
    const cat = document.getElementById('mc-cat').value;
    const nom = document.getElementById('mc-nom').value.trim();
    const pref = cat === 'fx' ? 'fx_' : (cat === 'audio' ? 'sfx_' : 'prop_');
    biblioteca.props.push({ id: pref + cleanId(nom, String(Date.now()).slice(-4)), nombre: nom, categoria: cat, archivo: null });
    catActiva = 'props';
  } else if (tipoModalCrear === 'guion') {
    const id = cleanId(document.getElementById('mc-id').value, 'ep_' + Date.now());
    biblioteca.guiones.push({
      id: id, titulo: document.getElementById('mc-nom').value.trim(),
      escenario_id: biblioteca.escenarios[0] ? biblioteca.escenarios[0].id : '',
            reparto: [], estado: 'Borrador', anecdota: '', escenas: []
    });
    catActiva = 'guiones';
    selId.guiones = id;
  } else if (tipoModalCrear === 'importar_escenas') {
    const g = biblioteca.guiones.find(function(x) { return x.id === selId.guiones; }); if (!g) return;
    try {
      const raw = document.getElementById('mc-json-esc').value.trim().replace(/^```json\s*/i, '').replace(/```$/, '').trim();
      const arr = JSON.parse(raw); if (!Array.isArray(arr)) throw new Error('Debe ser un array JSON');
      g.escenas = arr.map(function(i) { return { actor: String(i.actor || 'per_001'), ojos: String(i.ojos || 'neutro'), camara: String(i.camara || 'centro'), prop: String(i.prop || ''), sfx: String(i.sfx || ''), texto: String(i.texto || '') }; });
      catActiva = 'guiones';
    } catch (err) { toast('JSON inválido: ' + err.message, 'error'); return; }
  }
  window.cerrarModalC('modal-crear-entidad'); guardarBiblioteca(true); window.cambiarCategoria(catActiva); toast('Cambios guardados.', 'exito');
};

window.exportarManifiestoTermux = function() {
  const descargas = [];
  const addDl = function(r, reg) { if (reg && reg.url) descargas.push({ ruta_local: r, url: reg.url, tipo: reg.tipo || 'application/octet-stream' }); };
  const rutaSlot = function(pid, s) {
    const sub = s.preset === 'per_ref' ? 'referencia/' : (s.preset === 'per_cabeza' ? 'piezas/cabeza/' : (s.preset === 'per_ojos' ? 'piezas/ojos/' : (s.preset === 'per_boca' ? 'piezas/bocas/' : (s.preset === 'per_brazo' ? 'piezas/brazos/' : 'piezas/cuerpo/'))));
    return 'biblioteca/personajes/' + pid + '/' + sub + s.archivo + '.png';
  };
  const perOut = (biblioteca.personajes || []).map(function(p) {
    const pz = {}, vr = {};
    SLOTS_BASICOS_PERSONAJE.forEach(function(s) { const reg = p.piezas && p.piezas[s.key]; if (reg && reg.url) { const r = rutaSlot(p.id, s); pz[s.key] = r; addDl(r, reg); } });
    (p.variantes || []).forEach(function(v) { if (v && v.url) { const r = 'biblioteca/personajes/' + p.id + '/piezas/variantes/' + (v.archivo || v.id) + '.png'; vr[v.archivo || v.id] = r; addDl(r, v); } });
    if (p.muestra_voz && p.muestra_voz.url) addDl('biblioteca/personajes/' + p.id + '/referencia/muestra_voz.mp3', p.muestra_voz);
    return { id: p.id, nombre: p.nombre, raza: p.raza, voice_id: p.voice_id || '', pivotes: parsearPivotesPersonaje(p), piezas: pz, variantes: vr };
  });
  const escOut = (biblioteca.escenarios || []).map(function(e) {
    return { id: e.id, nombre: e.nombre, iluminacion: e.iluminacion || '', zonas: (e.zonas || []).map(function(z) {
      const o = { id: z.id, nombre: z.nombre, puntos_camara: z.puntos_camara || '' };
      if (z.fondo && z.fondo.url) { o.fondo = 'biblioteca/escenarios/' + e.id + '/zonas/' + z.id + '/fondo.png'; addDl(o.fondo, z.fondo); }
      if (z.frente && z.frente.url) { o.frente = 'biblioteca/escenarios/' + e.id + '/zonas/' + z.id + '/frente.png'; addDl(o.frente, z.frente); }
      return o;
    }) };
  });
  const propsOut = {};
  (biblioteca.props || []).forEach(function(pr) {
    if (pr.archivo && pr.archivo.url) {
      const ext = pr.categoria === 'audio' ? (String(pr.archivo.nombre || '').toLowerCase().indexOf('.ttf') >= 0 ? '.ttf' : '.mp3') : '.png';
      const dir = pr.categoria === 'audio' ? (ext === '.ttf' ? 'biblioteca/fuentes/' : 'biblioteca/audio/sfx/') : 'biblioteca/props/';
      const r = dir + pr.id + ext; propsOut[pr.id] = r; addDl(r, pr.archivo);
    }
  });
  const man = { proyecto: 'piro_rig_2d', generado_en: new Date().toISOString(), total_archivos: descargas.length, descargas: descargas, catalogo: { personajes: perOut, escenarios: escOut, props: propsOut, guiones: biblioteca.guiones || [] } };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(man, null, 2)], { type: 'application/json' })); a.download = 'catalogo_sync.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  toast('Manifiesto catalogo_sync.json exportado (' + descargas.length + ' activos).', 'exito');
};

window.addEventListener('message', async function(e) {
  if (!e.data || !e.data.tipo) return;
      if (e.data.tipo === 'PIRO_SHELL_CAMBIAR_PROYECTO' && e.data.proyecto) {
    proyectoActivo = Object.assign(proyectoActivo, e.data.proyecto);
    selId = { personajes: null, escenarios: null, guiones: null };
    cargarBiblioteca();
  } else if (e.data.tipo === 'PIRO_SHELL_AUTH' || e.data.tipo === 'PIRO_BIBLIOTECA_ACTUALIZADA') {
    if (e.data.proyecto) proyectoActivo = Object.assign(proyectoActivo, e.data.proyecto);
    cargarBiblioteca();
  }
  else if (e.data.tipo === 'PIRO_SHELL_ABRIR_CREAR') {
    if (e.data.entidad === 'personaje') window.cambiarCategoria('personajes');
    else if (e.data.entidad === 'escenario') window.cambiarCategoria('escenarios');
    else if (e.data.entidad === 'guion') window.cambiarCategoria('guiones');
    window.abrirModalCrear(e.data.entidad);
  } else if (e.data.tipo === 'PIRO_PNG_RECIBIDO' && e.data.blob && e.data.slotMeta) {
    const fileObj = new File([e.data.blob], e.data.nombreArchivo || 'pieza.png', { type: 'image/png' });
    await subirYAsignarArchivoASlot(fileObj, e.data.slotMeta, e.data.pivotes || null);
  } else if (e.data.tipo === 'PIRO_SHELL_VINCULAR_ASSET_TICKET' && e.data.slotMeta && e.data.registro) {
    aplicarRegistroEnSlot(e.data.slotMeta, e.data.registro, null);
    guardarBiblioteca(true); renderizarTodo();
    toast('Pieza vinculada automáticamente desde Tickets.', 'exito');
  }
});
