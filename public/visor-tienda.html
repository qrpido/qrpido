<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor de Piso y Radar de Stock | Geokatu SIG</title>
    <meta name="theme-color" content="#ff6b00">
    <link rel="stylesheet" href="mapatienda.css">
    <script src="html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        /* Estilos propios del modo visor de consulta */
        .badge-filtro {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .badge-filtro.activo {
            background: var(--naranja);
            color: white;
            border-color: var(--naranja);
            box-shadow: 0 0 12px rgba(255, 107, 0, 0.4);
        }

        /* Drawer / Ficha lateral de inspección de estante */
        #panel-detalle-mueble {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 380px;
            background: rgba(15, 15, 20, 0.96);
            border-left: 1px solid var(--naranja);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2500;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: -15px 0 40px rgba(0,0,0,0.9);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-sizing: border-box;
        }
        #panel-detalle-mueble.visible {
            transform: translateX(0);
        }

        .item-inventario-fila {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .tag-vencimiento {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .venc-urgente { background: rgba(255, 68, 68, 0.2); color: #ff5555; border: 1px solid #ff4444; }
        .venc-proximo { background: rgba(255, 170, 0, 0.2); color: #ffaa00; border: 1px solid #ffaa00; }
        .venc-optimo { background: rgba(0, 255, 100, 0.15); color: #00ff64; }

        /* Estilo visual de los estantes en Modo Visor */
        .mueble-bloque { cursor: pointer !important; }
        .mueble-bloque.alerta-vencimiento-rojo {
            background: rgba(255, 0, 0, 0.45) !important;
            border-color: #ff3333 !important;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6) !important;
        }
        .mueble-bloque.alerta-vencimiento-amarillo {
            background: rgba(255, 170, 0, 0.4) !important;
            border-color: #ffaa00 !important;
        }
    </style>
</head>
<body>

    <!-- 1. VIEWPORT DE SOLO LECTURA (CANVAS/PAN/ZOOM NATIVO) -->
    <div id="viewport-infinito">
        <div id="capa-transform">
            <canvas id="rejilla-canvas"></canvas>
            <div id="contenedor-muebles"></div>
        </div>
    </div>

    <!-- 2. HUD SUPERIOR CON BÚSQUEDA Y CÁMARA RÁPIDA -->
    <header class="hud-barra-superior" style="width: 92%; max-width: 600px; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px; flex: 1;">
            <span style="font-size: 14px;">🔍</span>
            <input type="text" id="visor-busqueda" class="hud-radar-input" style="width: 100%;" placeholder="Escanear o buscar SKU, nombre, lote...">
        </div>
        <button id="btn-abrir-camara" class="btn-radar-buscar" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);">📷 Cámara</button>
        <button id="btn-limpiar-filtros" class="btn-radar-buscar" style="background: transparent; color: #888;">✕</button>
    </header>

    <!-- 3. SELECTOR INFERIOR DE HEATMAPS Y CAPAS DE DECISIÓN -->
    <nav class="hud-burbujas-dock" style="gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 90%;">
        <button class="badge-filtro activo" data-capa="TODO">🌐 Todos los Muebles</button>
        <button class="badge-filtro" data-capa="VENCIMIENTOS">⏳ Próximos a Vencer</button>
        <button class="badge-filtro" data-capa="STOCK_CERO">⚠️ Sin Stock</button>
        <button class="badge-filtro" data-capa="PRECIOS">💲 Rango de Precios</button>
        <!-- Enlace rápido al Editor SIG (Visible solo para administradores) -->
        <button id="btn-ir-editor" class="badge-filtro" style="background: rgba(255,107,0,0.2); border-color: var(--naranja); color: var(--naranja); display: none;" onclick="window.open('mapatienda.html', '_blank')">✏️ Editar Plano SIG</button>
    </nav>

    <!-- 4. VISOR DE CÁMARA INCORPORADO FLOTANTE -->
    <div id="modal-camara" class="modal-flotante-wrap">
        <div class="modal-tarjeta-boveda" style="max-width: 360px; text-align: center;">
            <h3 style="margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: var(--naranja);">Apuntar a Producto o Bin</h3>
            <div id="lector-camara-visor" style="width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 220px;"></div>
            <button id="btn-cerrar-camara" class="btn-modal-accion" style="margin-top: 15px; background: rgba(255,255,255,0.1);">Cerrar Cámara</button>
        </div>
    </div>

    <!-- 5. FICHA LATERAL: DETALLE DE PRODUCTOS EN EL ESTANTE TOCADO -->
    <aside id="panel-detalle-mueble">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--glass-border); padding-bottom: 12px; margin-bottom: 15px;">
            <div>
                <span id="txt-mueble-id-físico" style="font-family: monospace; font-size: 11px; color: var(--naranja);">GEO-M-000</span>
                <h2 id="txt-mueble-nombre" style="margin: 4px 0 0 0; font-size: 18px; color: white;">Estante Central</h2>
            </div>
            <button id="btn-cerrar-drawer" style="background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer;">✕</button>
        </div>

        <div style="margin-bottom: 12px;">
            <span style="font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold;">Contenido por Nivel y Lotes:</span>
        </div>

        <!-- Lista de productos ubicados físicamente en este mueble -->
        <div id="lista-productos-estante" style="flex: 1; overflow-y: auto;">
            <p style="text-align: center; color: #666; font-size: 12px; margin-top: 40px;">Consultando inventario en tiempo real...</p>
        </div>
    </aside>

    <!-- 6. LÓGICA DE VISUALIZACIÓN Y CONSULTA EN TIEMPO REAL -->
    <script type="module">
        import GeokatuDB from './core-db.js';

        let idNegocio = localStorage.getItem('geokatu_active_uid') || null;
        const METRO_PX = 60;
        let perimetro = { anchoM: 12, largoM: 18 };
        let muebles = [];
        let celdasMurosBloqueadas = new Set();
        let catalogoTotal = [];
        let stockPosicionalGlobal = []; // Array de { id_prod, id_estante, id_comp, cantidad, lote, vencimiento }
        let capaActiva = "TODO";

        // Viewport
        let viewport = { x: window.innerWidth / 2 - 360, y: 120, escala: 1 };
        let arrastrando = false;
        let inicioRaton = { x: 0, y: 0 };

        const capaTransform = document.getElementById('capa-transform');
        const canvasRejilla = document.getElementById('rejilla-canvas');
        const ctxRejilla = canvasRejilla.getContext('2d');
        const contenedorMuebles = document.getElementById('contenedor-muebles');
        const drawer = document.getElementById('panel-detalle-mueble');

        function actualizarTransform() {
            capaTransform.style.transform = `translate3d(${viewport.x}px, ${viewport.y}px, 0) scale(${viewport.escala})`;
        }

        // --- Paneo y Zoom ---
        const vp = document.getElementById('viewport-infinito');
        vp.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.mueble-bloque')) return;
            arrastrando = true;
            inicioRaton = { x: e.clientX - viewport.x, y: e.clientY - viewport.y };
            vp.setPointerCapture(e.pointerId);
        });
        vp.addEventListener('pointermove', (e) => {
            if (!arrastrando) return;
            viewport.x = e.clientX - inicioRaton.x;
            viewport.y = e.clientY - inicioRaton.y;
            actualizarTransform();
        });
        vp.addEventListener('pointerup', () => { arrastrando = false; });
        vp.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = e.deltaY > 0 ? 0.9 : 1.1;
            viewport.escala = Math.min(Math.max(0.4, viewport.escala * factor), 2.5);
            actualizarTransform();
        }, { passive: false });

        // --- Dibujar Área del Plano y Muros ---
        function redibujarArea() {
            const w = perimetro.anchoM * METRO_PX;
            const h = perimetro.largoM * METRO_PX;
            canvasRejilla.width = w;
            canvasRejilla.height = h;
            canvasRejilla.style.width = `${w}px`;
            canvasRejilla.style.height = `${h}px`;

            ctxRejilla.clearRect(0, 0, w, h);
            ctxRejilla.fillStyle = 'rgba(25, 25, 32, 0.9)';
            ctxRejilla.fillRect(0, 0, w, h);

            ctxRejilla.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctxRejilla.lineWidth = 1;
            for (let x = 0; x <= w; x += METRO_PX) {
                ctxRejilla.beginPath(); ctxRejilla.moveTo(x, 0); ctxRejilla.lineTo(x, h); ctxRejilla.stroke();
            }
            for (let y = 0; y <= h; y += METRO_PX) {
                ctxRejilla.beginPath(); ctxRejilla.moveTo(0, y); ctxRejilla.lineTo(w, y); ctxRejilla.stroke();
            }

            ctxRejilla.strokeStyle = '#ff6b00';
            ctxRejilla.lineWidth = 3;
            ctxRejilla.strokeRect(0, 0, w, h);

            // Muros y columnas
            celdasMurosBloqueadas.forEach(coord => {
                const [cx, cy] = coord.split(',').map(Number);
                ctxRejilla.fillStyle = 'rgba(255, 68, 68, 0.45)';
                ctxRejilla.fillRect(cx * METRO_PX, cy * METRO_PX, METRO_PX, METRO_PX);
                ctxRejilla.strokeStyle = '#ff4444';
                ctxRejilla.lineWidth = 1;
                ctxRejilla.strokeRect(cx * METRO_PX, cy * METRO_PX, METRO_PX, METRO_PX);
            });
        }

        // --- Renderizar Muebles Bloqueados para Consulta ---
        function renderizarMueblesVisor() {
            contenedorMuebles.innerHTML = '';
            const hoy = new Date();

            muebles.forEach(m => {
                const el = document.createElement('div');
                el.classList.add('mueble-bloque');
                el.id = `mueble-visor-${m.id_mueble}`;
                el.style.width = `${m.anchoM * METRO_PX}px`;
                el.style.height = `${m.largoM * METRO_PX}px`;
                el.style.left = `${m.x}px`;
                el.style.top = `${m.y}px`;
                el.style.transform = `rotate(${m.rotacion || 0}deg)`;

                // Consultar artículos en este mueble
                const itemsEnMueble = stockPosicionalGlobal.filter(s => s.id_estante === m.id_mueble || s.id_estante === m.qr);

                // Aplicar Capas Temáticas
                if (capaActiva === "VENCIMIENTOS") {
                    let tieneVencimientoUrgente = false;
                    let tieneVencimientoProximo = false;

                    itemsEnMueble.forEach(it => {
                        if (it.fecha_vencimiento) {
                            const fVenc = new Date(it.fecha_vencimiento);
                            const diasRestantes = Math.ceil((fVenc - hoy) / (1000 * 60 * 60 * 24));
                            if (diasRestantes <= 5) tieneVencimientoUrgente = true;
                            else if (diasRestantes <= 15) tieneVencimientoProximo = true;
                        }
                    });

                    if (tieneVencimientoUrgente) el.classList.add('alerta-vencimiento-rojo');
                    else if (tieneVencimientoProximo) el.classList.add('alerta-vencimiento-amarillo');
                } else if (capaActiva === "STOCK_CERO") {
                    const totalUnidades = itemsEnMueble.reduce((acc, x) => acc + (x.cantidad || 0), 0);
                    if (totalUnidades === 0) el.classList.add('alerta-vencimiento-rojo');
                }

                // Cuadrícula interior visual
                const subGrid = document.createElement('div');
                subGrid.classList.add('mueble-subdivisiones');
                const cols = Math.ceil(Math.sqrt(m.subdivisionesXNivel || 4));
                subGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                for (let i = 0; i < (m.subdivisionesXNivel || 4); i++) {
                    const c = document.createElement('div');
                    c.classList.add('subdivision-celda');
                    subGrid.appendChild(c);
                }
                el.appendChild(subGrid);

                const tag = document.createElement('div');
                tag.classList.add('mueble-etiqueta');
                tag.innerText = `${m.nombre}\n[${m.zona === 'BODEGA' ? 'Bodega' : 'Piso Venta'}]`;
                el.appendChild(tag);

                // Clic para inspeccionar stock físico
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    abrirFichaMueble(m, itemsEnMueble);
                });

                contenedorMuebles.appendChild(el);
            });
        }

        // --- Inspección Detallada del Estante ---
        function abrirFichaMueble(mueble, items) {
            document.getElementById('txt-mueble-id-físico').innerText = mueble.qr;
            document.getElementById('txt-mueble-nombre').innerText = mueble.nombre;

            const listaEl = document.getElementById('lista-productos-estante');
            listaEl.innerHTML = '';

            if (items.length === 0) {
                listaEl.innerHTML = `
                    <div style="text-align: center; color: #777; padding: 30px 10px;">
                        <span style="font-size: 32px; opacity: 0.5;">📭</span>
                        <p style="margin-top: 8px; font-size: 12px;">No hay existencias registradas en este mueble.</p>
                    </div>
                `;
            } else {
                const hoy = new Date();
                items.forEach(it => {
                    const prodInfo = catalogoTotal.find(p => p.id_prod === it.id_prod || p.codigo_barras === it.id_prod) || {};
                    const diasVenc = it.fecha_vencimiento ? Math.ceil((new Date(it.fecha_vencimiento) - hoy) / (1000 * 60 * 60 * 24)) : null;

                    let tagVencHTML = '';
                    if (diasVenc !== null) {
                        if (diasVenc <= 0) tagVencHTML = `<span class="tag-vencimiento venc-urgente">¡VENCIDO! (${it.fecha_vencimiento})</span>`;
                        else if (diasVenc <= 5) tagVencHTML = `<span class="tag-vencimiento venc-urgente">Vence en ${diasVenc} días</span>`;
                        else if (diasVenc <= 15) tagVencHTML = `<span class="tag-vencimiento venc-proximo">Vence en ${diasVenc} días</span>`;
                        else tagVencHTML = `<span class="tag-vencimiento venc-optimo">${it.fecha_vencimiento}</span>`;
                    }

                    const div = document.createElement('div');
                    div.classList.add('item-inventario-fila');
                    div.innerHTML = `
                        <div style="width: 42px; height: 42px; border-radius: 8px; overflow: hidden; background: #000; flex-shrink: 0;">
                            <img src="${prodInfo.imagen || 'https://via.placeholder.com/60/0a0a0c/ff6b00?text=SKU'}" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div style="flex: 1; min-width: 0;">
                            <strong style="display: block; font-size: 12px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${prodInfo.nombre || it.id_prod}</strong>
                            <span style="font-size: 10px; color: #888; font-family: monospace;">Bin: ${it.id_compartimiento || 'N/A'} | Lote: ${it.lote || 'S/L'}</span>
                            <div style="margin-top: 4px;">${tagVencHTML}</div>
                        </div>
                        <div style="text-align: right;">
                            <span style="font-size: 16px; font-weight: 900; color: #00ff64; font-family: monospace;">${it.cantidad || 0}</span>
                            <span style="display: block; font-size: 9px; color: #888;">unds</span>
                        </div>
                    `;
                    listaEl.appendChild(div);
                });
            }

            drawer.classList.add('visible');
        }

        document.getElementById('btn-cerrar-drawer').addEventListener('click', () => {
            drawer.classList.remove('visible');
        });

        // --- CARGA LOCAL-FIRST CON HIDRATACIÓN POR DELTAS ---
        async function hidratarVisor() {
            if (!idNegocio) return;

            const claveCachePlano = `geokatu_plano_${idNegocio}`;
            const claveCacheStockUbis = `geokatu_stock_ubis_${idNegocio}`;
            const claveSyncTimestamp = `geokatu_sync_ubis_time_${idNegocio}`;

            // 1. CARGA EN 0 MS DESDE DISCO LOCAL
            const cachePlano = localStorage.getItem(claveCachePlano);
            const cacheUbis = localStorage.getItem(claveCacheStockUbis);

            if (cachePlano) {
                const planoData = JSON.parse(cachePlano);
                if (planoData.perimetro) perimetro = planoData.perimetro;
                if (Array.isArray(planoData.elementos)) muebles = planoData.elementos;
                if (Array.isArray(planoData.muros)) celdasMurosBloqueadas = new Set(planoData.muros);
            }

            if (cacheUbis) {
                stockPosicionalGlobal = JSON.parse(cacheUbis);
            }

            catalogoTotal = GeokatuDB.PosService.cargarCatalogoDesdeCache(idNegocio);

            redibujarArea();
            renderizarMueblesVisor();
            actualizarTransform();

            // 2. HIDRATACIÓN EN SEGUNDO PLANO (Deltas)
            try {
                if (!cachePlano) {
                    const resPlano = await GeokatuDB.RadarService.obtenerMapaBodega(idNegocio, "PLANO_PRINCIPAL");
                    if (resPlano.success && resPlano.data) {
                        localStorage.setItem(claveCachePlano, JSON.stringify(resPlano.data));
                        if (resPlano.data.perimetro) perimetro = resPlano.data.perimetro;
                        if (Array.isArray(resPlano.data.elementos)) muebles = resPlano.data.elementos;
                        if (Array.isArray(resPlano.data.muros)) celdasMurosBloqueadas = new Set(resPlano.data.muros);
                        redibujarArea();
                        renderizarMueblesVisor();
                    }
                }

                const resCat = await GeokatuDB.PosService.descargarCatalogoLocal(idNegocio);
                if (resCat.success) catalogoTotal = resCat.data;

                const ultimoSync = localStorage.getItem(claveSyncTimestamp) || null;
                const resUbis = await GeokatuDB.InventarioService.obtenerMapaStockTiendaCompleto(idNegocio, ultimoSync);

                if (resUbis.success) {
                    if (resUbis.esDelta && resUbis.data.length > 0) {
                        resUbis.data.forEach(delta => {
                            const idx = stockPosicionalGlobal.findIndex(s => s.id_prod === delta.id_prod && s.id_compartimiento === delta.id_compartimiento);
                            if (idx !== -1) {
                                stockPosicionalGlobal[idx] = delta;
                            } else {
                                stockPosicionalGlobal.push(delta);
                            }
                        });
                        console.log(`[GEOKATU SIG] Hidratados ${resUbis.data.length} deltas de stock posicional.`);
                    } else if (!resUbis.esDelta) {
                        stockPosicionalGlobal = resUbis.data;
                        console.log(`[GEOKATU SIG] Carga inicial completa de stock: ${resUbis.data.length} registros.`);
                    }

                    localStorage.setItem(claveCacheStockUbis, JSON.stringify(stockPosicionalGlobal));
                    localStorage.setItem(claveSyncTimestamp, resUbis.timestampCorte);

                    if (resUbis.data.length > 0) {
                        renderizarMueblesVisor();
                    }
                }

                // 3. RADAR EN VIVO: Escuchar cambios de stock
                GeokatuDB.InventarioService.escucharCambiosStock(idNegocio, (prodActualizado) => {
                    const prod = catalogoTotal.find(p => p.id_prod === prodActualizado.id_prod);
                    if (prod && prodActualizado.stock_actual !== undefined) {
                        prod.stock_actual = prodActualizado.stock_actual;
                    }
                    if (drawer.classList.contains('visible')) {
                        const items = stockPosicionalGlobal.filter(s => s.id_prod === prodActualizado.id_prod);
                        if (items.length > 0 && muebles.some(m => m.id_mueble === items[0].id_estante)) {
                            items.forEach(it => it.cantidad = prodActualizado.stock_actual);
                        }
                    }
                });

            } catch (err) {
                console.warn("[Visor Tienda] Error en hidratación en segundo plano:", err);
            }
        }

        // --- 7. VERIFICACIÓN DE PERMISOS PARA BOTÓN EDITAR PLANO SIG ---
        GeokatuDB.SecurityService.observarEstadoSesion(async (user) => {
            if (user && idNegocio) {
                try {
                    const { success, data } = await GeokatuDB.SecurityService.obtenerRolAdmin(user.uid);
                    if (success && (data.rol === 'admin' || data.rol === 'superadmin' || user.uid === idNegocio)) {
                        const btnEditor = document.getElementById('btn-ir-editor');
                        if (btnEditor) btnEditor.style.display = 'inline-block';
                    }
                } catch (eRol) {
                    console.warn("[Visor Tienda] No se pudo verificar rol de admin:", eRol);
                }
            }
        });

        // --- Control de Capas Temáticas ---
        document.querySelectorAll('.badge-filtro').forEach(btn => {
            if (btn.id === 'btn-ir-editor') return; // Excluir botón de navegación de las capas
            btn.addEventListener('click', () => {
                document.querySelectorAll('.badge-filtro').forEach(b => {
                    if (b.id !== 'btn-ir-editor') b.classList.remove('activo');
                });
                btn.classList.add('activo');
                capaActiva = btn.getAttribute('data-capa');
                renderizarMueblesVisor();
            });
        });

        // --- Buscador Multicriterio ---
        document.getElementById('visor-busqueda').addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            document.querySelectorAll('.mueble-bloque').forEach(m => m.classList.remove('radar-activo'));
            if (!query) return;

            const prodsCoincidentes = catalogoTotal.filter(p => 
                p.nombre.toLowerCase().includes(query) || 
                (p.codigo_barras && p.codigo_barras.includes(query)) ||
                (p.categoria && p.categoria.toLowerCase().includes(query))
            );

            const idsProds = prodsCoincidentes.map(p => p.id_prod);
            const ubicaciones = stockPosicionalGlobal.filter(s => idsProds.includes(s.id_prod) || (s.lote && s.lote.toLowerCase().includes(query)));

            ubicaciones.forEach(u => {
                const muebleEl = document.getElementById(`mueble-visor-${u.id_estante}`);
                if (muebleEl) muebleEl.classList.add('radar-activo');
            });
        });

        document.getElementById('btn-limpiar-filtros').addEventListener('click', () => {
            document.getElementById('visor-busqueda').value = '';
            document.querySelectorAll('.mueble-bloque').forEach(m => m.classList.remove('radar-activo'));
        });

        // --- Cámara Rápida para Consulta In Situ ---
        let html5QrCodeVisor = null;
        document.getElementById('btn-abrir-camara').addEventListener('click', () => {
            document.getElementById('modal-camara').style.display = 'flex';
            if (!html5QrCodeVisor) {
                html5QrCodeVisor = new Html5Qrcode("lector-camara-visor");
            }
            html5QrCodeVisor.start(
                { facingMode: "environment" },
                { fps: 15, qrbox: 200 },
                (codigo) => {
                    document.getElementById('visor-busqueda').value = codigo;
                    document.getElementById('visor-busqueda').dispatchEvent(new Event('input'));
                    cerrarCamara();
                },
                () => {}
            );
        });

        function cerrarCamara() {
            if (html5QrCodeVisor && html5QrCodeVisor.isScanning) {
                html5QrCodeVisor.stop().then(() => {
                    document.getElementById('modal-camara').style.display = 'none';
                });
            } else {
                document.getElementById('modal-camara').style.display = 'none';
            }
        }
        document.getElementById('btn-cerrar-camara').addEventListener('click', cerrarCamara);

        hidratarVisor();
    </script>
</body>
</html>
