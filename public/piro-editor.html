<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GEOKATU Studio · Editor Zero-Scroll</title>
<style>
  :root {
    --bg: #07090e;
    --panel: #101521;
    --panel-2: #171f30;
    --border: rgba(255, 255, 255, 0.11);
    --border-hi: rgba(255, 255, 255, 0.24);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --naranja: #ff6b00;
    --miel: #ffb300;
    --verde: #22c55e;
    --azul: #38bdf8;
    --rojo: #ef4444;
    --morado: #a855f7;
    --radius: 13px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
    overflow: hidden; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px; line-height: 1.38;
  }
  button, input, textarea, select { font-family: inherit; color: var(--text); }
  .svg-ico { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .hidden { display: none !important; }

  .app { display: flex; flex-direction: column; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: var(--bg); }

  /* BARRA SUPERIOR COMPACTA 44PX + BOTÓN NARANJA ▶ IZQUIERDO */
  .top-slim {
    height: 44px; flex-shrink: 0; padding: 0 8px;
    background: rgba(11, 15, 23, 0.98); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .top-left { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; }
  .btn-drawer-orange {
    width: 34px; height: 32px; flex-shrink: 0; border-radius: 9px;
    border: 1px solid #ff8533;
    background: linear-gradient(135deg, var(--naranja), #ea580c);
    color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(255, 107, 0, 0.35);
  }
  .btn-drawer-orange:active { transform: scale(0.94); }
  .ctx-title { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .ctx-title strong { font-size: 12.5px; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctx-title small { font-size: 10px; color: var(--azul); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 6px 10px; border-radius: 9px; border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.06); font-size: 11.5px; font-weight: 800;
    cursor: pointer; white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--naranja), #ea580c); border-color: var(--naranja); color: #fff; }
  .btn-blue { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.45); color: var(--azul); }
  .btn-green { background: rgba(34, 197, 94, 0.18); border-color: rgba(34, 197, 94, 0.5); color: #86efac; }
  .btn-purple { background: rgba(168, 85, 247, 0.18); border-color: rgba(168, 85, 247, 0.48); color: #d8b4fe; }
  .btn-danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
  .btn-xs { padding: 4px 8px; font-size: 10.5px; border-radius: 7px; }
  .inp, .txt, .sel {
    width: 100%; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: rgba(5, 8, 14, 0.85);
    font-size: 12px; outline: none;
  }
  .inp:focus, .txt:focus, .sel:focus { border-color: var(--naranja); }
  .pill {
    font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 99px;
    border: 1px solid var(--border); background: rgba(255, 255, 255, 0.05); color: var(--muted); white-space: nowrap;
  }
  .pill.ok { color: #86efac; border-color: rgba(34, 197, 94, 0.45); background: rgba(34, 197, 94, 0.14); }
  .pill.warn { color: #fcd34d; border-color: rgba(245, 158, 11, 0.45); background: rgba(245, 158, 11, 0.14); }
  .field { margin-bottom: 7px; }
  .field label { display: block; font-size: 10px; font-weight: 800; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; }

  /* VISTAS INTERNAS ZERO-SCROLL */
  .view-pane { flex: 1; min-height: 0; overflow: hidden; display: none; flex-direction: column; }
  .view-pane.activa { display: flex; }

  /* GUION IA ZERO-SCROLL */
  .compact-pane {
    flex: 1; min-height: 0; padding: 10px; display: flex; flex-direction: column; gap: 7px;
    overflow: hidden; max-width: 780px; width: 100%; margin: 0 auto;
  }
  .carousel-stage {
    flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 10px;
    overflow-x: auto; overflow-y: hidden; padding: 10px; scroll-snap-type: x mandatory;
  }
  .slide-card {
    flex: 0 0 min(88vw, 340px); height: 100%; scroll-snap-align: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px; display: flex; flex-direction: column; gap: 7px; overflow: hidden;
  }

  /* TIMELINE STAGE + PISTAS + DOCK SNAPSEED */
  .tl-stage-wrap {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, #121826, #05070b);
    padding: 30px 8px 4px 8px;
  }
  .stage-float-top {
    position: absolute; top: 5px; left: 8px; right: 8px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; pointer-events: none;
  }
  .float-grp { display: flex; gap: 4px; pointer-events: auto; }
  .mini-pill {
    padding: 3px 8px; border-radius: 7px; border: 1px solid var(--border);
    background: rgba(10, 14, 22, 0.88); color: var(--text); font-size: 10px; font-weight: 800; cursor: pointer;
  }
  .mini-pill.on { border-color: var(--azul); color: var(--azul); background: rgba(56, 189, 248, 0.16); }
  #canvas-preview {
    display: block; border-radius: 9px; border: 1px solid rgba(255, 255, 255, 0.16);
    background: #0d1117; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
  }
  .transport-bar {
    height: 36px; flex-shrink: 0; padding: 0 8px;
    background: rgba(12, 16, 25, 0.96); border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .timecode { font-family: monospace; font-size: 11px; font-weight: 900; color: var(--azul); }

  /* PISTAS HORIZONTALES COMPACTAS (108PX FIJO) */
  .timeline-tracks {
    flex-shrink: 0; height: 106px; background: rgba(9, 12, 19, 0.98);
    border-top: 1px solid var(--border); overflow-x: auto; overflow-y: hidden;
    position: relative; padding: 5px 8px; display: flex; flex-direction: column; gap: 4px;
  }
  .tl-playhead {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--naranja);
    box-shadow: 0 0 8px var(--naranja); pointer-events: none; z-index: 20; left: 60px;
  }
  .tl-row { display: flex; align-items: stretch; gap: 5px; height: 29px; position: relative; }
  .tl-label {
    position: sticky; left: 0; z-index: 15; width: 46px; flex-shrink: 0;
    background: rgba(14, 18, 28, 0.96); border: 1px solid var(--border); border-radius: 6px;
    font-size: 9px; font-weight: 800; color: var(--muted); text-transform: uppercase;
    display: flex; align-items: center; justify-content: center;
  }
  .tl-clips { display: flex; align-items: stretch; gap: 4px; }
  .tl-clip {
    flex-shrink: 0; border-radius: 6px; border: 1px solid var(--border);
    background: rgba(30, 41, 59, 0.78); padding: 2px 6px; cursor: pointer;
    display: flex; align-items: center; gap: 5px; overflow: hidden; text-align: left;
  }
  .tl-clip.activo { border-color: var(--naranja); box-shadow: 0 0 0 1px var(--naranja) inset; background: rgba(255, 107, 0, 0.2); }
  .tl-clip-thumb { width: 20px; height: 22px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: #05070b; }
  .tl-clip-txt { min-width: 0; flex: 1; }
  .tl-clip-txt strong { display: block; font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .tl-clip-txt small { display: block; font-size: 8.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-audio {
    flex-shrink: 0; border-radius: 6px; border: 1px dashed rgba(245, 158, 11, 0.45);
    background: rgba(245, 158, 11, 0.08); padding: 2px 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 9.5px; color: #fcd34d;
  }
  .tl-audio.listo { border-style: solid; border-color: rgba(34, 197, 94, 0.55); background: rgba(34, 197, 94, 0.14); color: #86efac; }
  .tl-audio.activo { outline: 1.5px solid var(--naranja); }
  .tl-fx {
    flex-shrink: 0; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.28);
    background: rgba(56, 189, 248, 0.08); padding: 2px 6px; cursor: pointer;
    display: flex; align-items: center; font-size: 9px; color: #7dd3fc; overflow: hidden; white-space: nowrap;
  }

  /* DOCK INFERIOR ESTILO SNAPSEED (114PX FIJO) */
  .snapseed-dock {
    height: 114px; flex-shrink: 0; background: rgba(12, 16, 25, 0.99);
    border-top: 1px solid var(--border-hi);
    display: flex; flex-direction: column; justify-content: center;
    padding: 6px 8px; overflow: hidden;
  }
  .tool-strip {
    display: flex; align-items: center; gap: 6px;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none; height: 100%; padding: 2px;
  }
  .tool-strip::-webkit-scrollbar { display: none; }
  .tool-btn {
    flex: 0 0 auto; min-width: 66px; height: 74px; padding: 6px;
    border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    cursor: pointer; color: #cbd5e1; font-size: 10.5px; font-weight: 800;
  }
  .tool-btn.activo { border-color: var(--naranja); background: rgba(255, 107, 0, 0.18); color: #fff; }
  .tool-btn.accent { border-color: rgba(56, 189, 248, 0.45); color: #7dd3fc; }
  .subpanel { display: flex; flex-direction: column; justify-content: space-between; height: 100%; gap: 5px; }
  .sub-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .sub-title { font-size: 10.5px; font-weight: 900; color: var(--miel); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-row { display: flex; align-items: center; gap: 5px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .sub-row::-webkit-scrollbar { display: none; }
  .sel-mini { padding: 4px 6px; border-radius: 7px; border: 1px solid var(--border); background: rgba(5, 8, 14, 0.9); font-size: 11px; width: auto; min-width: 78px; }

  /* DRAWER LATERAL IZQUIERDO (BOTÓN ▶ NARANJA) */
  .drawer-ov {
    position: fixed; inset: 0; z-index: 70000; background: rgba(4, 6, 11, 0.72);
    backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .drawer-ov.open { opacity: 1; pointer-events: auto; }
  .drawer-panel {
    position: absolute; top: 0; left: 0; bottom: 0; width: min(84vw, 310px);
    background: linear-gradient(165deg, #151c2c, #0a0e16);
    border-right: 1px solid var(--border-hi);
    transform: translateX(-104%); transition: transform .2s ease;
    display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow: hidden;
  }
  .drawer-ov.open .drawer-panel { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .drawer-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .drawer-sec-lbl { font-size: 10px; font-weight: 900; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .drawer-item {
    width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04); text-align: left; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 700;
  }
  .drawer-item.activo { border-color: var(--naranja); background: rgba(255, 107, 0, 0.18); color: #fff; }

  /* MODALES */
  .modal-ov {
    position: fixed; inset: 0; z-index: 80000; background: rgba(4, 6, 10, 0.84);
    backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 12px;
  }
  .modal-ov.open { display: flex; }
  .modal-card {
    width: 100%; max-width: 520px; max-height: 88dvh; overflow-y: auto;
    background: linear-gradient(155deg, #161c2a, #0b0e16);
    border: 1px solid var(--border-hi); border-radius: 16px; padding: 14px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 13.5px; font-weight: 800; }
  .card-sub { background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 10px; margin-bottom: 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }

  #toasts-ed { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 95000; display: flex; flex-direction: column; gap: 5px; pointer-events: none; max-width: 92vw; }
  .toast-ed { padding: 8px 13px; border-radius: 99px; font-size: 11.5px; font-weight: 800; background: rgba(12, 16, 25, 0.96); border: 1px solid var(--border); text-align: center; }
  .toast-ed.exito { border-color: rgba(34, 197, 94, 0.6); color: #86efac; }
  .toast-ed.error { border-color: rgba(239, 68, 68, 0.6); color: #fca5a5; }
  .toast-ed.info { border-color: rgba(56, 189, 248, 0.6); color: #7dd3fc; }
</style>
</head>
<body>

<div class="app">
  <!-- BARRA SUPERIOR COMPACTA CON BOTÓN ▶ NARANJA -->
  <header class="top-slim">
    <div class="top-left">
      <button type="button" class="btn-drawer-orange" title="Menú Editor" onclick="window.toggleDrawerEd(true)">
        <svg class="svg-ico" style="fill:currentColor; stroke:none;" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"/></svg>
      </button>
      <div class="ctx-title">
        <strong id="hdr-ed-tit">Editor</strong>
        <small id="hdr-ed-sub">Cargando...</small>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:5px;">
      <button type="button" class="btn btn-xs btn-blue" id="btn-switch-vista" onclick="window.toggleVistaRapida()">Timeline</button>
      <span id="badge-sync-ed" class="pill">...</span>
    </div>
  </header>

  <!-- PESTAÑA 1: GUION IA ZERO-SCROLL -->
  <section id="pane-guion" class="view-pane activa"></section>

  <!-- PESTAÑA 2: TIMELINE ZERO-SCROLL ESTILO SNAPSEED + YOUCUT -->
  <section id="pane-timeline" class="view-pane">
    <div class="tl-stage-wrap" id="tl-stage-wrap">
      <div class="stage-float-top">
        <div class="float-grp">
          <button type="button" class="mini-pill on" id="btn-safe-mini" onclick="window.toggleSafeZones()">Safe: ON</button>
          <span class="mini-pill" id="badge-clip-num" style="pointer-events:none; color:#fdba74;">Clip 0/0</span>
        </div>
        <button type="button" class="mini-pill on" id="btn-asp-mini" onclick="window.toggleAspectoRapido()">9:16</button>
      </div>
      <canvas id="canvas-preview" width="540" height="960"></canvas>
    </div>

    <div class="transport-bar">
      <div style="display:flex; gap:5px; align-items:center;">
        <button type="button" class="btn btn-xs btn-primary" id="btn-play-tl" onclick="window.togglePlayTimeline()">Play</button>
        <button type="button" class="btn btn-xs" onclick="window.detenerTimeline()">Stop</button>
        <button type="button" class="btn btn-xs" onclick="window.seleccionarClip(Math.max(0, clipSelIdx - 1))">←</button>
        <button type="button" class="btn btn-xs" onclick="window.seleccionarClip(clipSelIdx + 1)">→</button>
      </div>
      <span class="timecode" id="txt-timecode">00:00 / 00:00</span>
    </div>

    <div class="timeline-tracks" id="tl-scroll">
      <div class="tl-playhead" id="tl-playhead"></div>
      <div class="tl-row"><div class="tl-label">Vis</div><div class="tl-clips" id="track-visual"></div></div>
      <div class="tl-row"><div class="tl-label">Voz</div><div class="tl-clips" id="track-voces"></div></div>
      <div class="tl-row"><div class="tl-label">FX</div><div class="tl-clips" id="track-fx"></div></div>
    </div>

    <footer class="snapseed-dock" id="tl-dock"></footer>
  </section>
</div>

<!-- DRAWER LATERAL IZQUIERDO (SE ABRE CON BOTÓN ▶ NARANJA) -->
<div class="drawer-ov" id="drawer-ed" onclick="if(event.target.id==='drawer-ed') window.toggleDrawerEd(false)">
  <aside class="drawer-panel">
    <div class="drawer-head">
      <span id="badge-proy-ed" class="pill ok">Pirobonianos</span>
      <button type="button" class="btn btn-xs" onclick="window.toggleDrawerEd(false)">Cerrar</button>
    </div>
    <div class="drawer-scroll" id="drawer-ed-body"></div>
    <div style="border-top:1px solid var(--border); padding-top:8px; display:flex; gap:6px;">
      <button type="button" class="btn btn-xs btn-purple" style="flex:1;" onclick="window.toggleDrawerEd(false); window.abrirModalApis();"><span id="txt-btn-apis">APIs</span></button>
      <button type="button" class="btn btn-xs btn-blue" style="flex:1;" onclick="window.toggleDrawerEd(false); window.exportarPaqueteEpisodio();">Exportar Termux</button>
    </div>
  </aside>
</div>

<!-- MODAL: BÓVEDA LOCAL DE APIs -->
<div class="modal-ov" id="modal-apis" onclick="if(event.target.id==='modal-apis') window.cerrarModalApis()">
  <div class="modal-card">
        <div class="modal-head"><h3>Bóveda IA Cifrada (Nube)</h3><button type="button" class="btn btn-xs" onclick="window.cerrarModalApis()">Cerrar</button></div>
    <p style="margin:0 0 8px 0; font-size:11px; color:var(--muted);">Soporta APIs gratuitas (Groq, OpenRouter, Gemini) o pagas. Se cifran con AES-256-GCM en tu cuenta.</p>
    <div class="card-sub">
      <div class="grid-2">
        <div class="field"><label>Proveedor</label><select id="ed-v-prov" class="sel"><option value="gemini">Google Gemini</option><option value="groq">Groq (Gratis)</option><option value="openrouter">OpenRouter (Gratis/Pro)</option><option value="deepseek">DeepSeek</option><option value="openai">OpenAI (GPT)</option><option value="xai">xAI (Grok)</option><option value="elevenlabs">ElevenLabs (Voz)</option></select></div>
        <div class="field"><label>Modelo</label><input id="ed-v-mod" class="inp" placeholder="Ej: llama-3.3-70b-versatile"></div>
      </div>
      <div class="field"><label>API Key (se cifra y limpia)</label><input id="ed-v-key" type="password" autocomplete="off" spellcheck="false" class="inp" placeholder="Pega tu clave API"></div>
      <div style="display:flex; gap:6px;"><button type="button" class="btn btn-green" id="btn-ed-save-v" style="flex:1;" onclick="window.guardarKeyNubeEditor()">Vincular y Cifrar</button><button type="button" class="btn btn-blue" onclick="window.sincronizarBovedaEd(true)">Sincronizar</button></div>
    </div>
    <div id="ed-v-resumen" style="font-size:11px; color:#86efac;"></div>
  </div>
</div>

<!-- MODAL: REGLAS DE GUION (ANTI-IA + EJEMPLO + OJO DE DIRECTOR) -->
<div class="modal-ov" id="modal-reglas-guion" onclick="if(event.target.id==='modal-reglas-guion') window.cerrarModalReglasGuion()">
  <div class="modal-card">
    <div class="modal-head">
      <h3>Reglas de Guion y Estilo (Anti-IA)</h3>
      <button type="button" class="btn btn-xs" onclick="window.cerrarModalReglasGuion()">Cerrar</button>
    </div>
    <div class="field"><label>Normas de escritura del proyecto</label><textarea id="rg-normas" class="inp" rows="3" placeholder="Ej: Frases cortas, humor paisa natural, gancho en los primeros 2 segundos..."></textarea></div>
    <div class="field"><label>Frases prohibidas (clichés IA separados por coma)</label><textarea id="rg-prohibidas" class="inp" rows="2" placeholder="en un mundo donde, sin lugar a dudas, cabe destacar, prepárate para..."></textarea></div>
    <div class="field"><label>1 Ejemplo de diálogo que SÍ te gusta</label><textarea id="rg-ejemplo" class="inp" rows="3" placeholder="Ej: Fernando: ¿Otra vez pidiendo fiado? Mire que el letrero dice hoy no fío..."></textarea></div>
    <label style="display:flex; align-items:center; gap:7px; font-size:12px; color:#7dd3fc; font-weight:700; cursor:pointer; margin-bottom:10px;"><input type="checkbox" id="rg-director" style="accent-color:var(--azul);"> Activar 2ª pasada de revisión (Ojo de Director antes de entregar)</label>
    <div style="display:flex; justify-content:space-between; gap:8px;">
      <button type="button" class="btn btn-xs" onclick="window.restaurarReglasPorDefecto()">Restaurar Base</button>
      <button type="button" class="btn btn-primary" onclick="window.guardarReglasGuion()">Guardar Reglas</button>
    </div>
  </div>
</div>

  const bp = document.getElementById('badge-proy-ed'); if (bp) bp.textContent = proyectoActivo.nombre || 'Pirobonianos';

  if (GeokatuDB.PirobonianosService && navigator.onLine) {

    if (res.success && res.data && Array.isArray(res.data.personajes)) {
      if (!biblioteca.fecha_actualizacion || String(res.data.fecha_actualizacion || '') >= String(biblioteca.fecha_actualizacion)) {
        biblioteca = res.data;
        try { localStorage.setItem(kLoc, JSON.stringify(biblioteca)); } catch (e) {}
      }
      setSync(res.origen === 'nube' ? 'Nube OK' : 'Local', res.origen === 'nube' ? 'ok' : 'warn');
    } else {
      setSync('Local', 'warn');
    }
  } else {
    setSync('Offline', 'warn');
  }

  if (!Array.isArray(biblioteca.guiones)) biblioteca.guiones = [];
  if (biblioteca.guiones.length === 0) {
    biblioteca.guiones.push({
      id: 'ep001', titulo: 'Episodio 001',

    });
  }
  try {
    const rawUi = localStorage.getItem('piro_editor_ui_' + proyectoActivo.id);
    if (rawUi) {
      const u = JSON.parse(rawUi);
      if (!epIdActivo && u.epIdActivo && biblioteca.guiones.some(function(g) { return g.id === u.epIdActivo; })) epIdActivo = u.epIdActivo;
      if (typeof u.clipSelIdx === 'number') clipSelIdx = u.clipSelIdx;
      if (typeof u.zoomPxSeg === 'number') zoomPxSeg = u.zoomPxSeg;
      if (typeof u.duracionObjetivoSeg === 'number') duracionObjetivoSeg = u.duracionObjetivoSeg;
      if (u.vistaActual === 'timeline' || u.vistaActual === 'guion') vistaActual = u.vistaActual;

  biblioteca.fecha_actualizacion = new Date().toISOString();

  try { localStorage.setItem(getLocalBibKey(), JSON.stringify(limpioJson)); } catch (e) {}
  setSync('Guardando...', 'warn');
  clearTimeout(debounceSync);
  const run = async function() {
    if (!GeokatuDB.PirobonianosService) { setSync('Local', 'warn'); return; }
    const res = await GeokatuDB.PirobonianosService.guardarProyectoEDT(getDocBibId(), limpioJson);
    if (res.success && !res.offline) {
      hayCambiosPendientesEd = false;
      setSync('Nube OK', 'ok');

      setSync('Local', 'warn');
      if (res && res.error) toast('Aviso nube: ' + res.error, 'error');

window.cargarCapitulosMD = async function(files) {
  const g = getEp(); if (!g || !files || files.length === 0) return;
  const arr = Array.from(files).sort(function(a, b) {
    const ra = romanoAEntero(a.name.replace(/\.[^.]+$/, ''));
    const rb = romanoAEntero(b.name.replace(/\.[^.]+$/, ''));
    return ra !== rb ? (ra - rb) : a.name.localeCompare(b.name);
  });
  const textos = await Promise.all(arr.map(function(f) {
    return new Promise(function(res) { const r = new FileReader(); r.onload = function(ev) { res({ nom: f.name, txt: String(ev.target.result || '') }); }; r.readAsText(f); });
  }));
  g.anecdota = textos.map(function(t) { return '=== ' + t.nom + ' ===\n' + t.txt.trim(); }).join('\n\n');
  if (!g.titulo || /^Episodio\s/i.test(g.titulo)) g.titulo = textos.map(function(t) { return t.nom.replace(/\.[^.]+$/, ''); }).join(' + ');
  guardarBiblioteca(true); renderTodo();
  toast(textos.length + ' archivo(s) .md cargados.', 'exito');
};

window.editEp = function(campo, val) {
  const g = getEp(); if (!g) return;
  g[campo] = val;
  if (campo === 'titulo') actualizarHeaderEditor();
  if (campo === 'escenario_id' || campo === 'bilingue' || campo === 'tension') renderVistaGuionIA();
  guardarBiblioteca(false);
};

window.toggleRepartoEp = function(perId) {
  const g = getEp(); if (!g) return;
  if (!Array.isArray(g.reparto)) g.reparto = [];
  const i = g.reparto.indexOf(perId);
  if (i >= 0) g.reparto.splice(i, 1); else g.reparto.push(perId);
  guardarBiblioteca(true); renderVistaGuionIA();
};

async function llamarLLM(sysPrompt, userPrompt) {
  const cfg = obtenerCfgIAEditor();
  const res = await GeokatuDB.PirobonianosService.llamarProxyIA({ proveedorId: cfg.provLlm, accion: 'texto', tipoCobro: 'texto', modoPago: cfg.modoPago, modelo: cfg.modLlm, payload: { prompt: userPrompt, systemInstruction: { parts: [{ text: sysPrompt }] }, generationConfig: { temperature: 0.8 }, messages: [{ role: 'system', content: sysPrompt }, { role: 'user', content: userPrompt }], temperature: 0.8 } });
  if (!res || !res.success) throw new Error((res && res.error) || 'Error generando guion en servidor IA.');
  if (typeof res.saldoRestante === 'number') window.sincronizarBovedaEd(false);
  return String(res.texto || '');
}

    return {
      normas: 'Narrativa hard sci-fi tensa y cinematográfica. Frases directas de máximo 18 palabras. Cierra cada escena con tensión o giro técnico real.',

      ejemplo: 'NARRADOR: El sensor marcó cero coma tres segundos antes del colapso. DANIEL_CHEN: No fue un fallo de energía. Alguien abrió el canal desde adentro.',

}

function extraerArrayJsonLLM(raw) {
  const limpio = String(raw || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```$/, '').trim();
  const inicio = limpio.indexOf('['), fin = limpio.lastIndexOf(']');
  if (inicio < 0 || fin <= inicio) return null;
  try { const a = JSON.parse(limpio.slice(inicio, fin + 1)); return Array.isArray(a) && a.length > 0 ? a : null; } catch (e) { return null; }
}

window.generarGuionConAPI = async function() {
  const g = getEp(); if (!g) return;
  if (!g.anecdota || !g.anecdota.trim()) { toast('Escribe primero el texto base.', 'error'); return; }
  const btn = document.getElementById('btn-gen-guion-ia');
  if (btn) { btn.disabled = true; btn.textContent = 'Generando...'; }
  try {
    const rep = (g.reparto && g.reparto.length > 0) ? biblioteca.personajes.filter(function(p) { return g.reparto.indexOf(p.id) >= 0; }) : biblioteca.personajes;
    const actoresTxt = rep.map(function(p) { return p.id + ' (' + p.nombre + ' · ' + (p.raza || 'perro') + ' · ' + (p.personalidad || '') + ')'; }).join('\n');
    const escTxt = (biblioteca.escenarios || []).map(function(e) { return e.id + ' (' + e.nombre + ': zonas ' + (e.zonas || []).map(function(z) { return z.id + '=' + z.nombre; }).join(', ') + ')'; }).join('\n');
    const propsTxt = (biblioteca.props || []).filter(function(x) { return x.categoria !== 'audio'; }).map(function(x) { return x.id; }).join(', ');
    const sfxTxt = (biblioteca.props || []).filter(function(x) { return x.categoria === 'audio'; }).map(function(x) { return x.id; }).join(', ');
    const esBilingue = typeof g.bilingue === 'boolean' ? g.bilingue : Boolean(proyectoActivo.bilingue);
    const asp = getAspectoEp(g);
    const fmtTxt = asp === '16:9' ? 'horizontal panorámico 16:9 (YouTube serie animada)' : 'vertical 9:16 (YouTube Shorts / Reels / TikTok)';
    const planVeo = calcularPlanVeo(g.tension || 8);
    const rg = obtenerReglasGuion();
    const bloqueReglas = '\n\nREGLAS OBLIGATORIAS DE ESTILO:\n' + (rg.normas || '') + (rg.prohibidas ? ('\nFRASES PROHIBIDAS (NUNCA USAR): ' + rg.prohibidas) : '') + (rg.ejemplo ? ('\nEJEMPLO DE TONO Y RITMO QUE SÍ FUNCIONA:\n' + rg.ejemplo) : '');
    const sys = esBilingue
      ? 'Eres showrunner técnico de animación 2D hard sci-fi y motion-comic híbrido (Veo + cómic estático). Responde ÚNICAMENTE con un array JSON válido sin markdown.'
      : 'Eres guionista experto en comedia corta colombiana (estilo South Park / BoJack Horseman). Responde ÚNICAMENTE con un array JSON válido sin markdown.';
    const usr = (esBilingue
      ? ('Adapta este texto fuente de "' + proyectoActivo.nombre + '" en un episodio ' + fmtTxt + ' de 8 escenas (Tensión ' + (g.tension || 8) + '/10, ' + planVeo.cat + ').\nREGLA VEO: índices [' + planVeo.indices.join(', ') + '] (base 1) llevan "render_mode":"VEO_ANIMATED","modo":"plano". Las demás "STATIC_COMIC".\nClaves exactas: {"actor":"NARRADOR","escenario":"' + (g.escenario_id || 'esc_001') + '","zona":"' + (g.zona_id || 'zona_01') + '","posicion":"centro","ojos":"neutro|enojado|duda|indignado","camara":"centro|zoom_actor|plano_general","modo":"plano","render_mode":"STATIC_COMIC|VEO_ANIMATED","prop":"","sfx":"","duracion":5.5,"texto":"diálogo ES","texto_en":"English dialogue","prompt_plano":"base static ' + asp + ' frame prompt in English","veo_bridge_prompt":"5-6s Veo animation or slow_zoom_in"}\n\nETIQUETAS:\nPersonajes:\n' + actoresTxt + '\nEscenarios:\n' + escTxt + '\nProps: ' + (propsTxt || 'ninguno') + '\nSFX: ' + (sfxTxt || 'ninguno') + '\n\nTEXTO FUENTE:\n' + g.anecdota.slice(0, 12000))
      : ('Convierte esta anécdota en un guion dinámico ' + fmtTxt + ' de ~' + duracionObjetivoSeg + 's (7 a 12 líneas cortas, gancho fuerte y remate).\nClaves exactas: {"actor":"per_001","escenario":"' + (g.escenario_id || 'esc_001') + '","zona":"' + (g.zona_id || 'zona_01') + '","posicion":"izq|centro|der","ojos":"neutro|feliz|enojado|triste|duda|indignado","camara":"centro|izq|der|zoom_actor|plano_general","modo":"rig","prop":"","sfx":"","duracion":3.5,"texto":"diálogo colombiano","prompt_plano":"breve descripción ' + asp + ' en inglés"}\n\nETIQUETAS:\nPersonajes:\n' + actoresTxt + '\nEscenarios:\n' + escTxt + '\nProps: ' + (propsTxt || 'ninguno') + '\nSFX: ' + (sfxTxt || 'ninguno') + '\n\nANÉCDOTA:\n' + g.anecdota)) + bloqueReglas;

    const raw = await llamarLLM(sys, usr);
    let arr = extraerArrayJsonLLM(raw);
    if (!arr) throw new Error('JSON inválido devuelto por IA.');
    if (rg.ojo_director) {
      if (btn) btn.textContent = 'Revisando (Dir.)...';
      try {
        const usrDir = 'Actúa como director exigente viendo el borrador completo antes de grabar voces. Detecta y corrige: frases que suenen a IA o estén en la lista prohibida (' + (rg.prohibidas || 'clichés') + '), chistes flojos, líneas demasiado largas o expresiones de ojos repetitivas. Mantén EXACTAMENTE las mismas claves JSON e IDs válidos y devuelve ÚNICAMENTE el array JSON corregido.\n\nBORRADOR:\n' + JSON.stringify(arr);
        const rawDir = await llamarLLM(sys, usrDir);
        const arrDir = extraerArrayJsonLLM(rawDir);
        if (arrDir) arr = arrDir;
      } catch (eDir) {}
    }
    if (!Array.isArray(arr) || arr.length === 0) throw new Error('Guion vacío.');
    g.escenas = arr.map(function(it, idx) {
      const words = String(it.texto || '').trim().split(/\s+/).filter(Boolean).length;
      const durEst = Math.max(1.8, Math.min(9, Number(it.duracion) || Number((words / 2.7 + 0.7).toFixed(1))));
      return {
        id: 'sc_' + Date.now() + '_' + idx, actor: String(it.actor || (rep[0] ? rep[0].id : 'per_001')),
        escenario: String(it.escenario || g.escenario_id || 'esc_001'), zona: String(it.zona || g.zona_id || 'zona_01'),
        posicion: String(it.posicion || (idx % 2 === 0 ? 'izq' : 'der')), ojos: String(it.ojos || 'neutro'),
        camara: String(it.camara || 'centro'), modo: String(it.modo || 'rig'), prop: String(it.prop || ''), sfx: String(it.sfx || ''),
        duracion: durEst, texto: String(it.texto || ''), texto_en: String(it.texto_en || ''),
        render_mode: String(it.render_mode || 'STATIC_COMIC'), veo_bridge_prompt: String(it.veo_bridge_prompt || 'slow_zoom_in'),
        prompt_plano: String(it.prompt_plano || ''), audio_url: '', plano_url: ''
      };
    });
    clipSelIdx = 0; subGuionTab = 'escenas';
    guardarBiblioteca(true); renderTodo();
    toast('Guion generado (' + g.escenas.length + ' escenas).', 'exito');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Generar Guion'; }
  }
};

function ajustarCanvasPreview() {
  const cv = document.getElementById('canvas-preview');
  const wrap = document.getElementById('tl-stage-wrap');
  const g = getEp();
  if (!cv || !wrap || !g) return;
  const esH = getAspectoEp(g) === '16:9';
  const cw = esH ? 960 : 540, ch = esH ? 540 : 960;
  if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
  const maxW = Math.max(80, wrap.clientWidth - 16);
  const maxH = Math.max(80, wrap.clientHeight - 36);
  const r = Math.min(maxW / cw, maxH / ch);
  cv.style.width = Math.max(40, Math.floor(cw * r)) + 'px';
  cv.style.height = Math.max(40, Math.floor(ch * r)) + 'px';
}
window.addEventListener('resize', function() { if (vistaActual === 'timeline') ajustarCanvasPreview(); });

window.setZoomTimeline = function(val) { zoomPxSeg = val; renderTimeline(); };

window.agregarClipTimeline = function() {
  const g = getEp(); if (!g) return;
  if (!Array.isArray(g.escenas)) g.escenas = [];
  const act = (g.reparto && g.reparto[0]) || (biblioteca.personajes[0] ? biblioteca.personajes[0].id : 'per_001');
  g.escenas.push({
    id: 'sc_' + Date.now(), actor: act, escenario: g.escenario_id || 'esc_001', zona: g.zona_id || 'zona_01',
    posicion: g.escenas.length % 2 === 0 ? 'izq' : 'der', ojos: 'neutro', camara: 'centro',
    modo: 'rig', prop: '', sfx: '', duracion: 3.0, texto: '', prompt_plano: '', audio_url: '', plano_url: ''
  });
  clipSelIdx = g.escenas.length - 1; actorSelIdx = 0;
  guardarBiblioteca(true); renderTodo();
};

window.editEscena = function(idx, campo, val) {
  const g = getEp(); if (!g || !g.escenas || !g.escenas[idx]) return;
  g.escenas[idx][campo] = campo === 'duracion' ? Math.max(0.5, Number(val) || 2) : val;
  guardarBiblioteca(false);
  if (vistaActual === 'timeline') {
    if (campo !== 'texto' && campo !== 'texto_en' && campo !== 'prompt_plano' && campo !== 'veo_bridge_prompt') renderTimeline();
    window.renderPreviewCanvas();
  }
};

window.borrarEscena = function(idx) {
  const g = getEp(); if (!g || !g.escenas) return;
  g.escenas.splice(idx, 1);
  clipSelIdx = Math.max(0, Math.min(clipSelIdx, g.escenas.length - 1));
  actorSelIdx = 0;
  guardarBiblioteca(true); renderTodo();
};

window.moverClip = function(idx, d) {
  const g = getEp(); if (!g || !g.escenas) return;
  const dest = idx + d;
  if (dest < 0 || dest >= g.escenas.length) return;
  const tmp = g.escenas[idx]; g.escenas[idx] = g.escenas[dest]; g.escenas[dest] = tmp;
  clipSelIdx = dest;
  guardarBiblioteca(true); renderTimeline(); window.renderPreviewCanvas();
};

window.seleccionarClip = function(idx) {
  const g = getEp();
  const maxI = g && g.escenas ? Math.max(0, g.escenas.length - 1) : 0;
  clipSelIdx = Math.max(0, Math.min(idx, maxI));
  actorSelIdx = 0;
  if (!reproduciendo) {
    playOffsetSeg = inicioSegDeClip(clipSelIdx);
    actualizarPlayheadUI(playOffsetSeg);
  }
  renderTimeline();
  window.renderPreviewCanvas();

function duracionTotalEp() {
  const g = getEp(); if (!g || !Array.isArray(g.escenas)) return 0;
  return g.escenas.reduce(function(acc, sc) { return acc + (Number(sc.duracion) || 3); }, 0);
}

function inicioSegDeClip(idx) {
  const g = getEp(); if (!g || !Array.isArray(g.escenas)) return 0;
  let t = 0;
  for (let i = 0; i < idx && i < g.escenas.length; i++) t += (Number(g.escenas[i].duracion) || 3);
  return t;
}

function medirDuracionAudio(blob) {
  return new Promise(function(resolve) {
    const u = URL.createObjectURL(blob);
    const a = new Audio(u);
    a.onloadedmetadata = function() { const d = a.duration; URL.revokeObjectURL(u); resolve(Number.isFinite(d) && d > 0.2 ? Number(d.toFixed(2)) : 3.0); };
    a.onerror = function() { URL.revokeObjectURL(u); resolve(3.0); };
  });
}

window.cambiarMotorVozEditor = function(val) {
  iaCloud.provVoz = val || 'edge_tts';
  try { localStorage.setItem(CLAVE_PREFS_IA_ED, JSON.stringify(iaCloud)); } catch (e) {}
  renderDockTimeline();
  toast('Motor de voz: ' + iaCloud.provVoz, 'info');

function resolverVozPersonajeParaMotor(per, provVoz) {
  const p = per || {};
  if (provVoz === 'edge_tts') {
    const v = String(p.voz_es || p.voz_en || '').trim();
    return { voiceId: v || 'es-CO-GonzaloNeural', pitch: String(p.voz_pitch || '+0Hz').trim(), rate: String(p.voz_rate || '+0%').trim() };
  }
  if (provVoz === 'polly_free') return { voiceId: String(p.voz_polly || 'Miguel').trim() };
  if (provVoz === 'google_tts_free') return { voiceId: String(p.voz_gtts || 'es-CO').trim() };
  if (provVoz === 'gemini') return { voiceId: String(p.voz_gemini || 'Puck').trim() };
  if (provVoz === 'openai') return { voiceId: String(p.voz_openai || 'onyx').trim() };
  return { voiceId: String(p.voice_id || '').trim() };
}

window.generarVozClip = async function(idx) {
  const g = getEp(); const sc = g && g.escenas ? g.escenas[idx] : null;
  if (!sc) return;
  const cfgVoz = obtenerCfgIAEditor();
  if (!sc.texto || !sc.texto.trim()) { toast('Este clip no tiene diálogo.', 'error'); return; }
  const idVoz = (sc.hablante && sc.hablante !== 'ninguno') ? sc.hablante : sc.actor;
  const per = biblioteca.personajes.find(function(p) { return p.id === idVoz; });
  const vozCfg = resolverVozPersonajeParaMotor(per, cfgVoz.provVoz);
  if (cfgVoz.provVoz === 'elevenlabs' && !vozCfg.voiceId) { toast('Asigna voice_id de ElevenLabs a ' + (per ? per.nombre : sc.actor) + ' en Contenido, o cambia el motor a Edge $0.', 'error'); return; }
  const btn = document.getElementById('btn-gen-voz-clip');
  if (btn) { btn.disabled = true; btn.textContent = 'Sintetizando...'; }
  try {
    const resV = await GeokatuDB.PirobonianosService.llamarProxyIA({ proveedorId: cfgVoz.provVoz, accion: 'audio', tipoCobro: 'audio', modoPago: cfgVoz.modoPago, modelo: cfgVoz.modVoz, payload: { text: sc.texto, voiceId: vozCfg.voiceId, pitch: vozCfg.pitch || '+0Hz', rate: vozCfg.rate || '+0%', voice_settings: { stability: 0.45, similarity_boost: 0.78 } } });
    if (!resV || !resV.success || !resV.b64) throw new Error((resV && resV.error) || 'Error sintetizando voz.');
    if (typeof resV.saldoRestante === 'number') window.sincronizarBovedaEd(false);
    const mimeAud = resV.mime || 'audio/mpeg';
    const extAud = mimeAud.indexOf('wav') >= 0 ? 'wav' : 'mp3';
    const blob = base64ABlob(resV.b64, mimeAud);
    const dur = await medirDuracionAudio(blob);
    const fileObj = new File([blob], 'voz_' + (idx + 1) + '.' + extAud, { type: mimeAud });
    const up = await GeokatuDB.PirobonianosService.subirActivoPirobonianos(getEpStorageBucket(g.id), 'voces/' + Date.now() + '_clip_' + (idx + 1) + '.' + extAud, fileObj);
    if (!up.success) throw new Error(up.error || 'Error subiendo audio');
    sc.audio_url = up.url; sc.audio_storage = up.rutaStorage; sc.duracion = Number((dur + 0.25).toFixed(2));
    guardarBiblioteca(true); renderTimeline();
    toast('Voz ' + cfgVoz.provVoz + ' guardada (' + dur + 's).', 'exito');
  } catch (err) {
    toast('Error voz #' + (idx + 1) + ': ' + err.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = cfgVoz.esVozGratis ? 'Voz ($0)' : 'Generar Voz'; }
  }
};

        indices.push(i);
        const idVoz = (sc.hablante && sc.hablante !== 'ninguno') ? sc.hablante : sc.actor;
        const per = (biblioteca.personajes || []).find(function(p) { return p.id === idVoz; });
        if (!per || !per.voice_id || !per.voice_id.trim()) {
          const nom = per ? per.nombre : idVoz;
          if (sinVozPer.indexOf(nom) < 0) sinVozPer.push(nom);
        }
      }
    } else {
      if (sc.plano_url) { yaListos++; return; }
      if (sc.modo === 'plano') indices.push(i);
    }
  });
  if (indices.length === 0) {
    toast(tipo === 'voces' ? 'No hay clips pendientes de voz.' : 'No hay clips en modo Plano IA pendientes de imagen.', 'info');
    return;
  }
  lotePendienteTipo = tipo;
  lotePendienteIndices = indices;
    const cfgL = obtenerCfgIAEditor();
  document.getElementById('lote-conf-tit').textContent = tipo === 'voces' ? ('Confirmar Lote de Voces (' + cfgL.provVoz + ')') : ('Confirmar Lote de Planos (' + cfgL.provImg + ')');
  const alertas = [];
  if (tipo === 'voces' && !cfgL.listoVoz) alertas.push('Vincula ' + cfgL.provVoz + ' en Bóveda IA, recarga Créditos o cambia a Edge $0.');
  if (tipo === 'voces' && cfgL.provVoz === 'elevenlabs' && sinVozPer.length > 0) alertas.push('Personajes sin voice_id: ' + sinVozPer.join(', ') + '.');
  if (tipo === 'planos' && !cfgL.listoImg) alertas.push('Vincula tu clave de ' + cfgL.provImg + ' en Bóveda IA o recarga Créditos.');
  document.getElementById('lote-conf-body').innerHTML =
    '<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px;">' +
      '<div class="card-sub" style="margin:0; padding:7px;"><small style="color:var(--muted); display:block;">Formato</small><strong>' + esc(asp) + '</strong></div>' +
      '<div class="card-sub" style="margin:0; padding:7px;"><small style="color:var(--muted); display:block;">Por generar</small><strong style="color:var(--naranja);">' + indices.length + ' clips</strong></div>' +
    '</div>' +
    '<div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Ya listos (se saltan sin cobrar): <b>' + yaListos + '</b> · Modelo: <b>' + esc(tipo === 'voces' ? (cfgL.provVoz + (cfgL.esVozGratis ? ' (GRATIS $0)' : (' · ' + cfgL.modVoz + (cfgL.byokVoz ? ' (BYOK)' : (' · ' + (cfgL.tarifas.audio || 4) + ' cr'))))) : (cfgL.provImg + ' · ' + cfgL.modImg + (cfgL.byokImg ? ' (BYOK)' : (' · ' + (cfgL.tarifas.imagen || 6) + ' cr')))) + '</b></div>' +
    (alertas.length > 0 ? '<div style="padding:7px 9px; border-radius:8px; border:1px solid rgba(239,68,68,0.5); background:rgba(239,68,68,0.12); color:#fca5a5; font-size:11px; font-weight:700;">' + esc(alertas.join(' ')) + '</div>' : '<div style="font-size:11px; color:#86efac;">Consejo: prueba primero el clip #' + (indices[0] + 1) + ' para validar calidad antes de lanzar el lote.</div>');
  document.getElementById('btn-lote-prueba-1').textContent = 'Probar solo clip #' + (indices[0] + 1);
  document.getElementById('btn-lote-ejecutar-todo').textContent = 'Generar todos (' + indices.length + ')';
  document.getElementById('modal-confirm-lote').classList.add('open');
}

window.confirmarEjecutarLote = async function(soloPrimero) {
  const tipo = lotePendienteTipo;
  const lista = soloPrimero ? lotePendienteIndices.slice(0, 1) : lotePendienteIndices.slice();
  window.cerrarModalLote();
  if (!tipo || lista.length === 0) return;
  const btnId = tipo === 'voces' ? 'btn-lote-voces' : 'btn-lote-planos';
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.textContent = 'Procesando...'; }
  for (let k = 0; k < lista.length; k++) {
    if (tipo === 'voces') await window.generarVozClip(lista[k]);
    else await window.generarPlanoClip(lista[k]);
  }
  if (btn) { btn.disabled = false; btn.textContent = tipo === 'voces' ? 'Voces Lote' : 'Planos Lote'; }
};

window.generarVocesLote = function() { abrirConfirmacionLote('voces'); };

function base64ABlob(b64, mime) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime || 'image/png' });
}

window.generarPlanoClip = async function(idx) {
  const g = getEp(); const sc = g && g.escenas ? g.escenas[idx] : null;
  if (!sc) return;
    const cfgImg = obtenerCfgIAEditor();
  const per = biblioteca.personajes.find(function(p) { return p.id === sc.actor; });
  const escObj = biblioteca.escenarios.find(function(e) { return e.id === (sc.escenario || g.escenario_id); });
  const asp = getAspectoEp(g);
  const estiloRaw = proyectoActivo.estilo_visual || '2D cartoon animation frame, BoJack Horseman art style, clean black ink outlines, flat vibrant colors, no text.';
  const baseEstilo = asp === '16:9' ? ('Horizontal 16:9 widescreen cinematic frame. ' + estiloRaw.replace(/vertical\s*9:16/ig, 'horizontal 16:9 widescreen').replace(/9:16/g, '16:9')) : ('Vertical 9:16 portrait frame. ' + estiloRaw);
  const promptFinal = baseEstilo + ' Character: ' + (per ? (per.raza + ', ' + per.contextura + ', ' + per.pelaje_rasgos + ', wearing ' + per.vestuario_base) : sc.actor) + '. Expression: ' + (sc.ojos || 'neutro') + '. Setting: ' + (escObj ? (escObj.nombre + ', ' + escObj.iluminacion) : 'Colombian urban setting') + '. Action: ' + (sc.prompt_plano || sc.texto || 'talking expressively') + '.';
  const btn = document.getElementById('btn-gen-img-clip');
  if (btn) { btn.disabled = true; btn.textContent = 'Dibujando...'; }
  try {
        const szOai = cfgImg.modImg.indexOf('gpt-image') === 0 ? (asp === '16:9' ? '1536x1024' : '1024x1536') : (cfgImg.modImg.indexOf('dall-e-3') === 0 ? (asp === '16:9' ? '1792x1024' : '1024x1792') : '1024x1024');
    const resI = await GeokatuDB.PirobonianosService.llamarProxyIA({ proveedorId: cfgImg.provImg, accion: 'imagen', tipoCobro: 'imagen', modoPago: cfgImg.modoPago, modelo: cfgImg.modImg, payload: { prompt: promptFinal, aspectRatio: asp, size: szOai } });
    if (!resI || !resI.success || !resI.b64) throw new Error((resI && resI.error) || 'Sin datos de imagen.');
    if (typeof resI.saldoRestante === 'number') window.sincronizarBovedaEd(false);
    const b64 = resI.b64, mime = resI.mime || 'image/png';
    const blob = base64ABlob(b64, mime);
    const fileObj = new File([blob], 'plano_' + (idx + 1) + '.png', { type: mime });
    const up = await GeokatuDB.PirobonianosService.subirActivoPirobonianos(getEpStorageBucket(g.id), 'planos/' + Date.now() + '_clip_' + (idx + 1) + '.png', fileObj);
    if (!up.success) throw new Error(up.error || 'Error subiendo plano');
    sc.plano_url = up.url; sc.plano_storage = up.rutaStorage; sc.modo = 'plano';
    guardarBiblioteca(true); renderTimeline(); window.renderPreviewCanvas();
    toast('Plano guardado en clip #' + (idx + 1) + '.', 'exito');
  } catch (err) {
    toast('Error imagen: ' + err.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Imagen Gemini'; }
  }
};

window.generarPlanosLote = function() { abrirConfirmacionLote('planos'); };

window.quitarPlanoClip = function(idx) {
  const g = getEp(); const sc = g && g.escenas ? g.escenas[idx] : null;
  if (!sc) return;
  sc.plano_url = ''; sc.modo = 'rig';
  guardarBiblioteca(true); renderTimeline(); window.renderPreviewCanvas();
};

// =========================================================================
// 6. MULTI-ACTOR + PREVIEW + PLAYBACK CON ENVOLVENTE REAL Y L-CUTS
// =========================================================================
window.agregarActorClip = function(idx) {
  const g = getEp(); const sc = g && g.escenas ? g.escenas[idx] : null;
  if (!sc) return;
  sc.actores = normalizarActoresEscena(sc);
  const usados = sc.actores.map(function(a) { return a.id; });
  const sigPer = (biblioteca.personajes || []).find(function(p) { return usados.indexOf(p.id) < 0; }) || (biblioteca.personajes || [])[0];
  const posLibre = sc.actores.some(function(a) { return a.posicion === 'der'; }) ? (sc.actores.some(function(a) { return a.posicion === 'izq'; }) ? 'centro' : 'izq') : 'der';
  sc.actores.push({ id: sigPer ? sigPer.id : 'per_001', posicion: posLibre, ojos: 'duda', boca: 'boca_cerrada', brazo: 'brazo_delantero_reposo', rotCab: 0, rotBrazo: 0, prop: '', escala: 1 });
  actorSelIdx = sc.actores.length - 1;
  guardarBiblioteca(true); renderTimeline(); window.renderPreviewCanvas();
};

window.editActorClip = function(idx, aIdx, campo, val) {
  const g = getEp(); const sc = g && g.escenas ? g.escenas[idx] : null;
  if (!sc) return;
  sc.actores = normalizarActoresEscena(sc);
  if (!sc.actores[aIdx]) return;
  sc.actores[aIdx][campo] = val;
  if (campo === 'prop' && val) sc.actores[aIdx].brazo = 'brazo_delantero_prop';
  if (aIdx === 0) {
    if (campo === 'id') sc.actor = val;
    if (campo === 'posicion') sc.posicion = val;
    if (campo === 'ojos') sc.ojos = val;
  }
  guardarBiblioteca(false); renderTimeline(); window.renderPreviewCanvas();
};

window.quitarActorClip = function(idx, aIdx) {
  const g = getEp(); const sc = g && g.escenas ? g.escenas[idx] : null;
  if (!sc) return;
  sc.actores = normalizarActoresEscena(sc);
  if (sc.actores.length <= 1) return;
  sc.actores.splice(aIdx, 1);
  sc.actor = sc.actores[0].id;
  actorSelIdx = 0;
  guardarBiblioteca(true); renderTimeline(); window.renderPreviewCanvas();
};

window.renderPreviewCanvas = async function(bocaForzada, hablanteOverride, subtituloOverride) {
  const cv = document.getElementById('canvas-preview');
  const g = getEp();
  if (!cv || !g) return;
  const esH = getAspectoEp(g) === '16:9';
  const W = esH ? 960 : 540, H = esH ? 540 : 960;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; ajustarCanvasPreview(); }
  const ctx = cv.getContext('2d');
  const sc = (g.escenas || [])[clipSelIdx];
  await componerEscenaPiro(ctx, {
    escena: sc, episodio: g, biblioteca: biblioteca, ancho: W, alto: H, esHorizontal: esH,
    bocaHablante: bocaForzada || 'boca_cerrada', hablanteActivoId: hablanteOverride,
    subtituloOverride: subtituloOverride, safeZones: safeZonesOn
  });
};

function fmtSeg(s) { const n = Math.max(0, Math.floor(s)); return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); }
function actualizarPlayheadUI(seg) {
  const tc = document.getElementById('txt-timecode');
  if (tc) tc.textContent = fmtSeg(seg) + ' / ' + fmtSeg(duracionTotalEp());
  const ph = document.getElementById('tl-playhead');
  if (ph) ph.style.left = (59 + Math.round(seg * zoomPxSeg)) + 'px';
}

window.detenerTimeline = function() {
  reproduciendo = false;
  if (playRaf) { cancelAnimationFrame(playRaf); playRaf = null; }
  const aud = document.getElementById('audio-player-tl');
  if (aud) { aud.pause(); aud.currentTime = 0; }
  clipSonandoIdx = -1; clipAudioOrigenIdx = -1; audioOrigenInicioSeg = 0; envolventeActiva = null; playOffsetSeg = 0;
  const b = document.getElementById('btn-play-tl'); if (b) b.textContent = 'Play';
  actualizarPlayheadUI(0);
  window.renderPreviewCanvas('boca_cerrada');
};

window.togglePlayTimeline = function() {
  const g = getEp();
  if (!g || !g.escenas || g.escenas.length === 0) { toast('No hay clips para reproducir.', 'info'); return; }
  if (reproduciendo) {
    reproduciendo = false; if (playRaf) cancelAnimationFrame(playRaf);
    document.getElementById('audio-player-tl').pause();
    document.getElementById('btn-play-tl').textContent = 'Play';
    return;
  }
  const tot = duracionTotalEp();
  if (playOffsetSeg >= tot - 0.1) playOffsetSeg = 0;
  reproduciendo = true; clipSonandoIdx = -1; clipAudioOrigenIdx = -1; audioOrigenInicioSeg = 0; envolventeActiva = null;
  playInicioMs = performance.now() - playOffsetSeg * 1000;
  document.getElementById('btn-play-tl').textContent = 'Pausa';

  const tick = function(now) {
    if (!reproduciendo) return;
    const t = (now - playInicioMs) / 1000, total = duracionTotalEp();
    if (t >= total) { window.detenerTimeline(); return; }
    playOffsetSeg = t; actualizarPlayheadUI(t);
    let acum = 0, idxAct = 0;
    for (let i = 0; i < g.escenas.length; i++) {
      const d = Number(g.escenas[i].duracion) || 3;
      if (t < acum + d || i === g.escenas.length - 1) { idxAct = i; break; }
      acum += d;
    }
    if (idxAct !== clipSonandoIdx) {
      clipSonandoIdx = idxAct; clipSelIdx = idxAct; renderTimeline();
      const sc = g.escenas[idxAct], aud = document.getElementById('audio-player-tl');
      if (!(sc.continuar_audio && clipAudioOrigenIdx >= 0 && !sc.audio_url)) {
        if (sc.audio_url) {
          clipAudioOrigenIdx = idxAct; audioOrigenInicioSeg = acum; envolventeActiva = null;
          extraerEnvolventeAudio(sc.audio_url, 24).then(function(env) { if (clipAudioOrigenIdx === idxAct) envolventeActiva = env; });
          aud.src = sc.audio_url; aud.currentTime = Math.max(0, t - acum); aud.play().catch(function() {});
        } else {
          clipAudioOrigenIdx = -1; envolventeActiva = null; aud.pause();
        }
      }
    }
    const scAct = g.escenas[idxAct];
    const scAud = (scAct && scAct.continuar_audio && clipAudioOrigenIdx >= 0) ? g.escenas[clipAudioOrigenIdx] : scAct;
    const habId = scAud ? (scAud.hablante !== undefined ? scAud.hablante : scAud.actor) : 'ninguno';
    const tLocalAud = (scAct && scAct.continuar_audio && clipAudioOrigenIdx >= 0) ? (t - audioOrigenInicioSeg) : (t - acum);
    const boca = (habId && habId !== 'ninguno') ? obtenerBocaDesdeEnvolvente(envolventeActiva, tLocalAud, scAud ? scAud.texto : '') : 'boca_cerrada';
    const subTxt = (scAct && scAct.texto && scAct.texto.trim()) ? scAct.texto : (scAud ? (scAud.texto || '') : '');
    window.renderPreviewCanvas(boca, habId, subTxt);
    playRaf = requestAnimationFrame(tick);
  };
  playRaf = requestAnimationFrame(tick);
};

window.exportarPaqueteEpisodio = function() {
  const g = getEp(); if (!g) return;
  const descargas = [];
  (g.escenas || []).forEach(function(sc, idx) {
    if (sc.audio_url) descargas.push({ ruta_local: 'episodios/' + g.id + '/voces/clip_' + (idx + 1) + '.mp3', url: sc.audio_url });
    if (sc.plano_url) descargas.push({ ruta_local: 'episodios/' + g.id + '/medios/plano_' + (idx + 1) + '.png', url: sc.plano_url });
  });
  const instruccionesVeo = (g.escenas || []).map(function(sc, i) {
    if (sc.render_mode !== 'VEO_ANIMATED') return null;
    return '[ESCENA ' + String(i + 1).padStart(2, '0') + ' · ANIMAR CON VEO]\nFrame 0: plano_' + (i + 1) + '.png\nDuración: ' + (sc.duracion || 6) + 's\nPrompt: ' + (proyectoActivo.estilo_visual || '') + ' ' + (sc.veo_bridge_prompt || '');
  }).filter(Boolean);
  const asp = getAspectoEp(g);
  const epNorm = Object.assign({}, g, {
    escenas: (g.escenas || []).map(function(sc) {
      return Object.assign({}, sc, { actores: normalizarActoresEscena(sc), hablante: sc.hablante !== undefined ? sc.hablante : sc.actor, continuar_audio: Boolean(sc.continuar_audio) });
    })
  });
  const payload = { proyecto: proyectoActivo, formato_video: { aspecto: asp, ancho: asp === '16:9' ? 1920 : 1080, alto: asp === '16:9' ? 1080 : 1920 }, plan_veo: calcularPlanVeo(g.tension || 8), instrucciones_puente_veo: instruccionesVeo, episodio: epNorm, descargas_episodio: descargas, biblioteca: biblioteca, exportado_en: new Date().toISOString() };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
  a.download = proyectoActivo.id + '_' + g.id + '_produccion_termux.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  toast('Paquete ' + g.id + '_produccion_termux.json descargado.', 'exito');
};

// =========================================================================
// 7. PUENTE POSTMESSAGE + PERSISTENCIA
// =========================================================================
window.addEventListener('message', function(e) {
  if (!e.data || !e.data.tipo) return;
  if (e.data.tipo === 'PIRO_SHELL_CAMBIAR_PROYECTO' && e.data.proyecto) {
    window.detenerTimeline();
    proyectoActivo = Object.assign(proyectoActivo, e.data.proyecto);
    proyectoActivo.docBibId = normalizarDocBibId(proyectoActivo.docBibId, proyectoActivo.id);
    epIdActivo = null; clipSelIdx = 0; actorSelIdx = 0;
    cargarBiblioteca();
  } else if (e.data.tipo === 'PIRO_SHELL_AUTH' || e.data.tipo === 'PIRO_BIBLIOTECA_ACTUALIZADA') {
    if (e.data.proyecto) {
      proyectoActivo = Object.assign(proyectoActivo, e.data.proyecto);
      proyectoActivo.docBibId = normalizarDocBibId(proyectoActivo.docBibId, proyectoActivo.id);
    }
    cargarBiblioteca();
      } else if (e.data.tipo === 'PIRO_VAULT_ACTUALIZADO') {
    if (e.data.estadoIA) { try { localStorage.setItem(CLAVE_PREFS_IA_ED, JSON.stringify(e.data.estadoIA)); } catch (er) {} }
    cargarVault();
    if (vistaActual === 'guion') renderVistaGuionIA();
  } else if (e.data.tipo === 'PIRO_EDITOR_ABRIR_EPISODIO') {
    cargarBiblioteca().then(function() {
      if (e.data.episodioId) epIdActivo = e.data.episodioId;
      clipSelIdx = 0; actorSelIdx = 0;
      renderTodo(); window.setVistaEditor('timeline');
    });
  }
});

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') {
    guardarEstadoUIEditor();
    if (hayCambiosPendientesEd && biblioteca && Array.isArray(biblioteca.guiones) && biblioteca.guiones.length > 0) guardarBiblioteca(true);
  }
});
window.addEventListener('pagehide', function() {
  guardarEstadoUIEditor();
  if (hayCambiosPendientesEd && biblioteca && Array.isArray(biblioteca.guiones) && biblioteca.guiones.length > 0) guardarBiblioteca(true);
});

cargarVault();
GeokatuDB.SecurityService.observarEstadoSesion(function(user) {
  if (user) { cargarBiblioteca(); window.sincronizarBovedaEd(false); }
});
