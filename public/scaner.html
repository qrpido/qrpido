<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal Logística | Geokatu</title>
    <meta name="theme-color" content="#ff6b00">
    <link rel="stylesheet" href="ui-estilos.css"> 
    
    <!-- LIBRERÍA DE ESCÁNER DE CÁMARA (Soporta QR y Códigos de Barras) -->
    <script src="html5-qrcode.min.js" type="text/javascript"></script> 

    <style>
        /* =========================================
           ADN BÓVEDA & WIZARD (Geokatu UI)
           ========================================= */
        :root {
            --naranja: #ff6b00; --bg-oscuro: #0a0a0c; 
            --glass-bg: rgba(20, 20, 25, 0.85); --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at 50% 0%, #1a1a1f 0%, var(--bg-oscuro) 100%); 
            color: white; overflow: hidden; 
        }

        /* ESCUDO DE LOGIN */
        #pantalla-login {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-oscuro);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px;
        }
        
        .panel-login { 
            width: 100%; max-width: 380px; 
            background: rgba(15, 15, 18, 0.6); backdrop-filter: blur(19px); -webkit-backdrop-filter: blur(19px); 
            border: 1px solid rgba(255, 107, 0, 0.2); border-radius: 21px; 
            padding: 34px 21px; box-shadow: 0 34px 55px rgba(0,0,0,0.8), inset 0 0 21px rgba(255, 107, 0, 0.05); 
            position: relative; 
        }
        .panel-login::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--naranja), transparent); }

        .input-boveda { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); color: white; padding: 13px; border-radius: 13px; margin-bottom: 13px; outline: none; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        .input-boveda:focus { border-color: var(--naranja); box-shadow: 0 0 15px rgba(255,107,0,0.2); }
        
        .btn-accion-boveda { width: 100%; padding: 15px; border-radius: 13px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; background: linear-gradient(135deg, #ff8c00, var(--naranja)); color: white; font-size: 16px; transition: 0.3s; letter-spacing: 2px; box-shadow: 0 10px 25px rgba(255,107,0,0.4); }
        .btn-accion-boveda:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(255,107,0,0.3); }

        /* TERMINAL DE ESCANEO */
        #app-terminal {
            display: none; height: 100%; width: 100%; max-width: 600px; margin: 0 auto; 
            flex-direction: column; position: relative;
        }

        .header-terminal {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; border-bottom: 1px solid var(--glass-border);
            background: rgba(10,10,12,0.9);
        }

        .consola-controles { 
            background: rgba(15, 15, 18, 0.95); padding: 15px; border-bottom: 1px solid var(--glass-border); 
            display: flex; flex-direction: column; gap: 15px;
        }
        
        .ribbon-categorias { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; }
        .ribbon-categorias::-webkit-scrollbar { display: none; }
        .ribbon-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #aaa; border-radius: 20px; padding: 10px 15px; font-size: 11px; font-weight: bold; text-transform: uppercase; white-space: nowrap; cursor: pointer; transition: 0.3s; flex: 1; text-align: center; }
        .ribbon-btn.activo { background: var(--naranja); color: white; border-color: var(--naranja); box-shadow: 0 4px 10px rgba(255,107,0,0.4); }

        .select-glass { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--naranja); color: white; border-radius: 12px; padding: 12px; font-size: 14px; outline: none; appearance: none; text-align: center; font-weight: bold; }
        .select-glass option { background: var(--bg-oscuro); color: white; }

        /* ZONA DE ESCANEO IoT y CÁMARA */
        .zona-escaneo {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow-y: auto; padding: 20px;
        }
        
        .luz-escaner {
            width: 80%; height: 120px; border: 2px dashed rgba(255,107,0,0.5); border-radius: 21px;
            display: flex; align-items: center; justify-content: center; position: relative;
            background: radial-gradient(circle, rgba(255,107,0,0.1) 0%, transparent 70%);
            transition: 0.2s; cursor: pointer;
        }
        .luz-escaner.leyendo {
            border-color: #00ff64; background: radial-gradient(circle, rgba(0,255,100,0.2) 0%, transparent 70%);
            box-shadow: 0 0 30px rgba(0,255,100,0.3); transform: scale(1.05);
        }

        #lector-camara {
            width: 100%; max-width: 350px; border-radius: 21px; overflow: hidden; 
            display: none; border: 2px solid var(--naranja); margin-bottom: 20px;
        }
        
        #trampa-codigo {
            position: absolute; opacity: 0; left: -9999px; 
        }

        /* TARJETA DE PRODUCTO */
        .ultimo-escaneo {
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-top: 2px solid var(--naranja);
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 21px; box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: absolute; bottom: 0; width: 100%; box-sizing: border-box; z-index: 1000;
        }
        .ultimo-escaneo.visible { transform: translateY(0); }

        .btn-editar-info {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #aaa;
            padding: 8px 15px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; margin-top: 10px; display: flex; align-items: center; gap: 5px; width: 100%; justify-content: center;
        }

        /* Modal Petición Corrección */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: center; opacity: 0; transition: 0.3s; }
        .modal-overlay.activo { display: flex; opacity: 1; }
        .modal-contenido { width: 90%; max-width: 400px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 21px; padding: 21px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }

    </style>
</head>
<body>

    <!-- PANTALLA LOGIN (Mantenida igual) -->
    <div id="pantalla-login">
        <div class="panel-login">
            <div style="text-align: center; margin-bottom: 20px;">
                <h1 style="margin: 0; color: white; font-size: 28px; font-weight: 900; letter-spacing: 2px;">LOGI<span style="color: var(--naranja);">CORE</span></h1>
                <p style="color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">Terminal Operador Bóveda</p>
            </div>
            <input type="email" id="login-email" class="input-boveda" placeholder="Correo asignado">
            <input type="password" id="login-pass" class="input-boveda" placeholder="Contraseña de Operador">
            <button class="btn-accion-boveda" onclick="iniciarSesionTerminal()">INICIAR TURNO</button>
        </div>
    </div>

    <!-- TERMINAL PRINCIPAL -->
    <div id="app-terminal">
        
        <div class="header-terminal">
            <div>
                <span style="color: var(--naranja); font-weight: 900; font-size: 18px; letter-spacing: 1px;">LOGICORE</span>
                <span id="txt-operador" style="display: block; font-size: 10px; color: #888; text-transform: uppercase;">Operador: Cargando...</span>
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span style="color: #00ff64; font-size: 12px; font-weight: bold;">📡 SUI LINKED</span>
                <button style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 50%; width: 35px; height: 35px; cursor: pointer;" onclick="cerrarSesionTerminal()">🚪</button>
            </div>
        </div>

        <div class="consola-controles">
            <!-- Operación -->
            <label style="font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">Operación Física</label>
            <div class="ribbon-categorias" id="selector-operacion">
                <button class="ribbon-btn activo" data-op="RECEPCION" onclick="cambiarOperacion(this)">📥 Recepción</button>
                <button class="ribbon-btn" data-op="TRASLADO" onclick="cambiarOperacion(this)">🚚 Traslado</button>
            </div>

            <!-- Destino -->
            <div id="contenedor-destino" style="display: none; animation: fadeIn 0.3s ease;">
                <select id="select-destino" class="select-glass">
                    <option value="" disabled selected>-- SELECCIONA ALMACÉN DESTINO --</option>
                    <option value="wallet_sucursal_norte">Sucursal Norte</option>
                    <option value="wallet_sucursal_sur">Sucursal Sur</option>
                    <option value="wallet_venta_cliente">🚀 SALIDA FINAL</option>
                </select>
            </div>

            <!-- Empaque -->
            <label style="font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; margin-top: 5px;">Nivel de Empaque</label>
            <div class="ribbon-categorias" id="selector-empaque">
                <button class="ribbon-btn" data-nivel="CONTENEDOR" onclick="cambiarEmpaque(this)">🚢 Contenedor</button>
                <button class="ribbon-btn" data-nivel="CAJA" onclick="cambiarEmpaque(this)">📦 Cajas</button>
                <button class="ribbon-btn activo" data-nivel="UNIDAD" onclick="cambiarEmpaque(this)">🔧 Unidades</button>
            </div>
        </div>

        <!-- ZONA DE ESCANEO HÍBRIDA -->
        <div class="zona-escaneo" onclick="forzarFocoEscaner()">
            
            <!-- Contenedor para el video de la cámara -->
            <div id="lector-camara"></div>

            <h3 style="color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 2px;">ESPERANDO LECTURA...</h3>
            <div id="luz-estado" class="luz-escaner">
                <span style="font-size: 40px; filter: grayscale(100%); opacity: 0.5;">🔫</span>
            </div>
            <p style="font-size: 10px; color: #555; margin-top: 20px; text-align: center;">Presiona el gatillo del lector físico o utiliza la cámara del móvil.</p>
            
            <button class="btn-accion-boveda" id="btn-toggle-camara" style="width: auto; padding: 10px 20px; font-size: 12px; margin-top: 20px; z-index: 10;" onclick="toggleCamaraCelular(event)">
                📷 ACTIVAR CÁMARA
            </button>

            <!-- TRAMPA FÍSICA -->
            <input type="text" id="trampa-codigo" autofocus autocomplete="off">
        </div>

        <!-- Feedback UI (Mantenida igual) -->
        <div id="tarjeta-producto" class="ultimo-escaneo">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                <div>
                    <span id="badge-estado" style="background: #00ff64; color: black; font-size: 10px; padding: 3px 8px; border-radius: 8px; font-weight: bold; text-transform: uppercase;">✔️ PROCESADO</span>
                    <h2 id="prod-nombre" style="margin: 8px 0 0 0; font-size: 18px; color: white;">Producto</h2>
                </div>
                <div style="text-align: right;">
                    <p style="margin: 0; font-size: 10px; color: #aaa;">CÓDIGO:</p>
                    <p id="prod-codigo" style="margin: 0; font-family: monospace; font-size: 14px; color: var(--naranja); font-weight: bold;">---</p>
                </div>
            </div>
            
            <div style="background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.05);">
                <p style="margin: 0; font-size: 11px; color: #888;">Nivel procesado: <strong id="prod-nivel" style="color: white;">UNIDAD</strong></p>
                <p style="margin: 5px 0 0 0; font-size: 11px; color: #888;">Tx Blockchain: <span id="prod-hash" style="color: #00f5d4; font-family: monospace;">Pendiente...</span></p>
            </div>
            <button class="btn-editar-info" onclick="abrirModalCorreccion()">👁️‍🗨️ Solicitar Edición</button>
        </div>
    </div>

    <!-- MODAL (Mantenida igual) -->
    <div id="modal-correccion" class="modal-overlay">
        <!-- ... Contenido del modal original ... -->
    </div>

    <script type="module">
        // Importación simulada para que el código no rompa
        // import GeokatuDB from './core-db.js';
        const GeokatuDB = {
            SecurityService: { observarEstadoSesion: (cb)=>cb({email: "bodega@geokatu.com"}), iniciarSesion: ()=>({success:true}), cerrarSesion: ()=>{} },
            InventarioService: { registrarMovimientoFisico: async ()=>({success:true, data:{txID:"0x123456789"}}) }
        };

        let operacionActual = 'RECEPCION'; 
        let empaqueActual = 'UNIDAD'; 
        let codigoEscaneadoReciente = '';

        // Variables de la Cámara
        let html5QrCode;
        let camaraEncendida = false;

        // INICIALIZACIÓN
        GeokatuDB.SecurityService.observarEstadoSesion((user) => {
            if (user) {
                document.getElementById('pantalla-login').style.display = 'none';
                document.getElementById('app-terminal').style.display = 'flex';
                document.getElementById('txt-operador').innerText = `Operador: ${user.email}`;
                setTimeout(forzarFocoEscaner, 500);
            }
        });

        // ==========================================
        // 1. MOTOR DE CÁMARA (NUEVO)
        // ==========================================
        window.toggleCamaraCelular = (e) => {
            e.stopPropagation(); // Evita que el clic robe el foco hacia la trampa física
            const btn = document.getElementById('btn-toggle-camara');
            const contenedorCamara = document.getElementById('lector-camara');

            if (!html5QrCode) {
                // Instancia el lector apuntando al div
                html5QrCode = new Html5Qrcode("lector-camara");
            }

            if (camaraEncendida) {
                // Detener cámara
                html5QrCode.stop().then(() => {
                    camaraEncendida = false;
                    contenedorCamara.style.display = "none";
                    btn.innerHTML = "📷 ACTIVAR CÁMARA";
                    btn.style.background = "linear-gradient(135deg, #ff8c00, var(--naranja))";
                    forzarFocoEscaner(); // Devolver control al lector físico
                });
            } else {
                // Iniciar cámara trasera
                contenedorCamara.style.display = "block";
                html5QrCode.start(
                    { facingMode: "environment" }, // Cámara trasera siempre
                    { fps: 10, qrbox: { width: 250, height: 250 } }, // Configuraciones óptimas
                    (textoDecodificado) => {
                        // ÉXITO AL LEER (Entra aquí al encontrar un código)
                        procesarEscaneoFisico(textoDecodificado);
                        
                        // Opcional: Detener la cámara tras la lectura (descomenta para activar)
                        /*
                        html5QrCode.stop().then(() => {
                            camaraEncendida = false;
                            contenedorCamara.style.display = "none";
                            btn.innerHTML = "📷 ACTIVAR CÁMARA";
                        });
                        */
                    },
                    (errorFrame) => {
                        // Errores de lectura de fotogramas vacíos (se ignoran silenciosamente)
                    }
                ).then(() => {
                    camaraEncendida = true;
                    btn.innerHTML = "🛑 APAGAR CÁMARA";
                    btn.style.background = "#ff4444";
                }).catch((err) => {
                    alert("Error al iniciar la cámara. Verifica los permisos de tu navegador.");
                    contenedorCamara.style.display = "none";
                });
            }
        };

        // ==========================================
        // 2. MOTOR DEL ESCÁNER FÍSICO IOT (USB/BLUETOOTH)
        // ==========================================
        const trampa = document.getElementById('trampa-codigo');
        
        window.forzarFocoEscaner = () => {
            // Solo forzar si la cámara no está en uso intensivo o un modal no está abierto
            if (!document.getElementById('modal-correccion').classList.contains('activo')) {
                trampa.focus();
            }
        };

        // Asegurarnos de recuperar el foco siempre que el usuario toque cualquier parte de la App
        document.body.addEventListener('click', (e) => {
            if (['BUTTON', 'SELECT', 'TEXTAREA', 'INPUT'].includes(e.target.tagName)) return;
            forzarFocoEscaner();
        });

        trampa.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const codigoLimpio = trampa.value.trim();
                trampa.value = ''; 
                
                if (codigoLimpio !== '') {
                    procesarEscaneoFisico(codigoLimpio);
                }
            }
        });

        // ==========================================
        // 3. PROCESAMIENTO UNIFICADO
        // ==========================================
        async function procesarEscaneoFisico(codigo) {
            if (navigator.vibrate) navigator.vibrate([100]);
            
            codigoEscaneadoReciente = codigo;
            const luz = document.getElementById('luz-estado');
            luz.classList.add('leyendo');
            
            let destino = "BODEGA_PRINCIPAL"; 
            if (operacionActual === 'TRASLADO') {
                const selectDestino = document.getElementById('select-destino');
                if (!selectDestino.value) {
                    alert("⚠️ ALERTA: Selecciona un Almacén Destino antes de escanear.");
                    luz.classList.remove('leyendo');
                    return;
                }
                destino = selectDestino.value;
            }

            document.getElementById('prod-codigo').innerText = codigo;
            document.getElementById('prod-nivel').innerText = empaqueActual;
            document.getElementById('prod-hash').innerText = "Guardando...";
            document.getElementById('tarjeta-producto').classList.add('visible');

            // Simulación de conexión a BD
            const { success, data, error } = await GeokatuDB.InventarioService.registrarMovimientoFisico(codigo, "ACTUAL", destino, operacionActual);

            luz.classList.remove('leyendo');

            if (success) {
                if (navigator.vibrate) navigator.vibrate([50, 50]); 
                document.getElementById('prod-hash').innerText = `Tx: ${data.txID.substring(0,8)}...`;
            } else {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]); 
                document.getElementById('badge-estado').innerText = "❌ ERROR";
                document.getElementById('badge-estado').style.background = "#ff4444";
            }

            setTimeout(() => {
                if(success) document.getElementById('tarjeta-producto').classList.remove('visible');
            }, 4000);
        }

        // Resto de utilidades UI
        window.cambiarOperacion = (btn) => {
            document.querySelectorAll('#selector-operacion .ribbon-btn').forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
            operacionActual = btn.getAttribute('data-op');
            document.getElementById('contenedor-destino').style.display = operacionActual === 'TRASLADO' ? 'block' : 'none';
            forzarFocoEscaner(); 
        };

        window.cambiarEmpaque = (btn) => {
            document.querySelectorAll('#selector-empaque .ribbon-btn').forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
            empaqueActual = btn.getAttribute('data-nivel');
            forzarFocoEscaner(); 
        };

        window.abrirModalCorreccion = () => document.getElementById('modal-correccion').classList.add('activo');
        window.cerrarModal = () => { document.getElementById('modal-correccion').classList.remove('activo'); forzarFocoEscaner(); };
    </script>
</body>
</html>
