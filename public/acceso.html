<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Sistema de Gestión</title>
    
    <!-- 1. Importar el script de validación humana (reCAPTCHA) -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <style>
        /* Estilos base optimizados para PWA y móviles */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .login-card {
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #dce1e6;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        /* Contenedor adaptativo para el CAPTCHA en pantallas pequeñas */
        .recaptcha-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.25rem;
            /* Escala ligeramente el widget para que no rompa el diseño en móviles angostos */
            transform: scale(0.95);
            transform-origin: center;
        }
        
        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
            font-weight: 500;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #2980b9;
        }
        .btn-submit:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: #3498db;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        <form id="formAcceso">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="usuario@correo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <!-- 2. Widget de validación humana -->
            <div class="recaptcha-container">
                <!-- NOTA: Reemplaza 'TU_CLAVE_DE_SITIO_AQUI' con la clave de sitio pública generada en la consola de reCAPTCHA -->
                <div class="g-recaptcha" data-sitekey="6LeT74wtAAAAAMeqXa4L9kkNdFLqjzEjsykUD5ET"></div>
            </div>
            
            <!-- Mensaje de error si intentan saltarse el paso humano -->
            <div id="captchaError" class="error-msg">Por favor, valida que eres humano antes de ingresar.</div>

            <button type="submit" class="btn-submit" id="btnIngresar">Ingresar</button>
        </form>
        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>

        <script type="module">
        // Importamos el cerebro de la base de datos
        import GeokatuDB from './core-db.js';

        document.getElementById('formAcceso').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('captchaError');
            const btnSubmit = document.getElementById('btnIngresar');

            // 1. Barrera Humana (reCAPTCHA)
            const captchaResponse = grecaptcha.getResponse();
            if (captchaResponse.length === 0) {
                errorMsg.style.display = 'block';
                return; 
            }

            // 2. Feedback visual fluido
            errorMsg.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Verificando credenciales...';

            // 3. Conexión al Motor (Login Tradicional)
            const { success, error, data } = await GeokatuDB.SecurityService.iniciarSesion(email, password);

            if (success) {
                // Entregamos la llave maestra local
                localStorage.setItem('qrpido_session_validated', 'true');
                
                // Evaluamos a dónde enviarlo según su rol (Triaje)
                const rolData = await GeokatuDB.SecurityService.obtenerRolAdmin(data.uid);
                
                if (rolData.success && rolData.data.rol === 'conductor') {
                    window.location.href = 'domiciliarios.html';
                } else if (rolData.success && rolData.data.rol === 'moderador') {
                    window.location.href = 'moderacion.html';
                } else {
                    // Por defecto, lo mandamos a su oficina principal
                    window.location.href = 'admin.html';
                }
            } else {
                // Falla el login (Credenciales incorrectas)
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Ingresar';
                grecaptcha.reset(); // Reiniciamos el reto por seguridad
                alert("Acceso denegado: " + error);
            }
        });
    </script>


</body>
</html>
