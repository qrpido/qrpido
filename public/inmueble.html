<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inmuebles | Geokatu</title>
   
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b00">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/0a0a0c/ff6b00?text=GK">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <style>
        :root {
            --color-marca: #ff6b00;
            --naranja: #ff6b00;
            --bg-oscuro: #0a0a0c;
            --glass-bg: rgba(20, 20, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
           
            /* Sistema Áureo & Fibonacci */
            --texto-sm: 10px;
            --texto-base: 16px;
            --texto-h3: 22px;
            --texto-h1: 32px;
            
            --sp-micro: 8px;
            --sp-sm: 13px;
            --sp-md: 21px;
            --sp-lg: 34px;
            --sp-xl: 55px;
        }


        body, html { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-oscuro); 
            color: white; 
            scroll-behavior: smooth; 
            overflow-x: hidden; 
            font-size: var(--texto-base);
            touch-action: pan-y;
            overscroll-behavior-y: contain;
        }
       
        /* Fondo Ambiental */
        #fondo-pantalla { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100vh; 
            object-fit: cover; 
            z-index: -2; 
            opacity: 0.15; 
            filter: blur(15px);
            transition: opacity 0.5s ease;
        }


        .glass-panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
        }
       
        /* Shimmer Loading */
        .shimmer-box { 
            position: relative; 
            overflow: hidden; 
            background: rgba(255,255,255,0.05) !important; 
            color: transparent !important; 
            border-color: transparent !important; 
            pointer-events: none; 
        }
        .shimmer-box * { visibility: hidden; }
        .shimmer-box::after { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: -100%; 
            width: 50%; 
            height: 100%; 
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); 
            animation: shimmer 1.5s infinite; 
        }
        @keyframes shimmer { 100% { left: 100%; } }


        /* Navegación Flotante */
        .nav-flotante { 
            position: fixed; 
            top: 15px; 
            left: 15px; 
            right: 15px; 
            display: flex; 
            justify-content: space-between; 
            z-index: 500; 
            pointer-events: none; 
        }
        .btn-nav { 
            pointer-events: all; 
            background: rgba(10,10,15,0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2); 
            color: white; 
            border-radius: 50%; 
            width: 44px; 
            height: 44px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
            text-decoration: none; 
        }
        .btn-nav:active { 
            transform: scale(0.92); 
            background: var(--color-marca); 
            border-color: var(--color-marca); 
        }
        
        /* Contenedor Tinder Swipeable */
        #tarjeta-inmueble-activa {
            width: 100%;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease;
            will-change: transform, opacity;
        }


        /* Galería */
        .galeria-container { 
            width: 100%; 
            position: relative; 
            margin-bottom: var(--sp-md); 
        }
        .galeria-wrapper { 
            display: flex; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch; 
            border-radius: 0 0 28px 28px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            border-bottom: 2px solid var(--color-marca); 
            background: #000;
        }
        .galeria-wrapper::-webkit-scrollbar { display: none; }
        .galeria-img { 
            width: 100%; 
            height: 55vh; 
            min-height: 320px;
            max-height: 500px;
            flex-shrink: 0; 
            scroll-snap-align: start; 
            object-fit: cover; 
        }
       
        .indicador-galeria { 
            position: absolute; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0,0,0,0.7); 
            backdrop-filter: blur(6px); 
            padding: 4px 14px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 800; 
            letter-spacing: 1.5px; 
            border: 1px solid rgba(255,255,255,0.2); 
        }


        /* Información Principal */
        .info-container { 
            padding: 0 var(--sp-md); 
            padding-bottom: 120px; 
            max-width: 600px;
            margin: 0 auto;
        }
       
        .badge-operacion { 
            background: var(--color-marca); 
            color: white; 
            padding: 4px 12px; 
            border-radius: 12px; 
            font-size: 11px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            display: inline-block; 
            margin-bottom: 6px; 
            box-shadow: 0 0 12px rgba(255,107,0,0.4); 
        }
       
        .titulo-propiedad { 
            margin: 0 0 6px 0; 
            font-size: var(--texto-h1); 
            font-weight: 900; 
            line-height: 1.15; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.8); 
        }
        .precio-propiedad { 
            margin: 0 0 14px 0; 
            font-size: 26px; 
            color: #00ff64; 
            font-weight: 900; 
            text-shadow: 0 0 15px rgba(0,255,100,0.3); 
        }


        /* Badges de Atributos */
        .badges-row { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding-bottom: 6px; 
            margin-bottom: 16px; 
            scrollbar-width: none; 
        }
        .badges-row::-webkit-scrollbar { display: none; }
        .badge-cristal { 
            background: rgba(255,255,255,0.06); 
            border: 1px solid var(--glass-border); 
            padding: 7px 12px; 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-weight: bold; 
            font-size: 12px; 
            white-space: nowrap; 
            backdrop-filter: blur(10px); 
        }
        .badge-cristal span { color: var(--color-marca); font-size: 14px; }


        /* Botón Mapa Radar */
        .btn-ver-mapa {
            width: 100%; 
            padding: 13px; 
            border-radius: 14px; 
            background: rgba(255, 107, 0, 0.1); 
            color: var(--color-marca); 
            border: 1px solid var(--color-marca); 
            font-weight: 800; 
            font-size: 12.5px; 
            letter-spacing: 0.5px;
            margin-bottom: 22px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            transition: all 0.2s ease;
        }
        .btn-ver-mapa:active { transform: scale(0.97); background: rgba(255, 107, 0, 0.2); }


        .seccion-titulo { 
            font-size: 12px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 8px; 
            color: var(--color-marca); 
            border-bottom: 1px solid rgba(255,255,255,0.08); 
            padding-bottom: 6px; 
        }
        .descripcion-texto { 
            color: #ddd; 
            font-size: 13.5px; 
            line-height: 1.6; 
            margin-bottom: 25px; 
            background: rgba(0,0,0,0.35); 
            padding: 16px; 
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.05); 
        }


        /* Ficha Inmobiliaria */
        .agencia-card { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 14px 16px; 
            margin-bottom: 25px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .agencia-card:active { transform: scale(0.98); border-color: var(--color-marca); }
        .agencia-logo { 
            width: 46px; 
            height: 46px; 
            border-radius: 50%; 
            border: 2px solid var(--color-marca); 
            object-fit: cover; 
            background: #000;
        }
        .agencia-info h4 { margin: 0 0 2px 0; font-size: 14px; color: white; }
        .agencia-info p { margin: 0; font-size: 11.5px; color: #888; }


        /* Otras opciones carrusel */
        .otras-opciones-wrapper { 
            display: flex; 
            gap: 12px; 
            overflow-x: auto; 
            padding-bottom: 12px; 
            scrollbar-width: none; 
            align-items: stretch; 
        }
        .otras-opciones-wrapper::-webkit-scrollbar { display: none; }
        .card-opcion { 
            width: 200px; 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
            text-decoration: none; 
            color: white; 
            overflow: hidden; 
            border-radius: 16px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.2s; 
        }
        .card-opcion:active { transform: scale(0.96); border-color: var(--color-marca); }
        .card-opcion-img { width: 100%; height: 110px; object-fit: cover; }
        .card-opcion-info { padding: 10px; flex-grow: 1; }
        .card-opcion-titulo { margin: 0 0 4px 0; font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-opcion-precio { margin: 0; color: #00ff64; font-weight: 900; font-size: 13px; }


        /* Barra de Control Tinder Flotante */
        .cta-wrapper { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            padding: 15px 20px 20px 20px; 
            background: linear-gradient(to top, rgba(10,10,12,0.98) 70%, transparent); 
            z-index: 1000; 
            box-sizing: border-box; 
            display: flex; 
            gap: 12px; 
            max-width: 600px;
            left: 50%;
            transform: translateX(-50%);
        }
       
        .btn-pulsante { 
            border: none; 
            border-radius: 25px; 
            font-size: 14px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px; 
            transition: transform 0.2s ease; 
        }
        .btn-pulsante:active { transform: scale(0.94); }
       
        .btn-interesa { 
            background: linear-gradient(135deg, #ff8c00, var(--color-marca)); 
            color: white; 
            flex: 3; 
            height: 52px; 
            box-shadow: 0 8px 24px rgba(255,107,0,0.4); 
        }
       
        .btn-descartar-tinder { 
            flex: 1; 
            background: rgba(255,255,255,0.08); 
            backdrop-filter: blur(10px); 
            color: #ddd; 
            border: 1px solid rgba(255,255,255,0.15); 
            font-size: 18px; 
            height: 52px;
        }


        /* Modales */
        .modal-overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(8px);
            z-index: 2000; 
            display: flex; 
            justify-content: center; 
            align-items: flex-end; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.3s ease; 
        }
        .modal-overlay.activo { opacity: 1; pointer-events: all; }
        .modal-contenido { 
            width: 100%; 
            max-width: 500px; 
            background: rgba(20, 20, 25, 0.98); 
            border-top: 1px solid var(--color-marca); 
            border-radius: 28px 28px 0 0; 
            padding: 20px 25px 35px 25px; 
            transform: translateY(100%); 
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); 
            box-sizing: border-box; 
            text-align: center; 
        }
        .modal-overlay.activo .modal-contenido { transform: translateY(0); }
        .drag-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.25); border-radius: 5px; margin: 0 auto 16px auto; }
        
        .btn-accion-secundaria { 
            width: 100%; 
            padding: 13px; 
            border-radius: 12px; 
            border: 1px solid var(--glass-border); 
            background: rgba(255,255,255,0.06); 
            color: white; 
            font-weight: bold; 
            font-size: 12.5px;
            cursor: pointer; 
            transition: 0.2s; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 6px; 
        }
        .btn-accion-secundaria:active { background: rgba(255,255,255,0.12); transform: scale(0.96); }


        .offline-banner { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            background: #ff4444; 
            color: white; 
            text-align: center; 
            padding: 7px; 
            z-index: 10000; 
            font-weight: 900; 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            display: none; 
        }
        .offline-banner.activo { display: block; }
    </style>
</head>
<body>
    <div id="offline-banner" class="offline-banner">⚠️ Sin conexión: Modo offline activo</div>
    <img id="fondo-pantalla" src="" alt="Fondo Ambiental">


    <!-- Navegación Flotante -->
    <div class="nav-flotante">
        <a href="index.html" class="btn-nav" title="Volver al Radar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 5"></polyline>
            </svg>
        </a>
        <div style="display: flex; gap: 10px;">
            <button class="btn-nav" id="btn-fav-inmueble" onclick="window.guardarInmuebleActual()" title="Guardar Favorito" style="font-size: 18px;">🤍</button>
            <button class="btn-nav" onclick="window.abrirMisGuardados()" title="Mis Guardados" style="font-size: 18px; border-color: #ff4444; color: #ff4444; background: rgba(255, 68, 68, 0.2);">❤️</button>
            <button class="btn-nav" onclick="window.abrirModal('overlay-compartir')" title="Compartir Inmueble">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
            </button>
        </div>
    </div>


    <!-- TARJETA DESLIZABLE (TINDER SWIPE ENGINE) -->
    <div id="tarjeta-inmueble-activa">
        <!-- Galería de Fotos -->
        <div class="galeria-container">
            <div class="galeria-wrapper shimmer-box" id="carrusel-imagenes">
                <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="galeria-img">
            </div>
            <div class="indicador-galeria" id="contador-galeria">1 / 1</div>
        </div>


        <!-- Información Detallada -->
        <div class="info-container">
            <div id="badge-promo-container"></div>
            <h1 class="titulo-propiedad shimmer-box" id="inmueble-titulo" style="width: 80%; height: 32px; border-radius: 8px;"></h1>
            <h2 class="precio-propiedad shimmer-box" id="inmueble-precio" style="width: 45%; height: 30px; border-radius: 8px;"></h2>


            <div class="badges-row" id="contenedor-badges">
                <div class="badge-cristal shimmer-box" style="width: 80px; height: 36px; border-radius: 12px;"></div>
                <div class="badge-cristal shimmer-box" style="width: 80px; height: 36px; border-radius: 12px;"></div>
                <div class="badge-cristal shimmer-box" style="width: 80px; height: 36px; border-radius: 12px;"></div>
            </div>


            <button class="btn-ver-mapa" onclick="window.volarAlMapa()">
                <span>🗺️</span> VER UBICACIÓN EN EL RADAR GEOKATU
            </button>


            <h3 class="seccion-titulo">Descripción</h3>
            <div class="descripcion-texto shimmer-box" id="inmueble-descripcion" style="min-height: 90px; border-radius: 14px;"></div>


            <h3 class="seccion-titulo">Inmobiliaria / Anfitrión</h3>
            <div class="glass-panel agencia-card" id="tarjeta-agencia" onclick="window.irAPerfilAgencia()">
                <img id="agencia-logo" class="agencia-logo" src="https://via.placeholder.com/60/0a0a0c/ff6b00?text=INMO">
                <div class="agencia-info" style="width: 100%;">
                    <h4 id="agencia-nombre">Cargando Inmobiliaria...</h4>
                    <p id="agencia-nicho">Aliado Verificado</p>
                </div>
                <div style="margin-left: auto; color: var(--color-marca); font-size: 18px;">➔</div>
            </div>


            <h3 class="seccion-titulo" id="titulo-otras-opciones" style="display: none;">Otras propiedades en la zona</h3>
            <div class="otras-opciones-wrapper" id="contenedor-otras-opciones"></div>


            <button class="btn-ver-mapa" style="border-style: dashed; margin-top: 25px;" onclick="window.location.href='boveda-inmuebles.html'">
                🏢 ¿Eres agente o inmobiliaria? Gestiona tu catálogo aquí
            </button>
        </div>
    </div>


    <!-- Barra Inferior de Acción Tipo Tinder -->
    <div class="cta-wrapper">
        <button class="btn-pulsante btn-descartar-tinder" id="btn-descartar-tinder" onclick="window.siguientePropiedadTinder()" title="Siguiente Inmueble (Descartar)">
            ✕
        </button>
        <button class="btn-pulsante btn-interesa" id="btn-whatsapp-cta">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            Me Interesa
        </button>
    </div>


    <!-- Modal: Mis Guardados -->
    <div class="modal-overlay" id="modal-favoritos" onclick="window.cerrarModal(event, 'modal-favoritos')">
        <div class="modal-contenido" id="sheet-favoritos" style="border-top-color: #ff4444; text-align: left;">
            <div class="drag-handle"></div>
            <h2 style="color: #ff4444; margin-top: 0; text-transform: uppercase; letter-spacing: 1.5px; text-align: center;">Mis Guardados</h2>
            <p style="text-align:center; font-size:12px; color:#888; margin-bottom: 16px;">Inmuebles guardados localmente en este dispositivo.</p>
            <div id="lista-favoritos" style="max-height: 55vh; overflow-y: auto; margin-bottom: 15px; scrollbar-width: none;"></div>
        </div>
    </div>


    <!-- Modal: Compartir -->
    <div class="modal-overlay" id="overlay-compartir" onclick="window.cerrarModal(event, 'overlay-compartir')">
        <div class="modal-contenido" id="sheet-compartir">
            <div class="drag-handle"></div>
            <h2 style="margin-top: 0; color: var(--color-marca); text-transform: uppercase; letter-spacing: 1.5px; font-size: 18px;">Compartir Propiedad</h2>
            <div id="qr-code-container" style="background: white; padding: 14px; border-radius: 18px; display: inline-block; margin-bottom: 16px; line-height: 0;"></div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button class="btn-pulsante btn-interesa" id="btn-descargar-qr" onclick="window.descargarQR()" style="padding: 12px; font-size: 13px;">⬇️ DESCARGAR QR</button>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-accion-secundaria" onclick="window.copiarEnlace()" style="flex: 1;">🔗 Copiar Link</button>
                    <button class="btn-accion-secundaria" onclick="window.compartirNativo()" style="flex: 1;">📲 Compartir</button>
                </div>
            </div>
        </div>
    </div>


    <script type="module">
        import GeokatuDB from './core-db.js';


        window.GeokatuDB = GeokatuDB;
        window.datosAgencia = null;
        window.propiedadActual = null;
        window.propiedadesGlobales = [];


        window.sanitizarTexto = function(texto) {
            if (texto === null || texto === undefined) return '';
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        };


        window.formatearMoneda = function(valor, moneda = 'COP') {
            const num = Number(valor) || 0;
            if (moneda === 'USD') return (num / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
            return '$' + num.toLocaleString('es-CO') + ' COP';
        };


        window.abrirModal = (id) => document.getElementById(id).classList.add('activo');
        window.cerrarModal = (e, id) => { if (e.target.id === id) document.getElementById(id).classList.remove('activo'); };


        // === ARQUITECTURA DE DATOS Y CARGA ===
        async function construirInmueblesFeed() {
            const urlParams = new URLSearchParams(window.location.search);
            const idAgencia = urlParams.get('id');
            const idItem = urlParams.get('item');


            try {
                // 1. Si viene agencia específica, cargar su catálogo
                if (idAgencia) {
                    const resAgencia = await GeokatuDB.LocalService.getDetails(idAgencia);
                    if (resAgencia.success) window.datosAgencia = resAgencia.data;
                    
                    const resProps = await GeokatuDB.RadarService.obtenerProductosPublicos(idAgencia, { limite: 25 });
                    if (resProps.success && resProps.data.length > 0) {
                        window.propiedadesGlobales = resProps.data;
                    }
                }


                // 2. Si no hay propiedades de agencia o se entra directo, barrer radar general de inmuebles
                if (!window.propiedadesGlobales || window.propiedadesGlobales.length === 0) {
                    const resRadar = await GeokatuDB.RadarService.buscarInmueblesEnRadar(4.8133, -75.6961, 25000);
                    if (resRadar.success && resRadar.data.length > 0) {
                        window.propiedadesGlobales = resRadar.data;
                    }
                }


                if (window.propiedadesGlobales.length === 0) {
                    throw new Error("No hay inmuebles disponibles en este momento.");
                }


                // Determinar propiedad activa
                if (idItem) {
                    window.propiedadActual = window.propiedadesGlobales.find(p => p.id_prod === idItem || p.id === idItem) || window.propiedadesGlobales[0];
                } else {
                    window.propiedadActual = window.propiedadesGlobales[0];
                }


                // Obtener datos de la agencia dueña si no los tenemos
                const idPadre = window.propiedadActual.id_negocio_padre || idAgencia;
                if (idPadre && (!window.datosAgencia || window.datosAgencia.id !== idPadre)) {
                    const resPadre = await GeokatuDB.LocalService.getDetails(idPadre);
                    if (resPadre.success) window.datosAgencia = resPadre.data;
                }


                window.renderizarPropiedad(window.propiedadActual);
                window.actualizarOtrasOpciones();
                window.prepararQR();


            } catch (e) {
                console.error("Fallo al construir feed de inmuebles:", e);
                document.querySelector('.info-container').innerHTML = `
                    <div style="text-align: center; padding: 40px 15px;">
                        <span style="font-size: 40px;">🏠</span>
                        <h3 style="color:#ff6b00; margin-top: 10px;">${e.message}</h3>
                        <a href="index.html" style="color:#fff; text-decoration: underline; font-size: 13px;">Volver al Radar</a>
                    </div>`;
            }
        }


        window.renderizarPropiedad = function(prop) {
            if (!prop) return;


            // Retirar placeholders
            ['inmueble-titulo', 'inmueble-precio', 'inmueble-descripcion', 'carrusel-imagenes'].forEach(id => {
                document.getElementById(id)?.classList.remove('shimmer-box');
            });


            document.getElementById('inmueble-titulo').innerText = prop.nombre || 'Propiedad sin título';
            document.getElementById('inmueble-precio').innerText = window.formatearMoneda(prop.precio);
            document.getElementById('inmueble-descripcion').innerText = prop.cuerpo_texto || prop.descripcion || "Inmueble verificado con excelente ubicación.";


            document.title = `${prop.nombre} | Geokatu Inmuebles`;


            // Badge de operación
            const opContainer = document.getElementById('badge-promo-container');
            const tipoOp = prop.tipo_operacion || (prop.badge ? prop.badge : 'DISPONIBLE');
            opContainer.innerHTML = `<div class="badge-operacion">${window.sanitizarTexto(tipoOp)}</div>`;


            // Badges técnicos
            const bCont = document.getElementById('contenedor-badges');
            let bHtml = '';
            if (prop.subtipo_inmueble) bHtml += `<div class="badge-cristal"><span>🏢</span> ${window.sanitizarTexto(prop.subtipo_inmueble)}</div>`;
            if (prop.habitaciones) bHtml += `<div class="badge-cristal"><span>🛏️</span> ${prop.habitaciones} Hab</div>`;
            if (prop.banos) bHtml += `<div class="badge-cristal"><span>🚿</span> ${prop.banos} Baños</div>`;
            if (prop.area_m2) bHtml += `<div class="badge-cristal"><span>📐</span> ${prop.area_m2} m²</div>`;
            if (prop.estrato) bHtml += `<div class="badge-cristal"><span>🏙️</span> Estrato ${prop.estrato}</div>`;
            bCont.innerHTML = bHtml || '<div class="badge-cristal"><span>🔑</span> Listo para entrega</div>';


            // Galería
            const carrusel = document.getElementById('carrusel-imagenes');
            const imgMain = prop.foto_portada || prop.imagen || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?q=80&w=1080&auto=format&fit=crop';
            let galeria = [imgMain];
            if (Array.isArray(prop.galeria)) galeria = galeria.concat(prop.galeria.filter(Boolean));


            carrusel.innerHTML = galeria.map((img, i) => `
                <img src="${img}" class="galeria-img" loading="${i === 0 ? 'eager' : 'lazy'}" onerror="this.src='https://via.placeholder.com/600x400/0a0a0c/ff6b00?text=Inmueble'">
            `).join('');


            const contador = document.getElementById('contador-galeria');
            contador.innerText = `1 / ${galeria.length}`;
            carrusel.onscroll = () => {
                const idx = Math.round(carrusel.scrollLeft / carrusel.clientWidth) + 1;
                contador.innerText = `${idx} / ${galeria.length}`;
            };


            // Fondo dinámico
            document.getElementById('fondo-pantalla').src = imgMain;


            // Inmobiliaria
            const agenciaNom = window.datosAgencia ? window.datosAgencia.nombre : 'Inmobiliaria Aliada';
            const agenciaLogo = window.datosAgencia?.logo || 'https://via.placeholder.com/60/0a0a0c/ff6b00?text=INMO';
            document.getElementById('agencia-nombre').innerText = agenciaNom;
            document.getElementById('agencia-logo').src = agenciaLogo;


            // Botón Contacto WhatsApp Protegido (Hidratación bajo demanda)
            const btnWs = document.getElementById('btn-whatsapp-cta');
            btnWs.onclick = async () => {
                btnWs.disabled = true;
                const txtOriginal = btnWs.innerHTML;
                btnWs.innerText = "Conectando... ⏳";


                try {
                    const idAgenciaOPropietario = prop.id_negocio_padre || window.datosAgencia?.id || prop.codigo || prop.id;
                    const res = await GeokatuDB.LocalService.obtenerContactoComercio(idAgenciaOPropietario);
                    const c = (res.success && res.data) ? res.data : {};
                    const tel = (c.whatsapp || c.whatsApp || (c.telefonos && c.telefonos[0]) || '').toString().replace(/\D/g, '');


                    if (tel && tel.length >= 7) {
                        const numFinal = tel.length === 10 ? ('57' + tel) : tel;
                        const msg = "Hola, vi en Geokatu el inmueble: *" + prop.nombre + "* (" + window.formatearMoneda(prop.precio) + "). ¿Está disponible?";
                        window.open("https://wa.me/" + numFinal + "?text=" + encodeURIComponent(msg), '_blank');
                    } else {
                        alert("El anunciante no tiene un canal de WhatsApp disponible.");
                    }
                } catch (e) {
                    alert("Error al conectar con el anunciante.");
                } finally {
                    btnWs.disabled = false;
                    btnWs.innerHTML = txtOriginal;
                }
            };




            // Estado de favoritos
            window.actualizarBotonFavorito();
        };


        // === MECÁNICA TINDER (SWIPE & NEXT) ===
        window.siguientePropiedadTinder = function(direccion = 'izquierda') {
            if (!window.propiedadesGlobales || window.propiedadesGlobales.length <= 1) {
                alert("Has visto todas las propiedades del radar.");
                return;
            }


            if (navigator.vibrate) navigator.vibrate(30);


            const tarjeta = document.getElementById('tarjeta-inmueble-activa');
            const translacionX = direccion === 'derecha' ? '120%' : '-120%';
            const rotacion = direccion === 'derecha' ? '15deg' : '-15deg';


            // Animación de salida fluida
            tarjeta.style.transform = `translate3d(${translacionX}, 0, 0) rotate(${rotacion})`;
            tarjeta.style.opacity = '0';


            setTimeout(() => {
                let currentIndex = window.propiedadesGlobales.findIndex(p => (p.id_prod || p.id) === (window.propiedadActual.id_prod || window.propiedadActual.id));
                let nextIndex = (currentIndex + 1) % window.propiedadesGlobales.length;
                window.propiedadActual = window.propiedadesGlobales[nextIndex];


                // Cambio silencioso de URL
                const idProp = window.propiedadActual.id_prod || window.propiedadActual.id;
                const idAg = window.propiedadActual.id_negocio_padre || window.datosAgencia?.id || '';
                window.history.replaceState({}, '', `inmuebles.html?id=${idAg}&item=${idProp}`);


                window.renderizarPropiedad(window.propiedadActual);
                window.actualizarOtrasOpciones();
                window.scrollTo({ top: 0, behavior: 'smooth' });


                // Retorno instantáneo y aparición suave
                tarjeta.style.transition = 'none';
                tarjeta.style.transform = 'translate3d(0, 20px, 0)';
                setTimeout(() => {
                    tarjeta.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease';
                    tarjeta.style.transform = 'translate3d(0, 0, 0)';
                    tarjeta.style.opacity = '1';
                }, 30);
            }, 300);
        };


        // GESTO TÁCTIL (SWIPE FÍSICO)
        (function() {
            const tarjeta = document.getElementById('tarjeta-inmueble-activa');
            let startX = 0, currentX = 0, startY = 0, currentY = 0;
            let esSwipe = false;


            tarjeta.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                esSwipe = false;
            }, { passive: true });


            tarjeta.addEventListener('touchmove', (e) => {
                currentX = e.touches[0].clientX;
                currentY = e.touches[0].clientY;
                const deltaX = currentX - startX;
                const deltaY = currentY - startY;


                // Si el desplazamiento horizontal domina sobre el vertical
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 20) {
                    esSwipe = true;
                    tarjeta.style.transition = 'none';
                    tarjeta.style.transform = `translate3d(${deltaX}px, 0, 0) rotate(${deltaX * 0.05}deg)`;
                    tarjeta.style.opacity = `${1 - Math.abs(deltaX) / (window.innerWidth * 1.2)}`;
                }
            }, { passive: true });


            tarjeta.addEventListener('touchend', () => {
                if (!esSwipe) return;
                const deltaX = currentX - startX;
                if (Math.abs(deltaX) > 90) {
                    window.siguientePropiedadTinder(deltaX > 0 ? 'derecha' : 'izquierda');
                } else {
                    tarjeta.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                    tarjeta.style.transform = 'translate3d(0, 0, 0)';
                    tarjeta.style.opacity = '1';
                }
            });
        })();


        // === PERSISTENCIA Y FAVORITOS ===
        window.guardarInmuebleActual = function() {
            if (!window.propiedadActual) return;
            const p = window.propiedadActual;
            const id = p.id_prod || p.id;
            let favs = JSON.parse(localStorage.getItem('geokatu_favs_inmuebles')) || [];
            const idx = favs.findIndex(x => x.id === id);


            if (idx > -1) {
                favs.splice(idx, 1);
            } else {
                favs.push({
                    id: id,
                    nombre: p.nombre,
                    precio: p.precio,
                    foto: p.foto_portada || p.imagen,
                    whatsapp: p.whatsapp || window.datosAgencia?.whatsapp
                });
            }
            localStorage.setItem('geokatu_favs_inmuebles', JSON.stringify(favs));
            window.actualizarBotonFavorito();
        };


        window.actualizarBotonFavorito = function() {
            const btn = document.getElementById('btn-fav-inmueble');
            if (!btn || !window.propiedadActual) return;
            const id = window.propiedadActual.id_prod || window.propiedadActual.id;
            const favs = JSON.parse(localStorage.getItem('geokatu_favs_inmuebles')) || [];
            const esFav = favs.some(x => x.id === id);
            btn.innerText = esFav ? '❤️' : '🤍';
            btn.style.borderColor = esFav ? '#ff4444' : 'rgba(255,255,255,0.2)';
        };


        window.abrirMisGuardados = function() {
            const lista = document.getElementById('lista-favoritos');
            const favs = JSON.parse(localStorage.getItem('geokatu_favs_inmuebles')) || [];


            if (favs.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:#888; padding: 25px 0;">No tienes inmuebles guardados.</p>';
            } else {
                lista.innerHTML = favs.map(f => `
                    <div style="display: flex; gap: 12px; align-items: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 14px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.06);">
                        <img src="${f.foto}" style="width: 55px; height: 55px; border-radius: 10px; object-fit: cover;">
                        <div style="flex: 1; overflow: hidden; text-align: left;">
                            <h4 style="margin: 0; font-size: 13px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${window.sanitizarTexto(f.nombre)}</h4>
                            <span style="color: #00ff64; font-weight: bold; font-size: 12px;">${window.formatearMoneda(f.precio)}</span>
                        </div>
                        <button onclick="window.quitarFavorito('${f.id}')" style="background: none; border: none; color: #ff4444; font-size: 16px; cursor: pointer;">✕</button>
                    </div>
                `).join('');
            }
            window.abrirModal('modal-favoritos');
        };


        window.quitarFavorito = function(id) {
            let favs = JSON.parse(localStorage.getItem('geokatu_favs_inmuebles')) || [];
            favs = favs.filter(x => x.id !== id);
            localStorage.setItem('geokatu_favs_inmuebles', JSON.stringify(favs));
            window.abrirMisGuardados();
            window.actualizarBotonFavorito();
        };


        window.volarAlMapa = function() {
            if (!window.propiedadActual) return;
            const p = window.propiedadActual;
            let lat = p.lat || p.Coordenadas?.latitude;
            let lng = p.lng || p.Coordenadas?.longitude;
            if (!lat || !lng) return alert("Esta propiedad no tiene coordenadas exactas en el radar.");
            window.location.href = `index.html?lat=${lat}&lng=${lng}&zoom=17`;
        };


        window.actualizarOtrasOpciones = function() {
            const cont = document.getElementById('contenedor-otras-opciones');
            const tit = document.getElementById('titulo-otras-opciones');
            const currId = window.propiedadActual.id_prod || window.propiedadActual.id;
            const otras = window.propiedadesGlobales.filter(p => (p.id_prod || p.id) !== currId).slice(0, 6);


            if (otras.length === 0) {
                tit.style.display = 'none';
                cont.innerHTML = '';
                return;
            }


            tit.style.display = 'block';
            cont.innerHTML = otras.map(p => `
                <div class="card-opcion" onclick="window.seleccionarDirecta('${p.id_prod || p.id}')">
                    <img class="card-opcion-img" src="${p.foto_portada || p.imagen || 'https://via.placeholder.com/200x110/0a0a0c/ff6b00?text=Inmueble'}">
                    <div class="card-opcion-info">
                        <h4 class="card-opcion-titulo">${window.sanitizarTexto(p.nombre)}</h4>
                        <p class="card-opcion-precio">${window.formatearMoneda(p.precio)}</p>
                    </div>
                </div>
            `).join('');
        };


        window.seleccionarDirecta = function(id) {
            window.propiedadActual = window.propiedadesGlobales.find(p => (p.id_prod || p.id) === id);
            window.renderizarPropiedad(window.propiedadActual);
            window.actualizarOtrasOpciones();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };


        // QR y Compartir
        window.prepararQR = function() {
            const qrCont = document.getElementById('qr-code-container');
            if (!qrCont) return;
            qrCont.innerHTML = "";
            new QRCode(qrCont, {
                text: window.location.href,
                width: 180,
                height: 180,
                colorDark: "#ff6b00",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        };


        window.copiarEnlace = function() {
            navigator.clipboard.writeText(window.location.href).then(() => alert("Enlace copiado al portapapeles 🔗"));
        };


        window.compartirNativo = async function() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: document.title,
                        text: `Mira esta propiedad en Geokatu: ${window.propiedadActual?.nombre}`,
                        url: window.location.href
                    });
                } catch (e) {}
            } else {
                window.copiarEnlace();
            }
        };


        window.descargarQR = function() {
            const canvas = document.querySelector('#qr-code-container canvas');
            if (!canvas) return;
            const a = document.createElement('a');
            a.href = canvas.toDataURL("image/png");
            a.download = `QR_Inmueble_${Date.now()}.png`;
            a.click();
        };


        window.addEventListener('offline', () => document.getElementById('offline-banner').classList.add('activo'));
        window.addEventListener('online', () => document.getElementById('offline-banner').classList.remove('activo'));
        if (!navigator.onLine) document.getElementById('offline-banner').classList.add('activo');


        window.addEventListener('DOMContentLoaded', construirInmueblesFeed);
    </script>
</body>
</html>
