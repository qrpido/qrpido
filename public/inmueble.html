<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        <style>
        :root {
            --color-marca: #ff6b00;
            --bg-oscuro: #0a0a0c;
            --glass-bg: rgba(20, 20, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
           
            /* 📐 Sistema Áureo (1.618) & Fibonacci */
            --texto-sm: 10px;
            --texto-base: 16px;
            --texto-h3: 26px;
            --texto-h1: 42px;
            
            /* Espaciados de Fibonacci */
            --sp-micro: 8px;
            --sp-sm: 13px;
            --sp-md: 21px;
            --sp-lg: 34px;
            --sp-xl: 55px;
        }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-oscuro); color: white; scroll-behavior: smooth; overflow-x: hidden; font-size: var(--texto-base); }
       
        /* === FONDOS Y CRISTAL === */
        #fondo-pantalla { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; object-fit: cover; z-index: -2; opacity: 0.2; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; }
       
        /* === SKELETON SHIMMER LOADING === */
        .shimmer-box { position: relative; overflow: hidden; background: rgba(255,255,255,0.05) !important; color: transparent !important; border-color: transparent !important; text-shadow: none !important; box-shadow: none !important; pointer-events: none; }
        .shimmer-box * { visibility: hidden; }
        .shimmer-box::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 100% { left: 100%; } }
        /* === NAVEGACIÓN FLOTANTE === */
        .nav-flotante { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
        .btn-nav { pointer-events: all; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-decoration: none; }
        .btn-nav:active { transform: scale(0.9); background: var(--color-marca); border-color: var(--color-marca); }
                /* === GALERÍA ÁUREA === */
        .galeria-container { width: 100%; position: relative; margin-bottom: var(--sp-md); }
        .galeria-wrapper { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; border-radius: 0 0 30px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-bottom: 2px solid var(--color-marca); }
        .galeria-wrapper::-webkit-scrollbar { display: none; }
        .galeria-img { width: 100%; height: 61.8vh; flex-shrink: 0; scroll-snap-align: start; object-fit: cover; }
       
        .indicador-galeria { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; letter-spacing: 2px; border: 1px solid rgba(255,255,255,0.2); }
               /* === INFO DE PROPIEDAD (MID) === */
        .info-container { padding: 0 var(--sp-md); padding-bottom: calc(var(--sp-xl) * 2); /* Espacio para el CTA flotante */ }
       
        .badge-venta { background: var(--color-marca); color: white; padding: var(--sp-micro) var(--sp-sm); border-radius: 20px; font-size: var(--text-micro); font-weight: 900; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: var(--sp-micro); box-shadow: 0 0 10px rgba(255,107,0,0.4); }
       
        .titulo-propiedad { margin: 0 0 var(--sp-micro) 0; font-size: var(--texto-h1); font-weight: 900; line-height: 1.2; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .precio-propiedad { margin: 0 0 var(--sp-sm) 0; font-size: var(--texto-h1); color: var(--color-marca); font-weight: 900; text-shadow: 0 0 15px rgba(255,107,0,0.4); }
        /* === BADGES DE CARACTERÍSTICAS === */
        .badges-row { display: flex; gap: var(--sp-micro); overflow-x: auto; padding-bottom: var(--sp-micro); margin-bottom: var(--sp-sm); scrollbar-width: none; }
        .badges-row::-webkit-scrollbar { display: none; }
        .badge-cristal { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: var(--sp-micro) var(--sp-sm); border-radius: 15px; display: flex; align-items: center; gap: var(--sp-micro); font-weight: bold; font-size: var(--text-micro); white-space: nowrap; backdrop-filter: blur(10px); }
        .badge-cristal span { color: var(--color-marca); font-size: var(--texto-base); }
        /* === DESCRIPCIÓN === */
        .seccion-titulo { font-size: var(--texto-h3); font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: var(--sp-sm); color: var(--color-marca); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: var(--sp-micro); }
        .descripcion-texto { color: #ccc; font-size: var(--texto-base); line-height: 1.6; margin-bottom: var(--sp-lg); background: rgba(0,0,0,0.3); padding: var(--sp-md); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        /* === AGENCIA INFO === */
        .agencia-card { display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-md); margin-bottom: var(--sp-lg); cursor: pointer; transition: 0.3s; }
        .agencia-card:active { transform: scale(0.98); border-color: var(--color-marca); }
        .agencia-logo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--color-marca); object-fit: cover; }
        .agencia-info h4 { margin: 0 0 3px 0; font-size: 14px; color: white; }
        .agencia-info p { margin: 0; font-size: 12px; color: #888; }
        /* === ESPACIO ADSENSE === */
        .adsense-container { width: 100%; min-height: 100px; background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.2); border-radius: 15px; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; color: #666; font-size: 12px; text-transform: uppercase; font-weight: bold; letter-spacing: 2px; }
                /* === OTRAS OPCIONES (CARRUSEL INFERIOR) === */
        .otras-opciones-wrapper { display: flex; gap: var(--sp-sm); overflow-x: auto; padding-bottom: var(--sp-sm); scrollbar-width: none; align-items: stretch; }
        .otras-opciones-wrapper::-webkit-scrollbar { display: none; }
        .card-opcion { width: 226px; /* Golden Ratio 140 * 1.618 */ flex-shrink: 0; display: flex; flex-direction: column; text-decoration: none; color: white; overflow: hidden; transition: 0.3s; }
        .card-opcion:active { transform: scale(0.95); border-color: var(--color-marca); }
        .card-opcion-img { width: 100%; height: 140px; object-fit: cover; border-radius: 15px 15px 0 0; }
        .card-opcion-info { padding: 12px; background: rgba(0,0,0,0.5); border-radius: 0 0 15px 15px; flex-grow: 1; }
        .card-opcion-titulo { margin: 0 0 5px 0; font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-opcion-precio { margin: 0; color: var(--color-marca); font-weight: 900; font-size: 15px; }
        /* BOTÓN DE CAPTACIÓN (UPSELL) */
        .btn-upsell { width: 100%; background: transparent; border: 1px dashed var(--color-marca); color: var(--color-marca); padding: 15px; border-radius: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .btn-upsell:active { background: rgba(255,107,0,0.1); transform: scale(0.98); }
        /* === CTA FLOTANTE TINDER (PULSANTE) === */
        .cta-wrapper { position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px 20px 20px 20px; background: linear-gradient(to top, rgba(10,10,12,1) 60%, rgba(10,10,12,0)); z-index: 1000; box-sizing: border-box; display: flex; gap: 15px; }
       
        .btn-pulsante { border: none; border-radius: 30px; font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: 0.3s; }
        .btn-pulsante:active { transform: scale(0.95); }
       
                .btn-interesa { background: var(--color-marca); color: white; animation: pulso 2s infinite; flex: 3; height: 55px; min-width: 89px; display: flex; justify-content: center; align-items: center; padding: 0 var(--sp-md); }
        @keyframes pulso { 0% { box-shadow: 0 0 15px rgba(255,107,0,0.4); } 50% { box-shadow: 0 0 30px rgba(255,107,0,0.8); } 100% { box-shadow: 0 0 15px rgba(255,107,0,0.4); } }
       
        .btn-descartar-tinder { flex: 1; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 22px; }
        /* === MODALES (REUTILIZADOS) === */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.activo { opacity: 1; pointer-events: all; }
        .modal-contenido { width: 100%; max-width: 500px; background: var(--glass-bg); backdrop-filter: blur(25px); border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 15px 30px 30px 30px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); border-top: 1px solid var(--color-marca); box-sizing: border-box; text-align: center; }
        .modal-overlay.activo .modal-contenido { transform: translateY(0); }
        .drag-handle { width: 50px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 5px; margin: 0 auto 20px auto; cursor: grab; }
        .btn-accion-secundaria { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white; font-weight: bold; margin-bottom: 10px; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-accion-secundaria:active { background: rgba(255,255,255,0.1); transform: scale(0.95); }
        /* === UI DE RESCATE OFFLINE === */
        .offline-banner { position: fixed; top: 0; left: 0; width: 100%; background: #ff4444; color: white; text-align: center; padding: 8px; z-index: 10000; font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(255,68,68,0.4); display: none; }
        .offline-banner.activo { display: block; }
    </style>
</head>
<body>
    <div id="offline-banner" class="offline-banner">⚠️ Sin conexión: Mostrando datos de tu última visita</div>
    <img id="fondo-pantalla" src="" alt="Fondo Ambiental">
    <div class="nav-flotante">
        <a href="index.html" class="btn-nav" title="Volver al Radar">

        </a>

            <button class="btn-nav" onclick="abrirModal('overlay-compartir')" title="Compartir Inmueble">

            </button>
        </div>
    </div>
    <div class="galeria-container">
        <div class="galeria-wrapper shimmer-box" id="carrusel-imagenes">
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="galeria-img">
        </div>

    <div class="info-container">

        <h1 class="titulo-propiedad shimmer-box" id="inmueble-titulo" style="width: 80%; height: 31px; border-radius: 8px; margin: 0 0 5px 0;"></h1>
        <h2 class="precio-propiedad shimmer-box" id="inmueble-precio" style="width: 50%; height: 38px; border-radius: 8px; margin: 0 0 15px 0;"></h2>
        <div class="badges-row" id="contenedor-badges">
            <div class="badge-cristal shimmer-box" style="width: 80px; height: 40px; border-radius: 15px;"></div>
            <div class="badge-cristal shimmer-box" style="width: 80px; height: 40px; border-radius: 15px;"></div>
            <div class="badge-cristal shimmer-box" style="width: 80px; height: 40px; border-radius: 15px;"></div>
        </div>
        <h3 class="seccion-titulo">Descripción</h3>
        <div class="descripcion-texto shimmer-box" id="inmueble-descripcion" style="min-height: 100px; border-radius: 15px;"></div>
        <h3 class="seccion-titulo">Ofrecido por</h3>
       
        <div class="glass-panel agencia-card" id="tarjeta-agencia" onclick="" style="border-color: rgba(255,255,255,0.05);">
            <div id="agencia-logo" class="agencia-logo shimmer-box"></div>
            <div class="agencia-info" style="width: 100%;">
                <h4 id="agencia-nombre" class="shimmer-box" style="width: 70%; height: 14px; border-radius: 5px; margin-bottom: 5px;"></h4>
                <p id="agencia-nicho" class="shimmer-box" style="width: 40%; height: 12px; border-radius: 5px; margin: 0;"></p>
            </div>
            <div style="margin-left: auto; color: var(--color-marca);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </div>
        </div>
        <div class="adsense-container" id="espacio-publicitario">
            Espacio Reservado para AdSense
        </div>
        <h3 class="seccion-titulo" id="titulo-otras-opciones" style="display: none;">Otras opciones cerca de ti</h3>
        <div class="otras-opciones-wrapper" id="contenedor-otras-opciones">
            </div>
       
        <button class="btn-upsell" onclick="window.location.href='admin.html'">🏡 ¿Quieres publicar tu inmueble? Hazlo aquí</button>
    </div>
    <div class="cta-wrapper">
        <button class="btn-pulsante btn-descartar-tinder" id="btn-descartar-tinder" onclick="siguientePropiedadTinder()">
            ✖️
        </button>
        <button class="btn-pulsante btn-interesa" id="btn-whatsapp-cta" onclick="">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            Contactar
        </button>
    </div>
    <div class="modal-overlay" id="modal-favoritos" onclick="cerrarModal(event, 'modal-favoritos')">
        <div class="modal-contenido" id="sheet-favoritos" style="border-top-color: #ff4444; text-align: left;">
            <div class="drag-handle" style="margin: 0 auto 20px auto;"></div>
            <h2 style="color: #ff4444; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; text-align: center; text-shadow: 0 0 10px rgba(255,68,68,0.4);">Mis Guardados</h2>
            <p style="text-align:center; font-size:12px; color:#aaa; margin-bottom: 20px;">Tus inmuebles de interés guardados en este dispositivo.</p>
            <div id="lista-favoritos" style="max-height: 60vh; overflow-y: auto; margin-bottom: 20px; scrollbar-width: none;"></div>
        </div>
    </div>
    <div class="modal-overlay" id="overlay-compartir" onclick="cerrarModal(event, 'overlay-compartir')">
        <div class="modal-contenido" id="sheet-compartir">
            <div class="drag-handle"></div>
            <h2 style="margin-top: 0; color: var(--color-marca); text-shadow: 0 0 5px rgba(255,107,0,0.3); text-transform: uppercase; letter-spacing: 2px;">Compartir Propiedad</h2>
           
            <div id="qr-code-container" style="background: white; padding: 15px; border-radius: 20px; display: inline-block; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); line-height: 0;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-pulsante btn-interesa" id="btn-descargar-qr" onclick="descargarQR()" style="animation: none; padding: 15px; font-size: 14px;">⬇️ DESCARGAR QR</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-accion-secundaria" onclick="copiarEnlace()" style="margin: 0; flex: 1;">🔗 Copiar Link</button>
                    <button class="btn-accion-secundaria" onclick="compartirNativo()" style="margin: 0; flex: 1;">📲 Compartir</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import QRpidoDB from './core-db.js';
        let datosAgencia = null;
        let propiedadActual = null;
       
        window.propiedadesGlobales = []; // Necesario para la mecánica Tinder
        window.contadorRecargas = 0; // Algoritmo Monetización
        // === PERSISTENCIA ANÓNIMA (TINDER MATCHES) ===
        window.toggleFavorito = function(id, nombre, precio, foto, whatsapp, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            if (navigator.vibrate) navigator.vibrate(30);
           
            let favs = JSON.parse(localStorage.getItem('qrpido_favoritos_anon')) || [];
            const index = favs.findIndex(x => x.id === id);
           
            if (index > -1) {
                favs.splice(index, 1);
            } else {
                favs.push({ id, nombre, precio, foto, whatsapp });
            }
            localStorage.setItem('qrpido_favoritos_anon', JSON.stringify(favs));
            
            // PUENTE CROSS-TAB: Notificar cambios a otras pestañas y a la actual instantáneamente
            window.dispatchEvent(new Event('qrpido_favoritos_actualizados'));
            if ('BroadcastChannel' in window) {
                new BroadcastChannel('qrpido_canal_favs').postMessage({ action: 'actualizar_pines' });
            }


// ANALYTICS: Medir si el usuario guarda o quita de favoritos
const accion = index > -1 ? 'remove_favorite' : 'add_favorite';
QRpidoDB.LocalService.registrarEventoAnalytics(accion, {
    property_id: id,
    property_name: nombre
});
           
            if (propiedadActual && propiedadActual.id_prod === id) {
                const btnFav = document.getElementById('btn-fav-inmueble');
                if (btnFav) {
                    const isFav = favs.some(x => x.id === id);
                    btnFav.innerText = isFav ? '❤️' : '🤍';
                    btnFav.style.background = isFav ? 'rgba(255,68,68,0.2)' : 'rgba(0,0,0,0.6)';
                    btnFav.style.borderColor = isFav ? '#ff4444' : 'rgba(255,255,255,0.2)';
                }
            }
        };
                window.guardarInmuebleActual = function() {
            if (!propiedadActual) return;
            const titulo = propiedadActual.nombre;
            const precio = propiedadActual.precio || 0;
            const foto = propiedadActual.imagen || '';
            const ws = datosAgencia ? (datosAgencia.whatsApp || datosAgencia.whatsapp) : '';
            window.toggleFavorito(propiedadActual.id_prod, titulo, precio, foto, ws, null);
        };
        window.abrirMisGuardados = function() {
            const lista = document.getElementById('lista-favoritos');
            let favs = JSON.parse(localStorage.getItem('qrpido_favoritos_anon')) || [];
           
            if (favs.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:#888; padding: 20px; border: 1px dashed rgba(255,255,255,0.2); border-radius: 15px;">No tienes ningún inmueble guardado aún. 🤍</p>';
            } else {
                let html = '';
                favs.forEach(f => {
                    const precioTxt = f.precio && parseFloat(f.precio) > 0 ? '$' + parseFloat(f.precio).toLocaleString('es-CO') : 'Consultar';
                    const wsLink = f.whatsapp && f.whatsapp.trim() !== '' ? `https://wa.me/${f.whatsapp}?text=${encodeURIComponent('Hola, vengo de QRpido y me interesa: ' + f.nombre)}` : '#';
                   
                    html += `
                    <div style="display: flex; gap: 15px; align-items: center; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 15px; margin-bottom: 12px; border: 1px solid rgba(255,68,68,0.2); box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                        <img src="${f.foto}" style="width: 60px; height: 60px; border-radius: 12px; object-fit: cover;">
                        <div style="flex: 1; overflow: hidden; text-align: left;">
                            <h4 style="margin: 0 0 5px 0; font-size: 14px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${f.nombre}</h4>
                            <p style="margin: 0; color: var(--color-marca); font-weight: bold; font-size: 13px;">${precioTxt}</p>
                        </div>

        window.formatearMoneda = function(valorInt64, moneda = 'COP') {

                return (valorInt64 / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD' });

        // === LÓGICA DE HORARIOS ===
        function verificarHorarioOperativo() {
            if (!datosAgencia.horario_apertura || !datosAgencia.horario_cierre) return true;

            const horaActual = ahora.getHours() * 60 + ahora.getMinutes();

            const [hHasta, mHasta] = datosAgencia.horario_cierre.split(':').map(Number);
            const minDesde = hDesde * 60 + mDesde;
            const minHasta = hHasta * 60 + mHasta;
            if (minHasta < minDesde) {
                return horaActual >= minDesde || horaActual <= minHasta;
            } else {
                return horaActual >= minDesde && horaActual <= minHasta;

                currentY = e.touches[0].clientY;
                if(currentY > startY && content.scrollTop === 0) content.style.transform = `translateY(${currentY - startY}px)`;
            }, {passive: true});

                if (currentY - startY > 100 && content.scrollTop === 0) modal.classList.remove('activo');

// ANALYTICS: Registro de vista de propiedad y agencia

                function prepararQR() {

            new QRCode(qrContainer, {
